<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII City</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; height: 100vh; }
  canvas[hidden] { display: none; }
  #fail {
    color: #c8d2dc; font: 14px/1.6 "Consolas", monospace;
    max-width: 34em; padding: 2em; text-align: center;
  }
  #fail h1 { font-size: 1.4em; font-weight: 600; color: #e8eef4; }
  #hud {
    position: fixed; left: 10px; bottom: 8px;
    font: 12px "Consolas", monospace; color: #3a4a55; user-select: none;
  }
  #fps {
    position: fixed; right: 10px; top: 8px;
    font: 12px "Consolas", monospace; color: #3a4a55;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud">WASD move &middot; arrows turn &middot; shift run &middot; click for mouse-look &middot; M mono/colour &middot; C glyph set &middot; X raw view &middot; F fullscreen</div>
<div id="fps"></div>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/light.js"></script>
<script src="js/entities.js"></script>
<script src="js/player.js"></script>
<script src="js/webgpu/atlas.js"></script>
<script src="js/webgpu/shaders.js"></script>
<script src="js/webgpu/gpu-renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
