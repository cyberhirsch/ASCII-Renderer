<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII World</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* size is set in JS to an exact multiple of the glyph cell; stretching it
     here to the viewport would reintroduce fractional scaling */
  canvas { display: block; image-rendering: pixelated; }
  canvas[hidden] { display: none; }
  #boot {
    position: fixed; inset: 0; background: #000; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease;
  }
  #boot pre {
    margin: 0; text-align: center; color: #c8d2dc;
    font: 14px/1.7 "Consolas", "Courier New", monospace;
  }
  #boot .dim { color: #566070; }
  #fail {
    color: #c8d2dc; font: 14px/1.6 "Consolas", monospace;
    max-width: 34em; padding: 2em; text-align: center;
  }
  #fail h1 { font-size: 1.4em; font-weight: 600; color: #e8eef4; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="boot"><pre>a s c i i   w o r l d

<span id="boot-bar">                          </span>
<span id="boot-msg" class="dim">reading the seed</span></pre></div>
<script>
// Boot screen: paints before the bundle parses, animates a pulse along the
// same brightness ramp the renderer draws with, and hands stage text to
// main.js. Removed by Boot.done() on the first rendered frame.
(function () {
  const RAMP = ' .:-=+*#%@';
  const W = 26;
  let t = 0;
  const iv = setInterval(() => {
    t++;
    const period = 2 * (W - 1);
    const ph = t % period;
    const pos = ph < W ? ph : period - ph;
    let s = '';
    for (let i = 0; i < W; i++) {
      const g = Math.max(0, RAMP.length - 1 - Math.abs(i - pos) * 2);
      s += RAMP[g];
    }
    const bar = document.getElementById('boot-bar');
    if (bar) bar.textContent = s;
  }, 90);
  window.Boot = {
    set(msg) {
      const m = document.getElementById('boot-msg');
      if (m) m.textContent = msg;
    },
    done() {
      clearInterval(iv);
      const b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(() => b.remove(), 500);
    },
    fail() {
      clearInterval(iv);
      const b = document.getElementById('boot');
      if (b) b.remove();
    },
  };
})();
</script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/sky.js"></script>
<script src="js/overlay.js"></script>
<script src="js/entities.js"></script>
<script src="js/edits.js"></script>
<script src="js/fells.js"></script>
<script src="js/items.js"></script>
<script src="js/game.js"></script>
<script src="js/player.js"></script>
<script src="js/webgpu/atlas.js"></script>
<script src="js/webgpu/shaders.js"></script>
<script src="js/webgpu/gpu-renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
