<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII City</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* size is set in JS to an exact multiple of the glyph cell; stretching it
     here to the viewport would reintroduce fractional scaling */
  canvas { display: block; image-rendering: pixelated; }
  canvas[hidden] { display: none; }
  #fail {
    color: #c8d2dc; font: 14px/1.6 "Consolas", monospace;
    max-width: 34em; padding: 2em; text-align: center;
  }
  #fail h1 { font-size: 1.4em; font-weight: 600; color: #e8eef4; }
  #hud {
    position: fixed; left: 10px; bottom: 8px;
    font: 12px "Consolas", monospace; color: #9fb0bd; user-select: none;
    background: rgba(10, 14, 18, 0.5); padding: 3px 8px; border-radius: 3px;
  }
  #fps {
    position: fixed; right: 10px; top: 8px;
    font: bold 13px "Consolas", monospace; color: #d8e4ee;
    background: rgba(10, 14, 18, 0.65); padding: 3px 8px; border-radius: 3px;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="hud">WASD move &middot; arrows turn &middot; shift run &middot; click for mouse-look &middot; M mono/colour &middot; C glyph set &middot; X raw view &middot; F fullscreen</div>
<div id="fps"></div>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/world.js"></script>
<script src="js/entities.js"></script>
<script src="js/player.js"></script>
<script src="js/webgpu/atlas.js"></script>
<script src="js/webgpu/shaders.js"></script>
<script src="js/webgpu/gpu-renderer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
