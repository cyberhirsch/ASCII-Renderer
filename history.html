<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Chronicle</title>
<style>
  /* One committed world, not two themes: the game this belongs to is a black
     terminal, and a light-mode chronicle would be a different instrument. */
  :root {
    --bg:#08090b; --plate:#000; --ink:#c8d2dc; --dim:#566070; --line:#1b1f26;
    --edge:#2a3039; --loss:#d4674a; --water:#0d1a26;
    /* the six peoples, running bone -> copper -> bronze -> iron */
    --p0:#b08968; --p1:#c97b4a; --p2:#c9a94b;
    --p3:#6fae8f; --p4:#5f96c4; --p5:#8f7fc0;
    /* The game's own stack, taken from js/webgpu/atlas.js, which rasterizes
       the glyph sheet with `bold Npx "Consolas", "Courier New", monospace`.
       The record used to be set in a serif to separate it from the
       instrument; that distinction is carried by weight and colour now,
       because matching the game matters more than my nicety. */
    --mono:"Consolas","Courier New",monospace;
    --serif:"Consolas","Courier New",monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font:400 12px/1.6 var(--mono);
    display:flex; gap:26px; padding:22px; align-items:flex-start;
  }
  #left { flex:0 0 auto; display:flex; flex-direction:column; gap:12px; }
  #right { flex:1 1 auto; min-width:0; align-self:stretch;
           display:flex; flex-direction:column; gap:10px; }

  .eyebrow { font-size:10px; font-weight:600; letter-spacing:.2em;
             text-transform:uppercase; color:var(--dim); margin:0; }
  h1 { font:500 15px/1.3 var(--mono); letter-spacing:.02em; margin:2px 0 0; }

  /* the map sits like a mounted survey plate */
  .plate { position:relative; align-self:flex-start;
           border:1px solid var(--edge); outline:1px solid var(--line);
           outline-offset:3px; background:var(--plate); }
  canvas { display:block; }

  /* the three lifespans double as the timeline: same playhead, same gesture */
  #peoples { display:flex; flex-direction:column; gap:9px; margin-top:4px; }
  .lane { display:flex; gap:8px; align-items:baseline; font-size:11px; }
  .lane b { font-weight:500; }
  .sw { width:8px; height:8px; flex:0 0 auto; border-radius:1px; align-self:center; }
  .era { position:relative; height:6px; background:#0f1216;
         border:1px solid var(--line); margin:3px 0 2px; }
  .era i { position:absolute; top:0; bottom:0; display:block; opacity:.8; }
  .era b { position:absolute; top:-3px; bottom:-3px; width:1px;
           background:var(--ink); opacity:.9; }
  .yr { font-size:11px; }

  .bar { display:flex; align-items:center; gap:9px; }
  input[type=range] { flex:1; accent-color:var(--p1); height:2px; }
  input[type=number] { background:#0f1216; color:var(--ink);
    border:1px solid var(--line); padding:4px 7px; width:10ch; font:inherit; }
  button { background:#0f1216; color:var(--dim); border:1px solid var(--line);
    padding:4px 12px; font:500 11px/1 var(--mono); letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; transition:border-color .12s, color .12s; }
  button:hover { border-color:var(--edge); color:var(--ink); }
  .sp { padding:4px 10px; }
  .sp.on { border-color:var(--p1); color:var(--ink); }
  label { display:flex; align-items:center; gap:5px; cursor:pointer; font-size:11px; }
  :focus-visible { outline:1px solid var(--p1); outline-offset:2px; }

  #year, #alive, #stat { font-variant-numeric:tabular-nums; }
  #year { min-width:10ch; }

  /* the record speaks in serif; the instrument speaks in mono */
  .panel { border:1px solid var(--line); padding:11px 13px; overflow:auto; }
  #pick { flex:0 0 auto; max-height:230px; font:400 13px/1.6 var(--serif); }
  #heroes { flex:0 0 auto; max-height:170px; }
  #legends { flex:0 0 auto; max-height:200px; font:400 13px/1.55 var(--serif); }
  .thing { margin-bottom:7px; }
  .thing i { font-style:italic; color:var(--ink); opacity:.85; }
  #pick .lane { font:inherit; }
  #log { flex:1 1 auto; min-height:200px; font:400 13px/1.65 var(--serif); }
  .dim { color:var(--dim); }
  .ev { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 0; }
  .t { color:var(--dim); display:inline-block; width:5ch; text-align:right;
       margin-right:10px; font:400 11px/1 var(--mono);
       font-variant-numeric:tabular-nums; }
  /* The game's own screen: 1920x1080 over 12x22 cells is 160x49 characters,
     and a cell is 0.545 as wide as it is tall. A monospace advance is 0.6em,
     so line-height 1.1em reproduces that cell aspect exactly. */
  #ascii { display:none; margin:0; white-space:pre; color:var(--ink);
    font:bold 14px/1.1 var(--mono); letter-spacing:0; }
  body.ascii #left, body.ascii #right { display:none; }
  body.ascii #ascii { display:block; }
  body.ascii { display:block; }
  .hint { position:fixed; right:14px; bottom:10px; color:var(--dim); font-size:11px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<pre id="ascii"></pre>
<div class="hint">x — the game's own screen</div>
<div id="left">
  <div>
    <p class="eyebrow">Ascii World</p>
    <h1>The Chronicle</h1>
  </div>
  <div class="plate"><canvas id="map" width="704" height="704"></canvas></div>
  <div id="peoples"></div>
  <div class="bar">
    <button id="play">play</button>
    <input type="range" id="scrub" min="0" max="2000" value="2000" step="5" aria-label="year">
    <span id="year">year 2000</span>
  </div>
  <div class="bar">
    <span class="dim">speed</span>
    <button class="sp" data-sp="1">slow</button>
    <button class="sp on" data-sp="4">even</button>
    <button class="sp" data-sp="14">fast</button>
    <label class="dim"><input type="checkbox" id="loop" checked>loop</label>
    <label class="dim"><input type="checkbox" id="finds">finds</label>
    <label class="dim"><input type="checkbox" id="seen">seen</label>
    <span class="dim" id="alive"></span>
  </div>
  <div class="bar">
    <span class="dim">seed</span>
    <input type="number" id="seed" min="0" max="16777215" aria-label="world seed">
    <button id="go">run</button>
    <span id="stat" class="dim"></span>
  </div>
</div>
<div id="right">
  <p class="eyebrow">What stands there</p>
  <div class="panel" id="pick"></div>
  <p class="eyebrow">Who is remembered</p>
  <div class="panel" id="heroes"></div>
  <p class="eyebrow">What is remembered</p>
  <div class="panel" id="legends"></div>
  <p class="eyebrow">What happened</p>
  <div class="panel" id="log"></div>
</div>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/chronicle.js"></script>
<script>
// A map of the chronicle, scrubbable by year. Nothing here is stored: the
// sim hands over sites, links and events with dates on them, and every
// frame recomputes territory, road condition and ruin state for the year
// being asked about. If it can be derived it is not kept.
const S_PX = 11;                       // pixels per sim cell
const cv = document.getElementById('map'), cx = cv.getContext('2d');
cv.width = HIST.N * S_PX; cv.height = HIST.N * S_PX;

// One per people, ordered as the material succession runs: bone and tan,
// then copper, brass, the green of old bronze, then two irons.
const HUE = ['#b08968', '#c97b4a', '#c9a94b', '#6fae8f', '#5f96c4', '#8f7fc0'];
let S = null, year = HIST.SPAN, playing = false, picked = null;
let speed = 4, looping = true, showFinds = false, showSeen = false;
// The game's text resolution, derived rather than typed: a 16:9 screen at
// 1080p divided by the glyph cell the renderer actually uses.
const A_COLS = Math.floor(1920 / CFG.CELL_W), A_ROWS = Math.floor(1080 / CFG.CELL_H);
const A_MAP_W = 88, A_MAP_H = A_ROWS - 1, A_PANEL = A_COLS - A_MAP_W - 2;
let ascii = false;
// The prologue holds the screen before the record starts running: one line
// of the myth every few frames, then a pause, then six thousand years. Any
// key goes straight through it.
let phase = 'record', mythT = 0;
const MYTH_STEP = 16, MYTH_HOLD = 100;
// A time lapse has to show change, not just state. Anything built or lost
// inside living memory keeps a ring on it for a few years of playback, so
// the eye catches the moment rather than only the aftermath.
const FLASH = 45;

function run(seed) {
  CFG.SEED = seed;
  const t0 = performance.now();
  S = Chronicle.run();
  const ms = performance.now() - t0;
  document.getElementById('stat').textContent =
    `${S.sites.length} sites  ${S.links.length} roads  ` +
    `${S.links.reduce((a, l) => a + l.bridges.length, 0)} bridges  ${ms.toFixed(0)} ms`;
  picked = null;
  drawPeoples();
  draw();
}

// Territory is not simulated and not stored: at any year it is simply the
// people whose living site is nearest, out to a day's walk.
const TERR_R = 6;
function territory(y) {
  const N = HIST.N, own = new Int8Array(N * N).fill(-1);
  const best = new Float32Array(N * N).fill(1e9);
  for (const s of S.sites) {
    if (s.founded > y || (s.abandoned >= 0 && s.abandoned <= y)) continue;
    for (let dj = -TERR_R; dj <= TERR_R; dj++) for (let di = -TERR_R; di <= TERR_R; di++) {
      const i = s.i + di, j = s.j + dj;
      if (!Chronicle.inBounds(i, j)) continue;
      const d = Math.hypot(di, dj);
      if (d > TERR_R) continue;
      const k = j * N + i;
      if (d < best[k]) { best[k] = d; own[k] = s.people; }
    }
  }
  return own;
}

function draw() {
  document.getElementById('year').textContent = 'year ' + year;
  if (ascii) { drawAscii(); return; }
  const N = HIST.N, g = S.grid;
  // ground
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const k = j * N + i;
    if (g.water[k]) cx.fillStyle = '#0d1a26';
    else {
      const v = Math.round(24 + 52 * clamp(g.h[k] / CFG.TERRAIN_MAX, 0, 1));
      cx.fillStyle = `rgb(${v},${v + 2},${v + 4})`;
    }
    cx.fillRect(i * S_PX, j * S_PX, S_PX, S_PX);
  }
  // The country anybody has actually walked. Settlement can only ever
  // follow this, so it is the shape of the frontier at any given year.
  if (showSeen) {
    const up = S.peoples.filter(pe => year >= pe.rise && (pe.fell < 0 || year < pe.fell));
    cx.fillStyle = '#161b21';
    for (let k = 0; k < N * N; k++) {
      let any = false;
      for (const pe of up) if (S.known[pe.id][k]) { any = true; break; }
      if (any) cx.fillRect((k % N) * S_PX, ((k - k % N) / N) * S_PX, S_PX, S_PX);
    }
  }

  // territory, faintly
  const own = territory(year);
  cx.globalAlpha = 0.16;
  for (let k = 0; k < N * N; k++) {
    if (own[k] < 0) continue;
    cx.fillStyle = HUE[own[k]];
    cx.fillRect((k % N) * S_PX, ((k - k % N) / N) * S_PX, S_PX, S_PX);
  }
  cx.globalAlpha = 1;

  // roads. A road stops being repaired when either end dies; after that it
  // is a hollow-way, still visibly straight and slowly filling in.
  for (const l of S.links) {
    if (l.built > year) continue;
    const until = Chronicle.linkLive(S, l);
    const dead = year - until;
    cx.strokeStyle = HUE[l.people];
    cx.globalAlpha = dead <= 0 ? 0.85 : Math.max(0.12, 0.85 - dead / 700);
    cx.lineWidth = dead <= 0 ? 2 : 1;
    cx.beginPath();
    l.path.forEach((k, n) => {
      const x = (k % N) * S_PX + S_PX / 2, y = ((k - k % N) / N) * S_PX + S_PX / 2;
      n ? cx.lineTo(x, y) : cx.moveTo(x, y);
    });
    cx.stroke();
    // bridges read as a break in the line with piers either side
    cx.globalAlpha = 1;
    for (const b of l.bridges) for (const k of b) {
      const x = (k % N) * S_PX, y = ((k - k % N) / N) * S_PX;
      cx.fillStyle = dead <= 0 ? '#e8eef4' : '#6a7482';
      cx.fillRect(x + 2, y + 2, S_PX - 4, S_PX - 4);
    }
  }
  cx.globalAlpha = 1;

  // sites
  for (const s of S.sites) {
    if (s.founded > year) continue;
    const gone = s.abandoned >= 0 && s.abandoned <= year;
    const st = Chronicle.stage(S, s, year);
    const sink = Chronicle.sink(S, s, year);
    const x = s.i * S_PX + S_PX / 2, y = s.j * S_PX + S_PX / 2;
    const r = 2 + Math.sqrt(Math.max(s.pop, 20)) / 7;
    cx.beginPath(); cx.arc(x, y, r, 0, 6.284);
    if (!gone) { cx.fillStyle = HUE[s.people]; cx.fill(); }
    else {
      // a ruin fades as it goes down; below ground it is a ring only
      cx.strokeStyle = HUE[s.people];
      cx.globalAlpha = st >= 5 ? 0.28 : 0.75;
      cx.lineWidth = 1; cx.stroke();
      cx.globalAlpha = 1;
      if (sink > 1) {
        cx.fillStyle = '#000'; cx.globalAlpha = clamp(sink / 18, 0, 0.8);
        cx.fill(); cx.globalAlpha = 1;
      }
    }
    if (s.kind === 'hold') {   // capitals get a mark you can find at a glance
      cx.strokeStyle = HUE[s.people]; cx.globalAlpha = gone ? 0.5 : 1;
      cx.strokeRect(x - r - 3, y - r - 3, 2 * r + 6, 2 * r + 6);
      cx.globalAlpha = 1;
    }
    const built = year - s.founded, lost = gone ? year - s.abandoned : -1;
    if (lost >= 0 && lost < FLASH) {
      cx.strokeStyle = '#d4674a'; cx.lineWidth = 1.5;
      cx.globalAlpha = 1 - lost / FLASH;
      cx.beginPath(); cx.arc(x, y, r + 4 + 7 * (lost / FLASH), 0, 6.284); cx.stroke();
      cx.globalAlpha = 1;
    } else if (built >= 0 && built < FLASH) {
      cx.strokeStyle = '#e8eef4'; cx.lineWidth = 1.5;
      cx.globalAlpha = 1 - built / FLASH;
      cx.beginPath(); cx.arc(x, y, r + 4 + 5 * (built / FLASH), 0, 6.284); cx.stroke();
      cx.globalAlpha = 1;
    }
    if (picked === s.id) {
      cx.strokeStyle = '#e8eef4'; cx.lineWidth = 1;
      cx.beginPath(); cx.arc(x, y, r + 5, 0, 6.284); cx.stroke();
    }
  }
  // Battles: a cross where two peoples actually met, bright while it is
  // still in living memory and a faint scar afterwards.
  for (const b of S.battles) {
    if (b.t > year) continue;
    const bAge = year - b.t;
    const bx = b.i * S_PX + S_PX / 2, by = b.j * S_PX + S_PX / 2;
    const fresh = bAge < FLASH;
    const r = 3 + (fresh ? 4 * (1 - bAge / FLASH) : 0);
    cx.strokeStyle = '#d4674a';
    cx.globalAlpha = fresh ? 1 : 0.3;
    cx.lineWidth = fresh ? 2 : 1;
    cx.beginPath();
    cx.moveTo(bx - r, by - r); cx.lineTo(bx + r, by + r);
    cx.moveTo(bx + r, by - r); cx.lineTo(bx - r, by + r);
    cx.stroke();
    cx.globalAlpha = 1;
  }

  // What is in the ground. Gold means something named is down there; grey
  // means ordinary goods; dark means somebody has already been for it.
  if (showFinds) for (const d of S.deposits) {
    if (d.t > year) continue;
    const robbed = d.robbed >= 0 && d.robbed <= year;
    cx.fillStyle = robbed ? '#3a4048' : d.artifact !== null ? '#e8c46a' : '#7f8794';
    const ox = ((d.id % 3) - 1) * 3, oy = (((d.id / 3) | 0) % 3 - 1) * 3;
    cx.fillRect(d.i * S_PX + S_PX / 2 + ox - 1, d.j * S_PX + S_PX / 2 + oy - 1, 2, 2);
  }

  // playhead across the era bars, and who is actually standing right now
  const ph = document.querySelectorAll('.era b');
  for (let n = 0; n < ph.length; n++) ph[n].style.left = (100 * year / HIST.SPAN) + '%';
  const up = S.peoples.filter(p => year >= p.rise && (p.fell < 0 || year < p.fell));
  document.getElementById('alive').textContent =
    up.length ? up.map(p => p.name).join(' · ') : 'nobody';
  drawHeroes();
  drawLegends();
  drawLog();
  drawPick();
}

// Heroes are not declared: renown is a count of what somebody actually did,
// and the epithet is chosen from the deeds themselves.
function drawHeroes() {
  const out = S.heroes.filter(id => S.figures[id].born <= year).map(id => {
    const f = S.figures[id], pe = S.peoples[f.people];
    const rec = [f.wins ? f.wins + ' battles won' : null,
                 f.made ? f.made + ' things made' : null,
                 f.led >= 0 ? 'held the seat' : null].filter(Boolean).join(' · ');
    const dead = f.died >= 0 && f.died <= year;
    return `<div class="lane"><span class="sw" style="background:${HUE[f.people]}"></span>
      <b>${f.name}${f.epithet ? ' ' + f.epithet : ''}</b></div>
      <div class="dim yr">${pe.name} · ${f.born}–${dead ? f.died : ''} · ${rec}
      ${dead && f.cause === 'battle' ? ' · fell in battle' : ''}</div>`;
  }).join('');
  document.getElementById('heroes').innerHTML =
    out || '<span class="dim">nobody has done anything worth remembering yet</span>';
}

// ---- the game's own screen ----
// One glyph per character cell, the same grid the renderer draws the world
// into. The map is compressed to fit: 64 sim cells across 88 columns and
// down 48 rows, which is what 16:9 leaves once a cell is taller than wide.
const A_SITE = { hold: '@', fort: 'A', mine: '%', farm: 'n' };

function drawAscii() {
  if (phase === 'myth') return drawMyth();
  const N = HIST.N;
  const ch = [], col = [];
  for (let r = 0; r < A_ROWS; r++) { ch.push(new Array(A_COLS).fill(' ')); col.push(new Array(A_COLS).fill(null)); }
  const put = (x, y, c, k) => {
    if (x < 0 || y < 0 || x >= A_COLS || y >= A_ROWS) return;
    ch[y][x] = c; col[y][x] = k;
  };
  const sx = i => Math.min(A_MAP_W - 1, Math.floor(i * A_MAP_W / N));
  const sy = j => 1 + Math.min(A_MAP_H - 1, Math.floor(j * A_MAP_H / N));

  // ground
  for (let y = 1; y <= A_MAP_H; y++) for (let x = 0; x < A_MAP_W; x++) {
    const i = Math.min(N - 1, Math.floor(x * N / A_MAP_W));
    const j = Math.min(N - 1, Math.floor((y - 1) * N / A_MAP_H));
    const k = j * N + i;
    if (S.grid.water[k]) { put(x, y, '~', '#24506e'); continue; }
    const h = clamp(S.grid.h[k] / CFG.TERRAIN_MAX, 0, 1);
    put(x, y, h > 0.62 ? '^' : h > 0.34 ? ':' : '.', h > 0.62 ? '#5c5347' : '#3b4048');
  }
  // territory tints the ground under whoever holds it
  const own = territory(year);
  for (let y = 1; y <= A_MAP_H; y++) for (let x = 0; x < A_MAP_W; x++) {
    const i = Math.min(N - 1, Math.floor(x * N / A_MAP_W));
    const j = Math.min(N - 1, Math.floor((y - 1) * N / A_MAP_H));
    const o = own[j * N + i];
    if (o >= 0 && ch[y][x] !== '~') col[y][x] = HUE[o];
  }
  // roads, then what is on them
  for (const l of S.links) {
    if (l.built > year) continue;
    const dead = year - Chronicle.linkLive(S, l);
    for (const k of l.path) {
      const i = k % N, j = (k - i) / N;
      put(sx(i), sy(j), dead > 0 ? '-' : '=', dead > 0 ? '#4a5058' : HUE[l.people]);
    }
    for (const b of l.bridges) for (const k of b) {
      const i = k % N, j = (k - i) / N;
      put(sx(i), sy(j), '#', dead > 0 ? '#6a7482' : '#e8eef4');
    }
  }
  if (showFinds) for (const d of S.deposits) {
    if (d.t > year) continue;
    const robbed = d.robbed >= 0 && d.robbed <= year;
    put(sx(d.i), sy(d.j), '*', robbed ? '#3a4048' : d.artifact !== null ? '#e8c46a' : '#7f8794');
  }
  for (const b of S.battles) {
    if (b.t > year) continue;
    put(sx(b.i), sy(b.j), 'x', year - b.t < FLASH ? '#ff8a63' : '#8c4a37');
  }
  for (const s of S.sites) {
    if (s.founded > year) continue;
    const gone = s.abandoned >= 0 && s.abandoned <= year;
    const st = Chronicle.stage(S, s, year);
    const glyph = gone ? (st >= 4 ? ',' : (A_SITE[s.kind] || 'o').toLowerCase())
                       : (A_SITE[s.kind] || 'o');
    put(sx(s.i), sy(s.j), glyph, gone ? (st >= 4 ? '#454b54' : '#7a8290') : HUE[s.people]);
  }

  // ---- the record, down the right ----
  const px = A_MAP_W + 2;
  // The glyph atlas is ASCII 32..126 and nothing else, so anything the
  // record wants to say has to survive being flattened to it. Doing this
  // here is also how the game screen catches typography that would simply
  // not draw once this text is going through the renderer.
  const a7 = t => String(t)
    .replace(/[\u2014\u2013]/g, '-').replace(/\u00b7/g, '.')
    .replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .replace(/\u2026/g, '...').replace(/[^\x20-\x7e]/g, '?');
  const line = (y, str, c) => {
    const t = a7(str).slice(0, A_PANEL);
    for (let n = 0; n < t.length; n++) put(px + n, y, t[n], c);
  };
  const up = S.peoples.filter(p => year >= p.rise && (p.fell < 0 || year < p.fell));
  line(0, 'THE CHRONICLE', '#e8eef4');
  const hdr = 'year ' + String(year).padStart(4) + '   ' +
              (up.length ? up.map(p => p.name).join(', ') : 'nobody');
  const hdr7 = a7(hdr);
  for (let n = 0; n < hdr7.length && n < A_MAP_W; n++)
    put(A_MAP_W - hdr7.length + n, 0, hdr7[n], '#8b949e');

  line(1, 'WHO IS REMEMBERED', '#8b949e');
  const heroes = S.heroes.filter(id => S.figures[id].born <= year);
  for (let n = 0; n < 14; n++) {
    if (n >= heroes.length) break;
    const f = S.figures[heroes[n]];
    const dead = f.died >= 0 && f.died <= year;
    line(2 + n, (f.name + (f.epithet ? ' ' + f.epithet : '')).padEnd(34).slice(0, 34) +
                (dead ? f.born + '-' + f.died : f.born + '-'), HUE[f.people]);
  }
  line(17, 'WHAT IS REMEMBERED', '#8b949e');
  const legs = S.legends.filter(id => S.artifacts[id].made <= year);
  for (let n = 0; n < 7; n++) {
    if (n >= legs.length) break;
    const a = S.artifacts[legs[n]];
    line(18 + n * 2, a.name, HUE[a.people]);
    const rest = a.rest && a.rest.t <= year ? a.rest : null;
    const z = rest ? Chronicle.buryDepth(S, rest.i, rest.j, year - rest.t) : 0;
    line(19 + n * 2, '   ' + (a.title || '') +
         (rest ? '  (' + z.toFixed(1) + ' m down, ' +
          Chronicle.conditionWord(Chronicle.condition(S, a, year)) + ')' : ''), '#6c7480');
  }
  line(33, 'WHAT HAPPENED', '#8b949e');
  const evs = [];
  for (const e of S.events) { if (e.t > year) break; evs.push(e); }
  const tail = evs.slice(-15);
  for (let n = 0; n < tail.length; n++)
    line(34 + n, String(tail[n].t).padStart(4) + '  ' + evLine(tail[n]),
         n === tail.length - 1 ? '#c8d2dc' : '#7f8794');

  // one pass of run-length spans per row keeps this cheap enough to animate
  let out = '';
  for (let y = 0; y < A_ROWS; y++) {
    let run = '', cur = null;
    for (let x = 0; x < A_COLS; x++) {
      const c = col[y][x];
      if (c !== cur) {
        if (run) out += cur ? `<span style="color:${cur}">${esc(run)}</span>` : esc(run);
        run = ''; cur = c;
      }
      run += ch[y][x];
    }
    if (run) out += cur ? `<span style="color:${cur}">${esc(run)}</span>` : esc(run);
    out += '\n';
  }
  document.getElementById('ascii').innerHTML = out;
}
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// What they say came before any of it. Held on the same grid, so it reads as
// part of the game rather than as a title card in front of it.
// The renderer's cell is CFG.CELL_W x CFG.CELL_H. Whatever font actually
// wins the stack has its own advance width, so measure it and derive the
// line-height from it - that reproduces the game's cell aspect exactly
// instead of assuming a ratio that only holds for one of the fallbacks.
function fitAscii() {
  const el = document.getElementById('ascii');
  const probe = document.createElement('span');
  probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;' +
    'font:bold 100px var(--mono);';
  probe.textContent = '0'.repeat(50);
  document.body.appendChild(probe);
  const ratio = probe.getBoundingClientRect().width / 50 / 100;   // advance per em
  probe.remove();
  if (!ratio) return;
  const avail = document.documentElement.clientWidth - 40;
  const size = Math.max(6, Math.min(18, avail / (A_COLS * ratio)));
  el.style.fontSize = size.toFixed(2) + 'px';
  el.style.lineHeight = (size * ratio * (CFG.CELL_H / CFG.CELL_W)).toFixed(2) + 'px';
}

function drawMyth() {
  const lines = S.myth.lines;
  const shown = Math.min(lines.length, Math.floor(mythT / MYTH_STEP));
  const top = Math.max(2, Math.floor((A_ROWS - lines.length) / 2));
  const left = Math.max(2, Math.floor((A_COLS - 62) / 2));
  const rows = [];
  for (let r = 0; r < A_ROWS; r++) rows.push({ x: 0, t: '', c: null });
  let out = '';
  for (let r = 0; r < A_ROWS; r++) {
    let text = '', colr = null;
    const n = r - top;
    if (n >= 0 && n < shown) {
      text = lines[n]; colr = n < 3 ? '#8b949e' : '#c8d2dc';
    } else if (r === A_ROWS - 2 && shown >= lines.length) {
      text = 'any key'; colr = '#566070';
    }
    const pad = text ? ' '.repeat(left) : '';
    const body = pad + text;
    const fill = ' '.repeat(Math.max(0, A_COLS - body.length));
    out += (colr ? `${esc(pad)}<span style="color:${colr}">${esc(text)}</span>`
                 : esc(body)) + esc(fill) + '\n';
  }
  document.getElementById('ascii').innerHTML = out;
}

function drawPeoples() {
  document.getElementById('peoples').innerHTML = S.peoples.map((p, n) => {
    const end = p.fell >= 0 ? p.fell : HIST.SPAN;
    const l = 100 * p.rise / HIST.SPAN, w = 100 * (end - p.rise) / HIST.SPAN;
    return `<div class="lane"><span class="sw" style="background:${HUE[n]}"></span>
      <b>${p.name}</b><span class="dim">${p.kind}${p.player ? ' — yours' : ''}
      · builds in ${p.mat}, works ${p.metal}</span></div>
      <div class="era"><i style="left:${l}%;width:${w}%;background:${HUE[n]}"></i><b></b></div>
      <div class="dim yr">rose ${p.rise} ·
      ${p.fell >= 0 ? 'ended ' + p.fell + ' (' + p.cause + ')' : 'still here'}</div>`;
  }).join('');
}

// Things are remembered for the same reason people are: because of what
// happened to them. The title is read off the object's own history.
function drawLegends() {
  const out = S.legends.filter(id => S.artifacts[id].made <= year).map(id => {
    const a = S.artifacts[id];
    const rest = a.rest && a.rest.t <= year ? a.rest : null;
    const z = rest ? Chronicle.buryDepth(S, rest.i, rest.j, year - rest.t) : 0;
    const where = rest
      ? `${rest.how === 'grave' ? 'in a grave' : rest.how === 'hoard' ? 'hidden'
           : rest.how === 'lost' ? 'out in the country' : 'on the field'}` +
        ` at ${rest.i},${rest.j} — ${z.toFixed(1)} m down`
      : 'still above ground';
    return `<div class="thing">
      <span class="sw" style="background:${HUE[a.people]};display:inline-block"></span>
      ${a.name}<br><i>${a.title || ''}</i>
      <span class="dim"> · ${a.cls}, made ${a.made} · ${where}
      · ${Chronicle.conditionWord(Chronicle.condition(S, a, year))}</span></div>`;
  }).join('');
  document.getElementById('legends').innerHTML =
    out || '<span class="dim">nothing has a story attached to it yet</span>';
}

// Most events are structured; a figure's own deeds log their sentence as the
// action, so anything unrecognised is already readable as written.
function evLine(e) {
  const who = (e.who !== null && e.who !== undefined) ? S.figures[e.who] : null;
  const pe = (e.actor !== null && e.actor !== undefined) ? S.peoples[e.actor] : null;
  const at = (e.place !== null && e.place !== undefined) ? S.sites[e.place] : null;
  const nm = x => x ? x.name : 'somebody';
  switch (e.action) {
    case 'founded':   return `${nm(pe)} founded ${nm(at)}`;
    case 'settled':   return `${nm(pe)} settled ${nm(at)}`;
    case 'roaded':    return `${nm(pe)} cut a road to ${nm(at)}`;
    case 'bridged':   return `${nm(pe)} bridged the water near ${nm(at)}`;
    case 'fortified': return `${nm(pe)} fortified ${nm(at)}`;
    case 'declared war on':
      return `${nm(pe)} declared war on ${nm(S.peoples[e.target])} over ${e.cause}`;
    case 'made peace with':
      return `${nm(pe)} made peace with ${nm(S.peoples[e.target])}`;
    case 'lost the war to':
      return `${nm(pe)} lost the war to ${nm(S.peoples[e.target])}`;
    case 'won a battle at':
      return `${nm(pe)} won ${S.battles[e.target].name}` + (who ? `, under ${who.name}` : '');
    case 'fell at':
      return `${who ? who.name : 'their commander'} fell at ${S.battles[e.target].name}`;
    case 'made':
      return `${who ? who.name : nm(pe)} made ${S.artifacts[e.target].name}`;
    case 'was buried':
      return `${who ? who.name : 'somebody'} was buried at ${nm(at)}` +
             (e.cause && e.cause !== 'age' ? ` — ${e.cause}` : '');
    case 'lost the craft':
      return `the working of ${e.cause} went into the ground with ${nm(pe)} — ` +
             `nobody after them could do it`;
    case 'opened a grave of':
      return `${nm(pe)} opened a grave of ${nm(S.peoples[e.target])}`;
    case 'ended':
      return e.target === null ? `${nm(pe)} came to an end — ${e.cause}`
                               : `${nm(at)} was lost — ${e.cause}`;
    default:
      return `${who ? who.name + ' ' : ''}${e.action}`;
  }
}

function drawLog() {
  const out = [];
  for (const e of S.events) {
    if (e.t > year) break;
    out.push(`<div class="ev"><span class="t">${e.t}</span>${evLine(e)}</div>`);
  }
  const el = document.getElementById('log');
  el.innerHTML = out.slice(-400).reverse().join('') || '<span class="dim">nothing yet</span>';
}

function drawPick() {
  const el = document.getElementById('pick');
  if (picked === null) {
    el.innerHTML = '<div class="dim" style="margin-bottom:6px">what they say came before</div>' +
      S.myth.lines.map(l => l ? `<div>${l}</div>` : '<div>&nbsp;</div>').join('') +
      '<div class="dim yr" style="margin-top:6px">click the map for what stands there</div>';
    return;
  }
  const s = S.sites[picked], p = S.peoples[s.people];
  if (s.founded > year) {
    el.innerHTML = `<span class="dim">nothing here yet — ${s.name} is not founded until ${s.founded}</span>`;
    return;
  }
  const gone = s.abandoned >= 0 && s.abandoned <= year;
  const st = Chronicle.stage(S, s, year), sink = Chronicle.sink(S, s, year);
  const WHAT = ['lived in', 'standing and empty', 'roofless', 'walls falling',
                'a footprint in the grass', 'nothing left above ground'];
  el.innerHTML = `<div class="lane"><span class="sw" style="background:${HUE[s.people]}"></span>
    <b>${s.name}</b><span class="dim">a ${s.mat}-built ${s.kind} of ${p.name}</span></div>
    <div>built ${s.founded}${gone ? `, lost ${s.abandoned} — ${s.cause}` : ''}</div>
    <div>${WHAT[st]}${sink > 0.3 ? `, ${sink.toFixed(1)} m down` : ''}</div>
    <div class="dim">${gone ? (s.sudden ? 'left in a hurry — what they had is still in it'
                                        : 'emptied slowly — they took the good things with them')
                          : Math.round(s.pop) + ' people'}</div>
    ${finds(s)}`;
}

// Everything named that is lying in the ground within a couple of cells,
// with how deep it has gone and whether anybody has already been for it.
function finds(s) {
  const near = S.artifacts.filter(a => a.rest && a.rest.t <= year &&
    Math.abs(a.rest.i - s.i) <= 2 && Math.abs(a.rest.j - s.j) <= 2);
  const dug = S.deposits.filter(d => d.t <= year &&
    Math.abs(d.i - s.i) <= 2 && Math.abs(d.j - s.j) <= 2);
  const robbed = dug.filter(d => d.robbed >= 0 && d.robbed <= year).length;
  if (!near.length && !dug.length) return '';
  const list = near.slice(0, 4).map(a => {
    const z = Chronicle.buryDepth(S, a.rest.i, a.rest.j, year - a.rest.t);
    const cw = Chronicle.conditionWord(Chronicle.condition(S, a, year));
    return `<div class="dim yr">· ${a.name} — ${a.rest.how}, ${z.toFixed(1)} m down, ${cw}</div>`;
  }).join('');
  return `<div class="dim yr" style="margin-top:6px">${dug.length} deposits in this ground` +
         (robbed ? `, ${robbed} already opened` : '') + `</div>${list}`;
}

cv.addEventListener('click', ev => {
  const r = cv.getBoundingClientRect();
  const i = Math.floor((ev.clientX - r.left) / S_PX), j = Math.floor((ev.clientY - r.top) / S_PX);
  let best = null, bd = 4;
  for (const s of S.sites) {
    if (s.founded > year) continue;
    const d = Math.hypot(s.i - i, s.j - j);
    if (d < bd) { bd = d; best = s.id; }
  }
  picked = best;
  draw();
});

const scrub = document.getElementById('scrub');
scrub.max = HIST.SPAN;
scrub.addEventListener('input', () => { year = +scrub.value; draw(); });
const playBtn = document.getElementById('play');
function step() {
  if (!playing) return;
  if (phase === 'myth') {
    mythT += 1;
    drawAscii();
    if (mythT > S.myth.lines.length * MYTH_STEP + MYTH_HOLD) phase = 'record';
    requestAnimationFrame(step);
    return;
  }
  year += speed;
  if (year >= HIST.SPAN) {
    year = HIST.SPAN;
    scrub.value = year;
    draw();
    if (looping && !ascii) { year = 0; }   // straight round again
    else { playing = false; playBtn.textContent = 'play'; return; }
  }
  scrub.value = year;
  draw();
  requestAnimationFrame(step);
}
playBtn.addEventListener('click', function () {
  playing = !playing;
  this.textContent = playing ? 'pause' : 'play';
  if (playing) {
    if (year >= HIST.SPAN) year = 0;   // at the end, start over
    requestAnimationFrame(step);
  }
});
for (const b of document.querySelectorAll('.sp')) {
  b.addEventListener('click', function () {
    speed = +this.dataset.sp;
    for (const o of document.querySelectorAll('.sp')) o.classList.remove('on');
    this.classList.add('on');
  });
}
document.getElementById('loop').addEventListener('change', function () {
  looping = this.checked;
});
document.getElementById('finds').addEventListener('change', function () {
  showFinds = this.checked;
  draw();
});
document.getElementById('seen').addEventListener('change', function () {
  showSeen = this.checked;
  draw();
});

// x drops into the game's own screen, where the record plays through once
// from the beginning and then stands at the present.
window.addEventListener('keydown', function (e) {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  // anything at all goes past the prologue
  if (ascii && phase === 'myth' && e.key !== 'x' && e.key !== 'X') {
    phase = 'record';
    draw();
    return;
  }
  if (e.key !== 'x' && e.key !== 'X') return;
  ascii = !ascii;
  document.body.classList.toggle('ascii', ascii);
  if (ascii) fitAscii();
  if (ascii) {
    year = 0;
    phase = 'myth';
    mythT = 0;
    playing = true;
    playBtn.textContent = 'pause';
    requestAnimationFrame(step);
  } else {
    phase = 'record';
    playing = false;
    playBtn.textContent = 'play';
    year = HIST.SPAN;
    scrub.value = year;
  }
  draw();
});
const seedBox = document.getElementById('seed');
seedBox.value = CFG.SEED;
document.getElementById('go').addEventListener('click', () => {
  const v = Number(seedBox.value);
  if (Number.isInteger(v) && v >= 0 && v < (1 << 24)) run(v);
});
window.addEventListener('resize', function () { if (ascii) { fitAscii(); draw(); } });
run(CFG.SEED);
</script>
</body>
</html>
