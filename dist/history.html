<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Chronicle</title>
<style>
  /* One committed world, not two themes: the game this belongs to is a black
     terminal, and a light-mode chronicle would be a different instrument. */
  :root {
    --bg:#08090b; --plate:#000; --ink:#c8d2dc; --dim:#566070; --line:#1b1f26;
    --edge:#2a3039; --loss:#d4674a; --water:#0d1a26;
    /* the six peoples, running bone -> copper -> bronze -> iron */
    --p0:#b08968; --p1:#c97b4a; --p2:#c9a94b;
    --p3:#6fae8f; --p4:#5f96c4; --p5:#8f7fc0;
    /* The game's own stack, taken from js/webgpu/atlas.js, which rasterizes
       the glyph sheet with `bold Npx "Consolas", "Courier New", monospace`.
       The record used to be set in a serif to separate it from the
       instrument; that distinction is carried by weight and colour now,
       because matching the game matters more than my nicety. */
    --mono:"Consolas","Courier New",monospace;
    --serif:"Consolas","Courier New",monospace;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font:400 12px/1.6 var(--mono);
    display:flex; gap:26px; padding:22px; align-items:flex-start;
  }
  #left { flex:0 0 auto; display:flex; flex-direction:column; gap:12px; }
  #right { flex:1 1 auto; min-width:0; align-self:stretch;
           display:flex; flex-direction:column; gap:10px; }

  .eyebrow { font-size:10px; font-weight:600; letter-spacing:.2em;
             text-transform:uppercase; color:var(--dim); margin:0; }
  h1 { font:500 15px/1.3 var(--mono); letter-spacing:.02em; margin:2px 0 0; }

  /* the map sits like a mounted survey plate */
  .plate { position:relative; align-self:flex-start;
           border:1px solid var(--edge); outline:1px solid var(--line);
           outline-offset:3px; background:var(--plate); }
  canvas { display:block; }

  /* the three lifespans double as the timeline: same playhead, same gesture */
  #peoples { display:flex; flex-direction:column; gap:9px; margin-top:4px; }
  .lane { display:flex; gap:8px; align-items:baseline; font-size:11px; }
  .lane b { font-weight:500; }
  .sw { width:8px; height:8px; flex:0 0 auto; border-radius:1px; align-self:center; }
  .era { position:relative; height:6px; background:#0f1216;
         border:1px solid var(--line); margin:3px 0 2px; }
  .era i { position:absolute; top:0; bottom:0; display:block; opacity:.8; }
  .era b { position:absolute; top:-3px; bottom:-3px; width:1px;
           background:var(--ink); opacity:.9; }
  .yr { font-size:11px; }

  .bar { display:flex; align-items:center; gap:9px; }
  input[type=range] { flex:1; accent-color:var(--p1); height:2px; }
  input[type=number] { background:#0f1216; color:var(--ink);
    border:1px solid var(--line); padding:4px 7px; width:10ch; font:inherit; }
  button { background:#0f1216; color:var(--dim); border:1px solid var(--line);
    padding:4px 12px; font:500 11px/1 var(--mono); letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer; transition:border-color .12s, color .12s; }
  button:hover { border-color:var(--edge); color:var(--ink); }
  .sp { padding:4px 10px; }
  .sp.on { border-color:var(--p1); color:var(--ink); }
  label { display:flex; align-items:center; gap:5px; cursor:pointer; font-size:11px; }
  :focus-visible { outline:1px solid var(--p1); outline-offset:2px; }

  #year, #alive, #stat { font-variant-numeric:tabular-nums; }
  #year { min-width:10ch; }

  /* the record speaks in serif; the instrument speaks in mono */
  .panel { border:1px solid var(--line); padding:11px 13px; overflow:auto; }
  #pick { flex:0 0 auto; max-height:230px; font:400 13px/1.6 var(--serif); }
  #heroes { flex:0 0 auto; max-height:170px; }
  #legends { flex:0 0 auto; max-height:200px; font:400 13px/1.55 var(--serif); }
  .thing { margin-bottom:7px; }
  .thing i { font-style:italic; color:var(--ink); opacity:.85; }
  #pick .lane { font:inherit; }
  #log { flex:1 1 auto; min-height:200px; font:400 13px/1.65 var(--serif); }
  .dim { color:var(--dim); }
  .ev { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 0; }
  .t { color:var(--dim); display:inline-block; width:5ch; text-align:right;
       margin-right:10px; font:400 11px/1 var(--mono);
       font-variant-numeric:tabular-nums; }
  /* The game's own screen: 1920x1080 over 12x22 cells is 160x49 characters,
     and a cell is 0.545 as wide as it is tall. A monospace advance is 0.6em,
     so line-height 1.1em reproduces that cell aspect exactly. */
  #ascii { display:none; margin:0; white-space:pre; color:var(--ink);
    font:bold 14px/1.1 var(--mono); letter-spacing:0; }
  body.ascii #left, body.ascii #right { display:none; }
  body.ascii #ascii { display:block; }
  body.ascii { display:block; }
  .hint { position:fixed; right:14px; bottom:10px; color:var(--dim); font-size:11px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<pre id="ascii"></pre>
<div class="hint">x — the game's own screen</div>
<div id="left">
  <div>
    <p class="eyebrow">Ascii World</p>
    <h1>The Chronicle</h1>
  </div>
  <div class="plate"><canvas id="map" width="704" height="704"></canvas></div>
  <div id="peoples"></div>
  <div class="bar">
    <button id="play">play</button>
    <input type="range" id="scrub" min="0" max="2000" value="2000" step="5" aria-label="year">
    <span id="year">year 2000</span>
  </div>
  <div class="bar">
    <span class="dim">speed</span>
    <button class="sp" data-sp="1">slow</button>
    <button class="sp on" data-sp="4">even</button>
    <button class="sp" data-sp="14">fast</button>
    <label class="dim"><input type="checkbox" id="loop" checked>loop</label>
    <label class="dim"><input type="checkbox" id="finds">finds</label>
    <label class="dim"><input type="checkbox" id="seen">seen</label>
    <span class="dim" id="alive"></span>
  </div>
  <div class="bar">
    <span class="dim">seed</span>
    <input type="number" id="seed" min="0" max="16777215" aria-label="world seed">
    <button id="go">run</button>
    <span id="stat" class="dim"></span>
  </div>
</div>
<div id="right">
  <p class="eyebrow">What stands there</p>
  <div class="panel" id="pick"></div>
  <p class="eyebrow">Who is remembered</p>
  <div class="panel" id="heroes"></div>
  <p class="eyebrow">What is remembered</p>
  <div class="panel" id="legends"></div>
  <p class="eyebrow">What happened</p>
  <div class="panel" id="log"></div>
</div>

<script>
// ---- js/config.js ----
// Global configuration. Plain script, shared global scope (inlined at build time).
const CFG = {
  PLANE_LEN: 0.85,    // tan(horizontal half-FOV)
  MAX_DIST: 140,      // ray cutoff (world units); beyond fades to haze
  EYE: 1.55,          // camera height above ground
  SEED: 8151623,      // world seed; MUST stay below 2^24 so the f32 uniform
                      // carries it exactly and CPU and GPU agree on the world
  // rendering. Character cells are sized like a terminal's: monospace glyphs
  // are roughly 0.55x as wide as tall, so cells are taller than wide - and
  // bigger overall, which is both the look and far fewer rays.
  CELL_W: 12,         // CSS px per cell, horizontal
  CELL_H: 22,         // CSS px per cell, vertical
  MONO: false,        // uniform grayscale; devmode + M toggles
  GLYPH_SET: 'ascii', // ascii | symbols  (C cycles)
  // Tone curve applied before glyph selection. White sits at the luminance
  // sunlit surfaces actually reach; above that the brightest glyphs go
  // unused, below it they clip and the highlights flatten.
  TONE_BLACK: 0.0,
  TONE_WHITE: 0.90,
  TONE_GAMMA: 0.9,
  RAW: false,         // debug: show the shaded image without glyph mapping (X)
  SUN_AZ: 0.9,        // sun azimuth at t=0 (rad); the cycle sweeps from here
  DAY_LEN: 3000,      // seconds for a full day/night cycle (50 min)
  // Twilight reach, as sin(sun elevation) either side of the horizon. Low
  // sun means a long path through air, so the light warms well before it
  // touches down - the golden hour is long on the way in, and the afterglow
  // that follows it is shorter.
  WARM_UP: 0.70,      // ~44 deg up: the light starts to turn warm
  WARM_DOWN: 0.26,    // ~15 deg down: the last of the warmth is gone
  DUSK_UP: 0.30,      // the red band in the sky, before the sun is down
  DUSK_DOWN: 0.26,    // and lingering after it
  // night sky: the moon's angular radius and how thick its crescent is
  MOON_R: 0.085,
  MOON_CRESC: 0.42,   // offset of the shadow disc, in moon radii
  MOON_GLOW: 0.10,    // halo strength around the disc
  MOON_GLOW_P: 400,   // halo tightness; higher is a smaller halo
  MOON_DARK: 0.04,    // earthshine lift on the unlit limb
  STAR_GRID: 90,      // celestial grid fineness; higher = smaller stars
  STAR_RARE: 0.976,   // hash above this is a star, at full dark
  // Stars do not arrive at sunset. The first show once the sun is a little
  // way under, and the field fills in as it sinks further - these are the
  // two depths, measured as sin(elevation) below the horizon.
  STAR_DUSK: 0.06,    // ~3.5 deg down: the brightest few
  STAR_DARK: 0.30,    // ~17 deg down: the whole field
  // The celestial pole the sky turns about. Tilted well off vertical, so
  // stars rise and set instead of just wheeling around the zenith.
  STAR_POLE_AZ: 2.2,
  STAR_POLE_EL: 0.85,
  SHADOW: 0.04,       // sun contribution inside full shadow (sky light only)
  // wide sun disc: broad, soft penumbrae that grow with distance from the
  // occluder (0.05 rad is the "soft shadows" look; the real sun is 0.0047)
  SUN_ANGLE: 0.05,
  SUN_SAMPLES: 16,    // shadow rays per pixel
  AO_SAMPLES: 32,     // hemisphere rays per pixel
  AO_RADIUS: 9,       // AO ray length, world units
  TREE_REACH: 2,      // cells a canopy may overhang; sets the search radius
  // lighting LOD: full shadow/AO ray budgets inside SHADE_NEAR, then a hard
  // cut - beyond it no shadow or AO rays are traced at all, no taper
  SHADE_NEAR: 40,
  SHADE_FAR: 40.001,
  // terrain: a continuous, infinite heightfield evaluated in the shader and
  // mirrored in js/util.js. No stored grid, no world bounds.
  TERRAIN_MAX: 16,    // amplitude: highest possible ground, world units
  // caves: view distance underground; rays in cave air stop here and fade out
  CAVE_VIEW: 60,
  // headlamp: camera-attached light so unlit caves are explorable; falls off
  // with distance, only applied to underground hits
  LAMP: 0.6,
  // Overlay cell value meaning "render nothing here". 0 is transparent (the
  // scene's own glyph) and 32 is a space (also the scene's glyph), so clear
  // air around UI text needs a code of its own.
  UI_BLANK: 31,
  // underground ray caps: sun is mostly absent down there, so penumbra
  // fidelity is worth less than frame time
  CAVE_SUN: 8,
  CAVE_AO: 16,
  SEA_LEVEL: 2.4,     // water plane; terrain below this is sea/lake
  // Moving through the world. Until now the camera simply rode the floor:
  // there was no vertical velocity at all, and water was a wall you could
  // not walk into. Both of those are now real.
  GRAV: 18,           // world units per second squared
  JUMP: 6.2,          // launch speed; clears a little over a metre
  STEP_UP: 1.0,       // the tallest lip you can walk up without jumping
  // Wading and swimming are different things. Anything shallower than this
  // you walk through, standing on the bed; deeper and your feet leave it.
  WADE: 1.1,
  WADE_SPD: 0.62,     // water drags, even when you can still stand up in it
  SWIM_SPD: 0.48,
  SWIM_EYE: 0.35,     // how far the eye rides above the surface when afloat
  SWIM_RISE: 3.5,     // how fast you bob back up to the surface
  // entities (future creatures); buffer capacity fixed, live count per frame
  MAX_ENTS: 64,
  // digging: resident edit-chunk capacity on the GPU, reach and scoop size
  EDIT_MAX: 32,
  DIG_REACH: 3.5,
  DIG_R: 1.1,
  // Buildings resident on the GPU. A village is some hundreds of primitives
  // and only what is near the camera is sent, so these are a view budget
  // rather than a world limit.
  STEAD_HEAD: 256,    // buildings
  STEAD_PRIM: 8192,   // primitives across all of them
  STEAD_STEP: 40,     // world units the player moves before a repack
  // cleared cells visible to the GPU (nearest the player); farther cleared
  // props may visually reappear until this rises in a later phase
  REMOVED_MAX: 64,
};

// The seed is the whole world, so it is worth being able to hand someone
// else. ?seed=<n> picks one at load; the console's "seed" command sets that
// query and reloads, because every module caches something derived from it.
// Out-of-range values are ignored rather than silently wrapped: a seed at or
// above 2^24 does not survive the f32 uniform, and CPU and GPU would then
// disagree about where the world is.
const SEED_MAX = 1 << 24;
CFG.SEED_DEFAULT = CFG.SEED;
(function () {
  if (typeof location === 'undefined' || !location.search) return;
  const m = /[?&]seed=([^&]*)/.exec(location.search);
  if (!m) return;
  const v = Number(decodeURIComponent(m[1]));
  if (Number.isInteger(v) && v >= 0 && v < SEED_MAX) CFG.SEED = v;
  else console.warn('[ASCII World] ignoring seed ' + m[1] +
    ' - must be a whole number in 0..' + (SEED_MAX - 1));
})();

// Saves are per world: two seeds are two different places, and their digs,
// inventories and records have nothing to say to each other. The default
// seed keeps the original unsuffixed keys so an existing save survives.
function saveKey(base) {
  return CFG.SEED === CFG.SEED_DEFAULT ? base : base + ':' + CFG.SEED;
}
</script>
<script>
// ---- js/util.js ----
// Hashing / noise / terrain — bit-compatible mirrors of the WGSL functions in
// js/webgpu/shaders.js. The GPU draws the world from these functions and the
// CPU collides against them, so any change MUST be made in both places.

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

// u32 hash, identical to WGSL uhash (Math.imul == u32 multiply wrap)
function jsUhash(a, b) {
  let n = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663)) >>> 0;
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177) >>> 0;
  return (n ^ (n >>> 16)) >>> 0;
}

function hash01(x, y, s) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0) / 4294967296;
}

function hash2i(x, y, s) {
  const h = jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0);
  return [(h & 0xffff) / 65536, ((h >>> 16) & 0xffff) / 65536];
}

// 2D value noise, smoothstep-interpolated — mirror of WGSL vn2
function vn2(px, py, s) {
  const ix = Math.floor(px), iy = Math.floor(py);
  const fx = px - ix, fy = py - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash01(ix, iy, s), b = hash01(ix + 1, iy, s);
  const c = hash01(ix, iy + 1, s), d = hash01(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// -------- terrain height — mirror of WGSL terrainH --------
// Shape constants live here and are interpolated into the WGSL, never
// retyped there. Two hand-kept copies of terrainH is the divergence that
// would move the ground out from under collision without changing a single
// pixel of the sky, so scripts/verify.js rejects a bare float literal in
// either mirrored function.
const TERR = {
  WARP_F: 0.013,     // frequency of the field that warps the domain
  WARP_OX: 37.0,     // and the offsets that decorrelate its two channels
  WARP_OY: 91.0,
  WARP_A: 1.4,       // warp amplitude, in base-frequency units
  BASE_F: 0.023,     // base frequency of the heightfield
  OCT1_W: 0.62,      // octave weights, summing to 1
  OCT2_W: 0.26,
  OCT3_W: 0.12,
  OCT2_F: 2.7,       // and their frequency ratios
  OCT3_F: 6.1,
  RIDGE: 1.55,       // exponent: deepens valleys, sharpens ridges
};

function terrainH(px, py) {
  const s = CFG.SEED >>> 0;
  const wx = vn2(px * TERR.WARP_F, py * TERR.WARP_F, (s ^ 0x77) >>> 0);
  const wy = vn2(px * TERR.WARP_F + TERR.WARP_OX,
                 py * TERR.WARP_F + TERR.WARP_OY, (s ^ 0x77) >>> 0);
  const qx = px * TERR.BASE_F + (wx - 0.5) * TERR.WARP_A;
  const qy = py * TERR.BASE_F + (wy - 0.5) * TERR.WARP_A;
  let h = vn2(qx, qy, s) * TERR.OCT1_W +
          vn2(qx * TERR.OCT2_F, qy * TERR.OCT2_F, (s ^ 0x9e37) >>> 0) * TERR.OCT2_W +
          vn2(qx * TERR.OCT3_F, qy * TERR.OCT3_F, (s ^ 0x51ed) >>> 0) * TERR.OCT3_W;
  h = Math.pow(h, TERR.RIDGE);
  return h * CFG.TERRAIN_MAX;
}

// -------- caves: shared constants + density mirror --------
// These values are interpolated into the WGSL template in
// js/webgpu/shaders.js, so shader and mirror cannot disagree
// (scripts/verify.js enforces the convention: no literal CAVE_/EDIT_
// constants in the shader source).
const CAVES = {
  STEP: 0.3,     // primary-ray march step through cave air, world units
  STEPS: 200,    // primary-ray march budget (STEP * STEPS = CAVE_VIEW)
  TSTEP: 0.55,   // occlusion-ray march step through cave air
  TSTEPS: 14,    // occlusion-ray march budget
  BAND: 12,      // depth-band height; band k spans [k*BAND, k*BAND+BAND)
  TOP: -1,       // no natural void above this z (highest ceiling is -1.4)
  BOT: -36,      // deepest band floor for the slice; extensible downward
  MASK_F: 0.006, // cave-region mask frequency (regions ~150 u across)
  MASK_LO: 0.62, // mask gate: smoothstep(LO, HI, noise)
  MASK_HI: 0.70,
  FLOOR_F: 0.05, // floor ramp frequency; FLOOR_A * FLOOR_F * 1.5 bounds the
  FLOOR_A: 3.0,  // slope (~0.23 = 13 deg) - walkability is by construction
  PASS_F: 0.045, // passage isoline frequency (winding at ~20 u scale)
  PASS_F2: 0.062,// second isoline family; crossings knit the network together
  CHAM_F: 0.02,  // chamber noise frequency
  PASS_W: 0.06,  // passage half-width in isoline value units
  CHAM_W: 0.15,  // extra half-width inside chambers
  PASS_SCALE: 15,// value units -> approx world units (1 / (1.5 * PASS_F))
  // shafts: helical stair wells, one candidate per SHAFT_E cell per band
  // pair. Compact by design so the field only ever checks its own cell.
  SHAFT_E: 48,     // placement cell size; anchor jitter keeps R inside it
  SHAFT_R: 3.0,    // outer radius of the stair well
  SHAFT_RIN: 0.75, // central column radius (keeps the stair "supported")
  SHAFT_PITCH: 3.4,// vertical drop per full turn; grade ~16 deg mid-stair
  SHAFT_OPEN: 0.7, // open fraction of each turn (headroom 2.4, slab 1.0)
  // carved halls: one candidate per HALL_E cell per band; flat-floored
  // rotated rooms with a pillar lattice, entered wherever the natural
  // passage network punctures their walls
  HALL_E: 96,      // placement cell size
  PIL_S: 3.5,      // pillar lattice spacing inside halls
  PIL_R: 0.45,     // pillar half-width (square pillars, Chebyshev metric)
  // edits: sparse voxel-delta overlay (digging); see js/edits.js
  EDIT_CHUNK: 32,      // voxels per chunk edge
  EDIT_VOX: 0.5,       // voxel size, world units
  EDIT_SCALE: 0.03125, // stored i8 -> density units (1/32; range ~±4)
  EDIT_WORDS: 8192,    // u32 words per chunk (32^3 / 4)
};

// Band floor: a low-frequency ramp whose slope is bounded by construction.
// Mirror of WGSL caveFloor. KEEP IN SYNC.
function caveFloor(k, x, y) {
  const s = CFG.SEED >>> 0;
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  return k * CAVES.BAND + 1.6 +
         vn2(x * CAVES.FLOOR_F, y * CAVES.FLOOR_F, (bs ^ 0x0F1D) >>> 0) *
         CAVES.FLOOR_A;
}

// Natural banded void: positive inside carved space (roughly world-unit
// magnitude), very negative elsewhere. Passages are the near-median isolines
// of a per-band value noise - the median level set of a random field
// percolates, so the network is connected across the infinite plane. gz is
// terrainH(x, y), passed in because every caller already has it.
// Mirror of WGSL naturalV. KEEP IN SYNC.
function naturalV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return -1e9;
  const s = CFG.SEED >>> 0;
  const m = vn2(x * CAVES.MASK_F, y * CAVES.MASK_F, (s ^ 0x33AA) >>> 0);
  const gate = smoothstep(CAVES.MASK_LO, CAVES.MASK_HI, m) *
               smoothstep(CFG.SEA_LEVEL + 0.5, CFG.SEA_LEVEL + 1.5, gz);
  if (gate <= 0.001) return -1e9;
  const k = Math.floor(z / CAVES.BAND);
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  const fz = caveFloor(k, x, y);
  // two isoline families: each percolates on its own, and their crossings
  // knit isolated contour rings into one network with natural junctions
  const n1 = vn2(x * CAVES.PASS_F, y * CAVES.PASS_F, (bs ^ 0x5EA5) >>> 0);
  const n2 = vn2(x * CAVES.PASS_F2, y * CAVES.PASS_F2, (bs ^ 0x7A3B) >>> 0);
  const iso = Math.min(Math.abs(n1 - 0.5), Math.abs(n2 - 0.5));
  const c = vn2(x * CAVES.CHAM_F, y * CAVES.CHAM_F, (bs ^ 0xC4A6) >>> 0);
  const wide = smoothstep(0.60, 0.85, c);
  const w = (CAVES.PASS_W + wide * CAVES.CHAM_W) * gate;
  const ceilH = 2.6 + wide * 3.4;
  const h = (w - iso) * CAVES.PASS_SCALE;
  const vz = Math.min(z - fz, fz + ceilH - z);
  return Math.min(h, vz);
}

// Shaft candidate for placement cell (cx, cy) and band pair j (0 = surface
// into band -1, j >= 1 = band -j into band -(j+1)). Presence requires a
// passage at the anchor in the destination band (both bands for j >= 1), so
// a shaft always daylights into the network. When (px, py) is given, the
// cheap position/distance precheck runs before any expensive validation -
// the order the WGSL twin relies on. Mirror of WGSL shaftAt. KEEP IN SYNC.
function shaftAt(cx, cy, j, px, py) {
  const s = CFG.SEED >>> 0;
  const sj = (s ^ (0x51F7 + j * 0x9101)) >>> 0;
  if (hash01(cx, cy, sj) >= (j === 0 ? 0.55 : 0.8)) return null;
  const h2 = hash2i(cx, cy, (sj ^ 0x2C55) >>> 0);
  const ax = cx * CAVES.SHAFT_E + 10 + h2[0] * 28;
  const ay = cy * CAVES.SHAFT_E + 10 + h2[1] * 28;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > (CAVES.SHAFT_R + 2.0) * (CAVES.SHAFT_R + 2.0)) {
      return null;
    }
  }
  const gz = terrainH(ax, ay);
  let zTop, zBot;
  if (j === 0) {
    if (gz < CFG.SEA_LEVEL + 1.2 || gz > 11.0) return null;
    zTop = gz;
    zBot = caveFloor(-1, ax, ay);
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  } else {
    zTop = caveFloor(-j, ax, ay) + 0.2;
    zBot = caveFloor(-j - 1, ax, ay);
    if (naturalV(ax, ay, zTop + 1.0, gz) < 0.15) return null;
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  }
  const phase = hash01(cx, cy, (sj ^ 0x77AD) >>> 0);
  return { ax, ay, zTop, zBot, phase };
}

// Helical stair carve for one shaft: an annulus between the central column
// and the outer wall, with a helicoid floor - SHAFT_OPEN of every turn is
// air, the rest is the stair slab. Open to the sky just above the mouth;
// the bottom join is the band's own passage carving through the outer wall.
// Returns [void, slab]: slab > 0 marks stair steps that must STAY rock even
// where a tall passage or chamber would carve them away - without it the
// last turns of the stair dissolve into the band void and leave a drop.
// Mirror of WGSL helixV. KEEP IN SYNC.
function helixV(x, y, z, a) {
  const dx = x - a.ax, dy = y - a.ay;
  const r = Math.hypot(dx, dy);
  const radial = Math.min(CAVES.SHAFT_R - r, r - CAVES.SHAFT_RIN);
  const u = (a.zTop - z) / CAVES.SHAFT_PITCH +
            Math.atan2(dy, dx) / (2 * Math.PI) + a.phase;
  const su = u - Math.floor(u);
  const sv = Math.min(su, CAVES.SHAFT_OPEN - su) * CAVES.SHAFT_PITCH;
  let v = Math.min(radial, sv);
  // entry apron: a flat ledge ring around the mouth, stepped into from any
  // rim angle; the stair top emerges from it and winds down
  const apron = Math.min(CAVES.SHAFT_R + 1.8 - r,
                         z - (a.zTop - 0.45));
  v = Math.max(v, apron);
  v = Math.min(v, a.zTop + 1.5 - z, z - (a.zBot - 0.2));
  const slab = Math.min(radial,
    Math.min(su - CAVES.SHAFT_OPEN, 1 - su) * CAVES.SHAFT_PITCH,
    Math.min(z - (a.zBot - 0.2), (a.zTop - 0.45) - z));
  return [v, slab];
}

// All shafts near (x, y): anchors are jittered to keep the well inside its
// own placement cell, so only that one cell is ever checked - the cheap
// presence hash is all the hot march loops pay when no shaft is near.
// Returns [void, slab] aggregated over the band pairs.
// Mirror of WGSL shaftV. KEEP IN SYNC.
function shaftV(x, y, z, gz) {
  if (z > gz + 1.5) return [-1e9, -1e9];
  const cx = Math.floor(x / CAVES.SHAFT_E);
  const cy = Math.floor(y / CAVES.SHAFT_E);
  let v = -1e9, slab = -1e9;
  for (let j = 0; j < 3; j++) {
    const a = shaftAt(cx, cy, j, x, y);
    if (!a) continue;
    if (z > a.zTop + 1.5 || z < a.zBot - 0.5) continue;
    const h = helixV(x, y, z, a);
    if (h[0] > v) v = h[0];
    if (h[1] > slab) slab = h[1];
  }
  return [v, slab];
}

// Hall candidate for placement cell (cx, cy) in band k. Presence requires a
// passage at the anchor, so the network's own tunnels puncture the walls -
// those punctures are the doorways. The floor is FLAT: it sits at the
// anchor's band-floor height across the whole room, which against the noisy
// passages is what reads as "someone carved this".
// Mirror of WGSL hallAt. KEEP IN SYNC.
function hallAt(cx, cy, k, px, py) {
  const s = CFG.SEED >>> 0;
  const sk = (s ^ (0xB00B + (8 + k) * 0x8121)) >>> 0;
  if (hash01(cx, cy, sk) >= 0.5) return null;
  const h2 = hash2i(cx, cy, (sk ^ 0x39D1) >>> 0);
  const ax = cx * CAVES.HALL_E + 16 + h2[0] * 64;
  const ay = cy * CAVES.HALL_E + 16 + h2[1] * 64;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > 17 * 17) return null;
  }
  const h3 = hash2i(cx, cy, (sk ^ 0x5A5A) >>> 0);
  const gz = terrainH(ax, ay);
  const fz0 = caveFloor(k, ax, ay);
  if (naturalV(ax, ay, fz0 + 1.2, gz) < 0.15) return null;
  const ang = hash01(cx, cy, (sk ^ 0x11EF) >>> 0) * Math.PI;
  return {
    ax, ay,
    hx: 6 + h3[0] * 5,
    hy: 5 + h3[1] * 3,
    hgt: 3.2 + h3[0] * 1.3,
    fz0,
    ca: Math.cos(ang), sa: Math.sin(ang),
  };
}

// Hall carve near (x, y, z): returns [void, slab]. The room void is a plain
// rotated box; the flat floor slab and the pillar lattice ride the slab
// channel, so neither a chamber below nor one overlapping can dissolve them
// - freestanding pillars in a cavern are exactly the ruin look wanted.
// Mirror of WGSL hallV. KEEP IN SYNC.
function hallV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return [-1e9, -1e9];
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  if (!a) return [-1e9, -1e9];
  const dx = x - a.ax, dy = y - a.ay;
  const lx = a.ca * dx + a.sa * dy;
  const ly = -a.sa * dx + a.ca * dy;
  const inBox = Math.min(a.hx - Math.abs(lx), a.hy - Math.abs(ly));
  const v = Math.min(inBox, z - a.fz0, a.fz0 + a.hgt - z);
  // pillar lattice in the local frame (kept clear of the walls)
  const S = CAVES.PIL_S;
  const frac = t => t - Math.floor(t);
  const mx = Math.abs(frac(lx / S + 0.5) - 0.5) * S;
  const my = Math.abs(frac(ly / S + 0.5) - 0.5) * S;
  const cheb = Math.max(mx, my);
  const pillar = Math.min(CAVES.PIL_R - cheb, inBox - 1.2,
                          z - (a.fz0 - 0.1), a.fz0 + a.hgt - z);
  const floorSlab = Math.min(inBox, a.fz0 - z, z - (a.fz0 - 0.9));
  return [v, Math.max(pillar, floorSlab)];
}

// Which hall stands at this point, or null. CPU only - the shader needs the
// geometry, but only the gameplay side needs to know whose hall it is.
function hallIdAt(x, y, z) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return null;
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  return a ? { cx, cy, k, hall: a } : null;
}

// Cave void field: natural banded passages plus carved shafts and halls,
// minus the protected solids (stair slabs, hall floors, pillars), which win
// over every carve. Mirror of WGSL caveV. KEEP IN SYNC.
function caveV(x, y, z, gz) {
  const sv = shaftV(x, y, z, gz);
  const hv = hallV(x, y, z, gz);
  const v = Math.max(naturalV(x, y, z, gz), sv[0], hv[0]);
  return Math.min(v, -Math.max(sv[1], hv[1]));
}

// Layered density, the one authority on what is solid: positive in rock,
// negative in air. The sparse edit overlay (digging) adds on top - the
// typeof guard keeps this file loadable before js/edits.js and in node
// tests that do not exercise edits. Mirror of WGSL solidD. KEEP IN SYNC.
function solidD(x, y, z) {
  const gz = terrainH(x, y);
  let d = Math.min(gz - z, -caveV(x, y, z, gz));
  if (typeof Edits !== 'undefined' && Edits.bounds) d += Edits.sample(x, y, z);
  return d;
}

// -------- 3D value noise — mirror of WGSL vnoise --------
// Used by the shader for canopy erosion and glow lichen; mirrored here so
// the examine system can recognise a lichen patch at a hit point.
function jsUhash3(x, y, z) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, z >>> 0) >>> 0;
}

function vnoise(px, py, pz) {
  const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
  const fx = px - ix, fy = py - iy, fz = pz - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);
  const s = 1 / 4294967296;
  const c000 = jsUhash3(ix, iy, iz) * s;
  const c100 = jsUhash3(ix + 1, iy, iz) * s;
  const c010 = jsUhash3(ix, iy + 1, iz) * s;
  const c110 = jsUhash3(ix + 1, iy + 1, iz) * s;
  const c001 = jsUhash3(ix, iy, iz + 1) * s;
  const c101 = jsUhash3(ix + 1, iy, iz + 1) * s;
  const c011 = jsUhash3(ix, iy + 1, iz + 1) * s;
  const c111 = jsUhash3(ix + 1, iy + 1, iz + 1) * s;
  const x00 = c000 + (c100 - c000) * ux;
  const x10 = c010 + (c110 - c010) * ux;
  const x01 = c001 + (c101 - c001) * ux;
  const x11 = c011 + (c111 - c011) * ux;
  const y0 = x00 + (x10 - x00) * uy;
  const y1 = x01 + (x11 - x01) * uy;
  return y0 + (y1 - y0) * uz;
}

// -------- ground materials: what the world is made of, per point --------
// Shared constants, interpolated into the WGSL template in
// js/webgpu/shaders.js so shader and mirror cannot disagree (scripts/
// verify.js enforces the no-literals convention for MAT_ too).
const MATS = {
  DIRT: 0, STONE: 1, ORE: 2, GEM: 3,
  SOIL_MAX: 2.4,    // soil depth on dead-flat ground, world units
  SOIL_STEEP: 0.55, // slope where soil runs out entirely (bare rock)
  SOIL_FLAT: 0.12,  // slope below which soil is at full depth
  SOIL_F: 0.09,     // soil-depth variation frequency
  SOIL_VAR: 1.2,    // soil-depth variation amplitude
  ORE_F: 0.021,     // ore-region frequency: most rock holds nothing
  ORE_GATE: 0.62,   // region noise above this can carry veins
  VEIN_F: 0.15,     // vein frequency; two isosurfaces meet in curves
  VEIN_W: 0.05,     // vein half-width in noise-value units
  GEM_CORE: 0.22,   // fraction of the vein width that is gem, not ore
  GEM_Z: -6.0,      // gems only form below this depth
  IRON_Z: -14.0,    // ore below this is iron; above it, place decides
  // Tin does not lie with copper. Cassiterite belongs to its own granites,
  // and that one geological fact is why the bronze age ran on trade rather
  // than on local smelting - the two halves of the alloy come out of two
  // different parts of the country. Here it is a province: a coarse 2D
  // field, so tin is somewhere you GO, not something you happen to hit.
  TIN_F: 0.004,     // province frequency: a 250 u noise cell, which runs
                    // out to provinces several hundred units across
  TIN_GATE: 0.70,   // province noise above this carries tin instead of copper
  // Glow lichen on cave rock. Mirrored: the shader decides where it grows
  // and World.classifySolid decides where you may pick it, so a divergence
  // here offers a harvest off a bare wall.
  LICHEN_F: 1.9,    // frequency of the patch noise
  LICHEN_T: 0.8,    // noise above this is a patch
  LICHEN_GAIN: 9.0, // how fast a patch brightens past the threshold
};

// Soil depth below the surface at (x, y): deep on flats, zero on steep
// ground - which is why hillsides read as bare rock. Mirror of WGSL
// soilDepth. KEEP IN SYNC.
function soilDepth(x, y) {
  const e = 0.5;
  const hx = terrainH(x + e, y) - terrainH(x - e, y);
  const hy = terrainH(x, y + e) - terrainH(x, y - e);
  const slope = Math.hypot(hx, hy) / (2 * e);
  const d = smoothstep(MATS.SOIL_STEEP, MATS.SOIL_FLAT, slope) * MATS.SOIL_MAX +
    (vn2(x * MATS.SOIL_F, y * MATS.SOIL_F, (CFG.SEED ^ 0xD117) >>> 0) - 0.5) *
    MATS.SOIL_VAR;
  return Math.max(d, 0);
}

// What a point of rock is: plain stone, an ore vein, or a gem pocket. Two
// value-noise isosurfaces intersect along CURVES, not sheets - that is what
// makes veins read as branching tubes threading the stone rather than
// slabs. Gems sit in the very core of a deep vein. Mirror of WGSL rockMat.
// KEEP IN SYNC.
function rockMat(x, y, z) {
  const o = (CFG.SEED & 0xff) * 0.7;
  const reg = vnoise(x * MATS.ORE_F + 13 + o, y * MATS.ORE_F + 13,
                     z * MATS.ORE_F + 13);
  if (reg < MATS.ORE_GATE) return MATS.STONE;
  const strength = (reg - MATS.ORE_GATE) / (1 - MATS.ORE_GATE);
  const n1 = vnoise(x * MATS.VEIN_F + o, y * MATS.VEIN_F, z * MATS.VEIN_F);
  const n2 = vnoise(x * MATS.VEIN_F + 41 + o, y * MATS.VEIN_F + 17,
                    z * MATS.VEIN_F + 73);
  const w = MATS.VEIN_W * strength;
  const d1 = Math.abs(n1 - 0.5), d2 = Math.abs(n2 - 0.5);
  if (d1 >= w || d2 >= w) return MATS.STONE;
  if (z < MATS.GEM_Z && d1 < w * MATS.GEM_CORE && d2 < w * MATS.GEM_CORE) {
    return MATS.GEM;
  }
  return MATS.ORE;
}

// Material at a world point. gz is terrainH(x, y) - every caller has it.
// Mirror of WGSL matAt. KEEP IN SYNC.
function matAt(x, y, z, gz) {
  if (z > gz - soilDepth(x, y)) return MATS.DIRT;
  return rockMat(x, y, z);
}

// Is this ground tin country? A pure function of where you are standing,
// independent of whether there is any ore under it - the province is the
// place, the vein is the luck. Mirror of WGSL tinCountry. KEEP IN SYNC.
function tinCountry(x, y) {
  return vn2(x * MATS.TIN_F, y * MATS.TIN_F, (CFG.SEED ^ 0x7104) >>> 0) >
         MATS.TIN_GATE;
}

// Which metal a vein carries. Depth decides iron; above that the ground
// does, which is what makes bronze the first thing in this world nobody can
// make without leaving home.
function oreItem(x, y, z) {
  if (z < MATS.IRON_Z) return 'iron';
  return tinCountry(x, y) ? 'tin' : 'copper';
}

// species index for the tree anchored in cell (ix, iy) - deterministic,
// independent of the placement hash so size and species do not correlate
function treeSpecies(ix, iy) {
  return Math.min(2, Math.floor(hash01(ix, iy, (CFG.SEED ^ 0x5EED) >>> 0) * 3));
}

// -------- loose stones and boulders. KEEP IN SYNC with the WGSL --------
// One prop per cell, hash-placed like the trees, so the cleared-cell set in
// js/removed.js covers all of them with a single "ix,iy".
const PROPS = {
  STONE_D: 0.055,   // chance a cell holds a loose stone
  STONE_R: 0.13,    // stone bounding radius, plus a hashed share again
  // View cutoffs, set from each prop's LARGEST possible size at the range
  // where it stops covering even one character cell (a cell is ~0.0106 rad
  // at the default field of view). Cut any nearer and a prop vanishes while
  // it is still drawable, which reads as flicker as you walk.
  STONE_VIEW: 52,   // biggest stone is under a cell past 49
  ROCK_D: 0.011,    // chance a cell holds a boulder
  ROCK_R: 0.68,     // boulder bounding radius, plus a hashed share again
  ROCK_VIEW: 140,   // biggest boulder holds a cell to 256; MAX_DIST cuts first
  // Stones are not spheres: each is a bounding sphere with this many flat
  // cuts taken out of it, giving a faceted silhouette and flat per-face
  // normals. Measured over 30 boulders, this leaves 89% of the surface flat
  // - a low-poly read rather than a weathered one - and because every cut
  // sits at least CUT_MIN of the radius out, no rock can be clipped away.
  FACES: 11,
  CUT_MIN: 0.48,
  CUT_MAX: 0.78,
  // The cuts mean a rock fills roughly this much of its bounding sphere, so
  // collision has to use it or you would be stopped short of thin air.
  SOLID: 0.8,
};

// A loose stone: small, sits on the ground, free to pick up by hand.
// Mirror of WGSL stoneAt. KEEP IN SYNC.
function stoneAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0x570E) >>> 0) >= PROPS.STONE_D) return null;
  const h2 = hash2i(ix, iy, (s ^ 0x5C0B) >>> 0);
  const r = PROPS.STONE_R * (1 + h2[0]);
  return { cx: ix + 0.2 + h2[0] * 0.6, cy: iy + 0.2 + h2[1] * 0.6, r };
}

// A boulder: too big to lift, wants a pickaxe, and blocks the way.
// Mirror of WGSL rockAt. KEEP IN SYNC.
function rockAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0xB017) >>> 0) >= PROPS.ROCK_D) return null;
  if (treeAt(ix, iy)) return null;        // one prop to a cell
  const h2 = hash2i(ix, iy, (s ^ 0xB0DA) >>> 0);
  const r = PROPS.ROCK_R * (1 + h2[0]);
  return { cx: ix + 0.5, cy: iy + 0.5, r,
           // sunk into the ground so it reads as bedded, not dropped
           z: -r * 0.35 };
}

// -------- tree placement — mirror of WGSL treeAt --------
// Shared with the shader the same way the terrain constants are: the
// canopy's shape and its erosion noise are written down once. The erosion
// numbers matter twice over, because the primary ray and the shadow ray
// each carve the canopy's holes independently - if those two drifted, a
// tree would shadow gaps the eye can see straight through.
const TREE = {
  FOREST_F: 0.021,   // frequency of the forest-region field
  DENS_LO: 0.45,     // region gate: below LO is open ground
  DENS_HI: 0.72,
  DENS_A: 0.16,      // per-cell tree chance deep inside a forest
  DENS_MIN: 0.004,   // and out on the open ground, the occasional lone tree
  OFF: 0.3,          // anchor jitter within the cell
  OFF_VAR: 0.4,
  R_MIN: 1.0,        // canopy radius
  R_VAR: 0.5,
  TRUNK_H: 2.6,      // trunk height
  TRUNK_H_VAR: 1.2,
  TRUNK_R: 0.085,    // trunk radius: a constant plus a share of the canopy
  TRUNK_R_K: 0.055,
  CAN_Z: 0.55,       // canopy centre above the trunk top, in canopy radii
  // canopy erosion: two octaves of 3D noise thin the sphere into foliage
  DENS_F1: 2.6, DENS_W1: 0.75,
  DENS_F2: 6.5, DENS_W2: 0.25,
  EXT: 1.35,         // extinction along the chord through the canopy
  EXT_MIN: 0.35,     // floor and gain applied to the density before it
  EXT_K: 1.3,
  ALPHA_MIN: 0.03,   // below this the canopy is a hole, not foliage
};

function treeAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  const forest = vn2(ix * TREE.FOREST_F, iy * TREE.FOREST_F, (s ^ 0xF0F0) >>> 0);
  const density = smoothstep(TREE.DENS_LO, TREE.DENS_HI, forest) * TREE.DENS_A +
                  TREE.DENS_MIN;
  if (hash01(ix, iy, (s ^ 0x7EE7) >>> 0) >= density) return null;
  const h2 = hash2i(ix, iy, (s ^ 0xA11C) >>> 0);
  const cx = ix + TREE.OFF + h2[0] * TREE.OFF_VAR;
  const cy = iy + TREE.OFF + h2[1] * TREE.OFF_VAR;
  // Nothing grows out of a lake. The ground at the ANCHOR decides it, not
  // the ground at the cell: the anchor is where the trunk actually stands,
  // and a cell straddling a shoreline would otherwise keep or drop a tree
  // by up to half a cell's worth of the wrong ground. The height is handed
  // back because every caller wants it anyway - the trunk is drawn from it
  // - so the gate costs no extra terrain samples.
  const g = terrainH(cx, cy);
  if (g < CFG.SEA_LEVEL) return null;
  const r = TREE.R_MIN + h2[0] * TREE.R_VAR;
  return {
    cx, cy, g, r,
    trunkH: TREE.TRUNK_H + h2[1] * TREE.TRUNK_H_VAR,
    trunkR: TREE.TRUNK_R + r * TREE.TRUNK_R_K,
  };
}
</script>
<script>
// ---- js/chronicle.js ----
// The chronicle: six thousand years of people on this ground, run rather
// than written. Six peoples rise in turn, settle where the ground is
// worth settling, cut roads between what they build, quarrel, fail, and
// leave. Every ruin the game finds is the residue of something that
// happened here, on a date, for a reason.
//
// Pure CPU and a pure function of CFG.SEED - no DOM, no storage, no clock.
// Two runs of a seed agree down to the last abandoned farm, so the record
// costs nothing on disk and nothing on the wire.
//
// The sim stores only what it cannot derive: sites, links and events, each
// stamped with the year it happened. Territory, ruin stage and burial depth
// are functions of a year you ask for, which is why the map can scrub.

const HIST = {
  CELL: 128,      // sim cell, world units; roads inherit this granularity
  N: 64,          // cells per side. N * CELL is the width of the *settled*
                  // world - the terrain runs on forever, only history stops.
  SPAN: 6000,     // years simulated, ending at "now"
  PEOPLES: 6,     // one culture cycle is roughly a thousand years, so six
                  // millennia want six peoples, not one long-lived one

  // Tick resolution is coarse in deep time and fine near now, because the
  // player reads the recent past in detail and the deep past as strata.
  TICK_OLD: 20, TICK_MID: 10, TICK_NEW: 5,
  MID_FROM: 3600, NEW_FROM: 5700,

  // settlement
  CAP_POP: 900,      // carrying capacity of perfect ground
  SEED_POP: 40,      // a site is founded at this size
  GROW: 0.25,        // logistic growth per decade
  SPAWN_POP: 260,    // a site this big can throw a daughter settlement
  SPAWN_R: 7,        // and does it within this many cells
  MAX_SITES: 18,     // per people, so the cast stays readable
  MIN_SEP: 2,        // cells between any two sites
  // Ore does not replace good ground, it multiplies it: a seam under a
  // barren rock is worth less than the same seam under a field, because the
  // people working it still have to eat. Scoring these as alternatives made
  // every delving people build nothing but mines.
  LIVE_FLOOR: 0.15,  // you can settle thin ground, but not nothing
  ORE_PULL: 2.0,     // how far metal lifts a place, times how much they want it
  MINE_T: 0.25,      // ore * delve above this and the place is dug, not farmed
  SITE_MIN: 0.25,    // below this a place is worth neither food nor metal
  RETURN: 0.6,       // chance a people comes back to the old heartland rather
                     // than arriving somewhere of its own
  ROOM: 9,           // cells from the region edge before a place counts as
                     // having room to grow around it. Enough to discourage
                     // the outer band, not so much that everyone huddles in
                     // the middle - the aim is variety, not a bullseye.
  PICK_SHARP: 3,     // how hard the weighted draw leans toward good ground
  RESETTLE: 2.2,     // how much a later people is drawn to ground an earlier
                     // one already used. This is what makes a tell, and it
                     // is also the only reason the peoples ever meet.

  // going out. A people settles only where it has been, so somebody has to
  // go and look first - which is what stops the whole record happening in
  // one valley, and gives the far ruins somebody to have built them.
  KNOWN_HOME: 8,       // cells a people knows around its first site
  KNOWN_SITE: 4,       // and around everything it builds after
  EXPLORE: 0.34,       // chance a people sends an expedition, per tick, in prime
  EXPLORE_LEN: 24,     // cells an expedition covers before turning for home
  EXPLORE_SEE: 3,      // how wide a band it learns on the way
  EXPLORE_LOST: 0.18,  // chance it does not come back
  COLONY: 0.45,        // chance crowded people send settlers out instead of budding
  COLONY_MIN: 9,       // a colony sits at least this far from anything of ours
  CROWD_R: 6, CROWD_N: 4,   // this many of ours this close is too many

  // roads
  ROAD_R: 12,        // a new site links to a neighbour within this range
  SLOPE_COST: 26,    // travel cost per unit of grade
  WATER_COST: 6,     // crossing water: dear, but not so dear that a long
                     // detour always wins - a short neck is worth a bridge
  COLONY_ROAD: 30,   // a colony's road home may run much further than that
  ROAD_DISCOUNT: 0.45, // reuse of an existing road, so routes bundle
  BRIDGE_MIN: 1,     // water cells in a row before it is called a bridge

  // trouble. Rates are per tick and climb as a people ages, so nobody
  // simply grows forever; the fall is emergent, only the rise is scheduled.
  WAR_BASE: 0.05, WAR_AGE: 0.16,
  DISASTER: 0.035,
  CONTACT: 14,       // cells between peoples before they can quarrel
  COLLAPSE: 2,       // living sites below this and the people is finished
  END_WINDOW: 250,   // the years before a fall that actually say what did it
  BROKEN_SITES: 5,   // a people whose seat has been taken and who is down to
                     // this many places does not get up again. Without it a
                     // conquest could never finish anybody: decline ground
                     // every people down to nothing first, and war was only
                     // ever a footnote on the way.

  // A people has a prime and then does not. Past it the ground is tired,
  // no more daughters leave, and the small places are walked away from -
  // which is what makes the three of them a succession instead of three
  // neighbours who all happen to still be here.
  PRIME: 700,
  DECLINE: 700,      // years from the end of the prime to near-nothing
  LEAVE_POP: 22,     // a site smaller than this is simply left

  // people. Nobody is born into this record without a reason to be in it,
  // which is what keeps the cast small enough to remember.
  LIFE: 55, LIFE_VAR: 26, ADULT: 22,
  MAX_FIGURES: 700,   // a seat turns over roughly every forty years, and
                      // expeditions go out for as long as a people has the
                      // vigour, so six millennia of six peoples is a long
                      // roster. It must not bind: a starved cast means a
                      // people with nobody at the head of it. The memorable
                      // layer is S.heroes, not this.

  // war. A war is a state, not an event: it is declared, fought over some
  // years in battles that happen where the two peoples actually touch, and
  // then it ends - by peace, or because one side is gone.
  WAR_LEN: 90,        // years before peace becomes likely
  PEACE: 0.30,        // chance per tick an old war ends
  BATTLE: 0.55,       // chance of a battle per tick while at war
  CMD_EDGE: 0.35,     // how far a good commander tilts the odds
  CMD_FALLS: 0.45,    // chance the losing commander does not come back
  TAKES_SITE: 0.40,   // chance a won battle takes the place it was fought for

  // what a world remembers
  HEROES: 24,         // how many people stay named
  HERO_MIN: 6,        // and how much they must have done to
  LEGENDS: 24,        // how many things keep a story attached to them

  // making
  MAKE: 0.40,         // chance a people makes something, per tick, in its prime
  MAX_ARTIFACTS: 200,

  // what the ground keeps
  GRAVE_GOODS: 0.55,  // chance a notable death is buried with something
  HOARD: 0.50,        // chance a sacked or plagued place hid what it had
  VOTIVE: 0.10,       // offerings at the water's edge
  ROB: 0.35,          // chance a later people digs up an older deposit
  ROB_R: 3,           // cells within which they would find it
  ROB_WAIT: 120,      // years before the dead stop being anybody's dead
  HOLD_MAX: 3,        // nobody walks around with a museum. Without this a
                      // people arriving on an old heartland robs every grave
                      // near it in its founding year, and the one person alive
                      // to receive them ends up holding the lot.

  // decay. Timber goes first and stone stands; the roof is what matters,
  // because a building starts sinking as soon as it stops shedding water.
  ROOF_TIMBER: 45, ROOF_STONE: 130,
  WALL_TIMBER: 260, WALL_STONE: 900,
  SINK_MAX: 3.0,       // metres, on the softest ground: the deepest anything
                       // ever gets. History lives in the topsoil - the caves
                       // start at -12 and have nothing to do with it.
  SINK_TAU: 2200,      // years to settle most of the way down. Tuned to the
                       // span: too short and everything older than a couple
                       // of millennia sits at the same depth, and depth
                       // stops telling you the date.
  SINK_SOFT: 1.0,      // full rate on deep soil
  SINK_HARD: 0.2,      // and a fifth of it on bare rock, where a wall may
                       // still be standing when everything else is under
  GONE_DEPTH: 0.9,     // buried this far and there is nothing left to see
};

const Chronicle = {
  // ---- deterministic draws ----
  // Keyed by (salt, a, b), never a running sequence: a shared stream makes
  // the whole sim order-dependent, and then adding one entity type quietly
  // rewrites every world. This way the ticks can be reordered freely.
  rnd(salt, a, b) {
    return jsUhash(jsUhash((a | 0) >>> 0, (b | 0) >>> 0) ^ (CFG.SEED >>> 0),
                   (salt | 0) >>> 0) / 4294967296;
  },
  pick(tbl, salt, a, b) { return tbl[Math.floor(this.rnd(salt, a, b) * tbl.length) % tbl.length]; },

  // cell <-> world. Cell (0,0) is the far corner; the region is centred on
  // the origin, which is where the player starts.
  wx(i) { return (i - HIST.N / 2 + 0.5) * HIST.CELL; },
  wy(j) { return (j - HIST.N / 2 + 0.5) * HIST.CELL; },
  inBounds(i, j) { return i >= 0 && j >= 0 && i < HIST.N && j < HIST.N; },

  // ---- the ground, before anyone is on it ----
  // Suitability is a pure function of terrain: no simulation, no state. The
  // chronicle only ever reads it, and it is what makes two seeds settle
  // differently rather than the same shapes in different places.
  survey() {
    const N = HIST.N, n = N * N;
    const g = {
      h: new Float32Array(n), slope: new Float32Array(n),
      water: new Uint8Array(n), coast: new Float32Array(n),
      fert: new Float32Array(n), ore: new Float32Array(n),
      cost: new Float32Array(n), soil: new Float32Array(n),
    };
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i, x = this.wx(i), y = this.wy(j);
      const h = terrainH(x, y);
      // Sampled at the scale the terrain actually varies at (~40 u), not at
      // the cell width - a gradient taken across 128 u aliases the hills
      // away and reports the whole region as flat.
      const e = 6;
      const hx = terrainH(x + e, y) - terrainH(x - e, y);
      const hy = terrainH(x, y + e) - terrainH(x, y - e);
      const slope = Math.hypot(hx, hy) / (2 * e);
      g.h[k] = h;
      g.slope[k] = slope;
      g.water[k] = h < CFG.SEA_LEVEL ? 1 : 0;
      g.soil[k] = soilDepth(x, y);
      // ore follows the same region noise the rock does, so a mine sits
      // where the player would actually find metal underfoot
      g.ore[k] = Math.max(0, vn2(x * MATS.ORE_F, y * MATS.ORE_F,
                                 (CFG.SEED ^ 0x0e) >>> 0) - MATS.ORE_GATE);
      g.cost[k] = 1 + slope * HIST.SLOPE_COST + (g.water[k] ? HIST.WATER_COST : 0);
    }
    // distance to water, in cells, by a two-pass sweep - farms want a river
    const INF = 1e9, d = new Float32Array(n).fill(INF);
    for (let k = 0; k < n; k++) if (g.water[k]) d[k] = 0;
    for (let pass = 0; pass < 2; pass++) {
      const fwd = pass === 0;
      for (let s = 0; s < n; s++) {
        const k = fwd ? s : n - 1 - s;
        const i = k % N, j = (k - i) / N;
        for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
          if (!this.inBounds(i + di, j + dj)) continue;
          const step = (di && dj) ? 1.414 : 1;
          const v = d[(j + dj) * N + i + di] + step;
          if (v < d[k]) d[k] = v;
        }
      }
    }
    for (let k = 0; k < n; k++) {
      g.coast[k] = d[k];
      if (g.water[k]) { g.fert[k] = 0; continue; }
      // flat, low, watered, with soil on it. Steep ground grows nothing and
      // the highest ground is bare rock, so settlement finds the valleys.
      const flat = 1 - clamp(g.slope[k] / 0.45, 0, 1);
      const low = 1 - clamp((g.h[k] - CFG.SEA_LEVEL) / (CFG.TERRAIN_MAX * 0.7), 0, 1);
      const wet = 1 - clamp((d[k] - 1) / 9, 0, 1);
      const dirt = clamp(g.soil[k] / MATS.SOIL_MAX, 0, 1);
      g.fert[k] = flat * flat * (0.35 + 0.65 * low) * (0.3 + 0.7 * wet) * (0.4 + 0.6 * dirt);
    }
    return g;
  },

  // ---- who they are ----
  // Each people gets its own mouth-feel, so a name tells you which of the
  // three you are reading about before the date does.
  // The peoples do not simply improve. The third of them is the height of
  // this world - it works steel, builds further and makes more than anybody
  // before or after - and when it goes, the working of steel goes with it.
  // Everyone after falls back to what can be had without them: bronze while
  // the old trade still runs, then iron, which anybody can dig.
  // craft / reach / holds are multipliers on making, exploring and how many
  // places a people can hold at once; 1 is ordinary.
  // The peoples do not simply improve. The third of them is the height of
  // this world - it works steel, builds further and makes more than anybody
  // before or after - and when it goes, the working of steel goes with it.
  // What follows is a long way down: delvers who go after iron because it is
  // what is left, then a quiet folk who mostly farm and will not start a
  // fight, and then you, holding a small place among all of it.
  // craft / reach / holds / warlike are multipliers on making, exploring,
  // how much a people can hold, and how readily it declares war; 1 is
  // ordinary. `player` marks the people the game is played in.
  PHON: [
    { head: ['ur', 'anu', 'esh', 'ama', 'ish', 'ena', 'uru', 'ada'],
      tail: ['ara', 'im', 'una', 'esh', 'ani', 'aya', 'ir'],
      mat: 'timber', metal: 'bone', delve: 0.2, kind: 'the First People' },
    { head: ['kra', 'tesh', 'bur', 'dag', 'vok', 'sil', 'mur', 'tak'],
      tail: ['ak', 'osh', 'ur', 'eth', 'ik', 'un', 'ar'],
      mat: 'timber', metal: 'copper', delve: 0.6, kind: 'the Ashfolk' },
    { head: ['bran', 'coel', 'dun', 'gwyn', 'mael', 'tre', 'arv', 'cul'],
      tail: ['ach', 'wyd', 'or', 'eth', 'ain', 'ynt', 'as'],
      mat: 'stone', metal: 'steel', delve: 1.3, kind: 'the Kingdom',
      craft: 1.9, reach: 1.45, holds: 1.35 },
    { head: ['kar', 'thal', 'ves', 'gor', 'rin', 'urd', 'skal', 'mor'],
      tail: ['az', 'orn', 'eth', 'ir', 'und', 'esk', 'ol'],
      mat: 'stone', metal: 'iron', delve: 2.8, kind: 'the Delvers',
      reach: 1.15 },
    { head: ['lin', 'mera', 'sol', 'ael', 'nim', 'hala', 'ryn', 'ela'],
      tail: ['wen', 'ith', 'nis', 'ryl', 'la', 'mor', 'sel', 'din'],
      mat: 'timber', metal: 'copper', delve: 0.3, kind: 'the Quiet Folk',
      craft: 0.55, warlike: 0.10, holds: 0.85 },
    { head: ['hald', 'grim', 'stov', 'bre', 'fenn', 'oder', 'wulf', 'krast'],
      tail: ['and', 'ung', 'ost', 'elm', 'ard', 'ick', 'orn'],
      mat: 'stone', metal: 'iron', delve: 1.0, kind: 'the Last Hold',
      craft: 0.7, holds: 0.6, player: true },
  ],

  cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); },

  // A person or a place must not come out carrying the name of a people. The
  // draw is fair either way, but "Vesesk, of the Vesesk" reads as a mistake.
  freshName(S, p, salt, a) {
    let nm = this.nameFor(p.id, salt, a);
    for (let t = 0; t < 5; t++) {
      let clash = false;
      for (const q of S.peoples) if (q.name === nm) { clash = true; break; }
      if (!clash) return nm;
      nm = this.nameFor(p.id, salt + 101 + t * 37, a);
    }
    return nm;
  },
  nameFor(p, salt, a) {
    const ph = this.PHON[p % this.PHON.length];
    return this.cap(this.pick(ph.head, salt, a, p * 977 + 3) +
                    this.pick(ph.tail, salt + 1, a, p * 977 + 11));
  },

  // ---- what they say came before the record ----
  // The myth is generated last and reads the ground rather than shaping it:
  // the highest place, the richest seam and the nearest water are already
  // facts about this seed, and the story is fitted to them. That is the
  // reverse of the intention in the PRD, where the myth biases the terrain -
  // doing it that way needs the heightfield itself to change, which is
  // shader work. What the player sees is the same either way: the myth names
  // places that are really there, and gives a bearing you can walk.
  ELDER: {
    head: ['ush', 'keth', 'arn', 'thal', 'oum', 'vash', 'eng', 'mor', 'ekru', 'zaan'],
    tail: ['mar', 'anu', 'oth', 'ira', 'esh', 'un', 'aal', 'ekh', 'ora', 'iel'],
  },
  elderName(a, b) {
    return this.cap(this.pick(this.ELDER.head, 200, a, b) +
                    this.pick(this.ELDER.tail, 201, a, b + 5));
  },

  // Eight points, by comparison rather than by atan2: the trigonometric
  // functions are not guaranteed identical between engines, and the whole
  // record has to come out the same everywhere.
  bearing(i, j) {
    const dx = i - HIST.N / 2, dy = j - HIST.N / 2;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax < 1 && ay < 1) return 'under this very ground';
    const ns = dy < 0 ? 'north' : 'south', ew = dx < 0 ? 'west' : 'east';
    if (ax < ay * 0.45) return ns;
    if (ay < ax * 0.45) return ew;
    return ns + '-' + ew;
  },
  leagues(i, j) {
    return Math.round(Math.hypot(i - HIST.N / 2, j - HIST.N / 2));
  },

  myth(S) {
    const N = HIST.N;
    let high = 0, deep = 0, wet = -1, wetD = 1e9;
    for (let k = 0; k < N * N; k++) {
      const i = k % N, j = (k - i) / N;
      if (!S.grid.water[k] && S.grid.h[k] > S.grid.h[high]) high = k;
      if (!S.grid.water[k] && S.grid.ore[k] > S.grid.ore[deep]) deep = k;
      if (S.grid.water[k]) {
        const d = Math.hypot(i - N / 2, j - N / 2);
        if (d < wetD) { wetD = d; wet = k; }
      }
    }
    const cell = k => ({ i: k % N, j: (k - (k % N)) / N });
    const sky = this.elderName(1, 2), stone = this.elderName(3, 7), sea = this.elderName(11, 13);
    const hi = cell(high), dp = cell(deep), wa = wet >= 0 ? cell(wet) : hi;
    const took = this.pick(['swallowed it', 'took it down', 'closed a hand over it',
                            'carried it under'], 202, 0, 0);
    const why = this.pick(['out of hunger', 'out of envy', 'because it was bright',
                           'for no reason anybody kept'], 203, 0, 0);
    const cradle = S.peoples[0] && S.peoples[0].capital !== undefined
      ? S.sites[S.peoples[0].capital] : null;
    const m = {
      powers: [{ name: sky, of: 'the sky' }, { name: stone, of: 'the stone' },
               { name: sea, of: 'the water' }],
      places: [
        { name: 'the seat of ' + sky, i: hi.i, j: hi.j, what: 'the high ground' },
        { name: 'the wound of ' + stone, i: dp.i, j: dp.j, what: 'where the metal is' },
        { name: 'the tears of ' + sea, i: wa.i, j: wa.j, what: 'water' },
      ],
      lines: [],
    };
    m.lines = [
      'Before the record there was ' + sky + ', who was the sky,',
      'and ' + stone + ', who was the stone under it.',
      'They did not quarrel. There was nothing yet to quarrel over.',
      '',
      'Then ' + sky + ' made a light and set it walking,',
      'and ' + stone + ' ' + took + ', ' + why + '.',
      '',
      'Where ' + stone + ' lies with it still, the metal runs richest:',
      'the ground ' + this.bearing(dp.i, dp.j) + ' of here, ' +
        this.leagues(dp.i, dp.j) + ' leagues out.',
      'The high place ' + this.bearing(hi.i, hi.j) + ' is where ' + sky + ' sat',
      'and watched, and did not come down.',
      '',
      sea + ' came out of that wound and has not stopped since.',
      'You can see the water ' + this.bearing(wa.i, wa.j) + ' of here.',
    ];
    if (cradle) m.lines.push('', 'The first people woke on the ground at ' + cradle.name + '.',
                             'Everything after that is written down.');
    m.lines = m.lines.map(l => l.replace(/[^ -~]/g, ''));
    return m;
  },

  // ---- the run ----
  run() {
    const g = this.survey();
    const S = {
      grid: g, peoples: [], sites: [], links: [], events: [],
      figures: [], wars: [], battles: [], artifacts: [], deposits: [],
      heroes: [], legends: [],
      player: -1,       // the people the game is played in, filled in below
      known: [],        // per people, which cells anybody has actually seen
      roaded: new Uint8Array(HIST.N * HIST.N),   // cells a road already crosses
      now: HIST.SPAN, seed: CFG.SEED,
    };
    // Rises are staggered across the span with overlapping tails, so the
    // peoples meet at their edges instead of politely taking turns.
    // Spread so the last people is still young enough to be standing at
    // "now", and so the tails overlap: they meet at their edges rather than
    // politely taking turns.
    const step = (HIST.SPAN - HIST.PRIME) / Math.max(1, HIST.PEOPLES - 1);
    for (let p = 0; p < HIST.PEOPLES; p++) {
      S.known.push(new Uint8Array(HIST.N * HIST.N));
      S.peoples.push({
        id: p, name: this.nameFor(p, 1, 7), kind: this.PHON[p].kind,
        mat: this.PHON[p].mat, delve: this.PHON[p].delve,
        metal: this.PHON[p].metal,
        craft: this.PHON[p].craft || 1, reach: this.PHON[p].reach || 1,
        holds: this.PHON[p].holds || 1, warlike: this.PHON[p].warlike || 1,
        player: !!this.PHON[p].player,
        rise: Math.floor(p * step + this.rnd(2, p, 0) * step * 0.18),
        known: p,   // index into S.known
        fell: -1, cause: null, founded: false, sites: [], peak: 0, broken: -1,
      });
    }
    for (const p of S.peoples) if (p.player) S.player = p.id;
    for (let y = 0; y < HIST.SPAN; ) {
      const dt = y < HIST.MID_FROM ? HIST.TICK_OLD
               : y < HIST.NEW_FROM ? HIST.TICK_MID : HIST.TICK_NEW;
      this.tick(S, y, dt);
      y += dt;
    }
    S.myth = this.myth(S);
    this.crown(S);
    return S;
  },

  log(S, t, actor, action, target, place, cause, who) {
    S.events.push({ t, actor, action, target, place, cause,
                    who: who === undefined ? null : who });
  },

  living(S, p, y) {
    return p.sites.filter(id => {
      const s = S.sites[id];
      return s.founded <= y && (s.abandoned < 0 || s.abandoned > y);
    });
  },

  tick(S, y, dt) {
    this.age(S, y);
    for (const w of S.wars) if (w.ended < 0) this.fight(S, w, y, dt);
    for (const p of S.peoples) {
      if (y < p.rise || p.fell >= 0) continue;
      if (!p.founded) { this.found(S, p, y); continue; }
      this.leader(S, p, y);
      this.grow(S, p, y, dt);
      this.expand(S, p, y);
      if (this.vigour(p, y) > 0.6 && this.rnd(83, p.id, y) < HIST.MAKE * p.craft * (dt / 10))
        this.make(S, p, y);
      if (this.vigour(p, y) > 0.5 && this.rnd(97, p.id, y) < HIST.EXPLORE * (dt / 10))
        this.explore(S, p, y);
      this.trouble(S, p, y, dt);
      // A people is finished when it is gone, or when it is a shadow of
      // what it was - not merely because it is young and still small.
      const live = this.living(S, p, y).length;
      if (live > p.peak) p.peak = live;
      const seatGone = p.broken >= 0 && p.broken >= y - HIST.END_WINDOW;
      if (!p.player &&
          (live === 0 || (live < HIST.COLLAPSE && p.peak > HIST.COLLAPSE) ||
           (seatGone && live < HIST.BROKEN_SITES))) {
        p.fell = y;
        // What finished them is read off how their places actually went,
        // rather than latched the first time they lost a field.
        // Only the last years count. Every people abandons most of its
        // places quietly on the way down, so weighing a whole lifetime
        // buries the difference between fading out and being taken apart.
        let sacked = 0, quiet = 0;
        for (const id of p.sites) {
          const st = S.sites[id];
          if (st.abandoned < 0 || st.abandoned < y - HIST.END_WINDOW) continue;
          if (st.cause === 'sacked') sacked++; else quiet++;
        }
        if (!sacked && !quiet) for (const id of p.sites) {
          const st = S.sites[id];
          if (st.abandoned < 0) continue;
          if (st.cause === 'sacked') sacked++; else quiet++;
        }
        p.cause = (seatGone || (sacked > 0 && quiet === 0)) ? 'war'
                : sacked > 0 ? 'war and decline' : 'decline';
        this.log(S, y, p.id, 'ended', null, null, p.cause);
        // Nobody after them can work it. A steel thing in a later grave was
        // therefore taken out of one of theirs, which is a fact the ground
        // states without anybody having to write it down.
        if (p.metal !== 'bone' &&
            !S.peoples.some(q => q.id !== p.id && q.metal === p.metal &&
                                 (q.fell < 0 || q.fell > y)))
          this.log(S, y, p.id, 'lost the craft', null, null, p.metal);
      }
    }
  },

  // The capital goes on the best unclaimed ground anywhere in the region.
  // Deliberately global: a people's first choice is the thing everything
  // else about them is downstream of.
  // Where a people arrives. Deliberately not the single best cell in the
  // region: an argmax over a noisy field lands as readily in a corner as
  // anywhere, and a capital with a wall on two sides bends everything that
  // follows it. So score the whole region, then draw from the good ground
  // by weight - sharpened so the draw still strongly prefers good ground,
  // but no longer always picks the one extreme cell.
  found(S, p, y) {
    // some peoples come back to the old heartland; some arrive somewhere
    // of their own, which is what keeps six millennia off one hill
    const back = this.rnd(10, p.id, 3) < HIST.RETURN;
    const cand = [];
    let total = 0;
    for (let k = 0; k < HIST.N * HIST.N; k++) {
      if (S.grid.water[k]) continue;
      const i = k % HIST.N, j = (k - i) / HIST.N;
      if (this.tooClose(S, i, j, y, HIST.MIN_SEP + 2)) continue;
      // room to grow: the edge of the region is the edge of the world to a
      // people who would otherwise spend their whole history against it
      const edge = Math.min(i, j, HIST.N - 1 - i, HIST.N - 1 - j);
      let sc = S.grid.fert[k] * (0.62 + 0.38 * clamp(edge / HIST.ROOM, 0, 1));
      // Good ground stays good ground, for those who come looking for it:
      // that is how a mound accumulates, and why anybody is ever close
      // enough to anybody else to quarrel with them.
      if (back) sc *= 1 + HIST.RESETTLE * this.pastSettlement(S, i, j, y);
      if (sc <= 0) continue;
      sc = Math.pow(sc, HIST.PICK_SHARP);
      cand.push(k); total += sc;
      cand.push(sc);            // flat pairs: cell, weight
    }
    if (!cand.length) return;
    let r = this.rnd(11 + p.id, y, 7) * total, best = cand[0];
    for (let n = 0; n < cand.length; n += 2) {
      r -= cand[n + 1];
      if (r <= 0) { best = cand[n]; break; }
    }
    const i = best % HIST.N, j = (best - i) / HIST.N;
    const id = this.addSite(S, p, i, j, 'hold', y);
    p.founded = true;
    p.capital = id;
    this.learn(S, p, i, j, HIST.KNOWN_HOME);
    this.log(S, y, p.id, 'founded', id, id, null);
    this.rob(S, p, y, i, j);   // only once the people has a head to hand it to
  },

  // How much of somebody else's ruin field lies under this cell.
  pastSettlement(S, i, j, y) {
    let n = 0;
    for (const s of S.sites) {
      if (s.founded > y) continue;
      if (Math.abs(s.i - i) > 2 || Math.abs(s.j - j) > 2) continue;
      n++;
    }
    return clamp(n / 3, 0, 1);
  },

  tooClose(S, i, j, y, sep) {
    for (const s of S.sites) {
      if (s.abandoned >= 0 && s.abandoned <= y) continue;
      if (Math.abs(s.i - i) < sep && Math.abs(s.j - j) < sep) return true;
    }
    return false;
  },

  addSite(S, p, i, j, kind, y) {
    const k = j * HIST.N + i;
    const id = S.sites.length;
    S.sites.push({
      id, people: p.id, i, j, kind,
      x: this.wx(i), y: this.wy(j), z: S.grid.h[k],
      name: this.freshName(S, p, 20 + id, i * 31 + j),
      founded: y, abandoned: -1, cause: null,
      pop: HIST.SEED_POP, peak: HIST.SEED_POP,
      mat: kind === 'farm' ? 'timber' : p.mat,
    });
    p.sites.push(id);
    return id;
  },

  vigour(p, y) {
    const past = y - p.rise - HIST.PRIME;
    // The floor has to sit below what LEAVE_POP will tolerate, or a spent
    // people settles into a permanent shrunken twilight and never ends.
    return past <= 0 ? 1 : Math.max(0.01, 1 - past / HIST.DECLINE);
  },

  grow(S, p, y, dt) {
    const vig = this.vigour(p, y);
    for (const id of this.living(S, p, y)) {
      const s = S.sites[id];
      const k = s.j * HIST.N + s.i;
      let cap = HIST.CAP_POP * S.grid.fert[k];
      if (s.kind === 'mine') cap = HIST.CAP_POP * (0.25 + S.grid.ore[k] * 6);
      if (s.kind === 'hold') cap *= 1.5;
      cap = Math.max(cap, HIST.SEED_POP) * vig;
      s.pop += HIST.GROW * (dt / 10) * s.pop * (1 - s.pop / cap);
      s.pop = Math.max(0, s.pop);
      if (s.pop > s.peak) s.peak = s.pop;
      // the commonest way a place ends is that everybody left
      if (s.pop < HIST.LEAVE_POP && vig < 1) this.abandon(S, s, y, 'left', p.id);
    }
  },

  // A big enough site throws a daughter onto the best ground near it. What
  // that ground is good for decides what the daughter becomes, which is why
  // mines end up on the ore and farms end up on the flats.
  expand(S, p, y) {
    const live = this.living(S, p, y);
    if (live.length >= HIST.MAX_SITES * p.holds) return;
    if (this.vigour(p, y) < 0.75) return;   // nobody leaves a failing people
    const known = S.known[p.id];
    for (const id of live) {
      const s = S.sites[id];
      if (s.pop < HIST.SPAWN_POP) continue;
      if (this.rnd(31, id, y) > 0.55) continue;
      // hemmed in by our own? then somebody goes a long way off instead
      if (this.crowded(S, p, y, s) && this.rnd(96, id, y) < HIST.COLONY &&
          this.colonise(S, p, y) !== null) { s.pop *= 0.82; return; }
      let best = null, bestScore = 0;
      for (let dj = -HIST.SPAWN_R; dj <= HIST.SPAWN_R; dj++)
        for (let di = -HIST.SPAWN_R; di <= HIST.SPAWN_R; di++) {
          const i2 = s.i + di, j2 = s.j + dj;
          if (!this.inBounds(i2, j2)) continue;
          const k = j2 * HIST.N + i2;
          if (S.grid.water[k] || !known[k]) continue;
          if (this.tooClose(S, i2, j2, y, HIST.MIN_SEP)) continue;
          const ore = S.grid.ore[k] * p.delve;
          const sc = (HIST.LIVE_FLOOR + S.grid.fert[k]) * (1 + ore * HIST.ORE_PULL) *
                     (0.8 + 0.4 * this.rnd(41, i2 * 7 + id, j2 + y));
          if (sc > bestScore) { bestScore = sc; best = { i: i2, j: j2, k, ore }; }
        }
      if (!best || bestScore < HIST.SITE_MIN) continue;
      const kind = best.ore > HIST.MINE_T ? 'mine' : 'farm';
      const nid = this.addSite(S, p, best.i, best.j, kind, y);
      this.rob(S, p, y, best.i, best.j);
      this.learn(S, p, best.i, best.j, HIST.KNOWN_SITE);
      s.pop *= 0.78;   // the daughter is people who left
      this.log(S, y, p.id, 'settled', nid, nid, null);
      this.road(S, nid, y);
      return;          // one founding per people per tick keeps growth legible
    }
  },

  // ---- going out ----
  // Sixteen headings, written out rather than computed: Math.sin and cos are
  // not guaranteed identical between engines, and the record has to come out
  // the same everywhere from the seed alone.
  DIRS: [[1, 0], [0.92, 0.38], [0.71, 0.71], [0.38, 0.92],
         [0, 1], [-0.38, 0.92], [-0.71, 0.71], [-0.92, 0.38],
         [-1, 0], [-0.92, -0.38], [-0.71, -0.71], [-0.38, -0.92],
         [0, -1], [0.38, -0.92], [0.71, -0.71], [0.92, -0.38]],

  learn(S, p, i, j, r) {
    const k = S.known[p.id];
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      if (di * di + dj * dj > r * r) continue;
      const x = i + di, z = j + dj;
      if (this.inBounds(x, z)) k[z * HIST.N + x] = 1;
    }
  },

  // An expedition walks a heading out from the capital, learns a band either
  // side of its track, and reports the best ground it crossed. Some of them
  // do not come back, and those are the ones anybody remembers.
  explore(S, p, y) {
    const from = S.sites[p.capital];
    if (!from) return null;
    // Somebody who has come back before goes again, so a life of walking
    // accumulates onto one name instead of a new stranger every expedition.
    let f = null;
    for (const g of S.figures) {
      if (g.people !== p.id || g.role !== 'explorer' || !this.figureAlive(S, g, y)) continue;
      if (!f || g.deeds.length > f.deeds.length) f = g;
    }
    if (!f) f = this.newFigure(S, p, y, 'explorer', from.id);
    if (!f) return null;
    const d = this.DIRS[Math.floor(this.rnd(91, p.id, y) * this.DIRS.length) % this.DIRS.length];
    let best = null, bestScore = 0, reach = 0, lastI = from.i, lastJ = from.j;
    const far = Math.round(HIST.EXPLORE_LEN * p.reach);
    for (let n = 1; n <= far; n++) {
      const i = Math.round(from.i + d[0] * n + (this.rnd(92, p.id * 131 + n, y) - 0.5) * 3);
      const j = Math.round(from.j + d[1] * n + (this.rnd(93, p.id * 131 + n, y) - 0.5) * 3);
      if (!this.inBounds(i, j)) break;
      this.learn(S, p, i, j, HIST.EXPLORE_SEE);
      reach = n; lastI = i; lastJ = j;
      const k = j * HIST.N + i;
      if (S.grid.water[k]) continue;
      const sc = (HIST.LIVE_FLOOR + S.grid.fert[k]) *
                 (1 + S.grid.ore[k] * p.delve * HIST.ORE_PULL);
      if (sc > bestScore) { bestScore = sc; best = { i, j, k }; }
    }
    if (best) {
      const what = S.grid.ore[best.k] * p.delve > HIST.MINE_T
        ? 'metal in the ground' : 'good ground';
      this.deed(S, f, y, 'walked ' + reach + ' leagues out and found ' + what);
    } else {
      this.deed(S, f, y, 'walked ' + reach + ' leagues out and found nothing');
    }
    // the wild keeps some of them
    if (this.rnd(94, f.id, y) < HIST.EXPLORE_LOST) {
      f.died = y;
      f.cause = best && S.grid.ore[best.k] > 0.1 ? 'the deep' : 'the wild';
      // Whatever they were carrying is out there with them, a long way from
      // anywhere anybody built. Nobody buries an expedition.
      for (const aid of f.holds) {
        const a = S.artifacts[aid];
        a.owners.push({ who: f.id, from: y, how: 'lost in the wild with' });
        a.rest = { i: lastI, j: lastJ, t: y, how: 'lost', figure: f.id };
        this.deposit(S, lastI, lastJ, 'lost', y, p.id, f.id, aid, a.cls);
      }
      f.holds = [];
      this.log(S, y, p.id, 'never came back', null, from.id, f.cause, f.id);
    }
    return f;
  },

  // Is this place hemmed in by our own?
  crowded(S, p, y, s) {
    let n = 0;
    for (const id of this.living(S, p, y)) {
      const o = S.sites[id];
      if (Math.abs(o.i - s.i) <= HIST.CROWD_R && Math.abs(o.j - s.j) <= HIST.CROWD_R) n++;
    }
    return n >= HIST.CROWD_N;
  },

  // Settlers go a long way to somewhere already walked, and take the road
  // home with them. This is the whole reason the map is not one valley.
  colonise(S, p, y) {
    const known = S.known[p.id];
    const live = this.living(S, p, y);
    let best = null, bestScore = 0;
    for (let k = 0; k < HIST.N * HIST.N; k++) {
      if (!known[k] || S.grid.water[k]) continue;
      const i = k % HIST.N, j = (k - i) / HIST.N;
      let near = 1e9;
      for (const id of live) {
        const o = S.sites[id];
        const dd = Math.hypot(o.i - i, o.j - j);
        if (dd < near) near = dd;
      }
      if (near < HIST.COLONY_MIN) continue;
      if (this.tooClose(S, i, j, y, HIST.MIN_SEP)) continue;
      const edge = Math.min(i, j, HIST.N - 1 - i, HIST.N - 1 - j);
      const sc = (HIST.LIVE_FLOOR + S.grid.fert[k]) *
                 (1 + S.grid.ore[k] * p.delve * HIST.ORE_PULL) *
                 (0.55 + 0.45 * clamp(edge / HIST.ROOM, 0, 1)) *
                 (0.85 + 0.3 * this.rnd(95, i * 17 + j, y));
      if (sc > bestScore) { bestScore = sc; best = { i, j, k }; }
    }
    if (!best || bestScore < HIST.SITE_MIN) return null;
    const kind = S.grid.ore[best.k] * p.delve > HIST.MINE_T ? 'mine' : 'farm';
    const id = this.addSite(S, p, best.i, best.j, kind, y);
    this.rob(S, p, y, best.i, best.j);
    this.learn(S, p, best.i, best.j, HIST.KNOWN_SITE);
    const led = this.newFigure(S, p, y, 'settler', id);
    if (led) this.deed(S, led, y, 'led the settling of ' + S.sites[id].name, id);
    this.log(S, y, p.id, 'settled far out at', id, id, null, led ? led.id : null);
    this.road(S, id, y, HIST.COLONY_ROAD);
    return id;
  },

  // ---- roads ----
  // A road is the cheapest path over the travel-cost field, which means
  // bridges are not designed: they are what happens when the cheapest path
  // still has to get wet.
  road(S, id, y, reach) {
    const s = S.sites[id];
    const max = reach === undefined ? HIST.ROAD_R : reach;
    let bestId = -1, bestD = 1e9;
    for (const other of this.living(S, S.peoples[s.people], y)) {
      if (other === id) continue;
      const o = S.sites[other];
      const d = Math.hypot(o.i - s.i, o.j - s.j);
      if (d < bestD && d <= max) { bestD = d; bestId = other; }
    }
    if (bestId < 0) return null;
    const path = this.path(S, s, S.sites[bestId]);
    if (!path) return null;
    // a run of water cells on the route is a crossing that had to be built
    const bridges = [];
    let run = null;
    for (const k of path) {
      if (S.grid.water[k]) { (run || (run = [])).push(k); }
      else if (run) { if (run.length >= HIST.BRIDGE_MIN) bridges.push(run); run = null; }
    }
    if (run && run.length >= HIST.BRIDGE_MIN) bridges.push(run);
    const link = {
      id: S.links.length, a: id, b: bestId, people: s.people,
      built: y, path, bridges,
    };
    S.links.push(link);
    // Once per cell, not once per crossing. Compounding made the busiest
    // corridors twenty thousand times cheaper than open ground, so the late
    // network was shaped by repeated multiplication rather than by terrain.
    for (const k of path) {
      if (S.roaded[k]) continue;
      S.roaded[k] = 1;
      S.grid.cost[k] *= HIST.ROAD_DISCOUNT;
    }
    if (bridges.length) {
      this.log(S, y, s.people, 'bridged', link.id, id, null);
    }
    this.log(S, y, s.people, 'roaded', link.id, id, null);
    return link;
  },

  // Dijkstra over the cell grid. 4096 nodes and a road every few ticks, so
  // a binary heap is more than enough and an A* heuristic is not worth the
  // extra surface to get wrong.
  path(S, a, b) {
    const N = HIST.N, n = N * N;
    const dist = new Float32Array(n).fill(Infinity);
    const prev = new Int32Array(n).fill(-1);
    const seen = new Uint8Array(n);
    const src = a.j * N + a.i, dst = b.j * N + b.i;
    dist[src] = 0;
    const heap = [[0, src]];
    const push = (d, k) => {
      heap.push([d, k]);
      let c = heap.length - 1;
      while (c > 0) {
        const p = (c - 1) >> 1;
        if (heap[p][0] <= heap[c][0]) break;
        const t = heap[p]; heap[p] = heap[c]; heap[c] = t; c = p;
      }
    };
    const pop = () => {
      const top = heap[0], last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let c = 0;
        for (;;) {
          const l = c * 2 + 1, r = l + 1;
          let m = c;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === c) break;
          const t = heap[m]; heap[m] = heap[c]; heap[c] = t; c = m;
        }
      }
      return top;
    };
    while (heap.length) {
      const [d, k] = pop();
      if (seen[k]) continue;
      seen[k] = 1;
