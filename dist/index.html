<body>
<canvas id="screen"></canvas>
<div id="hud">WASD move &middot; arrows turn &middot; shift run &middot; click for mouse-look &middot; M mono/colour &middot; C glyph set &middot; X raw view &middot; F fullscreen</div>
<div id="fps"></div>
<script>
// ---- js/config.js ----
// Global configuration. Plain script, shared global scope (inlined at build time).
const CFG = {
  PLANE_LEN: 0.85,    // tan(horizontal half-FOV)
  MAX_DIST: 60,       // ray cutoff (world cells)
  EYE: 1.55,          // camera height above ground
  WORLD: 192,         // world grid size (cells per side)
  CITY: 96,           // city core size, centered; the rest is open ground
  SEED: 20260815,
  CAR_COUNT: 42,
  PED_COUNT: 70,
  // rendering
  MONO: true,         // uniform grayscale (M toggles)
  // palette: hard yellow sun against a deep blue sky, with the ambient term
  // kept low so shadows go dark and the sunlight reads as the only real light
  SUN_COL: [1.00, 0.86, 0.46],
  SUN_I: 1.55,
  AMB_COL: [0.20, 0.31, 0.55],
  AMB_I: 0.55,
  SKY_HORIZON: [0.34, 0.46, 0.66],
  SKY_ZENITH: [0.04, 0.10, 0.32],
  GLYPH_SET: 'ascii', // ascii | symbols  (C cycles)
  // Tone curve applied before glyph selection. White sits at the luminance
  // sunlit surfaces actually reach (~0.79 here); above that the brightest
  // glyphs go unused, below it they clip and the highlights flatten.
  TONE_BLACK: 0.0,
  TONE_WHITE: 0.90,
  TONE_GAMMA: 2.0,
  RAW: false,         // debug: show the shaded image without glyph mapping (X)
  SUN_AZ: 0.9,        // sun azimuth (rad)
  SUN_EL: 0.7,        // sun elevation (rad) — low enough for long, readable shadows
  // Near zero: a shadowed point receives sky light, not sunlight. Leaving a
  // slice of the warm sun in shadow tints it yellow instead of blue.
  SHADOW: 0.04,
  // Angular radius of the sun disc, which sets penumbra width. The real sun
  // is 0.0047 rad; 0.05 was eleven times that and smeared every shadow edge.
  // This keeps penumbrae that widen with distance, but with a crisp contact.
  SUN_ANGLE: 0.018,
  // stratified, so these go a lot further than the same count of random rays.
  // ~20k cells x 48 rays is small work for a GPU; raise if grain remains.
  SUN_SAMPLES: 16,    // shadow rays per pixel
  AO_SAMPLES: 32,     // hemisphere rays per pixel
  AO_RADIUS: 9,       // AO ray length, in world cells
  TREE_REACH: 2,      // cells a canopy may overhang; sets the search radius
};

// Cell types
const T_GRASS = 0, T_ROAD = 1, T_WALK = 2, T_BLDG = 3, T_TREE = 4;
// Prop kinds (street furniture), must match the shader constants
const P_NONE = 0, P_LIGHT = 1, P_BIN = 2, P_BOARD = 3;
// Cell flags
const F_LANE = 1, F_ROAD_V = 2, F_ROAD_H = 4;
</script>
<script>
// ---- js/util.js ----
// Seeded RNG + hashing helpers.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Fast integer hash -> [0,1). Deterministic per (x,y,z) triple.
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
</script>
<script>
// ---- js/world.js ----
// Procedural city: road lattice, sidewalks, building footprints, plazas, trees.
const World = {
  type: null, height: null, flags: null, bcol: null, bseed: null,
  roadX: [], roadY: [],

  base: null,   // ground type beneath a tree cell, so trees keep their paving

  idx(x, y) { return y * CFG.WORLD + x; },

  inBounds(x, y) { return x >= 0 && y >= 0 && x < CFG.WORLD && y < CFG.WORLD; },

  cellType(x, y) {
    if (!this.inBounds(x, y)) return T_BLDG; // world edge is solid
    return this.type[this.idx(x, y)];
  },

  isSolid(x, y) {
    const t = this.cellType(x, y);
    return t === T_BLDG || t === T_TREE;
  },

  generate(seed) {
    const W = CFG.WORLD, rng = mulberry32(seed);
    const N = W * W;
    this.type = new Uint8Array(N);
    this.base = new Uint8Array(N);
    this.height = new Uint8Array(N);
    this.flags = new Uint8Array(N);
    this.bcol = new Uint8Array(N);
    this.bseed = new Uint8Array(N);

    // City core is centered; everything outside stays open ground
    const c0 = (W - CFG.CITY) >> 1, c1 = c0 + CFG.CITY;
    this.cityMin = c0; this.cityMax = c1;

    // Road lines (3 cells wide, center cell carries lane dashes)
    this.roadX = []; this.roadY = [];
    let p = c0 + 4 + ((rng() * 4) | 0);
    while (p < c1 - 6) { this.roadX.push(p); p += 9 + ((rng() * 8) | 0); }
    p = c0 + 4 + ((rng() * 4) | 0);
    while (p < c1 - 6) { this.roadY.push(p); p += 9 + ((rng() * 8) | 0); }

    for (const cx of this.roadX) {
      for (let y = c0; y < c1; y++) {
        for (let dx = -1; dx <= 1; dx++) {
          const i = this.idx(cx + dx, y);
          this.type[i] = T_ROAD;
          this.flags[i] |= F_ROAD_V;
          if (dx === 0 && (y % 4) < 2) this.flags[i] |= F_LANE;
        }
      }
    }
    for (const cy of this.roadY) {
      for (let x = c0; x < c1; x++) {
        for (let dy = -1; dy <= 1; dy++) {
          const i = this.idx(x, cy + dy);
          this.type[i] = T_ROAD;
          this.flags[i] |= F_ROAD_H;
          if (dy === 0 && (x % 4) < 2) this.flags[i] |= F_LANE;
          else if (dy === 0) this.flags[i] &= ~F_LANE; // intersections: H wins, no double dashes
        }
      }
    }

    // Sidewalks: ring around roads
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      if (this.type[this.idx(x, y)] !== 0) continue;
      let nearRoad = false;
      for (let dy = -1; dy <= 1 && !nearRoad; dy++)
        for (let dx = -1; dx <= 1; dx++)
          if (this.inBounds(x + dx, y + dy) && this.type[this.idx(x + dx, y + dy)] === T_ROAD) { nearRoad = true; break; }
      if (nearRoad) this.type[this.idx(x, y)] = T_WALK;
    }

    // Block interiors: buildings on a 3x3 footprint grid, some plazas with trees.
    // Outside the city core: open plains with scattered trees.
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = this.idx(x, y);
      if (this.type[i] !== T_GRASS) continue;
      if (x < c0 || y < c0 || x >= c1 || y >= c1) {
        if (hash3(x, y, seed ^ 0x7777) < 0.015) {
          this.base[i] = this.type[i];
          this.type[i] = T_TREE;
          this.height[i] = 2 + ((hash3(x, y, seed ^ 0x78) * 2) | 0);
        }
        continue;
      }
      const fx = (x / 3) | 0, fy = (y / 3) | 0;
      const hzone = hash3(fx, fy, seed);
      if (hzone < 0.16) {
        // plaza: grass, scattered trees
        if (hash3(x, y, seed ^ 0x5111) < 0.18) {
          this.base[i] = this.type[i];
          this.type[i] = T_TREE;
          this.height[i] = 2 + ((hash3(x, y, seed ^ 0x77) * 2) | 0);
        }
        continue;
      }
      this.type[i] = T_BLDG;
      const tall = hash3(fx, fy, seed ^ 0x9e37) < 0.13;
      this.height[i] = tall
        ? 12 + ((hash3(fx, fy, seed ^ 0xabc) * 15) | 0)
        : 3 + ((hash3(fx, fy, seed ^ 0xdef) * 6) | 0);
      this.bcol[i] = (hash3(fx, fy, seed ^ 0x321) * 5) | 0;
      this.bseed[i] = (hash3(fx, fy, seed ^ 0x654) * 255) | 0;
    }

    // Street trees: sparse, on sidewalk cells not directly beside a lane crossing
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = this.idx(x, y);
      if (this.type[i] === T_WALK && hash3(x, y, seed ^ 0x1234) < 0.045) {
        this.base[i] = this.type[i];
        this.type[i] = T_TREE;
        this.height[i] = 2 + ((hash3(x, y, seed ^ 0x88) * 2) | 0);
      }
    }
  },

  // Street furniture on kerbside pavement, facing the road it serves.
  // Stored per cell as kind | variant<<8, where the variant's low two bits
  // are the facing and the rest selects a billboard sign.
  placeProps(seed) {
    const W = CFG.WORLD, N = W * W;
    this.prop = new Uint32Array(N);
    const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

    for (let y = 2; y < W - 2; y++) for (let x = 2; x < W - 2; x++) {
      const i = this.idx(x, y);
      if (this.type[i] !== T_WALK) continue;

      // face whichever side the carriageway is on
      let q = -1;
      for (let d = 0; d < 4; d++) {
        if (this.cellType(x + DIRS[d][0], y + DIRS[d][1]) === T_ROAD) { q = d; break; }
      }
      if (q < 0) continue;

      if ((x * 3 + y * 5) % 17 === 0) {
        this.prop[i] = P_LIGHT | (q << 8);
        continue;
      }
      if (hash3(x, y, seed ^ 0xB2) < 0.035) {
        this.prop[i] = P_BIN | (q << 8);
        continue;
      }
      if (hash3(x, y, seed ^ 0xC3) < 0.022) {
        // the panel is wide, so keep the span along the kerb clear; a building
        // directly behind it is fine and in fact typical
        const [px, py] = [-DIRS[q][1], DIRS[q][0]];
        let clear = true;
        for (let s = -1; s <= 1; s++) {
          const t = this.cellType(x + px * s, y + py * s);
          if (t === T_BLDG) { clear = false; break; }
        }
        if (!clear) continue;
        const sign = (hash3(x, y, seed ^ 0xD4) * 8) | 0;
        this.prop[i] = P_BOARD | ((q | (sign << 2)) << 8);
      }
    }
  },

  // A road intersection near the world center, for player spawn
  findSpawn() {
    const cx = CFG.WORLD / 2;
    let best = null, bestD = 1e9;
    for (const rx of this.roadX) for (const ry of this.roadY) {
      const d = (rx - cx) * (rx - cx) + (ry - cx) * (ry - cx);
      if (d < bestD) { bestD = d; best = [rx + 0.5, ry + 0.5]; }
    }
    return best || [cx, cx];
  },
};
</script>
<script>
// ---- js/light.js ----
// Sun direction and world bounds for the GPU renderer. Shadows and ambient
// occlusion are both traced per pixel in the compute shader, so nothing is
// baked here any more — this only supplies the height bound that lets a
// shadow ray stop once it has climbed clear of all geometry.
const Light = {
  sunX: 0, sunY: 0, tanEl: 0, maxH: 0,

  bake() {
    this.sunX = Math.cos(CFG.SUN_AZ);
    this.sunY = Math.sin(CFG.SUN_AZ);
    this.tanEl = Math.tan(CFG.SUN_EL);
    this.maxH = 0;
    for (let i = 0; i < World.height.length; i++) {
      if (World.height[i] > this.maxH) this.maxH = World.height[i];
    }
  },
};
</script>
<script>
// ---- js/entities.js ----
// Ambient traffic: cars follow the road lattice, pedestrians wander sidewalks.
const Entities = {
  cars: [], peds: [],

  init(seed) {
    const rng = mulberry32(seed ^ 0xC0FFEE);
    this.cars = []; this.peds = [];

    const roadCells = [], walkCells = [];
    for (let y = 0; y < CFG.WORLD; y++) for (let x = 0; x < CFG.WORLD; x++) {
      const t = World.type[World.idx(x, y)];
      if (t === T_ROAD) roadCells.push([x, y]);
      else if (t === T_WALK) walkCells.push([x, y]);
    }

    for (let i = 0; i < CFG.CAR_COUNT && roadCells.length; i++) {
      const [x, y] = roadCells[(rng() * roadCells.length) | 0];
      const f = World.flags[World.idx(x, y)];
      let dx = 0, dy = 0;
      if (f & F_ROAD_V) { dy = rng() < 0.5 ? 1 : -1; }
      else { dx = rng() < 0.5 ? 1 : -1; }
      this.cars.push({
        x: x + 0.5, y: y + 0.5, dx, dy,
        speed: 2.2 + rng() * 1.8,
        col: (rng() * 5) | 0,
      });
    }

    for (let i = 0; i < CFG.PED_COUNT && walkCells.length; i++) {
      const [x, y] = walkCells[(rng() * walkCells.length) | 0];
      this.peds.push({
        x: x + 0.5, y: y + 0.5, tx: x + 0.5, ty: y + 0.5,
        speed: 0.6 + rng() * 0.6,
        shade: 0.55 + rng() * 0.45,
      });
    }
  },

  update(dt, time) {
    for (const c of this.cars) {
      const nx = c.x + c.dx * c.speed * dt;
      const ny = c.y + c.dy * c.speed * dt;
      const cellAhead = World.cellType(
        Math.floor(nx + c.dx * 0.6), Math.floor(ny + c.dy * 0.6));
      if (cellAhead === T_ROAD) { c.x = nx; c.y = ny; }
      else {
        // pick a new road direction from the current cell
        const cx = Math.floor(c.x), cy = Math.floor(c.y);
        const opts = [];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          if (dx === -c.dx && dy === -c.dy) continue; // no U-turn unless stuck
          if (World.cellType(cx + dx * 2, cy + dy * 2) === T_ROAD) opts.push([dx, dy]);
        }
        if (opts.length === 0) { c.dx = -c.dx; c.dy = -c.dy; }
        else {
          const pick = opts[(hash3(cx, cy, (time * 997) | 0) * opts.length) | 0];
          c.dx = pick[0]; c.dy = pick[1];
          c.x = cx + 0.5; c.y = cy + 0.5;
        }
      }
    }

    for (const p of this.peds) {
      const ddx = p.tx - p.x, ddy = p.ty - p.y;
      const d = Math.hypot(ddx, ddy);
      if (d < 0.08) {
        // choose a new adjacent sidewalk cell
        const cx = Math.floor(p.x), cy = Math.floor(p.y);
        const opts = [];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
          if (World.cellType(cx + dx, cy + dy) === T_WALK) opts.push([dx, dy]);
        if (opts.length) {
          const pick = opts[(hash3(cx, cy, ((time * 613) | 0) ^ 0x99) * opts.length) | 0];
          p.tx = cx + pick[0] + 0.5; p.ty = cy + pick[1] + 0.5;
        }
      } else {
        p.x += (ddx / d) * p.speed * dt;
        p.y += (ddy / d) * p.speed * dt;
      }
    }
  },
};
</script>
<script>
// ---- js/player.js ----
// First-person player: WASD move, arrows/mouse turn, collision vs solid cells.
const Player = {
  x: 0, y: 0, angle: 0.6,
  pitch: 0, // vertical look, radians; ±90° is straight up/down
  keys: {},

  init() {
    const [sx, sy] = World.findSpawn();
    this.x = sx; this.y = sy;

    addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (e.code === 'KeyM') CFG.MONO = !CFG.MONO;
      if (e.code === 'KeyX') CFG.RAW = !CFG.RAW;
      if (e.code === 'KeyC' && GPURenderer.ok) {
        const sets = Object.keys(GlyphAtlas.SETS);
        const next = sets[(sets.indexOf(CFG.GLYPH_SET) + 1) % sets.length];
        console.info('glyph set:', JSON.stringify(GPURenderer.setGlyphSet(next)));
      }
      if (e.code === 'KeyF') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });

    const canvas = document.getElementById('screen');
    canvas.addEventListener('click', () => canvas.requestPointerLock());
    const locked = () => document.pointerLockElement === canvas;
    // browsers can fire one huge bogus movement delta when pointer lock
    // engages or the cursor re-syncs; skip the first events and clamp the rest
    let skipEvents = 0;
    document.addEventListener('pointerlockchange', () => { skipEvents = 2; });
    addEventListener('mousemove', e => {
      if (!locked()) return;
      if (skipEvents > 0) { skipEvents--; return; }
      const mx = clamp(e.movementX, -120, 120);
      const my = clamp(e.movementY, -120, 120);
      this.angle += mx * 0.0022;
      // real camera pitch. Full range: straight up to straight down. It stops
      // a hair short of the poles, where the camera basis would degenerate.
      const LIM = Math.PI / 2 - 0.001;
      this.pitch = clamp(this.pitch - my * 0.0022, -LIM, LIM);
    });
  },

  blocked(x, y) {
    const R = 0.22;
    for (const [ox, oy] of [[-R, -R], [R, -R], [-R, R], [R, R]])
      if (World.isSolid(Math.floor(x + ox), Math.floor(y + oy))) return true;
    return false;
  },

  update(dt) {
    const k = this.keys;
    const turn = 2.1 * dt;
    if (k['ArrowLeft']) this.angle -= turn;
    if (k['ArrowRight']) this.angle += turn;

    const run = (k['ShiftLeft'] || k['ShiftRight']) ? 2.0 : 1.0;
    const spd = 4.2 * run * dt;
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);

    let mx = 0, my = 0;
    if (k['KeyW'] || k['ArrowUp']) { mx += dx; my += dy; }
    if (k['KeyS'] || k['ArrowDown']) { mx -= dx; my -= dy; }
    if (k['KeyA']) { mx += dy; my -= dx; }
    if (k['KeyD']) { mx -= dy; my += dx; }

    const len = Math.hypot(mx, my);
    if (len > 0.001) {
      mx = mx / len * spd; my = my / len * spd;
      // axis-separated collision so we slide along walls
      if (!this.blocked(this.x + mx, this.y)) this.x += mx;
      if (!this.blocked(this.x, this.y + my)) this.y += my;
    }
  },
};
</script>
<script>
// ---- js/webgpu/atlas.js ----
// Procedural glyph atlas.
//
// Glyph order is measured, not guessed: every candidate is rendered and its
// ink coverage sampled, then the set is sorted by coverage and resampled so
// the ramp is close to linear in brightness. A hand-ordered ramp is uneven —
// the gaps show up as banding in smooth gradients.
// Billboard artwork: text rendered to a stacked atlas, one row per sign, which
// the compute shader samples when a ray lands on a hoarding panel.
const SignAtlas = {
  TEXTS: ['NOODLES', 'OPEN 24H', 'DATA', 'HOTEL',
          'GARAGE', 'SUSHI', 'TAXI', 'CITY BANK'],
  W: 256, H: 64,

  build() {
    const n = this.TEXTS.length;
    const cv = document.createElement('canvas');
    cv.width = this.W;
    cv.height = this.H * n;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      const t = this.TEXTS[i];
      // shrink to fit the panel rather than overflow it
      const size = Math.min(this.H * 0.6, (this.W * 1.55) / t.length);
      ctx.font = `bold ${size | 0}px "Consolas", "Courier New", monospace`;
      ctx.fillText(t, this.W / 2, this.H * i + this.H / 2);
    }
    return { canvas: cv, count: n };
  },
};

const GlyphAtlas = {
  // Candidate pools, printable ASCII only — no block elements, which read as
  // pixels rather than as text. Both pools top out near 25% ink, so the tone
  // curve in the fragment shader does the work of keeping bright areas
  // (mainly sky) off the end of the ramp.
  SETS: {
    ascii:   ' .\'`^",:;!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@',
    symbols: ' .\'`^",:;!|/\\()[]{}<>~+-_=*#%&@$?',
  },
  CELL: 32,
  LEVELS: 24,

  measure(chars) {
    const S = 16;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.font = `bold ${S * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const out = [];
    for (const ch of chars) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff';
      ctx.fillText(ch, S / 2, S / 2 + 1);
      const d = ctx.getImageData(0, 0, S, S).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i];
      out.push({ ch, cov: sum / (S * S * 255) });
    }
    return out;
  },

  // pick LEVELS glyphs whose coverages are as evenly spaced as possible
  buildRamp(setName) {
    const seen = new Set();
    const uniq = [];
    for (const g of this.measure(this.SETS[setName] || this.SETS.symbols)) {
      const key = g.cov.toFixed(4);
      if (seen.has(key)) continue;      // drop visually identical glyphs
      seen.add(key);
      uniq.push(g);
    }
    uniq.sort((a, b) => a.cov - b.cov);

    // Walk the sorted glyphs and take the first past each evenly spaced
    // threshold. Glyphs whose coverage is nearly identical look the same on
    // screen, so admitting them would spend ramp steps that show no change;
    // this keeps every step visually distinct and lets the count fall to
    // whatever the font can actually supply.
    const lo = uniq[0].cov, hi = uniq[uniq.length - 1].cov;
    const stepSize = (hi - lo) / (this.LEVELS - 1);
    const ramp = [];
    let next = lo;
    for (const g of uniq) {
      if (g.cov + 1e-9 >= next) {
        ramp.push(g);
        next = g.cov + stepSize;
      }
    }
    const last = uniq[uniq.length - 1];
    if (ramp[ramp.length - 1] !== last) ramp.push(last);
    return ramp;
  },

  build(setName) {
    const ramp = this.buildRamp(setName || CFG.GLYPH_SET);
    this.ramp = ramp;
    const n = ramp.length;
    const cv = document.createElement('canvas');
    cv.width = this.CELL * n;
    cv.height = this.CELL;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${this.CELL * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(ramp[i].ch, i * this.CELL + this.CELL / 2, this.CELL / 2 + 1);
    }
    return { canvas: cv, levels: n, cell: this.CELL,
             chars: ramp.map(g => g.ch).join('') };
  },
};
</script>
<script>
// ---- js/webgpu/shaders.js ----
// WGSL sources.
//
// Pass 1 (compute): one invocation per low-res cell, each casting a TRUE 3D
// ray — the camera basis is genuinely rotated by pitch, so vertical world
// edges converge to a third vanishing point instead of staying parallel as
// they do in a column-raycaster with a sheared horizon. Rays march the height
// field (DDA in xy, linear in z), hit building sides, roofs, the ground, or
// entity boxes, then trace a real shadow ray toward the sun and shade.
//
// Pass 2 (render): a fullscreen triangle maps each low-res cell to a glyph
// chosen by luminance and upscales it.

const WGSL_COMPUTE = /* wgsl */`
struct Uniforms {
  camPos    : vec2f,
  res       : vec2f,
  fwd       : vec3f,
  eye       : f32,
  right     : vec3f,
  maxDist   : f32,
  up        : vec3f,
  gridSize  : f32,
  sunDir    : vec3f,
  shadowK   : f32,
  tanX      : f32,
  tanY      : f32,
  maxHeight : f32,
  entCount  : f32,
  sunAngle  : f32,   // angular radius of the sun disc -> penumbra width
  sunSamples: f32,
  aoSamples : f32,
  aoRadius  : f32,
  treeReach : f32,   // cells to search for overhanging canopies and props
  signCount : f32,   // rows in the billboard sign atlas
  time      : f32,
  pad1      : f32,
  sunCol    : vec3f,
  sunI      : f32,
  ambCol    : vec3f,
  ambI      : f32,
  skyLo     : vec3f,   // horizon
  pad2      : f32,
  skyHi     : vec3f,   // zenith
  pad3      : f32,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> cells : array<u32>;
@group(0) @binding(2) var outTex : texture_storage_2d<rgba8unorm, write>;
// two vec4 per entity: (x, y, heading, kind) and (halfLen, halfWid, height, phase)
@group(0) @binding(3) var<storage, read> ents : array<vec4f>;
// per cell: propKind | variant<<8
@group(0) @binding(4) var<storage, read> props : array<u32>;
@group(0) @binding(5) var signTex : texture_2d<f32>;
@group(0) @binding(6) var signSamp : sampler;

const T_ROAD : u32 = 1u;
const T_WALK : u32 = 2u;
const T_BLDG : u32 = 3u;
const T_TREE : u32 = 4u;

struct Cell { kind : u32, h : f32, base : u32, nearObj : bool };

fn cellAt(x : i32, y : i32) -> Cell {
  let g = i32(U.gridSize);
  var c : Cell;
  if (x < 0 || y < 0 || x >= g || y >= g) {
    c.kind = 0u; c.h = 0.0; c.base = 0u; c.nearObj = false;
    return c;
  }
  let p = cells[u32(y * g + x)];
  c.kind = p & 0xffu;
  c.h = f32((p >> 8u) & 0xffu);
  c.base = (p >> 16u) & 0xffu;
  c.nearObj = ((p >> 24u) & 1u) != 0u;
  return c;
}

// value noise, for breaking the canopy up so it reads as leaves not a balloon
fn uhash3(x : i32, y : i32, z : i32) -> u32 {
  return uhash(uhash(bitcast<u32>(x), bitcast<u32>(y)), bitcast<u32>(z));
}
fn vnoise(p : vec3f) -> f32 {
  let i = floor(p);
  let f = p - i;
  let u = f * f * (3.0 - 2.0 * f);
  let ix = i32(i.x); let iy = i32(i.y); let iz = i32(i.z);
  let s = 1.0 / 4294967296.0;
  let c000 = f32(uhash3(ix,   iy,   iz  )) * s;
  let c100 = f32(uhash3(ix+1, iy,   iz  )) * s;
  let c010 = f32(uhash3(ix,   iy+1, iz  )) * s;
  let c110 = f32(uhash3(ix+1, iy+1, iz  )) * s;
  let c001 = f32(uhash3(ix,   iy,   iz+1)) * s;
  let c101 = f32(uhash3(ix+1, iy,   iz+1)) * s;
  let c011 = f32(uhash3(ix,   iy+1, iz+1)) * s;
  let c111 = f32(uhash3(ix+1, iy+1, iz+1)) * s;
  let x00 = mix(c000, c100, u.x);
  let x10 = mix(c010, c110, u.x);
  let x01 = mix(c001, c101, u.x);
  let x11 = mix(c011, c111, u.x);
  return mix(mix(x00, x10, u.y), mix(x01, x11, u.y), u.z);
}

// Trees are no longer part of the height field: they are traced as a trunk
// cylinder plus a semi-transparent canopy sphere.
fn isSolid(k : u32) -> bool { return k == T_BLDG; }
fn isTree(k : u32) -> bool { return k == T_TREE; }

// Integer hash. sin()-based hashes repeat and correlate across neighbouring
// pixels, which shows up as structure in the sampling noise.
fn uhash(a : u32, b : u32) -> u32 {
  var n = (a * 73856093u) ^ (b * 19349663u);
  n = n ^ (n >> 13u);
  n = n * 1274126177u;
  return n ^ (n >> 16u);
}

fn hash1(p : vec2f) -> f32 {
  let ip = vec2i(floor(p));
  return f32(uhash(bitcast<u32>(ip.x), bitcast<u32>(ip.y))) * (1.0 / 4294967296.0);
}

fn hash2(p : vec2f) -> vec2f {
  let ip = vec2i(floor(p));
  let h = uhash(bitcast<u32>(ip.x), bitcast<u32>(ip.y));
  return vec2f(f32(h & 0xffffu), f32((h >> 16u) & 0xffffu)) * (1.0 / 65536.0);
}

// Exact height-field occlusion test: walks cell boundaries with DDA rather
// than sampling at fixed intervals, so nothing is stepped over and shadow
// edges land on real geometry instead of on step boundaries.
fn occluded(ro : vec3f, rd : vec3f, maxT : f32) -> bool {
  let hlen = length(rd.xy);
  if (hlen < 1e-6) {
    let c = cellAt(i32(floor(ro.x)), i32(floor(ro.y)));
    return rd.z > 0.0 && isSolid(c.kind) && c.h > ro.z;
  }
  let rd2 = rd.xy / hlen;
  let zs = rd.z / hlen;
  let maxD = maxT * hlen;

  var mapX = i32(floor(ro.x));
  var mapY = i32(floor(ro.y));
  let dD = abs(1.0 / max(abs(rd2), vec2f(1e-9)));
  var sgn = vec2i(1, 1);
  var side = vec2f(0.0);
  if (rd2.x < 0.0) { sgn.x = -1; side.x = (ro.x - f32(mapX)) * dD.x; }
  else { side.x = (f32(mapX) + 1.0 - ro.x) * dD.x; }
  if (rd2.y < 0.0) { sgn.y = -1; side.y = (ro.y - f32(mapY)) * dD.y; }
  else { side.y = (f32(mapY) + 1.0 - ro.y) * dD.y; }

  var dEnter = 0.0;
  for (var i = 0; i < 256; i = i + 1) {
    let dExit = min(min(side.x, side.y), maxD);
    let c = cellAt(mapX, mapY);
    if (isSolid(c.kind)) {
      // lowest point of the ray segment crossing this cell
      let zLo = min(ro.z + zs * dEnter, ro.z + zs * dExit);
      if (zLo < c.h) { return true; }
    } else if (c.nearObj) {
      // Trunks, poles and signage block outright; canopies only partly, tested
      // stochastically across the sample set so a stand of trees casts dappled
      // shade rather than a hard silhouette.
      let ob = traceObjects(ro, rd, mapX, mapY, dEnter / hlen, dExit / hlen);
      if (ob.ok) {
        if (!ob.canopy) { return true; }
        if (hash1(ro.xy * 37.0 + rd.xy * 91.0) < ob.alpha) { return true; }
      }
    }
    if (dExit >= maxD) { return false; }
    if (zs > 0.0 && ro.z + zs * dEnter > U.maxHeight) { return false; }
    dEnter = dExit;
    if (side.x < side.y) { side.x = side.x + dD.x; mapX = mapX + sgn.x; }
    else { side.y = side.y + dD.y; mapY = mapY + sgn.y; }
  }
  return false;
}

// Area-light shadow: sample directions across the sun's disc, so penumbrae
// widen with distance from the occluder instead of being hard everywhere.
fn softShadow(p : vec3f, seed : vec2f) -> f32 {
  var t = vec3f(0.0, 0.0, 1.0);
  if (abs(U.sunDir.z) > 0.9) { t = vec3f(1.0, 0.0, 0.0); }
  let b1 = normalize(cross(t, U.sunDir));
  let b2 = cross(U.sunDir, b1);

  // Stratified disc sampling on a golden-angle spiral, rotated per pixel.
  // Independent random samples clump and leave gaps, so each pixel gets a
  // different estimate — that is the visible grain. An evenly spread set
  // cuts the variance dramatically for the same number of rays.
  let n = i32(U.sunSamples);
  let rot = hash1(seed) * 6.2831853;
  var lit = 0.0;
  for (var i = 0; i < n; i = i + 1) {
    let u = (f32(i) + 0.5) / f32(n);
    let rad = sqrt(u) * U.sunAngle;
    let ang = rot + f32(i) * 2.39996323;   // golden angle
    let d = normalize(U.sunDir + b1 * (cos(ang) * rad) + b2 * (sin(ang) * rad));
    if (!occluded(p, d, 90.0)) { lit = lit + 1.0; }
  }
  return lit / f32(n);
}

// Traced ambient occlusion: cosine-weighted hemisphere rays, actual visibility.
fn tracedAO(p : vec3f, nrm : vec3f, seed : vec2f) -> f32 {
  var t = vec3f(0.0, 0.0, 1.0);
  if (abs(nrm.z) > 0.9) { t = vec3f(1.0, 0.0, 0.0); }
  let b1 = normalize(cross(t, nrm));
  let b2 = cross(nrm, b1);

  // Same stratification: radius steps through the strata in order while the
  // golden angle spreads the azimuth, giving a cosine-weighted set with far
  // lower variance than independent random directions.
  let n = i32(U.aoSamples);
  let rot = hash1(seed + vec2f(17.0, 5.0)) * 6.2831853;
  var vis = 0.0;
  for (var i = 0; i < n; i = i + 1) {
    let u = (f32(i) + 0.5) / f32(n);
    let rr = sqrt(u);
    let zz = sqrt(max(0.0, 1.0 - u));
    let ang = rot + f32(i) * 2.39996323;
    let d = b1 * (cos(ang) * rr) + b2 * (sin(ang) * rr) + nrm * zz;
    if (!occluded(p, normalize(d), U.aoRadius)) { vis = vis + 1.0; }
  }
  return vis / f32(n);
}

struct Hit {
  t      : f32,     // distance along the ray
  n      : vec3f,   // surface normal
  albedo : vec3f,
  ok     : bool,
  canopy : bool,    // semi-transparent: composite and continue behind it
  tExit  : f32,     // where to resume the ray past a canopy
  alpha  : f32,     // canopy coverage for this ray
  emissive : f32,   // self-lit fraction (lamp glass, backlit signage)
};

fn shadeSky(rd : vec3f) -> vec3f {
  // spherical gradient, pale at the horizon deepening to blue overhead
  let t = clamp(rd.z, 0.0, 1.0);
  var col = mix(U.skyLo, U.skyHi, pow(t, 0.55));
  // sun disc and its glare, at the sun's true direction
  let d = dot(normalize(rd), U.sunDir);
  if (d > 0.9995) { return U.sunCol * 1.6; }
  col = col + U.sunCol * pow(max(d, 0.0), 220.0) * 1.1;
  col = col + U.sunCol * pow(max(d, 0.0), 18.0) * 0.22;
  if (rd.z < 0.0) {
    // below the horizon and beyond everything: haze off the ground
    col = mix(U.skyLo * 0.85, col, exp(rd.z * 6.0));
  }
  return col;
}

// ray vs sphere; returns (entry, exit) distances, or x < 0 on a miss.
// the exit is needed to resume the ray after a semi-transparent canopy.
fn hitSphere(ro : vec3f, rd : vec3f, c : vec3f, r : f32) -> vec2f {
  let oc = ro - c;
  let b = dot(oc, rd);
  let cc = dot(oc, oc) - r * r;
  let disc = b * b - cc;
  if (disc < 0.0) { return vec2f(-1.0, -1.0); }
  let s = sqrt(disc);
  return vec2f(-b - s, -b + s);
}

// ray vs vertical cylinder spanning z0..z1; returns near distance or -1
fn hitCylinder(ro : vec3f, rd : vec3f, c : vec2f, r : f32, z0 : f32, z1 : f32) -> f32 {
  let oc = ro.xy - c;
  let a = dot(rd.xy, rd.xy);
  if (a < 1e-8) { return -1.0; }
  let b = dot(oc, rd.xy);
  let cc = dot(oc, oc) - r * r;
  let disc = b * b - a * cc;
  if (disc < 0.0) { return -1.0; }
  let s = sqrt(disc);
  var t = (-b - s) / a;
  if (t <= 0.001) { t = (-b + s) / a; }
  if (t <= 0.001) { return -1.0; }
  let z = ro.z + rd.z * t;
  if (z < z0 || z > z1) { return -1.0; }
  return t;
}

// Ray vs box rotated about Z. Returns (t, normal); t < 0 on a miss. Almost
// every prop is built from these, so orientation lives here rather than in
// each object.
fn hitOBB(ro : vec3f, rd : vec3f, ctr : vec3f, he : vec3f,
          ca : f32, sa : f32) -> vec4f {
  let p = ro - ctr;
  let lo = vec3f(p.x * ca + p.y * sa, -p.x * sa + p.y * ca, p.z);
  let ld = vec3f(rd.x * ca + rd.y * sa, -rd.x * sa + rd.y * ca, rd.z);
  let safe = select(ld, vec3f(1e-9, 1e-9, 1e-9), abs(ld) < vec3f(1e-9));
  let inv = 1.0 / safe;
  let t0 = (-he - lo) * inv;
  let t1 = (he - lo) * inv;
  let tmin3 = min(t0, t1);
  let tmax3 = max(t0, t1);
  let tn = max(max(tmin3.x, tmin3.y), tmin3.z);
  let tf = min(min(tmax3.x, tmax3.y), tmax3.z);
  if (tf < max(tn, 0.001)) { return vec4f(-1.0, 0.0, 0.0, 0.0); }
  var nl = vec3f(0.0, 0.0, 1.0);
  if (tmin3.x >= tmin3.y && tmin3.x >= tmin3.z) {
    nl = vec3f(-sign(ld.x), 0.0, 0.0);
  } else if (tmin3.y >= tmin3.z) {
    nl = vec3f(0.0, -sign(ld.y), 0.0);
  } else {
    nl = vec3f(0.0, 0.0, -sign(ld.z));
  }
  let nw = vec3f(nl.x * ca - nl.y * sa, nl.x * sa + nl.y * ca, nl.z);
  return vec4f(max(tn, 0.001), nw.x, nw.y, nw.z);
}

// local coordinates of a point on a Z-rotated box, for billboard text lookup
fn obbLocal(p : vec3f, ctr : vec3f, ca : f32, sa : f32) -> vec3f {
  let d = p - ctr;
  return vec3f(d.x * ca + d.y * sa, -d.x * sa + d.y * ca, d.z);
}

// Deterministic canopy geometry for the tree in cell (cx, cy): the grid only
// stores that a tree is there, so its size and lean are derived from position.
// returns (centreX, centreY, centreZ, radius); trunk height is centreZ - r*0.6.
// The canopy clears eye height (1.55) so you walk under trees instead of
// standing inside one; overhang is bounded by TREE_REACH on the JS side.
fn treeParams(cx : i32, cy : i32) -> vec4f {
  let h = hash2(vec2f(f32(cx), f32(cy)));
  let radius = 1.05 + h.x * 0.45;
  let trunkH = 2.7 + h.y * 1.1;
  return vec4f(f32(cx) + 0.5, f32(cy) + 0.5, trunkH + radius * 0.55, radius);
}
fn trunkHeightOf(tp : vec4f) -> f32 { return tp.z - tp.w * 0.55; }
fn trunkRadiusOf(tp : vec4f) -> f32 { return 0.085 + tp.w * 0.055; }

// ray vs axis-aligned entity box; returns distance or -1
fn hitBox(ro : vec3f, rd : vec3f, lo : vec3f, hi : vec3f) -> f32 {
  let inv = 1.0 / rd;
  let t0 = (lo - ro) * inv;
  let t1 = (hi - ro) * inv;
  let tmin = min(t0, t1);
  let tmax = max(t0, t1);
  let a = max(max(tmin.x, tmin.y), tmin.z);
  let b = min(min(tmax.x, tmax.y), tmax.z);
  if (b < max(a, 0.0)) { return -1.0; }
  return select(a, 0.0, a < 0.0);
}

const P_LIGHT : u32 = 1u;
const P_BIN   : u32 = 2u;
const P_BOARD : u32 = 3u;

fn propAt(x : i32, y : i32) -> vec2u {
  let g = i32(U.gridSize);
  if (x < 0 || y < 0 || x >= g || y >= g) { return vec2u(0u, 0u); }
  let p = props[u32(y * g + x)];
  return vec2u(p & 0xffu, (p >> 8u) & 0xffu);   // kind, variant
}

// facing of a prop, quantised to the four cardinal directions
fn propFacing(variant : u32) -> vec2f {
  let q = variant & 3u;
  if (q == 0u) { return vec2f(1.0, 0.0); }
  if (q == 1u) { return vec2f(0.0, 1.0); }
  if (q == 2u) { return vec2f(-1.0, 0.0); }
  return vec2f(0.0, -1.0);
}

struct Obj {
  t        : f32,
  n        : vec3f,
  albedo   : vec3f,
  emissive : f32,
  canopy   : bool,
  tExit    : f32,
  alpha    : f32,
  ok       : bool,
};

// Every grid-anchored object in the neighbourhood of a cell. Trees and props
// overhang their own cell, so testing only the cell a ray is crossing would
// slice them off at the cell walls.
fn traceObjects(ro : vec3f, rd : vec3f, cx : i32, cy : i32,
                tLo : f32, tHi : f32) -> Obj {
  var o : Obj;
  o.ok = false; o.canopy = false; o.alpha = 1.0;
  o.emissive = 0.0; o.tExit = 0.0;
  var best = tHi;
  let reach = i32(U.treeReach);

  for (var oy = -reach; oy <= reach; oy = oy + 1) {
  for (var ox = -reach; ox <= reach; ox = ox + 1) {
    let tx = cx + ox;
    let ty = cy + oy;
    let cen = vec2f(f32(tx) + 0.5, f32(ty) + 0.5);

    // ---- trees ----
    if (isTree(cellAt(tx, ty).kind)) {
      let tp = treeParams(tx, ty);
      let tTrunk = hitCylinder(ro, rd, tp.xy, trunkRadiusOf(tp), 0.0,
                               trunkHeightOf(tp));
      if (tTrunk > tLo && tTrunk < best) {
        best = tTrunk;
        let hp = ro + rd * tTrunk;
        o.t = tTrunk;
        o.n = normalize(vec3f(hp.xy - tp.xy, 0.0));
        o.albedo = vec3f(0.30, 0.23, 0.17);
        o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
      }
      let sph = hitSphere(ro, rd, tp.xyz, tp.w);
      if (sph.y > tLo) {
        let tEnter = max(sph.x, tLo);
        if (tEnter < best) {
          let hp = ro + rd * tEnter;
          let dens = vnoise(hp * 2.6) * 0.75 + vnoise(hp * 6.5) * 0.25;
          let chord = max(sph.y - tEnter, 0.0);
          let a = 1.0 - exp(-chord * 1.35 * (0.35 + 1.3 * dens));
          if (a > 0.03) {
            best = tEnter;
            o.t = max(tEnter, 0.001);
            o.tExit = sph.y;
            o.n = normalize(normalize(hp - tp.xyz) +
              (vec3f(vnoise(hp * 5.1 + 11.0), vnoise(hp * 5.1 + 23.0),
                     vnoise(hp * 5.1 + 37.0)) - 0.5) * 0.55);
            o.albedo = vec3f(0.40, 0.60, 0.32);
            o.alpha = clamp(a, 0.0, 0.94);
            o.canopy = true; o.emissive = 0.0; o.ok = true;
          }
        }
      }
    }

    // ---- props ----
    let pr = propAt(tx, ty);
    if (pr.x == 0u) { continue; }
    let f = propFacing(pr.y);
    let ca = f.x;
    let sa = f.y;

    if (pr.x == P_LIGHT) {
      // pole, arm reaching over the kerb, and a lamp head
      let tPole = hitCylinder(ro, rd, cen, 0.055, 0.0, 3.15);
      if (tPole > tLo && tPole < best) {
        best = tPole;
        let hp = ro + rd * tPole;
        o.t = tPole;
        o.n = normalize(vec3f(hp.xy - cen, 0.0));
        o.albedo = vec3f(0.22, 0.23, 0.25);
        o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
      }
      let armC = vec3f(cen + f * 0.42, 3.18);
      let hArm = hitOBB(ro, rd, armC, vec3f(0.42, 0.045, 0.045), ca, sa);
      if (hArm.x > tLo && hArm.x < best) {
        best = hArm.x;
        o.t = hArm.x; o.n = hArm.yzw;
        o.albedo = vec3f(0.22, 0.23, 0.25);
        o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
      }
      let lampC = vec3f(cen + f * 0.80, 3.06);
      let hLamp = hitOBB(ro, rd, lampC, vec3f(0.20, 0.11, 0.07), ca, sa);
      if (hLamp.x > tLo && hLamp.x < best) {
        best = hLamp.x;
        o.t = hLamp.x; o.n = hLamp.yzw;
        o.albedo = vec3f(0.85, 0.84, 0.78);
        o.canopy = false; o.alpha = 1.0;
        o.emissive = select(0.0, 0.55, hLamp.w < -0.3); // glass underside
        o.ok = true;
      }
    } else if (pr.x == P_BIN) {
      let tBin = hitCylinder(ro, rd, cen, 0.23, 0.0, 0.62);
      if (tBin > tLo && tBin < best) {
        best = tBin;
        let hp = ro + rd * tBin;
        o.t = tBin;
        o.n = normalize(vec3f(hp.xy - cen, 0.0));
        o.albedo = vec3f(0.26, 0.28, 0.27);
        o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
      }
      let hLid = hitOBB(ro, rd, vec3f(cen, 0.655), vec3f(0.25, 0.25, 0.035),
                        1.0, 0.0);
      if (hLid.x > tLo && hLid.x < best) {
        best = hLid.x;
        o.t = hLid.x; o.n = hLid.yzw;
        o.albedo = vec3f(0.19, 0.20, 0.20);
        o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
      }
    } else if (pr.x == P_BOARD) {
      let per = vec2f(-f.y, f.x);              // along the panel's width
      for (var s = 0; s < 2; s = s + 1) {
        let side = select(-1.0, 1.0, s == 1);
        let postC = vec3f(cen + per * (side * 1.25), 1.55);
        let hPost = hitOBB(ro, rd, postC, vec3f(0.075, 0.075, 1.55), ca, sa);
        if (hPost.x > tLo && hPost.x < best) {
          best = hPost.x;
          o.t = hPost.x; o.n = hPost.yzw;
          o.albedo = vec3f(0.20, 0.21, 0.22);
          o.canopy = false; o.alpha = 1.0; o.emissive = 0.0; o.ok = true;
        }
      }
      let panelC = vec3f(cen, 4.05);
      let he = vec3f(1.55, 0.09, 1.05);
      let hP = hitOBB(ro, rd, panelC, he, ca, sa);
      if (hP.x > tLo && hP.x < best) {
        best = hP.x;
        o.t = hP.x; o.n = hP.yzw;
        o.canopy = false; o.alpha = 1.0;
        let lp = obbLocal(ro + rd * hP.x, panelC, ca, sa);
        if (abs(hP.z) > 0.5 || abs(hP.y) > 0.5) {
          // a face carrying artwork: sample the sign atlas
          let sign = f32(pr.y >> 2u);
          var u = lp.x / he.x * 0.5 + 0.5;
          if (dot(vec2f(hP.y, hP.z), f) > 0.0) { u = 1.0 - u; }
          let v = 0.5 - lp.z / he.z * 0.5;
          let texel = textureSampleLevel(signTex, signSamp,
            vec2f(clamp(u, 0.0, 1.0), (sign + clamp(v, 0.0, 1.0)) / U.signCount),
            0.0).r;
          o.albedo = mix(vec3f(0.10, 0.11, 0.13), vec3f(0.95, 0.93, 0.85), texel);
          o.emissive = texel * 0.35;
        } else {
          o.albedo = vec3f(0.17, 0.18, 0.19);   // frame edge
          o.emissive = 0.0;
        }
        o.ok = true;
      }
    }
  }
  }
  return o;
}

fn trace(ro : vec3f, rd : vec3f) -> Hit {
  var hit : Hit;
  hit.ok = false;
  hit.canopy = false;
  hit.tExit = 0.0;
  hit.alpha = 1.0;
  hit.emissive = 0.0;
  hit.t = U.maxDist;

  // --- height field: DDA in xy, z is linear in horizontal distance ---
  let hlen = length(rd.xy);
  if (hlen > 1e-5) {
    let rd2 = rd.xy / hlen;
    let zs = rd.z / hlen;            // dz per unit horizontal distance
    var mapX = i32(floor(ro.x));
    var mapY = i32(floor(ro.y));
    let dD = abs(1.0 / max(abs(rd2), vec2f(1e-9)));
    var sgn = vec2i(1, 1);
    var side = vec2f(0.0);
    if (rd2.x < 0.0) { sgn.x = -1; side.x = (ro.x - f32(mapX)) * dD.x; }
    else { side.x = (f32(mapX) + 1.0 - ro.x) * dD.x; }
    if (rd2.y < 0.0) { sgn.y = -1; side.y = (ro.y - f32(mapY)) * dD.y; }
    else { side.y = (f32(mapY) + 1.0 - ro.y) * dD.y; }

    var dEnter = 0.0;
    var axis = 0;
    let dGround = select(-1.0, -ro.z / zs, zs < -1e-6);  // horiz dist to z=0

    for (var i = 0; i < 768; i = i + 1) {
      let dExit = min(side.x, side.y);
      let c = cellAt(mapX, mapY);
      let zEnter = ro.z + zs * dEnter;

      if (isSolid(c.kind)) {
        if (zEnter < c.h && zEnter >= 0.0 && dEnter > 0.0) {
          // side face. DDA distances are horizontal; the ray parameter needs
          // them divided by the ray's horizontal length.
          hit.t = dEnter / hlen;
          var n = vec3f(0.0);
          if (axis == 0) { n.x = -f32(sgn.x); } else { n.y = -f32(sgn.y); }
          hit.n = n;
          hit.albedo = select(vec3f(0.80, 0.81, 0.83), vec3f(0.45, 0.75, 0.5),
                              c.kind == T_TREE);
          hit.ok = true;
          break;
        }
        if (zs < -1e-6) {
          // descending: may land on the roof inside this cell
          let dRoof = (c.h - ro.z) / zs;
          if (dRoof >= dEnter && dRoof <= dExit) {
            hit.t = dRoof / hlen;
            hit.n = vec3f(0.0, 0.0, 1.0);
            hit.albedo = select(vec3f(0.86, 0.87, 0.89), vec3f(0.5, 0.8, 0.55),
                                c.kind == T_TREE);
            hit.ok = true;
            break;
          }
        }
      } else {
        var found = false;
        if (c.nearObj) {
          let ob = traceObjects(ro, rd, mapX, mapY, dEnter / hlen, dExit / hlen);
          if (ob.ok) {
            hit.t = ob.t;
            hit.n = ob.n;
            hit.albedo = ob.albedo;
            hit.canopy = ob.canopy;
            hit.tExit = ob.tExit;
            hit.alpha = ob.alpha;
            hit.emissive = ob.emissive;
            hit.ok = true;
            found = true;
          }
        }
        if (found) { break; }

        if (dGround > 0.0 && dGround >= dEnter && dGround <= dExit) {
          hit.t = dGround / hlen;
          hit.n = vec3f(0.0, 0.0, 1.0);
          // a tree cell keeps whatever it was paved with underneath
          let g = select(c.kind, c.base, isTree(c.kind));
          var a = vec3f(0.55, 0.72, 0.45);            // grass
          if (g == T_ROAD) { a = vec3f(0.42, 0.43, 0.46); }
          if (g == T_WALK) { a = vec3f(0.68, 0.68, 0.70); }
          hit.albedo = a;
          hit.ok = true;
          break;
        }
      }

      if (dEnter > U.maxDist) { break; }
      if (zs > 0.0 && ro.z + zs * dEnter > U.maxHeight) { break; }

      dEnter = dExit;
      if (side.x < side.y) { side.x = side.x + dD.x; mapX = mapX + sgn.x; axis = 0; }
      else { side.y = side.y + dD.y; mapY = mapY + sgn.y; axis = 1; }
    }
  } else if (rd.z < 0.0) {
    // straight down
    hit.t = -ro.z / rd.z;
    hit.n = vec3f(0.0, 0.0, 1.0);
    let c = cellAt(i32(floor(ro.x)), i32(floor(ro.y)));
    hit.albedo = vec3f(0.5, 0.5, 0.52);
    hit.ok = true;
  }

  // --- entities: cars and pedestrians, assembled from oriented parts ---
  let n = i32(U.entCount);
  for (var i = 0; i < n; i = i + 1) {
    let e0 = ents[i * 2];
    let e1 = ents[i * 2 + 1];
    let pos = e0.xy;
    let ca = cos(e0.z);
    let sa = sin(e0.z);
    let fwd2 = vec2f(ca, sa);
    let side2 = vec2f(-sa, ca);

    if (e0.w < 0.5) {
      // car: body, glasshouse set back, four wheels
      let L = e1.x;
      let W = e1.y;
      let hB = hitOBB(ro, rd, vec3f(pos, 0.52), vec3f(L, W, 0.22), ca, sa);
      if (hB.x > 0.0 && hB.x < hit.t) {
        hit.t = hB.x; hit.n = hB.yzw;
        hit.albedo = vec3f(0.28 + e1.w * 0.5);
        hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
      }
      let hC = hitOBB(ro, rd, vec3f(pos - fwd2 * (L * 0.12), 0.86),
                      vec3f(L * 0.46, W * 0.86, 0.20), ca, sa);
      if (hC.x > 0.0 && hC.x < hit.t) {
        hit.t = hC.x; hit.n = hC.yzw;
        hit.albedo = vec3f(0.15, 0.17, 0.20);
        hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
      }
      for (var w = 0; w < 4; w = w + 1) {
        let fx = select(-0.62, 0.62, (w & 1) == 1);
        let fy = select(-1.0, 1.0, (w & 2) == 2);
        let off = fwd2 * (L * fx) + side2 * (W * fy);
        let hW = hitOBB(ro, rd, vec3f(pos + off, 0.18),
                        vec3f(0.18, 0.055, 0.18), ca, sa);
        if (hW.x > 0.0 && hW.x < hit.t) {
          hit.t = hW.x; hit.n = hW.yzw;
          hit.albedo = vec3f(0.08, 0.08, 0.09);
          hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
        }
      }
    } else {
      // pedestrian: head, torso, two legs swinging out of phase
      let hgt = e1.z;
      let swing = sin(U.time * 5.0 + e1.w * 6.283) * 0.15;
      let headC = vec3f(pos, hgt - 0.13);
      let hd = hitSphere(ro, rd, headC, 0.125);
      if (hd.x > 0.001 && hd.x < hit.t) {
        hit.t = hd.x;
        hit.n = normalize(ro + rd * hd.x - headC);
        hit.albedo = vec3f(0.60, 0.53, 0.46);
        hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
      }
      let hT = hitOBB(ro, rd, vec3f(pos, hgt * 0.63),
                      vec3f(0.115, 0.16, hgt * 0.20), ca, sa);
      if (hT.x > 0.0 && hT.x < hit.t) {
        hit.t = hT.x; hit.n = hT.yzw;
        hit.albedo = vec3f(0.26 + e1.w * 0.34, 0.30, 0.38);
        hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
      }
      for (var l = 0; l < 2; l = l + 1) {
        let sd = select(-1.0, 1.0, l == 1);
        let off = side2 * (0.072 * sd) + fwd2 * (swing * sd);
        let hL = hitOBB(ro, rd, vec3f(pos + off, hgt * 0.22),
                        vec3f(0.058, 0.058, hgt * 0.22), ca, sa);
        if (hL.x > 0.0 && hL.x < hit.t) {
          hit.t = hL.x; hit.n = hL.yzw;
          hit.albedo = vec3f(0.19, 0.20, 0.24);
          hit.canopy = false; hit.alpha = 1.0; hit.emissive = 0.0; hit.ok = true;
        }
      }
    }
  }
  return hit;
}

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let px = vec2i(gid.xy);
  if (px.x >= i32(U.res.x) || px.y >= i32(U.res.y)) { return; }

  // true 3D ray: camera basis is genuinely rotated, giving vertical convergence
  let ndc = vec2f(
    (f32(px.x) + 0.5) / U.res.x * 2.0 - 1.0,
    1.0 - (f32(px.y) + 0.5) / U.res.y * 2.0);
  let rd = normalize(U.fwd + U.right * (ndc.x * U.tanX) + U.up * (ndc.y * U.tanY));
  let ro = vec3f(U.camPos, U.eye);

  var col = vec3f(0.0);
  var throughput = 1.0;
  var org = ro;

  // Composite through up to four semi-transparent canopies before giving up.
  for (var bounce = 0; bounce < 4; bounce = bounce + 1) {
  let h = trace(org, rd);

  if (!h.ok) {
    col = col + throughput * shadeSky(rd);
    break;
  } else {
    let p = org + rd * h.t + h.n * 0.015;
    let seed = vec2f(px) + vec2f(0.37, 0.11);
    let sun = softShadow(p, seed);
    let ao = tracedAO(p, h.n, seed);
    // foliage is lit from both sides: light scatters through the canopy
    let ndl = select(max(dot(h.n, U.sunDir), 0.0),
                     mix(abs(dot(h.n, U.sunDir)), 1.0, 0.35), h.canopy);

    // ambient is sky light: blue, weak, and gated by how much sky is visible
    let skyAmt = mix(0.55, 1.0, h.n.z * 0.5 + 0.5) * ao;
    var lit = h.albedo * U.ambCol * (U.ambI * skyAmt);
    // direct sunlight: warm, strong, the only light that casts
    lit = lit + h.albedo * U.sunCol *
          (U.sunI * ndl * mix(U.shadowK, 1.0, sun));
    // self-lit surfaces (lamp glass, backlit signage) ignore shadowing
    lit = lit + h.albedo * U.sunCol * h.emissive;

    // tight, strong highlight: a broad soft one reads as overcast light
    if (sun > 0.0 && !h.canopy) {
      let r = reflect(-U.sunDir, h.n);
      let spec = pow(max(dot(r, -rd), 0.0), 48.0);
      lit = lit + U.sunCol * spec * 0.75 * sun;
    }

    // aerial perspective toward the horizon sky colour
    let dTotal = h.t + (length(org - ro));
    let fog = clamp(dTotal / U.maxDist, 0.0, 1.0);
    let shaded = mix(lit, shadeSky(rd) * 1.02, pow(fog, 1.5));

    if (h.canopy) {
      // composite the canopy over whatever lies behind it, then resume
      col = col + throughput * h.alpha * shaded;
      throughput = throughput * (1.0 - h.alpha);
      if (throughput < 0.02) { break; }
      org = org + rd * (h.tExit + 0.01);
      continue;
    }
    col = col + throughput * shaded;
    break;
  }
  }

  let lum = clamp(dot(col, vec3f(0.30, 0.59, 0.11)), 0.0, 1.0);
  textureStore(outTex, px, vec4f(col, lum));
}
`;

const WGSL_RENDER = /* wgsl */`
struct VSOut {
  @builtin(position) pos : vec4f,
  @location(0) uv : vec2f,
};

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VSOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  var o : VSOut;
  o.pos = vec4f(p[vi], 0.0, 1.0);
  o.uv = vec2f((p[vi].x + 1.0) * 0.5, (1.0 - p[vi].y) * 0.5);
  return o;
}

// all scalars after the vec2: a vec3 here would align to 16 and silently
// grow the struct to 48 bytes
struct RParams {
  gridRes : vec2f,   // 0
  levels  : f32,     // 8
  mono    : f32,     // 12
  raw     : f32,     // 16
  black   : f32,     // 20
  white   : f32,     // 24
  gamma   : f32,     // 28
};                   // size 32

@group(0) @binding(0) var lowTex : texture_2d<f32>;
@group(0) @binding(1) var atlas  : texture_2d<f32>;
@group(0) @binding(2) var samp   : sampler;
@group(0) @binding(3) var<uniform> R : RParams;

// 4x4 ordered dither. Choosing a glyph quantises brightness to the ramp's
// step count, which shows as banding across smooth gradients; offsetting by
// under one step turns each band edge into a stipple instead.
fn bayer4(p : vec2i) -> f32 {
  var m = array<f32, 16>(
     0.0,  8.0,  2.0, 10.0,
    12.0,  4.0, 14.0,  6.0,
     3.0, 11.0,  1.0,  9.0,
    15.0,  7.0, 13.0,  5.0);
  let i = (p.y & 3) * 4 + (p.x & 3);
  return m[i] / 16.0 - 0.5;
}

@fragment
fn fs(in : VSOut) -> @location(0) vec4f {
  let cellF = in.uv * R.gridRes;
  let cell = clamp(floor(cellF), vec2f(0.0), R.gridRes - vec2f(1.0));
  let inCell = fract(cellF);

  let texel = textureLoad(lowTex, vec2i(cell), 0);
  let lum = texel.a;

  // debug: the shaded raymarch output as-is, no glyph mapping
  if (R.raw > 0.5) {
    var c = texel.rgb;
    if (R.mono > 0.5) { c = vec3f(lum); }
    return vec4f(c, 1.0);
  }

  // Tone curve first: without it the sky sits at the very top of the ramp,
  // where an ASCII-only set has almost no steps left, and bands.
  let tone = pow(clamp((lum - R.black) / max(R.white - R.black, 1e-3),
                       0.0, 1.0), R.gamma);

  // glyph chosen by tone, dithered by just under one ramp step
  let dith = bayer4(vec2i(cell)) / R.levels;
  let gi = floor(clamp(tone + dith, 0.0, 0.9999) * R.levels);
  let au = (gi + inCell.x) / R.levels;
  let cov = textureSample(atlas, samp, vec2f(au, inCell.y)).r;

  // Glyph density already encodes brightness — the glyph was picked by
  // luminance. Tinting by luminance as well would apply it twice and squash
  // the tonal range, so ink goes down at full intensity and only carries hue.
  // Normalise by the brightest channel, not by luminance: dividing a deep
  // blue by its (low) luminance overshoots and clamps the hue away, while
  // this keeps the colour and lets glyph density carry the brightness.
  var ink = vec3f(1.0);
  if (R.mono < 0.5) {
    let m = max(max(texel.r, texel.g), max(texel.b, 0.001));
    ink = texel.rgb / m;
  }
  return vec4f(clamp(ink, vec3f(0.0), vec3f(1.0)) * cov, 1.0);
}
`;
</script>
<script>
// ---- js/webgpu/gpu-renderer.js ----
// WebGPU renderer: per-pixel 3D raymarch in a compute shader, then a
// glyph-mapped upscale. This is the only renderer.
const GPURenderer = {
  ok: false, device: null, ctx: null,
  cols: 0, rows: 0, cellPx: 10,
  reason: '',

  async init() {
    const canvas = document.getElementById('screen');
    if (!navigator.gpu) { this.reason = 'this browser has no WebGPU support'; return false; }
    let adapter, device;
    try {
      adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { this.reason = 'no GPU adapter available'; return false; }
      device = await adapter.requestDevice();
    } catch (e) { this.reason = 'device request failed: ' + e.message; return false; }

    this.device = device;
    this.ctx = canvas.getContext('webgpu');
    if (!this.ctx) { this.reason = 'could not get a webgpu canvas context'; return false; }
    this.format = navigator.gpu.getPreferredCanvasFormat();
    device.lost.then(info => {
      this.ok = false;
      console.error('[WebGPU] device lost: ' + info.message);
    });

    this.resize();
    this.ctx.configure({ device, format: this.format, alphaMode: 'opaque' });

    // world cells: type | height<<8 | ao<<16
    this.uploadWorld();

    // two vec4 per entity: (x, y, heading, kind), (halfLen, halfWid, height, phase)
    this.entCount = Entities.cars.length + Entities.peds.length;
    this.entData = new Float32Array(Math.max(this.entCount, 1) * 8);
    this.entBuf = device.createBuffer({
      size: this.entData.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });

    // billboard signage
    const signs = SignAtlas.build();
    this.signCount = signs.count;
    this.signTex = device.createTexture({
      size: [signs.canvas.width, signs.canvas.height],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST |
             GPUTextureUsage.RENDER_ATTACHMENT,
    });
    device.queue.copyExternalImageToTexture(
      { source: signs.canvas }, { texture: this.signTex },
      [signs.canvas.width, signs.canvas.height]);
    this.signSamp = device.createSampler({
      magFilter: 'linear', minFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge',
    });

    this.buildAtlas(CFG.GLYPH_SET);

    this.sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
    this.uniBuf = device.createBuffer({
      size: 192, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.rparBuf = device.createBuffer({
      size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    device.pushErrorScope('validation');
    const cmod = device.createShaderModule({ code: WGSL_COMPUTE });
    const rmod = device.createShaderModule({ code: WGSL_RENDER });
    if (!await this.checkShader(cmod, 'compute')) return false;
    if (!await this.checkShader(rmod, 'render')) return false;

    this.computePipe = device.createComputePipeline({
      layout: 'auto', compute: { module: cmod, entryPoint: 'main' } });
    this.renderPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: rmod, entryPoint: 'vs' },
      fragment: { module: rmod, entryPoint: 'fs', targets: [{ format: this.format }] },
      primitive: { topology: 'triangle-list' },
    });

    this.allocTargets();

    const err = await device.popErrorScope();
    if (err) {
      this.reason = 'pipeline validation: ' + err.message;
      console.error('[WebGPU] ' + this.reason);
      return false;
    }
    this.ok = true;
    return true;
  },

  // (Re)build the glyph atlas texture. Safe to call at runtime; the render
  // bind group is recreated because the texture object changes.
  buildAtlas(setName) {
    const atlas = GlyphAtlas.build(setName);
    this.levels = atlas.levels;
    this.rampChars = atlas.chars;
    if (this.atlasTex) this.atlasTex.destroy();
    this.atlasTex = this.device.createTexture({
      size: [atlas.canvas.width, atlas.canvas.height],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST |
             GPUTextureUsage.RENDER_ATTACHMENT,
    });
    this.device.queue.copyExternalImageToTexture(
      { source: atlas.canvas }, { texture: this.atlasTex },
      [atlas.canvas.width, atlas.canvas.height]);
    if (this.renderPipe) this.allocTargets();
    return atlas;
  },

  setGlyphSet(name) {
    CFG.GLYPH_SET = name;
    this.buildAtlas(name);
    return { set: name, levels: this.levels, chars: this.rampChars };
  },

  uploadWorld() {
    const N = CFG.WORLD * CFG.WORLD;
    // type | height<<8 | baseGround<<16 | treeNearby<<24.
    // Canopies overhang their own cell, so a ray must test trees in a
    // neighbourhood; the flag marks where that search is worth doing.
    const W = CFG.WORLD, R = CFG.TREE_REACH;
    const packed = new Uint32Array(N);
    for (let i = 0; i < N; i++) {
      packed[i] = (World.type[i] & 0xff) |
                  ((Math.min(World.height[i], 255) & 0xff) << 8) |
                  ((World.base[i] & 0xff) << 16);
    }
    // flag cells whose neighbourhood holds a tree or a prop, so rays only pay
    // for the object search where something can actually be hit
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (World.type[i] !== T_TREE && !World.prop[i]) continue;
      const y0 = Math.max(0, y - R), y1 = Math.min(W - 1, y + R);
      const x0 = Math.max(0, x - R), x1 = Math.min(W - 1, x + R);
      for (let ny = y0; ny <= y1; ny++)
        for (let nx = x0; nx <= x1; nx++) packed[ny * W + nx] |= (1 << 24);
    }
    this.cellBuf = this.device.createBuffer({
      size: packed.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    this.device.queue.writeBuffer(this.cellBuf, 0, packed);

    this.propBuf = this.device.createBuffer({
      size: World.prop.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    this.device.queue.writeBuffer(this.propBuf, 0, World.prop);
  },

  async checkShader(mod, label) {
    if (!mod.getCompilationInfo) return true;
    const info = await mod.getCompilationInfo();
    const errors = info.messages.filter(m => m.type === 'error');
    for (const m of info.messages) {
      const where = `${label}.wgsl:${m.lineNum}:${m.linePos}`;
      if (m.type === 'error') console.error(`[WGSL ${where}] ${m.message}`);
      else console.warn(`[WGSL ${where}] ${m.message}`);
    }
    if (errors.length) {
      this.reason = `${label} shader failed to compile (see console)`;
      return false;
    }
    return true;
  },

  resize() {
    const canvas = document.getElementById('screen');
    const dpr = 1; // glyph cells are the pixels that matter here
    canvas.width = Math.max(320, Math.floor(innerWidth * dpr));
    canvas.height = Math.max(240, Math.floor(innerHeight * dpr));
    this.cols = Math.max(40, Math.floor(canvas.width / this.cellPx));
    this.rows = Math.max(24, Math.floor(canvas.height / this.cellPx));
  },

  allocTargets() {
    if (this.lowTex) this.lowTex.destroy();
    this.lowTex = this.device.createTexture({
      size: [this.cols, this.rows],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING |
             GPUTextureUsage.COPY_SRC,
    });
    this.computeBind = this.device.createBindGroup({
      layout: this.computePipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: this.uniBuf } },
        { binding: 1, resource: { buffer: this.cellBuf } },
        { binding: 2, resource: this.lowTex.createView() },
        { binding: 3, resource: { buffer: this.entBuf } },
        { binding: 4, resource: { buffer: this.propBuf } },
        { binding: 5, resource: this.signTex.createView() },
        { binding: 6, resource: this.signSamp },
      ],
    });
    this.renderBind = this.device.createBindGroup({
      layout: this.renderPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: this.lowTex.createView() },
        { binding: 1, resource: this.atlasTex.createView() },
        { binding: 2, resource: this.sampler },
        { binding: 3, resource: { buffer: this.rparBuf } },
      ],
    });
  },

  handleResize() {
    const oc = this.cols, or = this.rows;
    this.resize();
    if (this.ok && (this.cols !== oc || this.rows !== or)) this.allocTargets();
  },

  render() {
    if (!this.ok) return;
    const dev = this.device;

    // --- camera basis, genuinely rotated by pitch (true 3-point perspective) ---
    const a = Player.angle, p = Player.pitch;
    const cp = Math.cos(p), sp = Math.sin(p);
    const fwd = [Math.cos(a) * cp, Math.sin(a) * cp, sp];
    const right = [-Math.sin(a), Math.cos(a), 0];
    // up = fwd x right  (the other order points down and flips the image)
    const up = [
      fwd[1] * right[2] - fwd[2] * right[1],
      fwd[2] * right[0] - fwd[0] * right[2],
      fwd[0] * right[1] - fwd[1] * right[0],
    ];
    const sx = Math.cos(CFG.SUN_AZ), sy = Math.sin(CFG.SUN_AZ), sz = Math.tan(CFG.SUN_EL);
    const il = 1 / Math.hypot(sx, sy, sz);
    const tanX = CFG.PLANE_LEN;
    const tanY = tanX * (this.rows / this.cols);

    const u = new Float32Array(48);
    u[0] = Player.x;  u[1] = Player.y;
    u[2] = this.cols; u[3] = this.rows;
    u[4] = fwd[0]; u[5] = fwd[1]; u[6] = fwd[2];   u[7] = CFG.EYE;
    u[8] = right[0]; u[9] = right[1]; u[10] = right[2]; u[11] = CFG.MAX_DIST;
    u[12] = up[0]; u[13] = up[1]; u[14] = up[2];   u[15] = CFG.WORLD;
    u[16] = sx * il; u[17] = sy * il; u[18] = sz * il; u[19] = CFG.SHADOW;
    u[20] = tanX; u[21] = tanY; u[22] = Light.maxH || 32; u[23] = this.entCount;
    u[24] = CFG.SUN_ANGLE; u[25] = CFG.SUN_SAMPLES;
    u[26] = CFG.AO_SAMPLES; u[27] = CFG.AO_RADIUS;
    u[28] = CFG.TREE_REACH;
    u[29] = this.signCount;
    u[30] = (performance.now() / 1000) % 3600;
    u.set(CFG.SUN_COL, 32);      u[35] = CFG.SUN_I;
    u.set(CFG.AMB_COL, 36);      u[39] = CFG.AMB_I;
    u.set(CFG.SKY_HORIZON, 40);
    u.set(CFG.SKY_ZENITH, 44);
    dev.queue.writeBuffer(this.uniBuf, 0, u);
    dev.queue.writeBuffer(this.rparBuf, 0, new Float32Array([
      this.cols, this.rows, this.levels, CFG.MONO ? 1 : 0,
      CFG.RAW ? 1 : 0, CFG.TONE_BLACK, CFG.TONE_WHITE, CFG.TONE_GAMMA]));

    // --- entities: position, heading, and per-instance dimensions ---
    let k = 0;
    for (const c of Entities.cars) {
      this.entData[k++] = c.x; this.entData[k++] = c.y;
      this.entData[k++] = Math.atan2(c.dy, c.dx); this.entData[k++] = 0; // car
      this.entData[k++] = 0.46; this.entData[k++] = 0.24;
      this.entData[k++] = 0.0;  this.entData[k++] = (c.col % 5) / 5;
    }
    for (const pd of Entities.peds) {
      const dx = pd.tx - pd.x, dy = pd.ty - pd.y;
      const ang = (dx * dx + dy * dy) > 1e-6 ? Math.atan2(dy, dx) : 0;
      this.entData[k++] = pd.x; this.entData[k++] = pd.y;
      this.entData[k++] = ang;  this.entData[k++] = 1; // pedestrian
      this.entData[k++] = 0.0;  this.entData[k++] = 0.0;
      this.entData[k++] = 1.55 + pd.shade * 0.25;
      this.entData[k++] = pd.shade;
    }
    dev.queue.writeBuffer(this.entBuf, 0, this.entData);

    const enc = dev.createCommandEncoder();
    const cpass = enc.beginComputePass();
    cpass.setPipeline(this.computePipe);
    cpass.setBindGroup(0, this.computeBind);
    cpass.dispatchWorkgroups(Math.ceil(this.cols / 8), Math.ceil(this.rows / 8));
    cpass.end();

    const rp = enc.beginRenderPass({
      colorAttachments: [{
        view: this.ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: 'clear', storeOp: 'store',
      }],
    });
    rp.setPipeline(this.renderPipe);
    rp.setBindGroup(0, this.renderBind);
    rp.draw(3);
    rp.end();
    dev.queue.submit([enc.finish()]);

    const probe = this.frameNo === undefined ? (this.frameNo = 0) : ++this.frameNo;
    if (probe < 3) {
      dev.pushErrorScope('validation');
      dev.popErrorScope().then(err => {
        if (err) console.error('[WebGPU] frame error: ' + err.message);
      });
    }
  },

  // Dumps the compute output so a black screen can be attributed to either
  // the raymarch (all zeros) or the glyph upscale (non-zero here).
  async debugReadback() {
    if (!this.ok) return 'GPU renderer inactive: ' + (this.reason || 'n/a');
    const bpr = Math.ceil(this.cols * 4 / 256) * 256;
    const buf = this.device.createBuffer({
      size: bpr * this.rows,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = this.device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: this.lowTex },
      { buffer: buf, bytesPerRow: bpr }, [this.cols, this.rows]);
    this.device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const d = new Uint8Array(buf.getMappedRange());
    let nonZero = 0, maxV = 0, sum = 0;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++) {
      const v = d[y * bpr + x * 4 + 3];
      if (v > 0) nonZero++;
      if (v > maxV) maxV = v;
      sum += v;
    }
    const total = this.cols * this.rows;
    buf.unmap(); buf.destroy();
    return { cols: this.cols, rows: this.rows, litCells: nonZero, total,
             maxLum: maxV, avgLum: +(sum / total).toFixed(1) };
  },
};
</script>
<script>
// ---- js/main.js ----
// Bootstrap + frame loop. WebGPU is the only renderer; without it there is
// nothing to fall back on, so say so plainly instead of showing black.
(async function () {
  World.generate(CFG.SEED);
  World.placeProps(CFG.SEED);
  Light.bake();
  Entities.init(CFG.SEED);
  Player.init();

  let ready = false;
  try { ready = await GPURenderer.init(); }
  catch (e) { GPURenderer.reason = e.message; }

  if (!ready) {
    document.getElementById('screen').hidden = true;
    const msg = document.createElement('div');
    msg.id = 'fail';
    msg.innerHTML = '<h1>WebGPU required</h1><p>' +
      (GPURenderer.reason || 'unknown error') + '</p>' +
      '<p>This renderer runs entirely on the GPU. Try a current Chrome, Edge, ' +
      'Firefox or Safari on a machine with a working GPU driver.</p>';
    document.body.appendChild(msg);
    console.error('[ASCII City] ' + GPURenderer.reason);
    return;
  }

  addEventListener('resize', () => GPURenderer.handleResize());

  let last = performance.now();
  let fpsAcc = 0, fpsN = 0;
  const fpsEl = document.getElementById('fps');

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    Player.update(dt);
    Entities.update(dt, now / 1000);
    GPURenderer.render();

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) {
      fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' fps · ' +
        GPURenderer.cols + '×' + GPURenderer.rows;
      fpsAcc = 0; fpsN = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
