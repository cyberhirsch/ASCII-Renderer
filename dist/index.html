<div id="fps"></div>
<script>
// ---- js/config.js ----
// Global configuration. Plain script, shared global scope (inlined at build time).
const CFG = {
  PLANE_LEN: 0.85,    // tan(horizontal half-FOV)
  MAX_DIST: 60,       // ray cutoff (world cells)
  EYE: 1.55,          // camera height above ground
  WORLD: 192,         // world grid size (cells per side)
  CITY: 96,           // city core size, centered; the rest is open ground
  SEED: 20260815,
  CAR_COUNT: 42,
  PED_COUNT: 70,
  // rendering
  MONO: true,         // uniform grayscale (M toggles)
  RAW: false,         // debug: show the shaded image without glyph mapping (X)
  SUN_AZ: 0.9,        // sun azimuth (rad)
  SUN_EL: 0.7,        // sun elevation (rad) — low enough for long, readable shadows
  SHADOW: 0.18,       // sun contribution inside full shadow (sky light only)
  SUN_ANGLE: 0.05,    // angular radius of the sun disc -> penumbra softness
  SUN_SAMPLES: 6,     // shadow rays per pixel
  AO_SAMPLES: 10,     // hemisphere rays per pixel
  AO_RADIUS: 9,       // AO ray length, in world cells
};

// Cell types
const T_GRASS = 0, T_ROAD = 1, T_WALK = 2, T_BLDG = 3, T_TREE = 4;
// Cell flags
const F_LANE = 1, F_ROAD_V = 2, F_ROAD_H = 4;
</script>
<script>
// ---- js/util.js ----
// Seeded RNG + hashing helpers.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Fast integer hash -> [0,1). Deterministic per (x,y,z) triple.
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
</script>
<script>
// ---- js/world.js ----
// Procedural city: road lattice, sidewalks, building footprints, plazas, trees.
const World = {
  type: null, height: null, flags: null, bcol: null, bseed: null,
  roadX: [], roadY: [],

  idx(x, y) { return y * CFG.WORLD + x; },

  inBounds(x, y) { return x >= 0 && y >= 0 && x < CFG.WORLD && y < CFG.WORLD; },

  cellType(x, y) {
    if (!this.inBounds(x, y)) return T_BLDG; // world edge is solid
    return this.type[this.idx(x, y)];
  },

  isSolid(x, y) {
    const t = this.cellType(x, y);
    return t === T_BLDG || t === T_TREE;
  },

  generate(seed) {
    const W = CFG.WORLD, rng = mulberry32(seed);
    const N = W * W;
    this.type = new Uint8Array(N);
    this.height = new Uint8Array(N);
    this.flags = new Uint8Array(N);
    this.bcol = new Uint8Array(N);
    this.bseed = new Uint8Array(N);

    // City core is centered; everything outside stays open ground
    const c0 = (W - CFG.CITY) >> 1, c1 = c0 + CFG.CITY;
    this.cityMin = c0; this.cityMax = c1;

    // Road lines (3 cells wide, center cell carries lane dashes)
    this.roadX = []; this.roadY = [];
    let p = c0 + 4 + ((rng() * 4) | 0);
    while (p < c1 - 6) { this.roadX.push(p); p += 9 + ((rng() * 8) | 0); }
    p = c0 + 4 + ((rng() * 4) | 0);
    while (p < c1 - 6) { this.roadY.push(p); p += 9 + ((rng() * 8) | 0); }

    for (const cx of this.roadX) {
      for (let y = c0; y < c1; y++) {
        for (let dx = -1; dx <= 1; dx++) {
          const i = this.idx(cx + dx, y);
          this.type[i] = T_ROAD;
          this.flags[i] |= F_ROAD_V;
          if (dx === 0 && (y % 4) < 2) this.flags[i] |= F_LANE;
        }
      }
    }
    for (const cy of this.roadY) {
      for (let x = c0; x < c1; x++) {
        for (let dy = -1; dy <= 1; dy++) {
          const i = this.idx(x, cy + dy);
          this.type[i] = T_ROAD;
          this.flags[i] |= F_ROAD_H;
          if (dy === 0 && (x % 4) < 2) this.flags[i] |= F_LANE;
          else if (dy === 0) this.flags[i] &= ~F_LANE; // intersections: H wins, no double dashes
        }
      }
    }

    // Sidewalks: ring around roads
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      if (this.type[this.idx(x, y)] !== 0) continue;
      let nearRoad = false;
      for (let dy = -1; dy <= 1 && !nearRoad; dy++)
        for (let dx = -1; dx <= 1; dx++)
          if (this.inBounds(x + dx, y + dy) && this.type[this.idx(x + dx, y + dy)] === T_ROAD) { nearRoad = true; break; }
      if (nearRoad) this.type[this.idx(x, y)] = T_WALK;
    }

    // Block interiors: buildings on a 3x3 footprint grid, some plazas with trees.
    // Outside the city core: open plains with scattered trees.
    for (let y = 0; y < W; y++) for (let x = 0; x < W; x++) {
      const i = this.idx(x, y);
      if (this.type[i] !== T_GRASS) continue;
      if (x < c0 || y < c0 || x >= c1 || y >= c1) {
        if (hash3(x, y, seed ^ 0x7777) < 0.015) {
          this.type[i] = T_TREE;
          this.height[i] = 2 + ((hash3(x, y, seed ^ 0x78) * 2) | 0);
        }
        continue;
      }
      const fx = (x / 3) | 0, fy = (y / 3) | 0;
      const hzone = hash3(fx, fy, seed);
      if (hzone < 0.16) {
        // plaza: grass, scattered trees
        if (hash3(x, y, seed ^ 0x5111) < 0.18) {
          this.type[i] = T_TREE;
          this.height[i] = 2 + ((hash3(x, y, seed ^ 0x77) * 2) | 0);
        }
        continue;
      }
      this.type[i] = T_BLDG;
      const tall = hash3(fx, fy, seed ^ 0x9e37) < 0.13;
      this.height[i] = tall
        ? 12 + ((hash3(fx, fy, seed ^ 0xabc) * 15) | 0)
        : 3 + ((hash3(fx, fy, seed ^ 0xdef) * 6) | 0);
      this.bcol[i] = (hash3(fx, fy, seed ^ 0x321) * 5) | 0;
      this.bseed[i] = (hash3(fx, fy, seed ^ 0x654) * 255) | 0;
    }

    // Street trees: sparse, on sidewalk cells not directly beside a lane crossing
    for (let y = 1; y < W - 1; y++) for (let x = 1; x < W - 1; x++) {
      const i = this.idx(x, y);
      if (this.type[i] === T_WALK && hash3(x, y, seed ^ 0x1234) < 0.045) {
        this.type[i] = T_TREE;
        this.height[i] = 2 + ((hash3(x, y, seed ^ 0x88) * 2) | 0);
      }
    }
  },

  // A road intersection near the world center, for player spawn
  findSpawn() {
    const cx = CFG.WORLD / 2;
    let best = null, bestD = 1e9;
    for (const rx of this.roadX) for (const ry of this.roadY) {
      const d = (rx - cx) * (rx - cx) + (ry - cx) * (ry - cx);
      if (d < bestD) { bestD = d; best = [rx + 0.5, ry + 0.5]; }
    }
    return best || [cx, cx];
  },
};
</script>
<script>
// ---- js/light.js ----
// Sun direction and world bounds for the GPU renderer. Shadows and ambient
// occlusion are both traced per pixel in the compute shader, so nothing is
// baked here any more — this only supplies the height bound that lets a
// shadow ray stop once it has climbed clear of all geometry.
const Light = {
  sunX: 0, sunY: 0, tanEl: 0, maxH: 0,

  bake() {
    this.sunX = Math.cos(CFG.SUN_AZ);
    this.sunY = Math.sin(CFG.SUN_AZ);
    this.tanEl = Math.tan(CFG.SUN_EL);
    this.maxH = 0;
    for (let i = 0; i < World.height.length; i++) {
      if (World.height[i] > this.maxH) this.maxH = World.height[i];
    }
  },
};
</script>
<script>
// ---- js/entities.js ----
// Ambient traffic: cars follow the road lattice, pedestrians wander sidewalks.
const Entities = {
  cars: [], peds: [],

  init(seed) {
    const rng = mulberry32(seed ^ 0xC0FFEE);
    this.cars = []; this.peds = [];

    const roadCells = [], walkCells = [];
    for (let y = 0; y < CFG.WORLD; y++) for (let x = 0; x < CFG.WORLD; x++) {
      const t = World.type[World.idx(x, y)];
      if (t === T_ROAD) roadCells.push([x, y]);
      else if (t === T_WALK) walkCells.push([x, y]);
    }

    for (let i = 0; i < CFG.CAR_COUNT && roadCells.length; i++) {
      const [x, y] = roadCells[(rng() * roadCells.length) | 0];
      const f = World.flags[World.idx(x, y)];
      let dx = 0, dy = 0;
      if (f & F_ROAD_V) { dy = rng() < 0.5 ? 1 : -1; }
      else { dx = rng() < 0.5 ? 1 : -1; }
      this.cars.push({
        x: x + 0.5, y: y + 0.5, dx, dy,
        speed: 2.2 + rng() * 1.8,
        col: (rng() * 5) | 0,
      });
    }

    for (let i = 0; i < CFG.PED_COUNT && walkCells.length; i++) {
      const [x, y] = walkCells[(rng() * walkCells.length) | 0];
      this.peds.push({
        x: x + 0.5, y: y + 0.5, tx: x + 0.5, ty: y + 0.5,
        speed: 0.6 + rng() * 0.6,
        shade: 0.55 + rng() * 0.45,
      });
    }
  },

  update(dt, time) {
    for (const c of this.cars) {
      const nx = c.x + c.dx * c.speed * dt;
      const ny = c.y + c.dy * c.speed * dt;
      const cellAhead = World.cellType(
        Math.floor(nx + c.dx * 0.6), Math.floor(ny + c.dy * 0.6));
      if (cellAhead === T_ROAD) { c.x = nx; c.y = ny; }
      else {
        // pick a new road direction from the current cell
        const cx = Math.floor(c.x), cy = Math.floor(c.y);
        const opts = [];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          if (dx === -c.dx && dy === -c.dy) continue; // no U-turn unless stuck
          if (World.cellType(cx + dx * 2, cy + dy * 2) === T_ROAD) opts.push([dx, dy]);
        }
        if (opts.length === 0) { c.dx = -c.dx; c.dy = -c.dy; }
        else {
          const pick = opts[(hash3(cx, cy, (time * 997) | 0) * opts.length) | 0];
          c.dx = pick[0]; c.dy = pick[1];
          c.x = cx + 0.5; c.y = cy + 0.5;
        }
      }
    }

    for (const p of this.peds) {
      const ddx = p.tx - p.x, ddy = p.ty - p.y;
      const d = Math.hypot(ddx, ddy);
      if (d < 0.08) {
        // choose a new adjacent sidewalk cell
        const cx = Math.floor(p.x), cy = Math.floor(p.y);
        const opts = [];
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
          if (World.cellType(cx + dx, cy + dy) === T_WALK) opts.push([dx, dy]);
        if (opts.length) {
          const pick = opts[(hash3(cx, cy, ((time * 613) | 0) ^ 0x99) * opts.length) | 0];
          p.tx = cx + pick[0] + 0.5; p.ty = cy + pick[1] + 0.5;
        }
      } else {
        p.x += (ddx / d) * p.speed * dt;
        p.y += (ddy / d) * p.speed * dt;
      }
    }
  },
};
</script>
<script>
// ---- js/player.js ----
// First-person player: WASD move, arrows/mouse turn, collision vs solid cells.
const Player = {
  x: 0, y: 0, angle: 0.6,
  pitch: 0, // vertical look, radians; ±90° is straight up/down
  keys: {},

  init() {
    const [sx, sy] = World.findSpawn();
    this.x = sx; this.y = sy;

    addEventListener('keydown', e => {
      this.keys[e.code] = true;
      if (e.code === 'KeyM') CFG.MONO = !CFG.MONO;
      if (e.code === 'KeyX') CFG.RAW = !CFG.RAW;
      if (e.code === 'KeyF') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });

    const canvas = document.getElementById('screen');
    canvas.addEventListener('click', () => canvas.requestPointerLock());
    const locked = () => document.pointerLockElement === canvas;
    // browsers can fire one huge bogus movement delta when pointer lock
    // engages or the cursor re-syncs; skip the first events and clamp the rest
    let skipEvents = 0;
    document.addEventListener('pointerlockchange', () => { skipEvents = 2; });
    addEventListener('mousemove', e => {
      if (!locked()) return;
      if (skipEvents > 0) { skipEvents--; return; }
      const mx = clamp(e.movementX, -120, 120);
      const my = clamp(e.movementY, -120, 120);
      this.angle += mx * 0.0022;
      // real camera pitch. Full range: straight up to straight down. It stops
      // a hair short of the poles, where the camera basis would degenerate.
      const LIM = Math.PI / 2 - 0.001;
      this.pitch = clamp(this.pitch - my * 0.0022, -LIM, LIM);
    });
  },

  blocked(x, y) {
    const R = 0.22;
    for (const [ox, oy] of [[-R, -R], [R, -R], [-R, R], [R, R]])
      if (World.isSolid(Math.floor(x + ox), Math.floor(y + oy))) return true;
    return false;
  },

  update(dt) {
    const k = this.keys;
    const turn = 2.1 * dt;
    if (k['ArrowLeft']) this.angle -= turn;
    if (k['ArrowRight']) this.angle += turn;

    const run = (k['ShiftLeft'] || k['ShiftRight']) ? 2.0 : 1.0;
    const spd = 4.2 * run * dt;
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);

    let mx = 0, my = 0;
    if (k['KeyW'] || k['ArrowUp']) { mx += dx; my += dy; }
    if (k['KeyS'] || k['ArrowDown']) { mx -= dx; my -= dy; }
    if (k['KeyA']) { mx += dy; my -= dx; }
    if (k['KeyD']) { mx -= dy; my += dx; }

    const len = Math.hypot(mx, my);
    if (len > 0.001) {
      mx = mx / len * spd; my = my / len * spd;
      // axis-separated collision so we slide along walls
      if (!this.blocked(this.x + mx, this.y)) this.x += mx;
      if (!this.blocked(this.x, this.y + my)) this.y += my;
    }
  },
};
</script>
<script>
// ---- js/webgpu/atlas.js ----
// Procedural glyph atlas.
//
// Glyph order is measured, not guessed: every candidate is rendered and its
// ink coverage sampled, then the set is sorted by coverage and resampled so
// the ramp is close to linear in brightness. A hand-ordered ramp is uneven —
// the gaps show up as banding in smooth gradients.
const GlyphAtlas = {
  // text glyphs top out around 25% ink, which leaves the bright end of the
  // ramp flat; the block elements carry it the rest of the way to solid
  CANDIDATES: ' .\'`^",:;!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@' +
              '░▒▓█▖▗▘▝▚▞▌▐▀▄▁▂▃▅▆▇▉▊▋▌▍▎▏▙▛▜▟',
  CELL: 32,
  LEVELS: 24,

  measure(chars) {
    const S = 16;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.font = `bold ${S * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const out = [];
    for (const ch of chars) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff';
      ctx.fillText(ch, S / 2, S / 2 + 1);
      const d = ctx.getImageData(0, 0, S, S).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i];
      out.push({ ch, cov: sum / (S * S * 255) });
    }
    return out;
  },

  // pick LEVELS glyphs whose coverages are as evenly spaced as possible
  buildRamp() {
    const seen = new Set();
    const uniq = [];
    for (const g of this.measure(this.CANDIDATES)) {
      const key = g.cov.toFixed(4);
      if (seen.has(key)) continue;      // drop visually identical glyphs
      seen.add(key);
      uniq.push(g);
    }
    uniq.sort((a, b) => a.cov - b.cov);

    // Walk the sorted glyphs and take the first past each evenly spaced
    // threshold. Glyphs whose coverage is nearly identical look the same on
    // screen, so admitting them would spend ramp steps that show no change;
    // this keeps every step visually distinct and lets the count fall to
    // whatever the font can actually supply.
    const lo = uniq[0].cov, hi = uniq[uniq.length - 1].cov;
    const stepSize = (hi - lo) / (this.LEVELS - 1);
    const ramp = [];
    let next = lo;
    for (const g of uniq) {
      if (g.cov + 1e-9 >= next) {
        ramp.push(g);
        next = g.cov + stepSize;
      }
    }
    const last = uniq[uniq.length - 1];
    if (ramp[ramp.length - 1] !== last) ramp.push(last);
    return ramp;
  },

  build() {
    const ramp = this.buildRamp();
    this.ramp = ramp;
    const n = ramp.length;
    const cv = document.createElement('canvas');
    cv.width = this.CELL * n;
    cv.height = this.CELL;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${this.CELL * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(ramp[i].ch, i * this.CELL + this.CELL / 2, this.CELL / 2 + 1);
    }
    return { canvas: cv, levels: n, cell: this.CELL,
             chars: ramp.map(g => g.ch).join('') };
  },
};
</script>
<script>
// ---- js/webgpu/shaders.js ----
// WGSL sources.
//
// Pass 1 (compute): one invocation per low-res cell, each casting a TRUE 3D
// ray — the camera basis is genuinely rotated by pitch, so vertical world
// edges converge to a third vanishing point instead of staying parallel as
// they do in a column-raycaster with a sheared horizon. Rays march the height
// field (DDA in xy, linear in z), hit building sides, roofs, the ground, or
// entity boxes, then trace a real shadow ray toward the sun and shade.
//
// Pass 2 (render): a fullscreen triangle maps each low-res cell to a glyph
// chosen by luminance and upscales it.

const WGSL_COMPUTE = /* wgsl */`
struct Uniforms {
  camPos    : vec2f,
  res       : vec2f,
  fwd       : vec3f,
  eye       : f32,
  right     : vec3f,
  maxDist   : f32,
  up        : vec3f,
  gridSize  : f32,
  sunDir    : vec3f,
  shadowK   : f32,
  tanX      : f32,
  tanY      : f32,
  maxHeight : f32,
  entCount  : f32,
  sunAngle  : f32,   // angular radius of the sun disc -> penumbra width
  sunSamples: f32,
  aoSamples : f32,
  aoRadius  : f32,
};

@group(0) @binding(0) var<uniform> U : Uniforms;
@group(0) @binding(1) var<storage, read> cells : array<u32>;
@group(0) @binding(2) var outTex : texture_storage_2d<rgba8unorm, write>;
// each entity: xy = position, z = half width, w = height
@group(0) @binding(3) var<storage, read> ents : array<vec4f>;

const T_ROAD : u32 = 1u;
const T_WALK : u32 = 2u;
const T_BLDG : u32 = 3u;
const T_TREE : u32 = 4u;

struct Cell { kind : u32, h : f32 };

fn cellAt(x : i32, y : i32) -> Cell {
  let g = i32(U.gridSize);
  var c : Cell;
  if (x < 0 || y < 0 || x >= g || y >= g) {
    c.kind = 0u; c.h = 0.0;
    return c;
  }
  let p = cells[u32(y * g + x)];
  c.kind = p & 0xffu;
  c.h = f32((p >> 8u) & 0xffu);
  return c;
}

fn isSolid(k : u32) -> bool { return k == T_BLDG || k == T_TREE; }

fn hash2(p : vec2f) -> vec2f {
  let q = vec2f(dot(p, vec2f(127.1, 311.7)), dot(p, vec2f(269.5, 183.3)));
  return fract(sin(q) * 43758.5453);
}

// Exact height-field occlusion test: walks cell boundaries with DDA rather
// than sampling at fixed intervals, so nothing is stepped over and shadow
// edges land on real geometry instead of on step boundaries.
fn occluded(ro : vec3f, rd : vec3f, maxT : f32) -> bool {
  let hlen = length(rd.xy);
  if (hlen < 1e-6) {
    let c = cellAt(i32(floor(ro.x)), i32(floor(ro.y)));
    return rd.z > 0.0 && isSolid(c.kind) && c.h > ro.z;
  }
  let rd2 = rd.xy / hlen;
  let zs = rd.z / hlen;
  let maxD = maxT * hlen;

  var mapX = i32(floor(ro.x));
  var mapY = i32(floor(ro.y));
  let dD = abs(1.0 / max(abs(rd2), vec2f(1e-9)));
  var sgn = vec2i(1, 1);
  var side = vec2f(0.0);
  if (rd2.x < 0.0) { sgn.x = -1; side.x = (ro.x - f32(mapX)) * dD.x; }
  else { side.x = (f32(mapX) + 1.0 - ro.x) * dD.x; }
  if (rd2.y < 0.0) { sgn.y = -1; side.y = (ro.y - f32(mapY)) * dD.y; }
  else { side.y = (f32(mapY) + 1.0 - ro.y) * dD.y; }

  var dEnter = 0.0;
  for (var i = 0; i < 256; i = i + 1) {
    let dExit = min(min(side.x, side.y), maxD);
    let c = cellAt(mapX, mapY);
    if (isSolid(c.kind)) {
      // lowest point of the ray segment crossing this cell
      let zLo = min(ro.z + zs * dEnter, ro.z + zs * dExit);
      if (zLo < c.h) { return true; }
    }
    if (dExit >= maxD) { return false; }
    if (zs > 0.0 && ro.z + zs * dEnter > U.maxHeight) { return false; }
    dEnter = dExit;
    if (side.x < side.y) { side.x = side.x + dD.x; mapX = mapX + sgn.x; }
    else { side.y = side.y + dD.y; mapY = mapY + sgn.y; }
  }
  return false;
}

// Area-light shadow: sample directions across the sun's disc, so penumbrae
// widen with distance from the occluder instead of being hard everywhere.
fn softShadow(p : vec3f, seed : vec2f) -> f32 {
  var t = vec3f(0.0, 0.0, 1.0);
  if (abs(U.sunDir.z) > 0.9) { t = vec3f(1.0, 0.0, 0.0); }
  let b1 = normalize(cross(t, U.sunDir));
  let b2 = cross(U.sunDir, b1);

  let n = i32(U.sunSamples);
  var lit = 0.0;
  for (var i = 0; i < n; i = i + 1) {
    let r = hash2(seed + vec2f(f32(i) * 1.618, f32(i) * 0.577));
    let ang = r.x * 6.2831853;
    let rad = sqrt(r.y) * U.sunAngle;
    let d = normalize(U.sunDir + b1 * (cos(ang) * rad) + b2 * (sin(ang) * rad));
    if (!occluded(p, d, 90.0)) { lit = lit + 1.0; }
  }
  return lit / f32(n);
}

// Traced ambient occlusion: cosine-weighted hemisphere rays, actual visibility.
fn tracedAO(p : vec3f, nrm : vec3f, seed : vec2f) -> f32 {
  var t = vec3f(0.0, 0.0, 1.0);
  if (abs(nrm.z) > 0.9) { t = vec3f(1.0, 0.0, 0.0); }
  let b1 = normalize(cross(t, nrm));
  let b2 = cross(nrm, b1);

  let n = i32(U.aoSamples);
  var vis = 0.0;
  for (var i = 0; i < n; i = i + 1) {
    let r = hash2(seed + vec2f(f32(i) * 0.7548 + 3.1, f32(i) * 0.5698 + 7.7));
    let ang = r.x * 6.2831853;
    let rr = sqrt(r.y);
    let zz = sqrt(max(0.0, 1.0 - r.y));
    let d = b1 * (cos(ang) * rr) + b2 * (sin(ang) * rr) + nrm * zz;
    if (!occluded(p, normalize(d), U.aoRadius)) { vis = vis + 1.0; }
  }
  return vis / f32(n);
}

struct Hit {
  t     : f32,      // distance along the ray
  n     : vec3f,    // surface normal
  albedo: vec3f,
  ok    : bool,
};

fn shadeSky(rd : vec3f) -> vec3f {
  // spherical gradient: white at the horizon, blue at the zenith
  let t = clamp(rd.z, 0.0, 1.0);
  var col = mix(vec3f(0.95, 0.96, 1.0), vec3f(0.30, 0.50, 0.92), pow(t, 0.65));
  // sun disc and glare, at its true direction
  let d = dot(normalize(rd), U.sunDir);
  if (d > 0.9995) { return vec3f(1.0, 1.0, 0.96); }
  col = col + vec3f(1.0, 0.92, 0.72) * pow(max(d, 0.0), 220.0) * 0.9;
  col = col + vec3f(1.0, 0.95, 0.85) * pow(max(d, 0.0), 18.0) * 0.18;
  if (rd.z < 0.0) {
    // below the horizon and beyond everything: ground haze
    col = mix(vec3f(0.82, 0.84, 0.88), col, exp(rd.z * 6.0));
  }
  return col;
}

// ray vs axis-aligned entity box; returns distance or -1
fn hitBox(ro : vec3f, rd : vec3f, lo : vec3f, hi : vec3f) -> f32 {
  let inv = 1.0 / rd;
  let t0 = (lo - ro) * inv;
  let t1 = (hi - ro) * inv;
  let tmin = min(t0, t1);
  let tmax = max(t0, t1);
  let a = max(max(tmin.x, tmin.y), tmin.z);
  let b = min(min(tmax.x, tmax.y), tmax.z);
  if (b < max(a, 0.0)) { return -1.0; }
  return select(a, 0.0, a < 0.0);
}

fn trace(ro : vec3f, rd : vec3f) -> Hit {
  var hit : Hit;
  hit.ok = false;
  hit.t = U.maxDist;

  // --- height field: DDA in xy, z is linear in horizontal distance ---
  let hlen = length(rd.xy);
  if (hlen > 1e-5) {
    let rd2 = rd.xy / hlen;
    let zs = rd.z / hlen;            // dz per unit horizontal distance
    var mapX = i32(floor(ro.x));
    var mapY = i32(floor(ro.y));
    let dD = abs(1.0 / max(abs(rd2), vec2f(1e-9)));
    var sgn = vec2i(1, 1);
    var side = vec2f(0.0);
    if (rd2.x < 0.0) { sgn.x = -1; side.x = (ro.x - f32(mapX)) * dD.x; }
    else { side.x = (f32(mapX) + 1.0 - ro.x) * dD.x; }
    if (rd2.y < 0.0) { sgn.y = -1; side.y = (ro.y - f32(mapY)) * dD.y; }
    else { side.y = (f32(mapY) + 1.0 - ro.y) * dD.y; }

    var dEnter = 0.0;
    var axis = 0;
    let dGround = select(-1.0, -ro.z / zs, zs < -1e-6);  // horiz dist to z=0

    for (var i = 0; i < 768; i = i + 1) {
      let dExit = min(side.x, side.y);
      let c = cellAt(mapX, mapY);
      let zEnter = ro.z + zs * dEnter;

      if (isSolid(c.kind)) {
        if (zEnter < c.h && zEnter >= 0.0 && dEnter > 0.0) {
          // side face. DDA distances are horizontal; the ray parameter needs
          // them divided by the ray's horizontal length.
          hit.t = dEnter / hlen;
          var n = vec3f(0.0);
          if (axis == 0) { n.x = -f32(sgn.x); } else { n.y = -f32(sgn.y); }
          hit.n = n;
          hit.albedo = select(vec3f(0.80, 0.81, 0.83), vec3f(0.45, 0.75, 0.5),
                              c.kind == T_TREE);
          hit.ok = true;
          break;
        }
        if (zs < -1e-6) {
          // descending: may land on the roof inside this cell
          let dRoof = (c.h - ro.z) / zs;
          if (dRoof >= dEnter && dRoof <= dExit) {
            hit.t = dRoof / hlen;
            hit.n = vec3f(0.0, 0.0, 1.0);
            hit.albedo = select(vec3f(0.86, 0.87, 0.89), vec3f(0.5, 0.8, 0.55),
                                c.kind == T_TREE);
            hit.ok = true;
            break;
          }
        }
      } else if (dGround > 0.0 && dGround >= dEnter && dGround <= dExit) {
        hit.t = dGround / hlen;
        hit.n = vec3f(0.0, 0.0, 1.0);
        var a = vec3f(0.55, 0.72, 0.45);            // grass
        if (c.kind == T_ROAD) { a = vec3f(0.42, 0.43, 0.46); }
        if (c.kind == T_WALK) { a = vec3f(0.68, 0.68, 0.70); }
        hit.albedo = a;
        hit.ok = true;
        break;
      }

      if (dEnter > U.maxDist) { break; }
      if (zs > 0.0 && ro.z + zs * dEnter > U.maxHeight) { break; }

      dEnter = dExit;
      if (side.x < side.y) { side.x = side.x + dD.x; mapX = mapX + sgn.x; axis = 0; }
      else { side.y = side.y + dD.y; mapY = mapY + sgn.y; axis = 1; }
    }
  } else if (rd.z < 0.0) {
    // straight down
    hit.t = -ro.z / rd.z;
    hit.n = vec3f(0.0, 0.0, 1.0);
    let c = cellAt(i32(floor(ro.x)), i32(floor(ro.y)));
    hit.albedo = vec3f(0.5, 0.5, 0.52);
    hit.ok = true;
  }

  // --- entities (cars, pedestrians) as small boxes ---
  let n = i32(U.entCount);
  for (var i = 0; i < n; i = i + 1) {
    let e = ents[i];
    let lo = vec3f(e.x - e.z, e.y - e.z, 0.0);
    let hi = vec3f(e.x + e.z, e.y + e.z, e.w);
    let t = hitBox(ro, rd, lo, hi);
    if (t >= 0.0 && t < hit.t) {
      let p = ro + rd * t;
      // normal from whichever face the point sits on
      let c = (lo + hi) * 0.5;
      let d = (p - c) / max((hi - lo) * 0.5, vec3f(1e-4));
      var nn = vec3f(0.0, 0.0, 1.0);
      if (abs(d.x) > abs(d.y) && abs(d.x) > abs(d.z)) { nn = vec3f(sign(d.x), 0.0, 0.0); }
      else if (abs(d.y) > abs(d.z)) { nn = vec3f(0.0, sign(d.y), 0.0); }
      hit.t = t;
      hit.n = nn;
      hit.albedo = select(vec3f(0.75, 0.76, 0.8), vec3f(0.6, 0.62, 0.68), e.w < 1.2);
      hit.ok = true;
    }
  }
  return hit;
}

@compute @workgroup_size(8, 8)
fn main(@builtin(global_invocation_id) gid : vec3u) {
  let px = vec2i(gid.xy);
  if (px.x >= i32(U.res.x) || px.y >= i32(U.res.y)) { return; }

  // true 3D ray: camera basis is genuinely rotated, giving vertical convergence
  let ndc = vec2f(
    (f32(px.x) + 0.5) / U.res.x * 2.0 - 1.0,
    1.0 - (f32(px.y) + 0.5) / U.res.y * 2.0);
  let rd = normalize(U.fwd + U.right * (ndc.x * U.tanX) + U.up * (ndc.y * U.tanY));
  let ro = vec3f(U.camPos, U.eye);

  var col : vec3f;
  let h = trace(ro, rd);

  if (!h.ok) {
    col = shadeSky(rd);
  } else {
    let p = ro + rd * h.t + h.n * 0.015;
    let seed = vec2f(px) + vec2f(0.37, 0.11);
    let sun = softShadow(p, seed);
    let ao = tracedAO(p, h.n, seed);
    let ndl = max(dot(h.n, U.sunDir), 0.0);

    // ambient is sky light: modulated by how much sky the point can see
    let amb = mix(0.30, 0.55, h.n.z * 0.5 + 0.5) * ao;
    var lit = h.albedo * (amb + ndl * mix(U.shadowK, 1.0, sun) * 0.9);

    // specular scaled by the visible fraction of the sun
    if (sun > 0.0) {
      let r = reflect(-U.sunDir, h.n);
      let spec = pow(max(dot(r, -rd), 0.0), 24.0);
      lit = lit + vec3f(1.0, 0.98, 0.92) * spec * 0.45 * sun;
    }

    // aerial perspective toward the horizon sky colour
    let fog = clamp(h.t / U.maxDist, 0.0, 1.0);
    col = mix(lit, shadeSky(rd) * 1.02, pow(fog, 1.5));
  }

  let lum = clamp(dot(col, vec3f(0.30, 0.59, 0.11)), 0.0, 1.0);
  textureStore(outTex, px, vec4f(col, lum));
}
`;

const WGSL_RENDER = /* wgsl */`
struct VSOut {
  @builtin(position) pos : vec4f,
  @location(0) uv : vec2f,
};

@vertex
fn vs(@builtin(vertex_index) vi : u32) -> VSOut {
  var p = array<vec2f, 3>(vec2f(-1.0, -3.0), vec2f(-1.0, 1.0), vec2f(3.0, 1.0));
  var o : VSOut;
  o.pos = vec4f(p[vi], 0.0, 1.0);
  o.uv = vec2f((p[vi].x + 1.0) * 0.5, (1.0 - p[vi].y) * 0.5);
  return o;
}

// all scalars after the vec2: a vec3 here would align to 16 and silently
// grow the struct to 48 bytes
struct RParams {
  gridRes : vec2f,   // 0
  levels  : f32,     // 8
  mono    : f32,     // 12
  raw     : f32,     // 16
  pad0    : f32,     // 20
  pad1    : f32,     // 24
  pad2    : f32,     // 28
};                   // size 32

@group(0) @binding(0) var lowTex : texture_2d<f32>;
@group(0) @binding(1) var atlas  : texture_2d<f32>;
@group(0) @binding(2) var samp   : sampler;
@group(0) @binding(3) var<uniform> R : RParams;

// 4x4 ordered dither. Choosing a glyph quantises brightness to the ramp's
// step count, which shows as banding across smooth gradients; offsetting by
// under one step turns each band edge into a stipple instead.
fn bayer4(p : vec2i) -> f32 {
  var m = array<f32, 16>(
     0.0,  8.0,  2.0, 10.0,
    12.0,  4.0, 14.0,  6.0,
     3.0, 11.0,  1.0,  9.0,
    15.0,  7.0, 13.0,  5.0);
  let i = (p.y & 3) * 4 + (p.x & 3);
  return m[i] / 16.0 - 0.5;
}

@fragment
fn fs(in : VSOut) -> @location(0) vec4f {
  let cellF = in.uv * R.gridRes;
  let cell = clamp(floor(cellF), vec2f(0.0), R.gridRes - vec2f(1.0));
  let inCell = fract(cellF);

  let texel = textureLoad(lowTex, vec2i(cell), 0);
  let lum = texel.a;

  // debug: the shaded raymarch output as-is, no glyph mapping
  if (R.raw > 0.5) {
    var c = texel.rgb;
    if (R.mono > 0.5) { c = vec3f(lum); }
    return vec4f(c, 1.0);
  }

  // glyph chosen by luminance, dithered by just under one ramp step
  let dith = bayer4(vec2i(cell)) / R.levels;
  let gi = floor(clamp(lum + dith, 0.0, 0.9999) * R.levels);
  let au = (gi + inCell.x) / R.levels;
  let cov = textureSample(atlas, samp, vec2f(au, inCell.y)).r;

  // Glyph density already encodes brightness — the glyph was picked by
  // luminance. Tinting by luminance as well would apply it twice and squash
  // the tonal range, so ink goes down at full intensity and only carries hue.
  var ink = vec3f(1.0);
  if (R.mono < 0.5) { ink = texel.rgb / max(lum, 0.001); }
  return vec4f(clamp(ink, vec3f(0.0), vec3f(1.0)) * cov, 1.0);
}
`;
</script>
<script>
// ---- js/webgpu/gpu-renderer.js ----
// WebGPU renderer: per-pixel 3D raymarch in a compute shader, then a
// glyph-mapped upscale. This is the only renderer.
const GPURenderer = {
  ok: false, device: null, ctx: null,
  cols: 0, rows: 0, cellPx: 10,
  reason: '',

  async init() {
    const canvas = document.getElementById('screen');
    if (!navigator.gpu) { this.reason = 'this browser has no WebGPU support'; return false; }
    let adapter, device;
    try {
      adapter = await navigator.gpu.requestAdapter();
      if (!adapter) { this.reason = 'no GPU adapter available'; return false; }
      device = await adapter.requestDevice();
    } catch (e) { this.reason = 'device request failed: ' + e.message; return false; }

    this.device = device;
    this.ctx = canvas.getContext('webgpu');
    if (!this.ctx) { this.reason = 'could not get a webgpu canvas context'; return false; }
    this.format = navigator.gpu.getPreferredCanvasFormat();
    device.lost.then(info => {
      this.ok = false;
      console.error('[WebGPU] device lost: ' + info.message);
    });

    this.resize();
    this.ctx.configure({ device, format: this.format, alphaMode: 'opaque' });

    // world cells: type | height<<8 | ao<<16
    this.uploadWorld();

    // entity buffer: vec4(x, y, halfWidth, height)
    this.entCount = Entities.cars.length + Entities.peds.length;
    this.entData = new Float32Array(Math.max(this.entCount, 1) * 4);
    this.entBuf = device.createBuffer({
      size: this.entData.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });

    const atlas = GlyphAtlas.build();
    this.levels = atlas.levels;
    this.atlasTex = device.createTexture({
      size: [atlas.canvas.width, atlas.canvas.height],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST |
             GPUTextureUsage.RENDER_ATTACHMENT,
    });
    device.queue.copyExternalImageToTexture(
      { source: atlas.canvas }, { texture: this.atlasTex },
      [atlas.canvas.width, atlas.canvas.height]);

    this.sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
    this.uniBuf = device.createBuffer({
      size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.rparBuf = device.createBuffer({
      size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    device.pushErrorScope('validation');
    const cmod = device.createShaderModule({ code: WGSL_COMPUTE });
    const rmod = device.createShaderModule({ code: WGSL_RENDER });
    if (!await this.checkShader(cmod, 'compute')) return false;
    if (!await this.checkShader(rmod, 'render')) return false;

    this.computePipe = device.createComputePipeline({
      layout: 'auto', compute: { module: cmod, entryPoint: 'main' } });
    this.renderPipe = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: rmod, entryPoint: 'vs' },
      fragment: { module: rmod, entryPoint: 'fs', targets: [{ format: this.format }] },
      primitive: { topology: 'triangle-list' },
    });

    this.allocTargets();

    const err = await device.popErrorScope();
    if (err) {
      this.reason = 'pipeline validation: ' + err.message;
      console.error('[WebGPU] ' + this.reason);
      return false;
    }
    this.ok = true;
    return true;
  },

  uploadWorld() {
    const N = CFG.WORLD * CFG.WORLD;
    // AO is traced per pixel now, so cells only carry type and height
    const packed = new Uint32Array(N);
    for (let i = 0; i < N; i++) {
      packed[i] = (World.type[i] & 0xff) |
                  ((Math.min(World.height[i], 255) & 0xff) << 8);
    }
    this.cellBuf = this.device.createBuffer({
      size: packed.byteLength,
      usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
    });
    this.device.queue.writeBuffer(this.cellBuf, 0, packed);
  },

  async checkShader(mod, label) {
    if (!mod.getCompilationInfo) return true;
    const info = await mod.getCompilationInfo();
    const errors = info.messages.filter(m => m.type === 'error');
    for (const m of info.messages) {
      const where = `${label}.wgsl:${m.lineNum}:${m.linePos}`;
      if (m.type === 'error') console.error(`[WGSL ${where}] ${m.message}`);
      else console.warn(`[WGSL ${where}] ${m.message}`);
    }
    if (errors.length) {
      this.reason = `${label} shader failed to compile (see console)`;
      return false;
    }
    return true;
  },

  resize() {
    const canvas = document.getElementById('screen');
    const dpr = 1; // glyph cells are the pixels that matter here
    canvas.width = Math.max(320, Math.floor(innerWidth * dpr));
    canvas.height = Math.max(240, Math.floor(innerHeight * dpr));
    this.cols = Math.max(40, Math.floor(canvas.width / this.cellPx));
    this.rows = Math.max(24, Math.floor(canvas.height / this.cellPx));
  },

  allocTargets() {
    if (this.lowTex) this.lowTex.destroy();
    this.lowTex = this.device.createTexture({
      size: [this.cols, this.rows],
      format: 'rgba8unorm',
      usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.TEXTURE_BINDING |
             GPUTextureUsage.COPY_SRC,
    });
    this.computeBind = this.device.createBindGroup({
      layout: this.computePipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: this.uniBuf } },
        { binding: 1, resource: { buffer: this.cellBuf } },
        { binding: 2, resource: this.lowTex.createView() },
        { binding: 3, resource: { buffer: this.entBuf } },
      ],
    });
    this.renderBind = this.device.createBindGroup({
      layout: this.renderPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: this.lowTex.createView() },
        { binding: 1, resource: this.atlasTex.createView() },
        { binding: 2, resource: this.sampler },
        { binding: 3, resource: { buffer: this.rparBuf } },
      ],
    });
  },

  handleResize() {
    const oc = this.cols, or = this.rows;
    this.resize();
    if (this.ok && (this.cols !== oc || this.rows !== or)) this.allocTargets();
  },

  render() {
    if (!this.ok) return;
    const dev = this.device;

    // --- camera basis, genuinely rotated by pitch (true 3-point perspective) ---
    const a = Player.angle, p = Player.pitch;
    const cp = Math.cos(p), sp = Math.sin(p);
    const fwd = [Math.cos(a) * cp, Math.sin(a) * cp, sp];
    const right = [-Math.sin(a), Math.cos(a), 0];
    // up = fwd x right  (the other order points down and flips the image)
    const up = [
      fwd[1] * right[2] - fwd[2] * right[1],
      fwd[2] * right[0] - fwd[0] * right[2],
      fwd[0] * right[1] - fwd[1] * right[0],
    ];
    const sx = Math.cos(CFG.SUN_AZ), sy = Math.sin(CFG.SUN_AZ), sz = Math.tan(CFG.SUN_EL);
    const il = 1 / Math.hypot(sx, sy, sz);
    const tanX = CFG.PLANE_LEN;
    const tanY = tanX * (this.rows / this.cols);

    const u = new Float32Array(28);
    u[0] = Player.x;  u[1] = Player.y;
    u[2] = this.cols; u[3] = this.rows;
    u[4] = fwd[0]; u[5] = fwd[1]; u[6] = fwd[2];   u[7] = CFG.EYE;
    u[8] = right[0]; u[9] = right[1]; u[10] = right[2]; u[11] = CFG.MAX_DIST;
    u[12] = up[0]; u[13] = up[1]; u[14] = up[2];   u[15] = CFG.WORLD;
    u[16] = sx * il; u[17] = sy * il; u[18] = sz * il; u[19] = CFG.SHADOW;
    u[20] = tanX; u[21] = tanY; u[22] = Light.maxH || 32; u[23] = this.entCount;
    u[24] = CFG.SUN_ANGLE; u[25] = CFG.SUN_SAMPLES;
    u[26] = CFG.AO_SAMPLES; u[27] = CFG.AO_RADIUS;
    dev.queue.writeBuffer(this.uniBuf, 0, u);
    dev.queue.writeBuffer(this.rparBuf, 0, new Float32Array([
      this.cols, this.rows, this.levels, CFG.MONO ? 1 : 0,
      CFG.RAW ? 1 : 0, 0, 0, 0]));

    // --- entities ---
    let k = 0;
    for (const c of Entities.cars) {
      this.entData[k++] = c.x; this.entData[k++] = c.y;
      this.entData[k++] = 0.42; this.entData[k++] = 0.85;
    }
    for (const pd of Entities.peds) {
      this.entData[k++] = pd.x; this.entData[k++] = pd.y;
      this.entData[k++] = 0.16; this.entData[k++] = 1.7;
    }
    dev.queue.writeBuffer(this.entBuf, 0, this.entData);

    const enc = dev.createCommandEncoder();
    const cpass = enc.beginComputePass();
    cpass.setPipeline(this.computePipe);
    cpass.setBindGroup(0, this.computeBind);
    cpass.dispatchWorkgroups(Math.ceil(this.cols / 8), Math.ceil(this.rows / 8));
    cpass.end();

    const rp = enc.beginRenderPass({
      colorAttachments: [{
        view: this.ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: 'clear', storeOp: 'store',
      }],
    });
    rp.setPipeline(this.renderPipe);
    rp.setBindGroup(0, this.renderBind);
    rp.draw(3);
    rp.end();
    dev.queue.submit([enc.finish()]);

    const probe = this.frameNo === undefined ? (this.frameNo = 0) : ++this.frameNo;
    if (probe < 3) {
      dev.pushErrorScope('validation');
      dev.popErrorScope().then(err => {
        if (err) console.error('[WebGPU] frame error: ' + err.message);
      });
    }
  },

  // Dumps the compute output so a black screen can be attributed to either
  // the raymarch (all zeros) or the glyph upscale (non-zero here).
  async debugReadback() {
    if (!this.ok) return 'GPU renderer inactive: ' + (this.reason || 'n/a');
    const bpr = Math.ceil(this.cols * 4 / 256) * 256;
    const buf = this.device.createBuffer({
      size: bpr * this.rows,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = this.device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: this.lowTex },
      { buffer: buf, bytesPerRow: bpr }, [this.cols, this.rows]);
    this.device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const d = new Uint8Array(buf.getMappedRange());
    let nonZero = 0, maxV = 0, sum = 0;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++) {
      const v = d[y * bpr + x * 4 + 3];
      if (v > 0) nonZero++;
      if (v > maxV) maxV = v;
      sum += v;
    }
    const total = this.cols * this.rows;
    buf.unmap(); buf.destroy();
    return { cols: this.cols, rows: this.rows, litCells: nonZero, total,
             maxLum: maxV, avgLum: +(sum / total).toFixed(1) };
  },
};
</script>
<script>
// ---- js/main.js ----
// Bootstrap + frame loop. WebGPU is the only renderer; without it there is
// nothing to fall back on, so say so plainly instead of showing black.
(async function () {
  World.generate(CFG.SEED);
  Light.bake();
  Entities.init(CFG.SEED);
  Player.init();

  let ready = false;
  try { ready = await GPURenderer.init(); }
  catch (e) { GPURenderer.reason = e.message; }

  if (!ready) {
    document.getElementById('screen').hidden = true;
    const msg = document.createElement('div');
    msg.id = 'fail';
    msg.innerHTML = '<h1>WebGPU required</h1><p>' +
      (GPURenderer.reason || 'unknown error') + '</p>' +
      '<p>This renderer runs entirely on the GPU. Try a current Chrome, Edge, ' +
      'Firefox or Safari on a machine with a working GPU driver.</p>';
    document.body.appendChild(msg);
    console.error('[ASCII City] ' + GPURenderer.reason);
    return;
  }

  addEventListener('resize', () => GPURenderer.handleResize());

  let last = performance.now();
  let fpsAcc = 0, fpsN = 0;
  const fpsEl = document.getElementById('fps');

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    Player.update(dt);
    Entities.update(dt, now / 1000);
    GPURenderer.render();

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) {
      fpsEl.textContent = Math.round(fpsN / fpsAcc) + ' fps · ' +
        GPURenderer.cols + '×' + GPURenderer.rows;
      fpsAcc = 0; fpsN = 0;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
