  // overburden away, and the soil face is drawing it in profile instead.
  // Two representations of the same soil, one per view.
  const t = smoothstep(0.78, 1.0, d);
  if (t > 0.01 && !(o && o.section)) {
    const B = partsBounds(out);
    // hugging the plan rather than the rubble field: at full decay the
    // thrown stone reaches a long way out, and a mound sized off that is a
    // hill with a hall somewhere under the middle of it
    out.unshift(Prim.cone([B.c[0], B.c[1]], -0.2, 0.34 * t,
                          B.R * 0.85, B.R * 0.38, 'turf'));
  }
  return out;
}

// A person, for scale. Not a character and not a creature - the one thing
// a catalogue of buildings genuinely cannot do without, because "eight
// units long" means nothing and "three times as long as somebody is tall"
// means everything.
const FIGURE_H = 1.72;
function figureParts(x, y, facing) {
  const P = [];
  const f = facing || 0;
  const put = (dx, dy) => [x + dx * Math.cos(f) - dy * Math.sin(f),
                           y + dx * Math.sin(f) + dy * Math.cos(f)];
  const M = 'mark';                      // read as a silhouette, not a person
  for (const sy of [-1, 1]) {
    P.push(Prim.cyl(put(0, sy * 0.10), 0.075, 0.0, 0.88, M, [f, sy * 0.04]));
    P.push(Prim.cyl(put(0, sy * 0.24), 0.055, 0.86, 1.36, M, [f, sy * 0.10]));
  }
  P.push(Prim.cone(put(0, 0), 0.84, 1.42, 0.20, 0.17, M, [f, 0]));
  P.push(Prim.sph([...put(0, 0), 1.56], 0.115, M));
  P.push(Prim.cyl(put(0, 0), 0.055, 1.40, 1.48, M));
  return P;
}

    { id: 'a-chisel', kind: 'chisel', cls: 'tool', mat: 'bronze', hold: 'look' },
    { id: 'a-saw', kind: 'saw', cls: 'tool', mat: 'iron' },
    { id: 'a-tongs', kind: 'tongs', cls: 'tool', mat: 'iron' },
    { id: 'a-lamp', kind: 'lamp', cls: 'tool', mat: 'copper', hold: 'lantern' },
    { id: 'a-bowl', kind: 'bowl', cls: 'vessel', mat: 'greenstone' },
    { id: 'a-cup', kind: 'cup', cls: 'vessel', mat: 'gold', hold: 'cup' },
    { id: 'a-horn', kind: 'drinking-horn', cls: 'vessel', mat: 'silver', hold: 'cup' },
    { id: 'a-urn', kind: 'urn', cls: 'vessel', mat: 'bone' },
    { id: 'a-cauldron', kind: 'cauldron', cls: 'vessel', mat: 'bronze' },
  ],

  // Every entry the viewer can draw, in one flat list with a group on each.
  // Built once, because the generated halves have to be identified the same
  // way the authored half is or the review notes will not survive a reload.
  all() {
    if (this._all) return this._all;
    const out = this.LIST.map(e => Object.assign({ kindOf: 'building' }, e));
    for (const w of this.WORLD) {
      out.push(Object.assign({ kindOf: 'world', g: 'world' }, w));
    }
    for (const c of this.CARRY) {
      const it = (typeof ITEMS !== 'undefined' && ITEMS[c.item]) || null;
      out.push(Object.assign({ kindOf: 'carry', g: 'carry' }, c, {
        name: it ? it.name : c.item,
        why: it ? it.desc : '',
      }));
    }
    for (const a of this.FINDS) {
      out.push(Object.assign({ kindOf: 'find', g: 'find', cond: 1 }, a, {
        name: a.mat[0].toUpperCase() + a.mat.slice(1) + ' ' + a.kind,
        why: 'Class ' + a.cls + '. Made by a smith in a year, carried, and put in the ' +
             'ground - and what is left of it follows from how long it has been there.',
      }));
    }
    this._all = out;
    return out;
  },

  byId(id) { return this.all().find(e => e.id === id) || null; },

  // Where a held thing sits relative to the eye. Offsets are forward, left
  // and up from the camera, so the whole set moves with CFG.EYE rather than
  // being written down again for every item.
  HOLD: {
    axe:     { pos: [0.52, -0.19, -0.30], yaw: 0.40, pitch: -0.85, roll: 0.30 },
    blade:   { pos: [0.54, -0.18, -0.26], yaw: 0.30, pitch: -1.05, roll: 0.18 },
    shaft:   { pos: [0.60, -0.17, -0.14], yaw: 0.16, pitch: -0.50, roll: 0.0 },
    shovel:  { pos: [0.54, -0.16, -0.34], yaw: 0.38, pitch: -0.62, roll: 0.22 },
    // Held upright and leaning forward, because a torch is built standing
    // up where a blade is built lying down - the pitch that raises one
    // tips the other past vertical and points it behind the eye.
    torch:   { pos: [0.44, -0.20, -0.42], yaw: 0.0, pitch: 0.24, roll: 0.0 },
    lantern: { pos: [0.50, -0.21, -0.52], yaw: 0.12, pitch: 0.10, roll: 0.0 },
    shield:  { pos: [0.56, 0.17, -0.24], yaw: 0.0, pitch: 1.40, roll: 0.30 },
    cup:     { pos: [0.38, -0.13, -0.26], yaw: 0.0, pitch: 0.12, roll: 0.0 },
    // held up and turned over, which is how you look at something you have
    // just dug out of the ground rather than something you are using
    look:    { pos: [0.32, -0.10, -0.13], yaw: 0.55, pitch: -0.30, roll: 0.40 },
  },

  // Metres, as a reader can check them. The catalogue is full of numbers
  // that only mean something next to a person, so both are always given.
  dims(b) {
    const f = v => (v >= 10 ? v.toFixed(0) : v.toFixed(1));
    return f(b.hi[0] - b.lo[0]) + ' x ' + f(b.hi[1] - b.lo[1]) +
           ' x ' + f(b.hi[2] - b.lo[2]) + ' m';
  },

  // Draw one. Everything the viewer varies - decay, cause, the people's
  // material, an artifact's condition - arrives here as options, so no
  // asset needs a copy per state and the parts list is always current.
  make(id, o) {
    const e = this.byId(id);
    if (!e) return { parts: [], bounds: partsBounds([]), entry: null };
    o = o || {};
    let parts = [];
    if (e.kindOf === 'building') {
      const fn = Build[e.id.replace(/-.*$/, '')];
      const ctx = assetCtx({
        key: e.id, decay: o.decay, cause: o.cause, mat: o.mat, metal: o.metal,
      });
      parts = fn ? fn(ctx, { robbed: !!e.robbed }) : [];
      // the ground closing over it, before anything is measured or framed
      if (o.sink !== false) parts = sinkParts(parts, ctx.decay, o);
    } else if (e.kindOf === 'find') {
      parts = Artifact.build(e.kind, o.mat && AMAT[o.mat] ? o.mat : e.mat,
        o.cond === undefined ? 1 : o.cond, e.id);
    } else if (e.kindOf === 'carry') {
      e.build(parts);
    } else {
      parts = e.build();
    }
    let bounds = partsBounds(parts);
    let held = false;

    // Held: the same geometry, put where a hand would be. Nothing about the
    // item changes - only where it is - which is the point of doing it as a
    // placement rather than as a second drawing.
    // A stain is not an object. It is a shape in the ground where an object
    // used to be, so there is nothing to put in a hand and the first-person
    // view has to decline rather than hold a discolouration up to the eye.
    const gone = e.kindOf === 'find' &&
      Artifact.isStain(o.cond === undefined ? 1 : o.cond);
    if (o.view === 'fp' && e.hold && !gone) {
      const H = this.HOLD[e.hold] || this.HOLD.look;
      // At its own size, and deliberately not scaled to fill the frame. A
      // torc is twenty-six centimetres across and a spear is a metre and a
      // half, and the only thing worth learning from a first-person view is
      // which of those you are holding. Sizing them to read equally well
      // would throw away the one fact the view is for.
      parts = transformParts(parts, {
        pos: [H.pos[0], H.pos[1], CFG.EYE + H.pos[2]],
        yaw: H.yaw, pitch: H.pitch, roll: H.roll,
      });
      bounds = partsBounds(parts);
      held = true;
    } else if (o.figure && bounds.hi[2] - bounds.lo[2] > 0.7) {
      // Clear of the footprint on the +y side, which is where the default
      // camera stands - so at rest the figure is in front of the thing and
      // not lost against it. The bearing is fixed rather than following the
      // camera, because a figure that moved to stay in front would change
      // the bounds as the turntable turned and the asset would breathe.
      parts = parts.concat(figureParts(bounds.c[0] + bounds.R * 0.25,
                                       bounds.hi[1] + 1.0, -1.7));
      bounds = partsBounds(parts);
    }
    return { parts, bounds, entry: e, held, gone };
  },
};

// Loadable from node for the test suite as well as from the two pages.
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { ASSET, AMAT, Prim, Build, Artifact, InWorld, Carried,
                     Assets, assetCtx, partsBounds, partBounds, convVerts,
                     rotApply, rotUnapply, basisOf, basisYPR, matMul,
                     transformParts, figureParts, sinkParts, sinkDepth,
                     beam, strut,
                     FIGURE_H,
                     stageOf, wear, arnd };
}

<script>
// ---- js/steading.js ----
// What actually stands on a site.
//
// The chronicle knows a farm was founded in the 1204th year, held ninety
// people, and burned in the 1560th. The asset catalogue knows how to build
// a longhouse at any degree of ruin. Neither knows about the other, and
// this is the seam between them: given a site, it says which buildings are
// there, where each one sits, which way it faces, and how far gone it is.
//
// Nothing is stored. A steading is a pure function of the site (which is a
// pure function of the seed) and the year you ask about, so two visits to
// the same ruin find the same walls in the same places - and a ruin found
// at year 6000 is the same building the sim watched being lived in.
const Steading = {
  // What a place of each kind is made of. `n` is a count, or 'pop' for a
  // count that follows how many people the place actually held - a farm
  // that never got past forty souls is one house and a barn, and the hold
  // that ran to nine hundred is a street of them.
  //
  // Ring 0 is the middle of the place, 1 the yard around it, 2 the edge.
  // A rampart and a gate belong on the edge for the same reason they did
  // when somebody built them.
  PLAN: {
    hold: [
      { build: 'moothall',  n: 1,     ring: 0 },
      { build: 'well',      n: 1,     ring: 1 },
      { build: 'granary',   n: 1,     ring: 1 },
      { build: 'longhouse', n: 'pop', ring: 1 },
      { build: 'tower',     n: 1,     ring: 2 },
      { build: 'gate',      n: 1,     ring: 2 },
      { build: 'rampart',   n: 1,     ring: 2 },
    ],
    farm: [
      { build: 'longhouse', n: 'pop', ring: 0 },
      { build: 'granary',   n: 1,     ring: 1 },
      { build: 'byre',      n: 1,     ring: 1 },
      { build: 'fieldwall', n: 1,     ring: 2 },
    ],
    mine: [
      { build: 'adit',      n: 1,     ring: 0 },
      { build: 'headframe', n: 1,     ring: 1 },
      { build: 'spoil',     n: 1,     ring: 1 },
      { build: 'smelter',   n: 1,     ring: 1 },
      { build: 'longhouse', n: 'pop', ring: 2 },
    ],
    fort: [
      { build: 'tower',     n: 1,     ring: 0 },
      { build: 'gate',      n: 1,     ring: 1 },
      { build: 'rampart',   n: 1,     ring: 2 },
      { build: 'longhouse', n: 1,     ring: 1 },
    ],
  },

  RING: [0, 7.5, 15.0],   // world units from the middle
  POP_PER_HOUSE: 260,     // souls before another roof is wanted
  MAX_HOUSES: 5,          // and the point past which it is a street, not a count

  // Sixteen headings rather than an angle: Math.atan2 and Math.sin are not
  // guaranteed identical between engines, and two players standing in the
  // same village have to see it built the same way round.
  YAW: 16,

  // How far gone a building is, 0 as built and 1 a plan in the grass.
  // Continuous in age rather than stepped, so two ruined halls three
  // centuries apart do not wear the same face - but tuned against the
  // chronicle's own roof and wall lifetimes, so the shape you see and the
  // stage the record reports never disagree about what is standing.
  decay(S, s, now) {
    if (s.abandoned < 0 || now < s.abandoned) return 0;
    const age = now - s.abandoned;
    const wall = s.mat === 'timber' ? HIST.WALL_TIMBER : HIST.WALL_STONE;
    return clamp(age / (wall * 1.15), 0, 1);
  },

  // The buildings of one site: what, where, which way round, how ruined.
  plan(S, s, now) {
    const p = S.peoples[s.people];
    const list = this.PLAN[s.kind] || this.PLAN.farm;
    const d = this.decay(S, s, now);
    const out = [];
    let seat = 0;
    for (const item of list) {
      let n = item.n;
      if (n === 'pop') {
        n = clamp(1 + Math.floor(s.peak / this.POP_PER_HOUSE), 1, this.MAX_HOUSES);
      }
      for (let i = 0; i < n; i++) {
        const slot = seat++;
        const r = this.RING[item.ring] || 0;
        // spread the ring by slot, jittered per site so two villages of the
        // same size are not the same village
        const turn = (slot * 5 + Math.floor(hash01(s.id, slot, CFG.SEED >>> 0) * 3)) % this.YAW;
        const a = (turn / this.YAW) * Math.PI * 2;
        const jitter = 0.7 + hash01(s.id + 91, slot, CFG.SEED >>> 0) * 0.6;
        const x = s.x + (r ? Math.cos(a) * r * jitter : 0);
        const y = s.y + (r ? Math.sin(a) * r * jitter : 0);
        out.push({
          build: item.build,
          key: s.id + ':' + item.build + ':' + i,
          site: s.id,
          pos: [x, y, terrainH(x, y)],
          yaw: (Math.floor(hash01(s.id + 7, slot, CFG.SEED >>> 0) * this.YAW) / this.YAW)
               * Math.PI * 2,
          decay: d,
          cause: s.abandoned >= 0 ? (s.cause || 'left') : 'left',
          mat: s.mat,
          metal: p ? p.metal : 'copper',
        });
      }
    }
    return out;
  },

  // The same plan, built out into primitives in world space. This is the
  // list a renderer wants: every part already translated onto the ground it
  // stands on and turned the way it faces, with nothing left to place.
  parts(S, s, now) {
    const out = [];
    for (const b of this.plan(S, s, now)) {
      const fn = Build[b.build];
      if (!fn) continue;
      const ctx = assetCtx({ key: b.key, decay: b.decay, cause: b.cause,
                             mat: b.mat, metal: b.metal });
      let parts = fn(ctx);
      // the ground takes a place before it takes the walls, so it sinks
      // before it is moved onto the hillside it sank into
      parts = sinkParts(parts, b.decay);
      parts = transformParts(parts, { pos: b.pos, yaw: b.yaw });
      for (const q of parts) { q.site = s.id; q.of = b.build; out.push(q); }
    }
    return out;
  },


  // ---- handing a place to the renderer ----
  //
  // Two levels, because a village is 441 primitives and a ray must not pay
  // for all of them. Each BUILDING carries a bounding sphere, so a ray tests
  // seven spheres and only opens the one or two it actually strikes. That is
  // the same shape the reference tracer uses, one level up.
  //
  // Kinds, as the shader reads them. conv is folded onto its box: it is two
  // parts in a thousand and carrying a plane list for it would cost every
  // other primitive the space.
  KIND: { box: 0, cyl: 1, sph: 2, cone: 3, facet: 4, conv: 0 },
  PRIM_F: 20,        // floats per primitive (5 vec4)
  HEAD_F: 8,         // floats per building (2 vec4)

  // A facet's cuts come from arnd('facet' + seed, k), which folds the key
  // string into one u32 and then hashes numerically. Folding here and
  // sending the u32 lets the shader reproduce the same stone exactly
  // without ever seeing a string.
  fold(key) {
    let h = (CFG.SEED ^ 0x9E37) >>> 0;
    for (let k = 0; k < key.length; k++) h = jsUhash(h, key.charCodeAt(k));
    return h >>> 0;
  },

  matIndex(name) {
    if (!this._mat) {
      this._mat = {};
      const keys = Object.keys(AMAT);
      for (let i = 0; i < keys.length; i++) this._mat[keys[i]] = i;
    }
    const i = this._mat[name];
    return i === undefined ? this._mat.drystone || 0 : i;
  },

  // Pack the buildings nearest (px, py) into the caller's arrays. Returns
  // how many buildings and primitives were written, so nothing has to be
  // cleared between frames - the counts are the truth.
  pack(S, px, py, now, head, prim, maxHead, maxPrim) {
    // A folded seed is a full 32-bit value and a float cannot carry one
    // past 2^24, so the two seed slots are written as raw bits through a
    // u32 view and read back in the shader with bitcast.
    if (!this._u32 || this._u32.buffer !== prim.buffer) {
      this._u32 = new Uint32Array(prim.buffer);
    }
    // nearest sites first; a village is 15 units across, so a handful of
    // them covers everything the eye can reach
    const near = S.sites.slice().sort((a, b) =>
      ((a.x - px) ** 2 + (a.y - py) ** 2) - ((b.x - px) ** 2 + (b.y - py) ** 2));
    let nh = 0, np = 0;
    // one sphere around everything resident, so an occlusion ray far from
    // any village pays a single test rather than one per building
    const lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9];
    for (const s of near) {
      if (nh >= maxHead || np >= maxPrim) break;
      if ((s.x - px) ** 2 + (s.y - py) ** 2 > this.VIEW * this.VIEW) break;
      for (const b of this.plan(S, s, now)) {
        const fn = Build[b.build];
        if (!fn) continue;
        const ctx = assetCtx({ key: b.key, decay: b.decay, cause: b.cause,
                               mat: b.mat, metal: b.metal });
        let parts = transformParts(sinkParts(fn(ctx), b.decay),
                                   { pos: b.pos, yaw: b.yaw });
        if (nh >= maxHead || np + parts.length > maxPrim) {
          return { heads: nh, prims: np, all: this.overall(lo, hi) };
        }
        const B = partsBounds(parts);
        const h = nh * this.HEAD_F;
        head[h] = B.c[0]; head[h + 1] = B.c[1]; head[h + 2] = B.c[2];
        head[h + 3] = B.r;
        head[h + 4] = np; head[h + 5] = parts.length; head[h + 6] = s.id; head[h + 7] = 0;
        for (let d = 0; d < 3; d++) {
          if (B.c[d] - B.r < lo[d]) lo[d] = B.c[d] - B.r;
          if (B.c[d] + B.r > hi[d]) hi[d] = B.c[d] + B.r;
        }
        nh++;
        for (const q of parts) np = this.writePrim(prim, np, q, b);
      }
    }
    return { heads: nh, prims: np, all: this.overall(lo, hi) };
  },

  // the sphere that holds everything resident, or null when nothing is
  overall(lo, hi) {
    if (lo[0] > hi[0]) return null;
    const c = [0, 0, 0];
    let r = 0;
    for (let d = 0; d < 3; d++) c[d] = (lo[d] + hi[d]) / 2;
    for (let d = 0; d < 3; d++) r += (hi[d] - lo[d]) ** 2;
    return [c[0], c[1], c[2], Math.sqrt(r) / 2 + 0.01];
  },

  VIEW: 260,   // world units: past this a village is under a character cell

  writePrim(prim, np, q, b) {
    const o = np * this.PRIM_F;
    const m = q.m || [1, 0, 0, 0, 1, 0, 0, 0, 1];
    const mat = this.matIndex(q.mat);
    let a0 = 0, a1 = 0, a2 = 0, e1 = 0, e2 = 0;
    let cx = 0, cy = 0, cz = 0;
    const k = this.KIND[q.k] === undefined ? 0 : this.KIND[q.k];
    if (q.k === 'cyl' || q.k === 'cone') {
      // the anchor is the base of the axis, and the axis runs up local +z
      cx = q.c[0]; cy = q.c[1]; cz = q.z0;
      a1 = q.z1 - q.z0;
      if (q.k === 'cyl') a0 = q.r; else { a0 = q.r0; a2 = q.r1; }
    } else if (q.k === 'conv') {
      // folded onto its own box, which is what its planes are cut from
      const bb = partBounds(q);
      cx = (bb.lo[0] + bb.hi[0]) / 2; cy = (bb.lo[1] + bb.hi[1]) / 2;
      cz = (bb.lo[2] + bb.hi[2]) / 2;
      a0 = (bb.hi[0] - bb.lo[0]) / 2; a1 = (bb.hi[1] - bb.lo[1]) / 2;
      a2 = (bb.hi[2] - bb.lo[2]) / 2;
    } else {
      cx = q.c[0]; cy = q.c[1]; cz = q.c[2];
      if (q.k === 'box') { a0 = q.he[0]; a1 = q.he[1]; a2 = q.he[2]; }
      else a0 = q.r;
      if (q.k === 'facet') {
        e1 = this.fold('facet' + q.seed);
        e2 = this.fold('cut' + q.seed);
      }
    }
    prim[o] = cx; prim[o + 1] = cy; prim[o + 2] = cz; prim[o + 3] = k;
    prim[o + 4] = a0; prim[o + 5] = a1; prim[o + 6] = a2; prim[o + 7] = mat;
    prim[o + 8] = m[0]; prim[o + 9] = m[1]; prim[o + 10] = m[2];
    prim[o + 12] = m[3]; prim[o + 13] = m[4]; prim[o + 14] = m[5];
    this._u32[o + 11] = e1 >>> 0;
    this._u32[o + 15] = e2 >>> 0;
    prim[o + 16] = m[6]; prim[o + 17] = m[7]; prim[o + 18] = m[8]; prim[o + 19] = 0;
    return np + 1;
  },

  // How much of the world one steading takes up, for a renderer that wants
  // to reject the whole place with one test before looking at any of it.
  bounds(S, s, now) { return partsBounds(this.parts(S, s, now)); },
};

<script>
// ---- js/lore.js ----
// The record, read off the chronicle instead of written.
//
// A hall belongs to whichever people had a settlement nearest to it, and
// what is cut into its pillars is drawn from that people's own event log:
// real names, real years, real causes, and nothing that did not happen.
// Two runs of a seed cut the same words, and none of it is stored.
//
// Depth still lays a life out in order - within the people a hall belongs
// to, band -1 carries their beginning, -2 the middle of their time, -3 the
// end of it - so going down still reads a story front to back. But WHOSE
// story depends on where you went down. Two entrances a few hundred units
// apart can belong to two peoples and two thousand years, which is the
// whole reason to try another one.
const Lore = {
  S: null,
  WIDTH: 46,     // the widest a cut line may be, panel included
  REACH: 1400,   // world units from a hall to the nearest settlement before
                 // nobody's record covers it and the pillars are blank

  init() {
    if (!this.S) this.S = Chronicle.run();
    return this.S;
  },

  // ---- which people cut this hall ----

  // Nearest settlement to a point, over the whole span - a place that stood
  // for four centuries and fell is as much a claim on the ground as one
  // still standing.
  nearestSite(x, y) {
    const S = this.init();
    let best = null, bd = Infinity;
    for (const s of S.sites) {
      const d = (s.x - x) ** 2 + (s.y - y) ** 2;
      if (d < bd) { bd = d; best = s; }
    }
    return (best && bd <= this.REACH * this.REACH) ? best : null;
  },

  // The hall's owners: the site nearest its anchor, the people who held it,
  // and the slice of their life this depth belongs to. Null where the
  // chronicle simply does not reach - the region is finite and the world
  // is not, so far enough out the halls are nobody's.
  hall(cx, cy, k) {
    const a = hallAt(cx, cy, k);
    if (!a) return null;
    const site = this.nearestSite(a.ax, a.ay);
    if (!site) return null;
    const S = this.S;
    const p = S.peoples[site.people];
    const from = p.rise;
    const to = p.fell >= 0 ? p.fell : S.now;
    // band -1 shallowest is the beginning, -3 deepest is the end
    const i = Math.max(0, Math.min(2, -k - 1));
    const span = Math.max(1, (to - from) / 3);
    return { site, people: p, from: from + i * span, to: from + (i + 1) * span };
  },

  // ---- turning what happened into what is cut ----

  // The sim's causes are labels; a wall wants them said. Anything not
  // listed already reads as English and is used as it stands.
  CAUSE: {
    left: 'everybody had gone',
    sacked: 'it was sacked',
    flood: 'the water came',
    plague: 'plague',
    famine: 'famine',
    'the deep': 'the deep',
  },


  name(S, id) { return id === null || id === undefined ? null : S.figures[id].name; },

  // One event, as a line on a wall. The chronicle's deed events already
  // carry their own prose ('made the grey gold brooch of Vesesk'), so those
  // only need whoever did it put in front; the structural ones are given a
  // voice here.
  line(S, e, p) {
    const who = this.name(S, e.who);
    const site = e.place !== null && S.sites[e.place] ? S.sites[e.place].name : null;
    const other = (e.target !== null && S.peoples[e.target]) ? S.peoples[e.target].name : null;
    switch (e.action) {
      case 'founded':   return 'We set the first stone of ' + site + '.';
      case 'settled':   return 'We put people into ' + site + '.';
      case 'settled far out at':
        return 'We sent settlers a long way, to ' + site + '.';
      case 'roaded':    return 'We cut the road to ' + site + '.';
      case 'bridged':   return 'We threw a bridge for the road to ' + site + '.';
      case 'fortified': return 'We walled ' + site + ' against them.';
      case 'declared war on': return 'We took up arms against ' + other +
        (e.cause ? ', over ' + e.cause + '.' : '.');
      case 'made peace with': return 'We put down our arms.';
      case 'lost the war to': return other + ' broke us in the field.';
      case 'won a battle at': return who ? who + ' won the day for us.'
                                         : 'The day went to us.';
      case 'fell at':   return who + ' did not come off the field.';
      case 'was buried': return who + ' was laid in the ground' +
        (e.cause && e.cause !== 'age' ? ', taken by ' + e.cause + '.' : '.');
      case 'never came back': return who + ' walked out and did not return.';
      case 'opened a grave of': return 'We opened what an older people buried.';
      case 'made':      return null;   // the deed line says it better
      case 'ended':
        // A site's ending is logged against whoever ENDED it, not whoever
        // held it - so on our own wall the same event is either our loss
        // or our doing, and it has to be read the right way round.
        if (e.place !== null && site) {
          return S.sites[e.place].people === p.id
            ? site + ' was lost: ' + (this.CAUSE[e.cause] || e.cause) + '.'
            : 'We broke ' + site + ' and took the ground.';
        }
        return null;
      default:
        // a deed: prose already, and it wants a name in front of it
        return who ? who + ' ' + e.action + '.' : null;
    }
  },

  // What a hall's pillars say. Deterministic in the hall's own cell, so the
  // same wall always carries the same words.
  inscription(cx, cy, k) {
    const h = this.hall(cx, cy, k);
    const key = cx + ',' + cy + ',' + k;
    if (!h) return null;
    const S = this.S;
    const p = h.people;
    // Compose first, then measure. The year rides in front of every line,
    // so a cap on the text alone lets the finished line overrun the panel.
    const pool = [];
    for (const e of S.events) {
      if (e.actor !== p.id || e.t < h.from || e.t > h.to) continue;
      const l = this.line(S, e, p);
      if (!l) continue;
      const cut = String(e.t).padStart(4) + '  ' + l;
      if (cut.length <= this.WIDTH) pool.push(cut);
    }
    const head = [p.name + ', ' + p.kind + '.', ''];
    if (!pool.length) {
      return { band: k, key, people: p.id,
               lines: head.concat(['Nothing of these years was cut here.']) };
    }
    // a window into the pool, placed by the hall's own cell
    const want = Math.min(4, pool.length);
    const start = jsUhash(((cx * 31) ^ (cy * 17)) >>> 0,
                          ((8 + k) ^ (CFG.SEED >>> 0)) >>> 0) % pool.length;
    const lines = head.slice();
    for (let i = 0; i < want; i++) lines.push(pool[(start + i) % pool.length]);
    // and how it ended for them, at the deepest band
    if (k <= -3) {
      lines.push('');
      lines.push(p.fell >= 0
        ? 'Ended in the ' + this.ord(p.fell) + ' year, by ' + (p.cause || 'decline') + '.'
        : 'They are up there still.');
    }
    return { band: k, key, people: p.id, lines };
  },

  // 1st, 2nd, 3rd, 4th - and 11th through 13th, which break the pattern
  ord(n) {
    const t = n % 100;
    if (t >= 11 && t <= 13) return n + 'th';
    return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  },

  // what a hall calls itself: the settlement it answers to, and its shape
  KIND: ['Hall', 'Gallery', 'Delve', 'Vault', 'Stair-house', 'Cut'],
  hallName(cx, cy, k) {
    const h = this.hall(cx, cy, k);
    const kind = this.KIND[jsUhash((cx ^ 0x9e37) >>> 0, (cy ^ (8 + k)) >>> 0) %
                           this.KIND.length];
    return h ? 'the ' + kind + ' of ' + h.site.name : 'an unnamed ' + kind.toLowerCase();
  },

  // Who the world remembers, for the journal. Not one civilisation any
  // more - whichever peoples the player has actually read.
  peopleName(id) {
    const S = this.init();
    return S.peoples[id] ? S.peoples[id].name : 'someone';
  },
};
</script>
<script>
// ---- js/items.js ----
// Item, recipe, and tree-species definitions. Data only - the logic that
// gives, takes, crafts, and examines lives in js/game.js.
const ITEMS = {
  wood:   { name: 'wood',        desc: 'Rough-split timber.' },
  stone:  { name: 'stone',       desc: 'Fist-sized chunks of rock.' },
  lichen: { name: 'glow lichen', desc: 'Faintly luminous. Cold to the touch.' },
  fruit:  { name: 'pale fruit',  desc: 'Heavy and sweet-smelling.' },
  sap:    { name: 'pine sap',    desc: 'Sticky amber resin.' },
  copper: { name: 'copper ore',  desc: 'Green-crusted, soft, warm-toned.' },
  iron:   { name: 'iron ore',    desc: 'Heavy, dull, faintly magnetic.' },
  tin:    { name: 'tin ore',     desc: 'Pale, heavy, and never where the copper is.' },
  bronze: { name: 'bronze',      desc: 'Copper and tin. Harder than either alone.' },
  gem:    { name: 'gem',         desc: 'It holds the light a moment too long.' },
  axe:    { name: 'stone axe',   desc: 'Removed trees.' },
  pick:   { name: 'stone pickaxe', desc: 'Breaks stone and frees the soft metals.' },
  bronzepick: { name: 'bronze pickaxe', desc: 'Bites iron, which stone will not.' },
  ironpick:   { name: 'iron pickaxe',   desc: 'Hard enough for the gem pockets.' },
  shovel: { name: 'wooden shovel', desc: 'Moves soil. Useless on rock.' },
  torch:  { name: 'torch',       desc: 'Brightens your lamp while carried.' },
  lantern:{ name: 'gem lantern', desc: 'A gem in a copper cage. Bright, steady.' },
};

// `n` is how many the recipe yields, defaulting to one. Smelting is the
// only thing so far that gives back more pieces than it takes names.
const RECIPES = [
  { out: 'axe',     needs: { wood: 2, stone: 1 } },
  { out: 'pick',    needs: { wood: 1, stone: 2 } },
  { out: 'shovel',  needs: { wood: 2, stone: 1 } },
  { out: 'torch',   needs: { wood: 1, lichen: 1 } },
  { out: 'lantern', needs: { gem: 1, copper: 2, wood: 1 } },
  // The alloy. Three parts copper to one of tin is roughly what the real
  // thing runs at, and the wood is the fire under it - so bronze costs a
  // journey for the tin and a woodland for the heat.
  { out: 'bronze',  n: 2, needs: { copper: 3, tin: 1, wood: 2 } },
  // A pick only bites what it is harder than, so the metals are a ladder
  // and each rung is the way up to the next: bronze is what opens iron,
  // and iron is what opens the gems the lantern wants.
  { out: 'bronzepick', needs: { bronze: 2, wood: 1 } },
  { out: 'ironpick',   needs: { iron: 3, wood: 1 } },
];

// Species index comes from the tree's placement hash - deterministic per
// tree, same on every visit. harvest: [item, count] or null.
const SPECIES = [
  { name: 'pine',      desc: 'Tall, dark, resin-streaked.',
    harvest: ['sap', 2],   chop: 3,
    hug: 'Sticky. Worth it.' },
  { name: 'bloomwood', desc: 'A broadleaf heavy with pale fruit.',
    harvest: ['fruit', 2], chop: 3,
    hug: 'The canopy rustles approvingly.' },
  { name: 'ironbark',  desc: 'Dense and dark. Dents axe blades.',
    harvest: null,         chop: 4,
    hug: 'Like hugging a wall. Solid.' },
];

<script>
// ---- js/game.js ----
// Game state: inventory, modal panels (inventory / craft / examine), and the
// actions they expose. All UI is written into the ASCII grid via Overlay -
// no DOM. One keydown layer routes keys by mode; while a panel is open the
// player is frozen and every key is captured here.
const Game = {
  mode: 'play',        // play | inventory | craft | examine | console
  inv: new Map(),      // item id -> count
  cursor: 0,
  uiDirty: true,
  toastMsg: '', toastT: 0,
  needSave: false, saveTimer: 0,
  devMode: false,       // gates debug view toggles (mono/raw) behind a command
  cmdBuf: '',
  cmdHistory: [],
  read: [],             // inscription keys already read, in the order found
  done: false,          // the record has been pieced together
  spawnAt: null,        // where a saved game left the player standing

  // The prologue: what they say came before the record. It runs once, for
  // somebody who has never been here - a returning player is dropped
  // straight back in where they stopped, and does not sit through the
  // creation of the world a second time.
  mythT: 0,
  MYTH_LINE: 0.38,   // seconds before the next line of it arrives
  MYTH_HOLD: 1.2,    // and how long it stands complete before the title

  init() {
    this.load();
    if (!this.spawnAt) this.mode = 'myth';
  },

  // ---- inventory ----

  count(id) { return this.inv.get(id) || 0; },

  give(id, n) {
    this.inv.set(id, this.count(id) + n);
    this.needSave = true;
    this.uiDirty = true;
  },

  take(id, n) {
    const c = this.count(id);
    if (c < n) return false;
    if (c === n) this.inv.delete(id); else this.inv.set(id, c - n);
    this.needSave = true;
    this.uiDirty = true;
    return true;
  },

  toast(msg) { this.toastMsg = msg; this.toastT = 3; this.uiDirty = true; },

  // ---- digging: what the ground is made of decides what it takes ----

  // Pickaxes come in three metals and a point only bites what it is harder
  // than. Stone takes rock and the soft metals; iron ore wants bronze; the
  // gem pockets want iron. That ladder is what the journey for tin is FOR -
  // without it bronze is a trinket, and with it bronze is the rung that
  // reaches iron, which is the rung that reaches the lantern.
  PICKS: [['pick', 1], ['bronzepick', 2], ['ironpick', 3]],
  PICK_NAME: ['bare hands', 'a stone pickaxe', 'a bronze pickaxe', 'an iron pickaxe'],

  pickTier() {
    let t = 0;
    for (const [id, tier] of this.PICKS) if (this.count(id) && tier > t) t = tier;
    return t;
  },

  // how hard this point is to shift, on the same scale
  needFor(mat, x, y, z) {
    if (mat === MATS.GEM) return 3;
    if (mat === MATS.ORE && oreItem(x, y, z) === 'iron') return 2;
    return 1;
  },


  // Returns the scoop radius to carve, or 0 when the right tool is missing
  // (a toast explaining why is already queued). Pays out whatever the
  // material yields. Soil moves in bigger bites than rock does.
  digAt(x, y, z) {
    const mat = matAt(x, y, z, terrainH(x, y));
    if (mat === MATS.DIRT) {
      if (!this.count('shovel')) { this.toast('soil - you need a shovel'); return 0; }
      return CFG.DIG_R * 1.4;
    }
    const need = this.needFor(mat, x, y, z);
    const tier = this.pickTier();
    if (tier < need) {
      // say which rung is missing, not just that something is
      this.toast(tier === 0 ? 'solid rock - you need a pickaxe'
        : 'the point turns - this wants ' + this.PICK_NAME[need]);
      return 0;
    }
    if (mat === MATS.GEM) {
      this.give('gem', 1);
      this.toast('a gem comes loose (' + this.count('gem') + ')');
    } else if (mat === MATS.ORE) {
      const id = oreItem(x, y, z);
      this.give(id, 1);
      this.toast('+1 ' + ITEMS[id].name + ' (' + this.count(id) + ')');
    } else {
      this.give('stone', 1);
      this.toast('+1 stone (' + this.count('stone') + ')');
    }
    return CFG.DIG_R;
  },

  open(mode) { this.mode = mode; this.cursor = 0; this.uiDirty = true; },
  close() { this.mode = 'play'; this.uiDirty = true; },

  // ---- console: text commands, "devmode" gates the debug view toggles ----

  openConsole() { this.cmdBuf = ''; this.mode = 'console'; this.uiDirty = true; },

  // Takes the raw keyboard event, not just the code - it needs the actual
  // typed character, which the code-only key() routing below doesn't carry.
  consoleInput(e) {
    if (e.code === 'Escape') { this.close(); return; }
    if (e.code === 'Enter') {
      if (!this.cmdBuf.trim()) { this.close(); return; }
      this.runCommand(this.cmdBuf);
      this.cmdBuf = '';
      this.uiDirty = true;
      return;
    }
    if (e.code === 'Backspace') {
      this.cmdBuf = this.cmdBuf.slice(0, -1);
      this.uiDirty = true;
      return;
    }
    if (e.key && e.key.length === 1 && this.cmdBuf.length < 60) {
      this.cmdBuf += e.key;
      this.uiDirty = true;
    }
  },

  runCommand(raw) {
    const cmd = raw.trim();
    if (!cmd) return;
    this.cmdHistory.push('> ' + cmd);
    const arg = cmd.split(/\s+/);
    const verb = arg[0].toLowerCase();
    // waiting out a whole cycle to see midnight is no way to work
    if (verb === 'time') {
      if (arg.length > 1 && isFinite(parseFloat(arg[1]))) {
        Sky.setHour(parseFloat(arg[1]));
      }
      this.cmdHistory.push('time ' + Sky.hour().toFixed(2) +
        (Sky.paused ? ' (frozen)' : ''));
      return;
    }
    if (verb === 'freeze') {
      Sky.paused = !Sky.paused;
      this.cmdHistory.push(Sky.paused ? 'time frozen' : 'time running');
      return;
    }
    if (verb === 'daylen') {
      if (arg.length > 1 && parseFloat(arg[1]) > 0) CFG.DAY_LEN = parseFloat(arg[1]);
      this.cmdHistory.push('day length ' + CFG.DAY_LEN + 's');
      return;
    }
    // The seed is the world. Handing someone a number hands them the same
    // hills, the same caves and the same dead civilisation, which is the
    // whole claim this project makes - so it needs to be sayable at runtime
    // and not only editable in a source file nobody who plays this has.
    if (verb === 'seed') {
      if (arg.length > 1) {
        const v = Number(arg[1]);
        if (!Number.isInteger(v) || v < 0 || v >= SEED_MAX) {
          this.cmdHistory.push('seed must be a whole number below ' + SEED_MAX);
          this.cmdHistory.push('(above that an f32 uniform stops carrying it)');
          return;
        }
        if (v === CFG.SEED) { this.cmdHistory.push('already standing in ' + v); return; }
        // Half the modules cache something derived from the seed - the
        // spawn, the civilisation, the resident dig chunks - so the honest
        // way into another world is to load it. Flush what is owed first.
        this.save();
        if (typeof Edits !== 'undefined') Edits.save();
        if (typeof Removed !== 'undefined') Removed.save();
        this.cmdHistory.push('walking to ' + v + '...');
        if (typeof location !== 'undefined') location.search = '?seed=' + v;
        return;
      }
      this.cmdHistory.push('seed ' + CFG.SEED + '  -  "seed <n>" walks to another world');
      this.cmdHistory.push('every world keeps its own digs, items and record');
      return;
    }
    // the map's scale, since what you want to see changes with what you
    // are looking for: a cave mouth is a walk away, a settlement is not
    if (verb === 'map') {
      if (!this.devMode) {
        this.cmdHistory.push('the map is a devmode tool - run "devmode" first');
        return;
      }
      const z = this.MAP_ZOOM;
      if (arg.length > 1 && isFinite(parseFloat(arg[1]))) {
        this.MAP.u = clamp(parseFloat(arg[1]), 1, 400);
      } else {
        this.MAP.u = z[(z.indexOf(this.MAP.u) + 1) % z.length];
      }
      this.mapKey = '';
      this.uiDirty = true;
      this.cmdHistory.push('map ' + this.MAP.u + ' units to a cell' +
        '  (@ you, > cave mouth, HFMT standing, hfmt ruined)');
      return;
    }
    if (verb === 'quality') {
      if (typeof Quality === 'undefined') {
        this.cmdHistory.push('quality control is not loaded');
        return;
      }
      if (arg.length > 1 && !Quality.set(arg[1].toLowerCase())) {
        this.cmdHistory.push('quality: low, medium, high, or auto');
        return;
      }
      this.cmdHistory.push(Quality.describe());
      return;
    }
    // The screen already IS text. Handing it back as text is the one export
    // format this renderer can offer that no screenshot improves on.
    if (verb === 'copy') {
      if (typeof GPURenderer === 'undefined' || !GPURenderer.ok) {
        this.cmdHistory.push('nothing to copy - the renderer is not running');
        return;
      }
      // Nobody wants a picture of themselves asking for a picture, so the
      // console closes first and the grab waits for the HUD to be redrawn
      // without it. Two frames, because the redraw happens inside the frame
      // loop and this is not being called from it. The world itself is
      // unaffected: the overlay is substituted in the glyph pass, not
      // marched in the raymarch, so nothing has to be re-rendered.
      this.close();
      const done = m => this.toast(m);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        GPURenderer.captureText().then(txt => {
          const rows = txt.split('\n').length;
          if (typeof navigator !== 'undefined' && navigator.clipboard) {
            navigator.clipboard.writeText(txt).then(
              () => done(rows + ' lines copied'),
              () => { console.log(txt); done('clipboard refused it - see the console'); });
          } else { console.log(txt); done('no clipboard here - see the console'); }
        }, e => done('copy failed: ' + e.message));
      }));
      return;
    }
    switch (cmd.toLowerCase()) {
      case 'devmode':
        this.devMode = !this.devMode;
        this.cmdHistory.push(this.devMode
          ? 'dev mode on - M/X view toggles unlocked'
          : 'dev mode off');
        break;
      case 'clear':
        this.cmdHistory.length = 0;
        break;
      case 'wipe':
        this.inv.clear(); this.read = []; this.done = false; this.used.clear();
        if (typeof localStorage !== 'undefined') {
          // this world only: another seed's digs are none of its business
          localStorage.removeItem(saveKey('ascii-save-v1'));
          localStorage.removeItem(saveKey('ascii-caves-v1'));
          localStorage.removeItem(saveKey('ascii-removed-v1'));
        }
        this.cmdHistory.push('save wiped - reload to start over');
        break;
      case 'help':
        this.cmdHistory.push('commands: seed <n>, quality <low|medium|high|auto>,');
        this.cmdHistory.push('copy, time <h>, freeze, daylen <s>, devmode, map,');
        this.cmdHistory.push('wipe, clear, help');
        break;
      default:
        this.cmdHistory.push('unknown command: ' + cmd);
    }
    if (this.cmdHistory.length > 40) this.cmdHistory.splice(0, this.cmdHistory.length - 40);
  },

  // ---- input: returns true when the key was consumed ----

  key(code) {
    // the prologue yields to anything at all, and lands on the title
    if (this.mode === 'myth') {
      if (code !== 'F11') { this.mode = 'title'; this.uiDirty = true; }
      return true;
    }
    if (this.mode === 'play') {
      if (code === 'Tab') { this.open('inventory'); return true; }
      if (code === 'KeyC') { this.open('craft'); return true; }
      if (code === 'KeyJ') { this.open('journal'); return true; }
      if (code === 'KeyE') { this.examine(); return true; }
      return false;
    }
    // the title is dismissed by anything, and offers nothing else
    if (this.mode === 'title') {
      if (code !== 'F11') this.close();
      return true;
    }
    if (code === 'KeyJ' && this.mode !== 'journal') { this.open('journal'); return true; }
    if (code === 'KeyQ' || code === 'Escape' || code === 'Tab') {
      this.close();
      return true;
    }
    if (code === 'KeyW' || code === 'ArrowUp') {
      this.cursor--; this.uiDirty = true; return true;
    }
    if (code === 'KeyS' || code === 'ArrowDown') {
      this.cursor++; this.uiDirty = true; return true;
    }
    if (code === 'KeyE' || code === 'Enter') { this.confirm(); return true; }
    return true;   // swallow everything else while a panel is open
  },

  confirm() {
    if (this.mode === 'craft') {
      const n = RECIPES.length;
      const r = RECIPES[((this.cursor % n) + n) % n];
      if (!this.canCraft(r)) { this.toast('missing ingredients'); return; }
      for (const [id, cnt] of Object.entries(r.needs)) this.take(id, cnt);
      const made = r.n || 1;
      this.give(r.out, made);
      this.toast('crafted: ' + (made > 1 ? made + ' ' : '') + ITEMS[r.out].name);
      return;
    }
    if (this.mode === 'examine' && this.actions.length) {
      const n = this.actions.length;
      const i = ((this.cursor % n) + n) % n;
      this.actions[i].fn();
      // actions may consume themselves (once-per-target); rebuild the list
      this.actions = this.actionsFor(this.target);
      this.cursor = Math.min(i, Math.max(0, this.actions.length - 1));
      this.uiDirty = true;
    }
  },

  // ---- examine ----

  target: null, actions: [],
  used: new Set(),   // once-per-target actions spent this session

  // The spent set rides along in every save, and a long walk gathers
  // thousands of loose stones - unbounded, it is the one part of the save
  // that grows without end. Oldest first out, so a patch the player left
  // far behind will eventually offer itself again, which is a cheaper
  // failure than a save that never stops growing. (A Set iterates in
  // insertion order, so the first value is always the oldest.)
  USED_MAX: 512,

  spend(key) {
    this.used.add(key);
    while (this.used.size > this.USED_MAX) {
      this.used.delete(this.used.values().next().value);
    }
    this.needSave = true;
  },

  examine() {
    const p = Player;
    const cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
    const t = World.examineRay(p.x, p.y, p.z + CFG.EYE,
      Math.cos(p.angle) * cp, Math.sin(p.angle) * cp, sp);
    if (!t) { this.toast('nothing within reach'); return; }
    this.target = t;
    this.actions = this.actionsFor(t);
    this.open('examine');
  },

  useKey(t, what) {
    return what + ':' + (t.kind === 'tree'
      ? t.ix + ',' + t.iy
      : t.point.map(v => Math.round(v)).join(','));
  },

  actionsFor(t) {
    const acts = [];
    const once = (what, label, fn) => {
      if (this.used.has(this.useKey(t, what))) return;
      acts.push({ label, fn: () => { this.spend(this.useKey(t, what)); fn(); } });
    };
    if (t.kind === 'tree') {
      const sp = SPECIES[treeSpecies(t.ix, t.iy)];
      acts.push({ label: 'chop' + (this.count('axe') ? '' : '  (needs an axe)'),
        fn: () => this.chop(t, sp) });
      if (sp.harvest) {
        once('harvest', 'harvest  (+' + sp.harvest[1] + ' ' +
          ITEMS[sp.harvest[0]].name + ')', () => {
            this.give(sp.harvest[0], sp.harvest[1]);
            this.toast('+' + sp.harvest[1] + ' ' + ITEMS[sp.harvest[0]].name);
          });
      }
      once('branch', 'break branch  (+1 wood)', () => {
        this.give('wood', 1);
        this.toast('+1 wood (' + this.count('wood') + ')');
      });
      acts.push({ label: 'hug', fn: () => this.toast(sp.hug) });
    } else if (t.kind === 'lichen') {
      once('pick', 'harvest  (+1 glow lichen)', () => {
        this.give('lichen', 1);
        this.toast('+1 glow lichen (' + this.count('lichen') + ')');
      });
    } else if (t.kind === 'ore' || t.kind === 'gem') {
      const id = t.kind === 'gem' ? 'gem' : oreItem(...t.point);
      const need = t.kind === 'gem' ? 3 : (id === 'iron' ? 2 : 1);
      const has = this.pickTier() >= need;
      once('mine', 'mine  (+1 ' + ITEMS[id].name + ')' +
        (has ? '' : '  (needs ' + this.PICK_NAME[need] + ')'), () => {
          if (!has) { this.toast('you need ' + this.PICK_NAME[need] + ' for that'); return; }
          this.give(id, 1);
          this.toast('+1 ' + ITEMS[id].name + ' (' + this.count(id) + ')');
        });
    } else if (t.kind === 'stone') {
      acts.push({ label: 'pick up  (+1 stone)', fn: () => {
        Removed.add(t.ix, t.iy);
        this.give('stone', 1);
        this.toast('+1 stone (' + this.count('stone') + ')');
        this.close();
      } });
    } else if (t.kind === 'boulder') {
      const has = this.pickTier() >= 1;   // plain rock: any pick will do
      acts.push({ label: 'break' + (has ? '  (+3 stone)' : '  (needs a pickaxe)'),
        fn: () => {
          if (!has) { this.toast('you need a pickaxe for that'); return; }
          Removed.add(t.ix, t.iy);
          this.give('stone', 3);
          this.toast('the boulder splits  (+3 stone)');
          this.close();
        } });
    } else if (t.kind === 'rock' || t.kind === 'cavewall' || t.kind === 'dug') {
      // Loose scree, gathered by hand: the bootstrap out of having no tools
      // at all, since every recipe starts with stone.
      once('gather', 'gather loose stone  (+1 stone)', () => {
        this.give('stone', 1);
        this.toast('+1 stone (' + this.count('stone') + ')');
      });
    } else if (t.kind === 'pillar' && t.hall) {
      // Far enough out, no people's record reaches the hall and the pillar
      // is only a pillar. The region is finite; the world is not.
      const ins = Lore.inscription(t.hall.cx, t.hall.cy, t.hall.k);
      if (ins) {
        const seen = this.read.includes(ins.key);
        acts.push({ label: seen ? 'read again' : 'read the inscription',
          fn: () => this.readInscription(ins) });
      }
    } else if (t.kind === 'water') {
      acts.push({ label: 'drink', fn: () => this.toast('Cold and clean.') });
    }
    return acts;
  },

  // ---- the record ----

  // Which depths the player has read from. The story runs founding, digging,
  // end down the three bands, so holding all three is holding the whole of
  // it - and it can only be done by going down.
  bandsRead() {
    const b = new Set();
    for (const k of this.read) b.add(k.split(',')[2]);
    return b;
  },

  objective() {
    if (this.done) return 'the record is whole';
    const n = this.bandsRead().size;
    if (this.read.length === 0) return 'find the carved halls, and read what they cut';
    return 'the record runs deeper: ' + n + ' of 3 depths read';
  },

  readInscription(ins) {
    this.reading = ins;
    if (!this.read.includes(ins.key)) {
      this.read.push(ins.key);
      this.needSave = true;
    }
    this.open('reading');
    if (!this.done && this.bandsRead().size >= 3) {
      this.done = true;
      this.needSave = true;
    }
  },

  chop(t, sp) {
    if (!this.count('axe')) { this.toast('you need an axe for that'); return; }
    if (typeof Removed === 'undefined') { this.toast('the axe is not sharp yet'); return; }
    Removed.add(t.ix, t.iy);
    this.give('wood', sp.chop);
    this.toast('the ' + sp.name + ' falls  (+' + sp.chop + ' wood)');
    this.close();
  },

  describe(t) {
    switch (t.kind) {
      case 'tree': {
        const sp = SPECIES[treeSpecies(t.ix, t.iy)];
        return [sp.name.toUpperCase(), sp.desc];
      }
      case 'stone':     return ['LOOSE STONE', 'Fist-sized. It would go in a',
                                'pocket without complaint.'];
      case 'boulder':   return ['BOULDER', 'Half-buried and going nowhere.',
                                'It would take a pickaxe.'];
      case 'water':     return ['WATER', 'Still, dark, patient.'];
      case 'lichen':    return ['GLOW LICHEN', ITEMS.lichen.desc];
      case 'ore':       return [ITEMS[oreItem(...t.point)].name.toUpperCase() + ' VEIN',
                                'A seam of metal threading the stone.'];
      case 'gem':       return ['GEM IN THE ROCK',
                                'Deep in a vein, something is catching',
                                'the light that is not stone.'];
      case 'cavewall':  return ['CAVE WALL', 'Water-worn stone. It has been',
                                'down here longer than anything.'];
      case 'dug':       return ['HEWN ROCK', 'Tool marks. Yours.'];
      case 'stair':     return ['STAIR WELL', 'Old, deliberate, patient work.',
                                'Someone cut this. Long ago.'];
      case 'pillar':    return ['CARVED PILLAR', 'Tool marks spiral upward.',
                                'It is holding the mountain up.'];
      case 'hallfloor': return ['CARVED FLOOR', 'Dead flat. Nothing natural',
                                'is this flat.'];
      case 'sand':      return ['SHORE SAND', 'Fine and pale. A shovel would',
                                'move it easily.'];
      case 'rock':      return ['BARE ROCK', 'Too steep for soil to hold.',
                                'Loose scree lies at your feet.'];
      case 'grass':     return ['MEADOW', 'Wind-combed grass over deep soil.'];
      default:          return [t.kind.toUpperCase(), ''];
    }
  },

  // ---- per-frame ----

  tick(dt) {
    // a map that lags behind where you are standing is worse than none
    if (this.devMode && typeof Player !== 'undefined' && this.mapAt() !== this.mapKey) {
      this.uiDirty = true;
    }
    if (this.mode === 'myth') {
      this.mythT += dt;
      this.uiDirty = true;
      const all = (Lore.init().myth || { lines: [] }).lines;
      // once it has all been said, hold it a moment and then step aside
      if (this.mythT > all.length * this.MYTH_LINE + this.MYTH_HOLD * 4) {
        this.mode = 'title';
      }
    }
    if (this.toastT > 0) {
      this.toastT -= dt;
      if (this.toastT <= 0) { this.toastMsg = ''; this.uiDirty = true; }
    }
    if (this.needSave) {
      this.saveTimer += dt;
      if (this.saveTimer > 2) { this.saveTimer = 0; this.save(); }
    }
  },

  // ---- the minimap (devmode) ----
  //
  // Drawn into the glyph grid like everything else, because a DOM overlay
  // would be the one thing on screen that is not made of characters. North
  // is up: the chronicle calls -y north, and the map has to agree with the
  // bearings the inscriptions give.
  //
  // Cells are taller than they are wide, so a cell covers proportionally
  // more world vertically - otherwise the map is squashed and a circle of
  // ground reads as an ellipse.
  MAP: { w: 31, h: 15, u: 12 },
  MAP_ZOOM: [6, 12, 24, 48, 96],
  MAP_RAMP: '.,:;=+*#',      // land, low to high; water has its own mark
  MAP_KIND: { hold: 'H', farm: 'F', mine: 'M', fort: 'T' },
  mapRows: null, mapKey: '',

  // What the map is centred on, as a key: rebuilding only when this changes
  // keeps 465 terrain samples off the frames where nothing moved.
  mapAt() {
    const uy = this.MAP.u * CFG.CELL_H / CFG.CELL_W;
    return Math.round(Player.x / this.MAP.u) + ',' +
           Math.round(Player.y / uy) + ',' + this.MAP.u;
  },

  buildMap() {
    const key = this.mapAt();
    if (this.mapRows && this.mapKey === key) return this.mapRows;
    this.mapKey = key;
    const M = this.MAP;
    const ux = M.u, uy = M.u * CFG.CELL_H / CFG.CELL_W;
    const cx = (M.w - 1) / 2, cy = (M.h - 1) / 2;
    const px = Player.x, py = Player.y;
    const g = [];
    for (let j = 0; j < M.h; j++) {
      const row = [];
      for (let i = 0; i < M.w; i++) {
        const h = terrainH(px + (i - cx) * ux, py + (j - cy) * uy);
        row.push(h < CFG.SEA_LEVEL ? '~' : this.MAP_RAMP[
          clamp(Math.floor(h / CFG.TERRAIN_MAX * this.MAP_RAMP.length),
                0, this.MAP_RAMP.length - 1)]);
      }
      g.push(row);
    }
    const put = (wx, wy, ch) => {
      const i = Math.round((wx - px) / ux + cx);
      const j = Math.round((wy - py) / uy + cy);
      if (i >= 0 && i < M.w && j >= 0 && j < M.h) g[j][i] = ch;
    };
    // Cave mouths, which is most of what this is for: they are the one
    // thing in the world you have to find on foot and cannot see far.
    const SE = CAVES.SHAFT_E;
    for (let sy = Math.floor((py - cy * uy) / SE); sy <= Math.floor((py + cy * uy) / SE); sy++) {
      for (let sx = Math.floor((px - cx * ux) / SE); sx <= Math.floor((px + cx * ux) / SE); sx++) {
        const a = shaftAt(sx, sy, 0);
        if (a) put(a.ax, a.ay, '>');
      }
    }
    // Settlements: standing in capitals, gone in lower case, so a glance
    // says which of them there is anybody left in.
    if (typeof Lore !== 'undefined' && Lore.S) {
      for (const st of Lore.S.sites) {
        const ch = this.MAP_KIND[st.kind] || 'S';
        put(st.x, st.y, st.abandoned < 0 ? ch : ch.toLowerCase());
      }
    }
    g[Math.round(cy)][Math.round(cx)] = '@';
    this.mapRows = g.map(r => r.join(''));
    return this.mapRows;
  },

  drawMap() {
    const M = this.MAP;
    const x0 = Overlay.cols - M.w - 1;
    if (x0 < 1 || Overlay.rows < M.h + 4) return;   // no room; say nothing
    const rows = this.buildMap();
    Overlay.write(x0, 1, ('map ' + M.u + 'u  ' +
      Math.round(Player.x) + ',' + Math.round(Player.y)).slice(0, M.w));
    for (let j = 0; j < rows.length; j++) Overlay.write(x0, 2 + j, rows[j]);
  },

  // ---- panel rendering (into the Overlay glyph grid) ----

  // Panels are lines of text placed in the field, not boxes: nothing is
  // padded out to a common width, because padding would clear a rectangle
  // of cells and put the solid backing chip back.
  panel(lines) {
    const w = Math.max(...lines.map(l => l.length));
    const x0 = Math.max(1, (Overlay.cols - w) >> 1);
    const y0 = Math.max(1, ((Overlay.rows - lines.length) >> 1) - 2);
    for (let i = 0; i < lines.length; i++) {
      if (lines[i]) Overlay.write(x0, y0 + i, lines[i]);
    }
  },

  drawUI() {
    if (this.devMode && typeof Player !== 'undefined') this.drawMap();
    if (this.toastMsg) {
      Overlay.writeCentre(Overlay.rows - 3, ' ' + this.toastMsg + ' ');
    }
    if (this.mode === 'myth') this.drawMyth();
    if (this.mode === 'inventory') this.drawInventory();
    if (this.mode === 'examine') this.drawExamine();
    if (this.mode === 'craft') this.drawCraft();
    if (this.mode === 'console') this.drawConsole();
    if (this.mode === 'reading') this.drawReading();
    if (this.mode === 'journal') this.drawJournal();
    if (this.mode === 'title') this.drawTitle();
  },

  // One line of the myth at a time, laid out for the whole of it from the
  // first line, so the text does not walk up the screen as more arrives.
  drawMyth() {
    const all = (Lore.init().myth || { lines: [] }).lines;
    if (!all.length) { this.mode = 'title'; return; }
    const shown = Math.min(all.length, Math.floor(this.mythT / this.MYTH_LINE));
    const w = Math.max(...all.map(l => l.length));
    const x0 = Math.max(1, (Overlay.cols - w) >> 1);
    const y0 = Math.max(1, (Overlay.rows - (all.length + 2)) >> 1);
    for (let i = 0; i < shown; i++) if (all[i]) Overlay.write(x0, y0 + i, all[i]);
    if (shown >= all.length) {
      Overlay.write(x0, y0 + all.length + 1, 'press any key');
    }
  },

  drawTitle() {
    this.panel([
      'A S C I I   W O R L D',
      '',
      'Every hill, cave and stone here is a',
      'number, worked out the moment you look',
      'at it. Nothing is stored. It goes on as',
      'far as you care to walk.',
      '',
      'You are standing at a cave mouth. Someone',
      'cut the stair below you, a long time ago,',
      'and left their record on the walls.',
      '',
      'Find out who they were.',
      '',
      'E    look at what is in front of you',
      'WASD walk    Space jump    LMB dig',
      'Tab  your things',
      'C    craft   J record   Enter console',
      '',
      'press any key',
    ]);
  },

  drawReading() {
    if (!this.reading) return;
    const lines = ['CUT INTO THE PILLAR', ''];
    for (const l of this.reading.lines) lines.push(l);
    lines.push('');
    if (this.done && this.bandsRead().size >= 3) {
      lines.push('That is the last of it. The record is whole.');
      lines.push('[J] read it through  [Q] close');
    } else {
      lines.push(this.objective());
      lines.push('[Q] close');
    }
    this.panel(lines);
  },

  drawJournal() {
    const lines = ['THE RECORD', ''];
    if (this.read.length === 0) {
      lines.push('Nothing yet. Somewhere below, someone');
      lines.push('cut their history into the stone.');
    } else {
      // Deepest last, so the panel reads the way the descent did. Different
      // halls can belong to different peoples now, so each entry carries
      // its own name rather than the panel carrying one for all of them.
      const order = [...this.read].sort((a, b) =>
        Number(b.split(',')[2]) - Number(a.split(',')[2]));
      for (const key of order) {
        const [cx, cy, k] = key.split(',').map(Number);
        const ins = Lore.inscription(cx, cy, k);
        if (!ins) continue;
        for (const l of ins.lines) lines.push(l);
        lines.push('');
      }
      lines.push(this.done
        ? 'That is as deep as anyone cut. Nobody came back up.'
        : this.objective());
    }
    lines.push('[Q] close');
    this.panel(lines);
  },

  drawConsole() {
    const w = Math.min(Overlay.cols - 4, 70);
    const h = 9;
    const x0 = 2, y0 = Math.max(1, Overlay.rows - h - 2);
    Overlay.write(x0, y0, 'CONSOLE' + (this.devMode ? ' [dev]' : ''));
    const rows = h - 2;
    const hist = this.cmdHistory.slice(-rows);
    for (let i = 0; i < rows; i++) {
      if (hist[i]) Overlay.write(x0 + 1, y0 + 1 + i, hist[i].slice(0, w - 2));
    }
    Overlay.write(x0 + 1, y0 + h - 1, ('> ' + this.cmdBuf + '_').slice(0, w - 2));
  },

  canCraft(r) {
    for (const [id, cnt] of Object.entries(r.needs)) {
      if (this.count(id) < cnt) return false;
    }
    return true;
  },

  drawCraft() {
    const lines = ['CRAFTING', ''];
    const n = RECIPES.length;
    const cur = ((this.cursor % n) + n) % n;
    for (let i = 0; i < n; i++) {
      const r = RECIPES[i];
      const needs = Object.entries(r.needs)
        .map(([id, cnt]) => cnt + ' ' + ITEMS[id].name).join(', ');
      const owned = this.count(r.out) ? '  (have ' + this.count(r.out) + ')' : '';
      const mark = this.canCraft(r) ? '' : '  - missing';
      const out = (r.n > 1 ? r.n + ' ' : '') + ITEMS[r.out].name;
      lines.push((i === cur ? '> ' : '  ') +
        out.padEnd(16) + needs + mark + owned);
    }
    lines.push('');
    lines.push('[W/S] choose  [E] craft  [Q] close');
    this.panel(lines);
  },

  drawExamine() {
    if (!this.target) return;
    const lines = [...this.describe(this.target), ''];
    if (this.actions.length) {
      const n = this.actions.length;
      const cur = ((this.cursor % n) + n) % n;
      for (let i = 0; i < n; i++) {
        lines.push((i === cur ? '> ' : '  ') + this.actions[i].label);
      }
      lines.push('');
      lines.push('[W/S] choose  [E] do  [Q] close');
    } else {
      lines.push('[Q] close');
    }
    this.panel(lines);
  },

  drawInventory() {
    const lines = ['INVENTORY', ''];
    const ids = [...this.inv.keys()];
    if (ids.length === 0) {
      lines.push('(empty)');
      lines.push('');
      lines.push('dig for stone, examine [E] a');
      lines.push('tree for wood');
    } else {
      for (const id of ids) {
        const it = ITEMS[id] || { name: id };
        lines.push(it.name.padEnd(14) + ' x ' + this.count(id));
      }
    }
    lines.push('');
    lines.push('[Q] close');
    this.panel(lines);
  },

  // ---- persistence ----

  // Everything the player accumulated, including where they were standing:
  // a world you return to has to still have you in it.
  snapshot() {
    const inv = {};
    for (const [k, v] of this.inv) inv[k] = v;
    return {
      inv, read: this.read, done: this.done,
      at: typeof Player !== 'undefined' ? [Player.x, Player.y, Player.angle,
                                           Player.pitch, Player.z] : null,
      t: typeof Sky !== 'undefined' ? Sky.t : null,
      used: [...this.used],
    };
  },

  restore(s) {
    this.inv.clear();
    for (const k of Object.keys(s.inv || {})) this.inv.set(k, s.inv[k]);
    this.read = Array.isArray(s.read) ? s.read : [];
    this.done = !!s.done;
    this.used = new Set((s.used || []).slice(-this.USED_MAX));
    this.spawnAt = Array.isArray(s.at) ? s.at : null;
    if (typeof s.t === 'number' && typeof Sky !== 'undefined') Sky.t = s.t;
  },

  save() {
    if (typeof localStorage === 'undefined') { this.needSave = false; return; }
    try { localStorage.setItem(saveKey('ascii-save-v1'), JSON.stringify(this.snapshot())); }
    catch (e) { console.warn('save failed: ' + e.message); }
    this.needSave = false;
  },

  load() {
    if (typeof localStorage === 'undefined') return;
    const s = localStorage.getItem(saveKey('ascii-save-v1'));
    if (!s) return;
    try { this.restore(JSON.parse(s)); }
    catch (e) { console.warn('load failed'); }
  },
};
</script>
<script>
// ---- js/player.js ----
// First-person player over the infinite terrain: WASD move, arrows/mouse
// look, slope- and water-limited movement, trunk-circle tree collision.
const Player = {
  x: 0, y: 0, z: 0, angle: 0.6,
  pitch: 0, // radians; ±90° is straight up/down
  keys: {},
  // Vertical state. The camera used to ride the floor and nothing else, so
  // there was no way to leave the ground and no way to be in water.
  vz: 0,
  onGround: true,
  swimming: false,

  init() {
    // a saved game puts you back where you stopped, facing where you looked
    const at = Game.spawnAt;
    if (at) {
      this.x = at[0]; this.y = at[1];
      this.angle = at[2]; this.pitch = at[3];
      this.z = at[4];
    } else {
      const [sx, sy] = World.findSpawn();
      this.x = sx; this.y = sy;
      this.z = World.groundZ(sx, sy);
    }

    addEventListener('keydown', e => {
      // the console wants raw typed characters, not just key codes - route
      // it before the code-only panel dispatch below
      if (Game.mode === 'console') { Game.consoleInput(e); e.preventDefault(); return; }
      // the game's modal layer gets every key first; panels capture W/S/E/Q
      if (Game.key(e.code)) { e.preventDefault(); return; }
      this.keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();   // or the page scrolls
      if (e.code === 'Enter') { Game.openConsole(); return; }
      // view toggles are debug tools, locked behind the "devmode" command
      if (e.code === 'KeyM' && Game.devMode) CFG.MONO = !CFG.MONO;
      if (e.code === 'KeyX' && Game.devMode) CFG.RAW = !CFG.RAW;
      if (e.code === 'KeyV' && GPURenderer.ok) {
        const sets = Object.keys(GlyphAtlas.SETS);
        const next = sets[(sets.indexOf(CFG.GLYPH_SET) + 1) % sets.length];
        console.info('glyph set:', JSON.stringify(GPURenderer.setGlyphSet(next)));
      }
      if (e.code === 'KeyF') {
        if (document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
      }
      // debug: hop into the cave system below, or back to the surface
      if (e.code === 'KeyG') {
        const h = World.groundZ(this.x, this.y);
        if (this.z < h - 1.5) {
          this.z = h;
        } else {
          let found = false;
          for (let z = -1.5; z > -35; z -= 0.3) {
            if (caveV(this.x, this.y, z, h) > 0) {
              const fz = World.walkZ(this.x, this.y, z);
              if (fz !== null) { this.z = fz; found = true; }
              break;
            }
          }
          if (!found) console.info('no cave below this spot');
        }
      }
    });
    addEventListener('keyup', e => { this.keys[e.code] = false; });

    const canvas = document.getElementById('screen');
    canvas.addEventListener('click', () => {
      if (Game.mode === 'myth') { Game.mode = 'title'; Game.uiDirty = true; return; }
      if (Game.mode === 'title') Game.close();
      canvas.requestPointerLock();
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    const locked = () => document.pointerLockElement === canvas;
    this.mouse = {};
    addEventListener('mousedown', e => { if (locked()) this.mouse[e.button] = true; });
    addEventListener('mouseup', e => { this.mouse[e.button] = false; });
    let skipEvents = 0;
    document.addEventListener('pointerlockchange', () => { skipEvents = 2; });
    addEventListener('mousemove', e => {
      if (!locked() || Game.mode !== 'play') return;
      if (skipEvents > 0) { skipEvents--; return; }
      const mx = clamp(e.movementX, -120, 120);
      const my = clamp(e.movementY, -120, 120);
      this.angle += mx * 0.0022;
      const LIM = Math.PI / 2 - 0.001;
      this.pitch = clamp(this.pitch - my * 0.0022, -LIM, LIM);
    });
  },

  // first solid point along the view ray within digging reach, or null
  aim() {
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    const dx = Math.cos(this.angle) * cp, dy = Math.sin(this.angle) * cp;
    const ez = this.z + CFG.EYE;
    for (let t = 0.3; t <= CFG.DIG_REACH; t += 0.08) {
      const px = this.x + dx * t, py = this.y + dy * t, pz = ez + sp * t;
      if (solidD(px, py, pz) >= 0) return [px, py, pz, dx, dy, sp];
    }
    return null;
  },

  // What is under a point, and how much water is over it. The bed is the
  // density field's floor, so this reads the same on a hillside, a cave
  // floor and a lake bottom.
  footing(x, y, z) {
    const bed = World.walkZ(x, y, z);
    const gz = World.groundZ(x, y);
    const under = bed === null ? gz : bed;
    return { bed, gz, depth: gz < CFG.SEA_LEVEL ? CFG.SEA_LEVEL - under : 0 };
  },

  // Props stop you whatever you are doing: a trunk is a trunk whether you
  // are walking past it, swimming past it or falling past it.
  propsBlock(x, y) {
    const near = World.trunkNear(x, y, 1);
    if (near && near.dist < near.tree.trunkR + 0.22) return true;
    return !!World.rockNear(x, y);
  },

  blocked(x, y) {
    const h = World.groundZ(x, y);
    const underground = this.z < h - 1.5;

    // Afloat: the water is not an obstacle and there is no step to measure,
    // because you are not standing on anything. Only solid things stop you.
    if (this.swimming) {
      for (let dz = 0.1; dz <= 1.7; dz += 0.4) {
        if (solidD(x, y, this.z + dz) >= 0) return true;
      }
      return this.propsBlock(x, y);
    }

    // In the air: the drop is not an obstacle either, or you could not jump
    // a gap. Collide against solids at the height you are actually at.
    if (!this.onGround) {
      for (let dz = 0.1; dz <= 1.7; dz += 0.4) {
        if (solidD(x, y, this.z + dz) >= 0) return true;
      }
      return underground ? false : this.propsBlock(x, y);
    }

    // On foot: the old rules, minus the wall that water used to be. Water
    // you can stand up in is waded, and anything deeper is entered by
    // swimming rather than refused.
    const fz = World.walkZ(x, y, this.z);
    if (fz === null) return true;
    const deep = h < CFG.SEA_LEVEL && CFG.SEA_LEVEL - fz > CFG.WADE;
    if (!deep && Math.abs(fz - this.z) > CFG.STEP_UP) return true;
    // headroom: refuse pinched passages
    for (let dz = 0.5; dz <= 1.7; dz += 0.4) {
      if (solidD(x, y, fz + dz) >= 0) return true;
    }
    if (!underground && this.propsBlock(x, y)) return true;
    return false;
  },

  update(dt) {
    // frozen while a panel is open
    if (Game.mode !== 'play') { this.keys = {}; return; }
    const k = this.keys;
    const turn = 2.1 * dt;
    if (k['ArrowLeft']) this.angle -= turn;
    if (k['ArrowRight']) this.angle += turn;

    // where you are before anything moves: it decides how fast you go and
    // whether your feet are on anything
    const f0 = this.footing(this.x, this.y, this.z);
    this.swimming = f0.depth > CFG.WADE && this.z < CFG.SEA_LEVEL;

    const run = (k['ShiftLeft'] || k['ShiftRight']) ? 2.0 : 1.0;
    const drag = this.swimming ? CFG.SWIM_SPD
               : f0.depth > 0.25 ? CFG.WADE_SPD : 1.0;
    const spd = 4.2 * run * dt * drag;
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);

    let mx = 0, my = 0;
    if (k['KeyW'] || k['ArrowUp']) { mx += dx; my += dy; }
    if (k['KeyS'] || k['ArrowDown']) { mx -= dx; my -= dy; }
    if (k['KeyA']) { mx += dy; my -= dx; }
    if (k['KeyD']) { mx -= dy; my += dx; }

    const len = Math.hypot(mx, my);
    if (len > 0.001) {
      mx = mx / len * spd; my = my / len * spd;
      // axis-separated collision so we slide along obstacles
      if (!this.blocked(this.x + mx, this.y)) this.x += mx;
      if (!this.blocked(this.x, this.y + my)) this.y += my;
      Game.needSave = true;   // where you are is part of the save
    }
    // digging: LMB carves, RMB fills; fills never engulf the player
    this.digCd = Math.max(0, (this.digCd || 0) - dt);
    if ((this.mouse[0] || this.mouse[2]) && this.digCd <= 0) {
      const hit = this.aim();
      if (hit) {
        if (this.mouse[0]) {
          // what you are digging decides whether you can dig it at all
          const r = Game.digAt(hit[0], hit[1], hit[2]);
          if (r > 0) Edits.splat(hit[0], hit[1], hit[2], r, -100);
        } else {
          const digR = CFG.DIG_R;
          const fx = hit[0] - hit[3] * 0.6;
          const fy = hit[1] - hit[4] * 0.6;
          const fz = hit[2] - hit[5] * 0.6;
          const hd = Math.hypot(fx - this.x, fy - this.y);
          const overlap = hd < digR + 0.35 &&
            fz > this.z - digR && fz < this.z + 1.8 + digR;
          if (!overlap) Edits.splat(fx, fy, fz, digR, 100);
        }
        this.digCd = 0.15;
      }
    }

    this.vertical(dt, k);
  },

  // Up and down. Three regimes that never overlap: afloat, in the air, and
  // on foot. Only the last of them rides the floor, which is all the game
  // used to do.
  vertical(dt, k) {
    const f = this.footing(this.x, this.y, this.z);
    this.swimming = f.depth > CFG.WADE && this.z < CFG.SEA_LEVEL;

    if (this.swimming) {
      // You float. The body rides so the eye sits just clear of the
      // surface, which is also why there is no diving: below the water
      // plane the renderer has nothing to show you but sky.
      const ride = CFG.SEA_LEVEL + CFG.SWIM_EYE - CFG.EYE;
      this.z += (ride - this.z) * Math.min(1, dt * CFG.SWIM_RISE);
      this.vz = 0;
      this.onGround = false;
      return;
    }

    // A jump only leaves ground you are standing on. Treading water gives
    // nothing to push against.
    if (k['Space'] && this.onGround) {
      this.vz = CFG.JUMP;
      this.onGround = false;
    }

    if (this.onGround) {
      if (f.bed === null) { this.onGround = false; return; }
      this.z += (f.bed - this.z) * Math.min(1, dt * 10);
      // walked off the edge of something
      if (this.z - f.bed > 0.3) { this.onGround = false; this.vz = 0; }
      return;
    }

    this.vz -= CFG.GRAV * dt;
    this.z += this.vz * dt;
    // a ceiling stops a jump dead rather than letting it climb through
    if (this.vz > 0 && solidD(this.x, this.y, this.z + 1.7) >= 0) this.vz = 0;
    if (f.bed !== null && this.z <= f.bed) {
      this.z = f.bed;
      this.vz = 0;
      this.onGround = true;
    }
    // came down in deep water: the fall ends in a splash, not a landing
    if (!this.onGround && this.z < CFG.SEA_LEVEL && f.depth > CFG.WADE) {
      this.swimming = true;
      this.vz = 0;
    }
  },
};
</script>
<script>
// ---- js/webgpu/atlas.js ----
// Procedural glyph atlas.
//
// Glyph order is measured, not guessed: every candidate is rendered and its
// ink coverage sampled, then the set is sorted by coverage and resampled so
// the ramp is close to linear in brightness. A hand-ordered ramp is uneven —
// the gaps show up as banding in smooth gradients.

// Full printable-ASCII strip (codes 32..126) for the text overlay, rendered
// at the display cell size like the ramp atlas so texels stay 1:1 with pixels.
const TextAtlas = {
  FIRST: 32, COUNT: 95,

  build(cellW, cellH) {
    const W = Math.max(4, Math.round(cellW || 10));
    const H = Math.max(6, Math.round(cellH || 18));
    const cv = document.createElement('canvas');
    cv.width = W * this.COUNT;
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(6, Math.round(H * 0.85))}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < this.COUNT; i++) {
      ctx.fillText(String.fromCharCode(this.FIRST + i), i * W + W / 2, H / 2);
    }
    return { canvas: cv };
  },
};

const GlyphAtlas = {
  // Candidate pools, printable ASCII only — no block elements, which read as
  // pixels rather than as text. Both pools top out near 25% ink, so the tone
  // curve in the fragment shader does the work of keeping bright areas
  // (mainly sky) off the end of the ramp.
  SETS: {
    ascii:   ' .\'`^",:;!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@',
    symbols: ' .\'`^",:;!|/\\()[]{}<>~+-_=*#%&@$?',
  },
  CELL: 32,
  LEVELS: 24,

  measure(chars) {
    const S = 16;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.font = `bold ${S * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const out = [];
    for (const ch of chars) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff';
      ctx.fillText(ch, S / 2, S / 2 + 1);
      const d = ctx.getImageData(0, 0, S, S).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i];
      out.push({ ch, cov: sum / (S * S * 255) });
    }
    return out;
  },

  // pick LEVELS glyphs whose coverages are as evenly spaced as possible
  buildRamp(setName) {
    const seen = new Set();
    const uniq = [];
    for (const g of this.measure(this.SETS[setName] || this.SETS.symbols)) {
      const key = g.cov.toFixed(4);
      if (seen.has(key)) continue;      // drop visually identical glyphs
      seen.add(key);
      uniq.push(g);
    }
    uniq.sort((a, b) => a.cov - b.cov);

    // Walk the sorted glyphs and take the first past each evenly spaced
    // threshold. Glyphs whose coverage is nearly identical look the same on
    // screen, so admitting them would spend ramp steps that show no change;
    // this keeps every step visually distinct and lets the count fall to
    // whatever the font can actually supply.
    const lo = uniq[0].cov, hi = uniq[uniq.length - 1].cov;
    const stepSize = (hi - lo) / (this.LEVELS - 1);
    const ramp = [];
    let next = lo;
    for (const g of uniq) {
      if (g.cov + 1e-9 >= next) {
        ramp.push(g);
        next = g.cov + stepSize;
      }
    }
    const last = uniq[uniq.length - 1];
    if (ramp[ramp.length - 1] !== last) ramp.push(last);
    return ramp;
  },

  // cell is the on-screen size of a glyph in device pixels; rendering the
  // atlas at exactly that size keeps texel-to-pixel mapping 1:1, which is
  // what stops the glyphs from aliasing into moire
  build(setName, cellW, cellH) {
    const ramp = this.buildRamp(setName || CFG.GLYPH_SET);
    this.ramp = ramp;
    const W = Math.max(4, Math.round(cellW || 10));
    const H = Math.max(6, Math.round(cellH || 18));
    const n = ramp.length;
    const cv = document.createElement('canvas');
    cv.width = W * n;
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(6, Math.round(H * 0.85))}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(ramp[i].ch, i * W + W / 2, H / 2);
    }
    return { canvas: cv, levels: n,
             chars: ramp.map(g => g.ch).join('') };
  },
};
</script>
<script>
// ---- js/webgpu/shaders.js ----
// WGSL sources.
//
// Pass 1 (compute): one invocation per low-res cell, each casting a true 3D
// ray into an INFINITE procedural world. Terrain is a continuous noise
// function of world position evaluated in the shader — nothing is stored, so
// the world has no edges and no cell steps: rays march the smooth heightfield
// and normals come from its gradient. Trees are placed by deterministic hash
// per integer cell and traced as trunk + opaque, noise-holed canopy. Water is a sea
// level plane. Sun visibility is a real marched shadow ray; AO is traced
// hemisphere rays. Entities (future creatures) are articulated primitives.
//
// The same hash/noise functions are mirrored in js/util.js so CPU collision
// agrees with what the GPU draws.
//
