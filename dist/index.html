        { binding: 8, resource: { buffer: this.steadPrimBuf } },
      ],
    });
    this.renderBind = this.device.createBindGroup({
      layout: this.renderPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: this.lowTex.createView() },
        { binding: 1, resource: this.atlasTex.createView() },
        { binding: 2, resource: this.sampler },
        { binding: 3, resource: { buffer: this.rparBuf } },
        { binding: 4, resource: this.textTex.createView() },
        { binding: 5, resource: { buffer: this.overlayBuf } },
        { binding: 6, resource: { buffer: this.starBuf } },
      ],
    });
  },

  handleResize() {
    const oc = this.cols, or = this.rows;
    const ow = this.cellW, oh = this.cellH;
    this.resize();
    if (!this.ok) return;
    // a changed cell size means the atlas is no longer 1:1 with the display
    if (this.cellW !== ow || this.cellH !== oh) { this.buildAtlas(CFG.GLYPH_SET); return; }
    if (this.cols !== oc || this.rows !== or) this.allocTargets();
  },

  render() {
    if (!this.ok) return;
    const dev = this.device;

    // --- camera basis, genuinely rotated by pitch (true 3-point perspective) ---
    const a = Player.angle, p = Player.pitch;
    const cp = Math.cos(p), sp = Math.sin(p);
    const fwd = [Math.cos(a) * cp, Math.sin(a) * cp, sp];
    const right = [-Math.sin(a), Math.cos(a), 0];
    // up = fwd x right  (the other order points down and flips the image)
    const up = [
      fwd[1] * right[2] - fwd[2] * right[1],
      fwd[2] * right[0] - fwd[0] * right[2],
      fwd[0] * right[1] - fwd[1] * right[0],
    ];
    // the whole sky - sun position, moon, every colour - comes from Sky
    const sky = Sky.state();
    const tanX = CFG.PLANE_LEN;
    const tanY = tanX * (this.rows * this.cellH) / (this.cols * this.cellW);

    // --- player edits: re-pack the resident chunk set when it changed ---
    if (Edits.gpuDirty) {
      const res = Edits.pack(Player.x, Player.y, Player.z);
      dev.queue.writeBuffer(this.editHeadBuf, 0, Edits.head);
      // The headers are half a kilobyte and always go. The bricks are 32 KB
      // each, and only the ones whose contents actually changed go with
      // them: digging held the mouse down at seven scoops a second, and
      // each one used to re-send the whole megabyte to alter a few hundred
      // bytes of it.
      const brick = CAVES.EDIT_CHUNK ** 3;
      for (const i of res.slots) {
        dev.queue.writeBuffer(this.editDataBuf, i * brick, Edits.data, i * brick, brick);
      }
      this.editCount = res.count;
      this.editBounds = res.bounds;
      Edits.gpuDirty = false;
    }

    // Buildings are repacked when the player has walked far enough to
    // change what is in range, not every frame: laying out a village is
    // milliseconds of work and the answer only changes as you move.
    if (typeof Steading !== 'undefined' && typeof Lore !== 'undefined' && Lore.S) {
      const moved = !this.steadAt ||
        Math.hypot(Player.x - this.steadAt[0], Player.y - this.steadAt[1]) > CFG.STEAD_STEP;
      if (moved) {
        const r = Steading.pack(Lore.S, Player.x, Player.y, Lore.S.now,
                                this.steadHead, this.steadPrim,
                                CFG.STEAD_HEAD, CFG.STEAD_PRIM);
        this.steadCount = r.heads;
        this.steadAll = r.all;
        this.steadAt = [Player.x, Player.y];
        if (r.heads > 0) {
          dev.queue.writeBuffer(this.steadHeadBuf, 0, this.steadHead, 0, r.heads * 8);
          dev.queue.writeBuffer(this.steadPrimBuf, 0, this.steadPrim, 0, r.prims * 20);
        }
      }
    }

    if (Removed.gpuDirty) {
      this.removedCount = Removed.pack(Player.x, Player.y);
      dev.queue.writeBuffer(this.removedBuf, 0, Removed.data);
      Removed.gpuDirty = false;
    }

    const u = new Float32Array(72);
    u[0] = Player.x;  u[1] = Player.y;
    u[2] = this.cols; u[3] = this.rows;
    // eye rides on the terrain; Player.z is kept current by Player.update
    u[4] = fwd[0]; u[5] = fwd[1]; u[6] = fwd[2];
    u[7] = (Player.z || 0) + CFG.EYE;
    u[8] = right[0]; u[9] = right[1]; u[10] = right[2]; u[11] = CFG.MAX_DIST;
    u[12] = up[0]; u[13] = up[1]; u[14] = up[2];   u[15] = CFG.SEED;
    u.set(sky.sunDir, 16);                          u[19] = CFG.SHADOW;
    u[20] = tanX; u[21] = tanY; u[22] = CFG.TERRAIN_MAX;
    u[23] = Math.min(Entities.list.length, CFG.MAX_ENTS);
    u[24] = CFG.SUN_ANGLE; u[25] = CFG.SUN_SAMPLES;
    u[26] = CFG.AO_SAMPLES; u[27] = CFG.AO_RADIUS;
    u[28] = CFG.TREE_REACH;
    u[29] = CFG.SEA_LEVEL;
    u[30] = (performance.now() / 1000) % 3600;
    u[31] = CFG.SHADE_NEAR;
    u[43] = CFG.SHADE_FAR;
    u.set(sky.sunCol, 32);       u[35] = sky.sunI;
    u.set(sky.ambCol, 36);       u[39] = sky.ambI;
    u.set(sky.skyLo, 40);
    u.set(sky.skyHi, 44);
    if (this.editCount > 0 && this.editBounds) {
      u[48] = this.editBounds[0]; u[49] = this.editBounds[1];
      u[50] = this.editBounds[2]; u[51] = this.editCount;
      u[52] = this.editBounds[3]; u[53] = this.editBounds[4];
      u[54] = this.editBounds[5];
    }
    // a carried light brightens the headlamp; the gem lantern beats a torch
    u[56] = CFG.LAMP * (Game.count('lantern') > 0 ? 3.4
                      : Game.count('torch') > 0 ? 2.2 : 1);
    u[57] = this.removedCount;
    u[58] = sky.starAmt;
    u[59] = sky.skyAngle;
    u.set(sky.moonDir, 60);
    u[63] = sky.night;
    u.set(sky.keyDir, 64);
    u[67] = this.steadCount;
    if (this.steadCount > 0 && this.steadAll) {
      u[68] = this.steadAll[0]; u[69] = this.steadAll[1];
      u[70] = this.steadAll[2]; u[71] = this.steadAll[3];
    }
    dev.queue.writeBuffer(this.uniBuf, 0, u);
    dev.queue.writeBuffer(this.rparBuf, 0, new Float32Array([
      this.cols, this.rows, this.levels, CFG.MONO ? 1 : 0,
      CFG.RAW ? 1 : 0, CFG.TONE_BLACK, CFG.TONE_WHITE, CFG.TONE_GAMMA]));

    // --- entities: (x, y, heading, kind) + kind extras, e1[0] = ground z ---
    let k = 0;
    const live = Math.min(Entities.list.length, CFG.MAX_ENTS);
    for (let i = 0; i < live; i++) {
      const e = Entities.list[i];
      this.entData[k++] = e.x; this.entData[k++] = e.y;
      this.entData[k++] = e.heading || 0; this.entData[k++] = e.kind || 0;
      this.entData[k++] = World.groundZ(e.x, e.y);
      this.entData[k++] = e.e1 ? e.e1[1] : 0;
      this.entData[k++] = e.e1 ? e.e1[2] : 0;
      this.entData[k++] = e.e1 ? e.e1[3] : 0;
    }
    if (live > 0) dev.queue.writeBuffer(this.entBuf, 0, this.entData);

    if (Overlay.dirty && Overlay.data &&
        Overlay.data.byteLength === this.cols * this.rows * 4) {
      dev.queue.writeBuffer(this.overlayBuf, 0, Overlay.data);
      Overlay.dirty = false;
    }

    const enc = dev.createCommandEncoder();
    const cpass = enc.beginComputePass();
    cpass.setPipeline(this.computePipe);
    cpass.setBindGroup(0, this.computeBind);
    cpass.dispatchWorkgroups(Math.ceil(this.cols / 8), Math.ceil(this.rows / 8));
    cpass.end();

    const rp = enc.beginRenderPass({
      colorAttachments: [{
        view: this.ctx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: 'clear', storeOp: 'store',
      }],
    });
    rp.setPipeline(this.renderPipe);
    rp.setBindGroup(0, this.renderBind);
    rp.draw(3);
    rp.end();
    dev.queue.submit([enc.finish()]);

    const probe = this.frameNo === undefined ? (this.frameNo = 0) : ++this.frameNo;
    if (probe < 3) {
      dev.pushErrorScope('validation');
      dev.popErrorScope().then(err => {
        if (err) console.error('[WebGPU] frame error: ' + err.message);
      });
    }
  },

  // 4x4 ordered dither, mirroring bayer4 in the fragment shader.
  BAYER: [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5],

  // The frame already IS a grid of characters, so this hands it back as
  // text. Everything the glyph pass does to choose a character happens
  // again here on the CPU - the same tone curve, the same ordered dither,
  // the same measured ramp, the same star and overlay substitutions, in the
  // same order - so what lands on the clipboard is the screen, not an
  // impression of it. KEEP IN SYNC with the fragment shader's fs().
  async captureText() {
    if (!this.ok) throw new Error('the renderer is not running');
    const cols = this.cols, rows = this.rows;
    const bpr = Math.ceil(cols * 4 / 256) * 256;
    const lumBuf = this.device.createBuffer({
      size: bpr * rows,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const starBuf = this.device.createBuffer({
      size: cols * rows * 4,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = this.device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: this.lowTex },
      { buffer: lumBuf, bytesPerRow: bpr }, [cols, rows]);
    enc.copyBufferToBuffer(this.starBuf, 0, starBuf, 0, cols * rows * 4);
    this.device.queue.submit([enc.finish()]);
    await lumBuf.mapAsync(GPUMapMode.READ);
    await starBuf.mapAsync(GPUMapMode.READ);
    const lum = new Uint8Array(lumBuf.getMappedRange());
    const star = new Uint32Array(starBuf.getMappedRange());
    const ramp = this.rampChars, levels = this.levels;
    const ui = Overlay.data;
    const span = Math.max(CFG.TONE_WHITE - CFG.TONE_BLACK, 1e-3);
    let out = '';
    for (let y = 0; y < rows; y++) {
      let line = '';
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        // the overlay wins over a star, and a star over the ramp - the same
        // precedence the fragment shader applies to the coverage sample
        const code = ui ? ui[i] : 0;
        if (code === CFG.UI_BLANK) { line += ' '; continue; }
        if (code > 32 && code < 127) { line += String.fromCharCode(code); continue; }
        const st = star[i];
        if (st > 32 && st < 127) { line += String.fromCharCode(st); continue; }
        const v = lum[y * bpr + x * 4 + 3] / 255;
        const tone = Math.pow(clamp((v - CFG.TONE_BLACK) / span, 0, 1), CFG.TONE_GAMMA);
        const dith = (this.BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.5) / levels;
        const gi = Math.floor(clamp(tone + dith, 0, 0.9999) * levels);
        line += ramp[Math.min(gi, ramp.length - 1)];
      }
      // the darkest step of the ramp is a space, so a trailing run of them
      // carries nothing; trimming keeps the text paste-clean
      out += line.replace(/[ ]+$/, '') + '\n';
    }
    lumBuf.unmap(); lumBuf.destroy();
    starBuf.unmap(); starBuf.destroy();
    return out;
  },

  // Dumps the compute output so a black screen can be attributed to either
  // the raymarch (all zeros) or the glyph upscale (non-zero here).
  async debugReadback() {
    if (!this.ok) return 'GPU renderer inactive: ' + (this.reason || 'n/a');
    const bpr = Math.ceil(this.cols * 4 / 256) * 256;
    const buf = this.device.createBuffer({
      size: bpr * this.rows,
      usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const enc = this.device.createCommandEncoder();
    enc.copyTextureToBuffer({ texture: this.lowTex },
      { buffer: buf, bytesPerRow: bpr }, [this.cols, this.rows]);
    this.device.queue.submit([enc.finish()]);
    await buf.mapAsync(GPUMapMode.READ);
    const d = new Uint8Array(buf.getMappedRange());
    let nonZero = 0, maxV = 0, sum = 0;
    for (let y = 0; y < this.rows; y++) for (let x = 0; x < this.cols; x++) {
      const v = d[y * bpr + x * 4 + 3];
      if (v > 0) nonZero++;
      if (v > maxV) maxV = v;
      sum += v;
    }
    const total = this.cols * this.rows;
    buf.unmap(); buf.destroy();
    return { cols: this.cols, rows: this.rows, litCells: nonZero, total,
             maxLum: maxV, avgLum: +(sum / total).toFixed(1) };
  },
};
</script>
<script>
// ---- js/main.js ----
// Bootstrap + frame loop. The world is procedural in the shader; nothing to
// generate up front beyond finding a spawn point.
(async function () {
  // a macrotask yield so a boot-stage line paints before a synchronous block
  const breathe = () => new Promise(r => setTimeout(r, 0));

  Entities.init();
  Quality.init();     // ray budgets, before anything reads them
  Edits.init();       // load persisted digs before the first frame
  Removed.init();     // load persisted cleared cells
  Game.init();        // load persisted inventory
  Boot.set('running the centuries');
  await breathe();
  Lore.init();        // six thousand years, ~40 ms, before anything asks
  Boot.set('finding a door');
  await breathe();
  Player.init();      // spawn scan: the heavy synchronous bit
  Boot.set('waking the gpu');
  await breathe();

  let ready = false;
  try { ready = await GPURenderer.init(); }
  catch (e) { GPURenderer.reason = e.message; }

  if (!ready) {
    Boot.fail();
    document.getElementById('screen').hidden = true;
    const msg = document.createElement('div');
    msg.id = 'fail';
    msg.innerHTML = '<h1>WebGPU required</h1><p>' +
      (GPURenderer.reason || 'unknown error') + '</p>' +
      '<p>This renderer runs entirely on the GPU. Try a current Chrome, Edge, ' +
      'Firefox or Safari on a machine with a working GPU driver.</p>';
    document.body.appendChild(msg);
    console.error('[ASCII World] ' + GPURenderer.reason);
    return;
  }

  addEventListener('resize', () => GPURenderer.handleResize());

  let last = performance.now();
  let fpsAcc = 0, fpsN = 0, fpsLine = '';
  // ASCII only: the text atlas covers 32..126, and anything outside it
  // clears to a gap rather than drawing
  const HUD_LINE = 'wasd move - space jump - E examine - Tab items - C craft - J record - Enter console - LMB dig';

  addEventListener('beforeunload', () => {
    if (Edits.needSave) Edits.save();
    if (Removed.needSave) Removed.save();
    if (Game.needSave) Game.save();
  });

  let booted = false;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    Player.update(dt);
    Entities.update(dt, now / 1000);
    Sky.update(dt);
    Edits.tick(dt);
    Removed.tick(dt);
    Game.tick(dt);
    // watches the frame time and gives up rays when it has to; a no-op
    // unless the player asked for automatic quality (it is the default)
    Quality.tick(dt);

    fpsAcc += dt; fpsN++;
    if (fpsAcc > 0.5) {
      const ms = (fpsAcc / fpsN) * 1000;
      const hh = Math.floor(Sky.hour());
      const mm = Math.floor((Sky.hour() - hh) * 60);
      fpsLine = Math.round(fpsN / fpsAcc) + ' fps ' +
        ms.toFixed(1) + ' ms ' + GPURenderer.cols + 'x' + GPURenderer.rows +
        ' ' + Player.x.toFixed(0) + ',' + Player.y.toFixed(0) +
        ' ' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
      fpsAcc = 0; fpsN = 0;
      Game.uiDirty = true;
    }
    if (Game.uiDirty) {
      Overlay.clear();
      Overlay.writeRight(0, fpsLine);
      Overlay.write(1, 0, Game.objective());
      Overlay.write(1, Overlay.rows - 1, HUD_LINE);
      Game.drawUI();
      Game.uiDirty = false;
    }
    GPURenderer.render();
    if (!booted) { booted = true; Boot.done(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
