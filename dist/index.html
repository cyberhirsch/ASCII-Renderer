<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ASCII World</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  /* size is set in JS to an exact multiple of the glyph cell; stretching it
     here to the viewport would reintroduce fractional scaling */
  canvas { display: block; image-rendering: pixelated; }
  canvas[hidden] { display: none; }
  #boot {
    position: fixed; inset: 0; background: #000; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .45s ease;
  }
  #boot pre {
    margin: 0; text-align: center; color: #c8d2dc;
    font: 14px/1.7 "Consolas", "Courier New", monospace;
  }
  #boot .dim { color: #566070; }
  #fail {
    color: #c8d2dc; font: 14px/1.6 "Consolas", monospace;
    max-width: 34em; padding: 2em; text-align: center;
  }
  #fail h1 { font-size: 1.4em; font-weight: 600; color: #e8eef4; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="boot"><pre>a s c i i   w o r l d

<span id="boot-bar">                          </span>
<span id="boot-msg" class="dim">reading the seed</span></pre></div>
<script>
// Boot screen: paints before the bundle parses, animates a pulse along the
// same brightness ramp the renderer draws with, and hands stage text to
// main.js. Removed by Boot.done() on the first rendered frame.
(function () {
  const RAMP = ' .:-=+*#%@';
  const W = 26;
  let t = 0;
  const iv = setInterval(() => {
    t++;
    const period = 2 * (W - 1);
    const ph = t % period;
    const pos = ph < W ? ph : period - ph;
    let s = '';
    for (let i = 0; i < W; i++) {
      const g = Math.max(0, RAMP.length - 1 - Math.abs(i - pos) * 2);
      s += RAMP[g];
    }
    const bar = document.getElementById('boot-bar');
    if (bar) bar.textContent = s;
  }, 90);
  window.Boot = {
    set(msg) {
      const m = document.getElementById('boot-msg');
      if (m) m.textContent = msg;
    },
    done() {
      clearInterval(iv);
      const b = document.getElementById('boot');
      if (!b) return;
      b.style.opacity = '0';
      setTimeout(() => b.remove(), 500);
    },
    fail() {
      clearInterval(iv);
      const b = document.getElementById('boot');
      if (b) b.remove();
    },
  };
})();
</script>
<script>
// ---- js/config.js ----
// Global configuration. Plain script, shared global scope (inlined at build time).
const CFG = {
  PLANE_LEN: 0.85,    // tan(horizontal half-FOV)
  MAX_DIST: 140,      // ray cutoff (world units); beyond fades to haze
  EYE: 1.55,          // camera height above ground
  SEED: 8151623,      // world seed; MUST stay below 2^24 so the f32 uniform
                      // carries it exactly and CPU and GPU agree on the world
  // rendering. Character cells are sized like a terminal's: monospace glyphs
  // are roughly 0.55x as wide as tall, so cells are taller than wide - and
  // bigger overall, which is both the look and far fewer rays.
  CELL_W: 12,         // CSS px per cell, horizontal
  CELL_H: 22,         // CSS px per cell, vertical
  MONO: false,        // uniform grayscale; devmode + M toggles
  SUN_COL: [1.00, 0.86, 0.46],
  SUN_I: 1.55,
  AMB_COL: [0.20, 0.31, 0.55],
  AMB_I: 0.55,
  SKY_HORIZON: [0.34, 0.46, 0.66],
  SKY_ZENITH: [0.04, 0.10, 0.32],
  GLYPH_SET: 'ascii', // ascii | symbols  (C cycles)
  // Tone curve applied before glyph selection. White sits at the luminance
  // sunlit surfaces actually reach; above that the brightest glyphs go
  // unused, below it they clip and the highlights flatten.
  TONE_BLACK: 0.0,
  TONE_WHITE: 0.90,
  TONE_GAMMA: 0.9,
  RAW: false,         // debug: show the shaded image without glyph mapping (X)
  SUN_AZ: 0.9,        // sun azimuth at t=0 (rad); the cycle sweeps from here
  SUN_EL: 0.7,        // legacy static elevation; Sky drives elevation now
  DAY_LEN: 300,       // seconds for a full day/night cycle
  // night sky: the moon's angular radius and how thick its crescent is
  MOON_R: 0.085,
  MOON_CRESC: 0.42,   // offset of the shadow disc, in moon radii
  MOON_GLOW: 0.10,    // halo strength around the disc
  MOON_GLOW_P: 400,   // halo tightness; higher is a smaller halo
  MOON_DARK: 0.04,    // earthshine lift on the unlit limb
  STAR_GRID: 90,      // celestial grid fineness; higher = smaller stars
  STAR_RARE: 0.976,   // hash above this is a star, at full dark
  // Stars do not arrive at sunset. The first show once the sun is a little
  // way under, and the field fills in as it sinks further - these are the
  // two depths, measured as sin(elevation) below the horizon.
  STAR_DUSK: 0.06,    // ~3.5 deg down: the brightest few
  STAR_DARK: 0.30,    // ~17 deg down: the whole field
  // The celestial pole the sky turns about. Tilted well off vertical, so
  // stars rise and set instead of just wheeling around the zenith.
  STAR_POLE_AZ: 2.2,
  STAR_POLE_EL: 0.85,
  SHADOW: 0.04,       // sun contribution inside full shadow (sky light only)
  // wide sun disc: broad, soft penumbrae that grow with distance from the
  // occluder (0.05 rad is the "soft shadows" look; the real sun is 0.0047)
  SUN_ANGLE: 0.05,
  SUN_SAMPLES: 16,    // shadow rays per pixel
  AO_SAMPLES: 32,     // hemisphere rays per pixel
  AO_RADIUS: 9,       // AO ray length, world units
  TREE_REACH: 2,      // cells a canopy may overhang; sets the search radius
  // lighting LOD: full shadow/AO ray budgets inside SHADE_NEAR, then a hard
  // cut - beyond it no shadow or AO rays are traced at all, no taper
  SHADE_NEAR: 40,
  SHADE_FAR: 40.001,
  // terrain: a continuous, infinite heightfield evaluated in the shader and
  // mirrored in js/util.js. No stored grid, no world bounds.
  TERRAIN_MAX: 16,    // amplitude: highest possible ground, world units
  // caves: view distance underground; rays in cave air stop here and fade out
  CAVE_VIEW: 60,
  // headlamp: camera-attached light so unlit caves are explorable; falls off
  // with distance, only applied to underground hits
  LAMP: 0.6,
  // Overlay cell value meaning "render nothing here". 0 is transparent (the
  // scene's own glyph) and 32 is a space (also the scene's glyph), so clear
  // air around UI text needs a code of its own.
  UI_BLANK: 31,
  // underground ray caps: sun is mostly absent down there, so penumbra
  // fidelity is worth less than frame time
  CAVE_SUN: 8,
  CAVE_AO: 16,
  SEA_LEVEL: 2.4,     // water plane; terrain below this is sea/lake
  // entities (future creatures); buffer capacity fixed, live count per frame
  MAX_ENTS: 64,
  // digging: resident edit-chunk capacity on the GPU, reach and scoop size
  EDIT_MAX: 32,
  DIG_REACH: 3.5,
  DIG_R: 1.1,
  // cleared cells visible to the GPU (nearest the player); farther cleared
  // props may visually reappear until this rises in a later phase
  REMOVED_MAX: 64,
};
</script>
<script>
// ---- js/util.js ----
// Hashing / noise / terrain — bit-compatible mirrors of the WGSL functions in
// js/webgpu/shaders.js. The GPU draws the world from these functions and the
// CPU collides against them, so any change MUST be made in both places.

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

// u32 hash, identical to WGSL uhash (Math.imul == u32 multiply wrap)
function jsUhash(a, b) {
  let n = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663)) >>> 0;
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177) >>> 0;
  return (n ^ (n >>> 16)) >>> 0;
}

function hash01(x, y, s) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0) / 4294967296;
}

function hash2i(x, y, s) {
  const h = jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0);
  return [(h & 0xffff) / 65536, ((h >>> 16) & 0xffff) / 65536];
}

// 2D value noise, smoothstep-interpolated — mirror of WGSL vn2
function vn2(px, py, s) {
  const ix = Math.floor(px), iy = Math.floor(py);
  const fx = px - ix, fy = py - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash01(ix, iy, s), b = hash01(ix + 1, iy, s);
  const c = hash01(ix, iy + 1, s), d = hash01(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// -------- terrain height — mirror of WGSL terrainH --------
function terrainH(px, py) {
  const s = CFG.SEED >>> 0;
  const wx = vn2(px * 0.013, py * 0.013, (s ^ 0x77) >>> 0);
  const wy = vn2(px * 0.013 + 37.0, py * 0.013 + 91.0, (s ^ 0x77) >>> 0);
  const qx = px * 0.023 + (wx - 0.5) * 1.4;
  const qy = py * 0.023 + (wy - 0.5) * 1.4;
  let h = vn2(qx, qy, s) * 0.62 +
          vn2(qx * 2.7, qy * 2.7, (s ^ 0x9e37) >>> 0) * 0.26 +
          vn2(qx * 6.1, qy * 6.1, (s ^ 0x51ed) >>> 0) * 0.12;
  h = Math.pow(h, 1.55);
  return h * CFG.TERRAIN_MAX;
}

// -------- caves: shared constants + density mirror --------
// These values are interpolated into the WGSL template in
// js/webgpu/shaders.js, so shader and mirror cannot disagree
// (scripts/verify.js enforces the convention: no literal CAVE_/EDIT_
// constants in the shader source).
const CAVES = {
  STEP: 0.3,     // primary-ray march step through cave air, world units
  STEPS: 200,    // primary-ray march budget (STEP * STEPS = CAVE_VIEW)
  TSTEP: 0.55,   // occlusion-ray march step through cave air
  TSTEPS: 14,    // occlusion-ray march budget
  BAND: 12,      // depth-band height; band k spans [k*BAND, k*BAND+BAND)
  TOP: -1,       // no natural void above this z (highest ceiling is -1.4)
  BOT: -36,      // deepest band floor for the slice; extensible downward
  MASK_F: 0.006, // cave-region mask frequency (regions ~150 u across)
  MASK_LO: 0.62, // mask gate: smoothstep(LO, HI, noise)
  MASK_HI: 0.70,
  FLOOR_F: 0.05, // floor ramp frequency; FLOOR_A * FLOOR_F * 1.5 bounds the
  FLOOR_A: 3.0,  // slope (~0.23 = 13 deg) - walkability is by construction
  PASS_F: 0.045, // passage isoline frequency (winding at ~20 u scale)
  PASS_F2: 0.062,// second isoline family; crossings knit the network together
  CHAM_F: 0.02,  // chamber noise frequency
  PASS_W: 0.06,  // passage half-width in isoline value units
  CHAM_W: 0.15,  // extra half-width inside chambers
  PASS_SCALE: 15,// value units -> approx world units (1 / (1.5 * PASS_F))
  // shafts: helical stair wells, one candidate per SHAFT_E cell per band
  // pair. Compact by design so the field only ever checks its own cell.
  SHAFT_E: 48,     // placement cell size; anchor jitter keeps R inside it
  SHAFT_R: 3.0,    // outer radius of the stair well
  SHAFT_RIN: 0.75, // central column radius (keeps the stair "supported")
  SHAFT_PITCH: 3.4,// vertical drop per full turn; grade ~16 deg mid-stair
  SHAFT_OPEN: 0.7, // open fraction of each turn (headroom 2.4, slab 1.0)
  // carved halls: one candidate per HALL_E cell per band; flat-floored
  // rotated rooms with a pillar lattice, entered wherever the natural
  // passage network punctures their walls
  HALL_E: 96,      // placement cell size
  PIL_S: 3.5,      // pillar lattice spacing inside halls
  PIL_R: 0.45,     // pillar half-width (square pillars, Chebyshev metric)
  // edits: sparse voxel-delta overlay (digging); see js/edits.js
  EDIT_CHUNK: 32,      // voxels per chunk edge
  EDIT_VOX: 0.5,       // voxel size, world units
  EDIT_SCALE: 0.03125, // stored i8 -> density units (1/32; range ~±4)
  EDIT_WORDS: 8192,    // u32 words per chunk (32^3 / 4)
};

// Band floor: a low-frequency ramp whose slope is bounded by construction.
// Mirror of WGSL caveFloor. KEEP IN SYNC.
function caveFloor(k, x, y) {
  const s = CFG.SEED >>> 0;
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  return k * CAVES.BAND + 1.6 +
         vn2(x * CAVES.FLOOR_F, y * CAVES.FLOOR_F, (bs ^ 0x0F1D) >>> 0) *
         CAVES.FLOOR_A;
}

// Natural banded void: positive inside carved space (roughly world-unit
// magnitude), very negative elsewhere. Passages are the near-median isolines
// of a per-band value noise - the median level set of a random field
// percolates, so the network is connected across the infinite plane. gz is
// terrainH(x, y), passed in because every caller already has it.
// Mirror of WGSL naturalV. KEEP IN SYNC.
function naturalV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return -1e9;
  const s = CFG.SEED >>> 0;
  const m = vn2(x * CAVES.MASK_F, y * CAVES.MASK_F, (s ^ 0x33AA) >>> 0);
  const gate = smoothstep(CAVES.MASK_LO, CAVES.MASK_HI, m) *
               smoothstep(CFG.SEA_LEVEL + 0.5, CFG.SEA_LEVEL + 1.5, gz);
  if (gate <= 0.001) return -1e9;
  const k = Math.floor(z / CAVES.BAND);
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  const fz = caveFloor(k, x, y);
  // two isoline families: each percolates on its own, and their crossings
  // knit isolated contour rings into one network with natural junctions
  const n1 = vn2(x * CAVES.PASS_F, y * CAVES.PASS_F, (bs ^ 0x5EA5) >>> 0);
  const n2 = vn2(x * CAVES.PASS_F2, y * CAVES.PASS_F2, (bs ^ 0x7A3B) >>> 0);
  const iso = Math.min(Math.abs(n1 - 0.5), Math.abs(n2 - 0.5));
  const c = vn2(x * CAVES.CHAM_F, y * CAVES.CHAM_F, (bs ^ 0xC4A6) >>> 0);
  const wide = smoothstep(0.60, 0.85, c);
  const w = (CAVES.PASS_W + wide * CAVES.CHAM_W) * gate;
  const ceilH = 2.6 + wide * 3.4;
  const h = (w - iso) * CAVES.PASS_SCALE;
  const vz = Math.min(z - fz, fz + ceilH - z);
  return Math.min(h, vz);
}

// Shaft candidate for placement cell (cx, cy) and band pair j (0 = surface
// into band -1, j >= 1 = band -j into band -(j+1)). Presence requires a
// passage at the anchor in the destination band (both bands for j >= 1), so
// a shaft always daylights into the network. When (px, py) is given, the
// cheap position/distance precheck runs before any expensive validation -
// the order the WGSL twin relies on. Mirror of WGSL shaftAt. KEEP IN SYNC.
function shaftAt(cx, cy, j, px, py) {
  const s = CFG.SEED >>> 0;
  const sj = (s ^ (0x51F7 + j * 0x9101)) >>> 0;
  if (hash01(cx, cy, sj) >= (j === 0 ? 0.55 : 0.8)) return null;
  const h2 = hash2i(cx, cy, (sj ^ 0x2C55) >>> 0);
  const ax = cx * CAVES.SHAFT_E + 10 + h2[0] * 28;
  const ay = cy * CAVES.SHAFT_E + 10 + h2[1] * 28;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > (CAVES.SHAFT_R + 2.0) * (CAVES.SHAFT_R + 2.0)) {
      return null;
    }
  }
  const gz = terrainH(ax, ay);
  let zTop, zBot;
  if (j === 0) {
    if (gz < CFG.SEA_LEVEL + 1.2 || gz > 11.0) return null;
    zTop = gz;
    zBot = caveFloor(-1, ax, ay);
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  } else {
    zTop = caveFloor(-j, ax, ay) + 0.2;
    zBot = caveFloor(-j - 1, ax, ay);
    if (naturalV(ax, ay, zTop + 1.0, gz) < 0.15) return null;
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  }
  const phase = hash01(cx, cy, (sj ^ 0x77AD) >>> 0);
  return { ax, ay, zTop, zBot, phase };
}

// Helical stair carve for one shaft: an annulus between the central column
// and the outer wall, with a helicoid floor - SHAFT_OPEN of every turn is
// air, the rest is the stair slab. Open to the sky just above the mouth;
// the bottom join is the band's own passage carving through the outer wall.
// Returns [void, slab]: slab > 0 marks stair steps that must STAY rock even
// where a tall passage or chamber would carve them away - without it the
// last turns of the stair dissolve into the band void and leave a drop.
// Mirror of WGSL helixV. KEEP IN SYNC.
function helixV(x, y, z, a) {
  const dx = x - a.ax, dy = y - a.ay;
  const r = Math.hypot(dx, dy);
  const radial = Math.min(CAVES.SHAFT_R - r, r - CAVES.SHAFT_RIN);
  const u = (a.zTop - z) / CAVES.SHAFT_PITCH +
            Math.atan2(dy, dx) / (2 * Math.PI) + a.phase;
  const su = u - Math.floor(u);
  const sv = Math.min(su, CAVES.SHAFT_OPEN - su) * CAVES.SHAFT_PITCH;
  let v = Math.min(radial, sv);
  // entry apron: a flat ledge ring around the mouth, stepped into from any
  // rim angle; the stair top emerges from it and winds down
  const apron = Math.min(CAVES.SHAFT_R + 1.8 - r,
                         z - (a.zTop - 0.45));
  v = Math.max(v, apron);
  v = Math.min(v, a.zTop + 1.5 - z, z - (a.zBot - 0.2));
  const slab = Math.min(radial,
    Math.min(su - CAVES.SHAFT_OPEN, 1 - su) * CAVES.SHAFT_PITCH,
    Math.min(z - (a.zBot - 0.2), (a.zTop - 0.45) - z));
  return [v, slab];
}

// All shafts near (x, y): anchors are jittered to keep the well inside its
// own placement cell, so only that one cell is ever checked - the cheap
// presence hash is all the hot march loops pay when no shaft is near.
// Returns [void, slab] aggregated over the band pairs.
// Mirror of WGSL shaftV. KEEP IN SYNC.
function shaftV(x, y, z, gz) {
  if (z > gz + 1.5) return [-1e9, -1e9];
  const cx = Math.floor(x / CAVES.SHAFT_E);
  const cy = Math.floor(y / CAVES.SHAFT_E);
  let v = -1e9, slab = -1e9;
  for (let j = 0; j < 3; j++) {
    const a = shaftAt(cx, cy, j, x, y);
    if (!a) continue;
    if (z > a.zTop + 1.5 || z < a.zBot - 0.5) continue;
    const h = helixV(x, y, z, a);
    if (h[0] > v) v = h[0];
    if (h[1] > slab) slab = h[1];
  }
  return [v, slab];
}

// Hall candidate for placement cell (cx, cy) in band k. Presence requires a
// passage at the anchor, so the network's own tunnels puncture the walls -
// those punctures are the doorways. The floor is FLAT: it sits at the
// anchor's band-floor height across the whole room, which against the noisy
// passages is what reads as "someone carved this".
// Mirror of WGSL hallAt. KEEP IN SYNC.
function hallAt(cx, cy, k, px, py) {
  const s = CFG.SEED >>> 0;
  const sk = (s ^ (0xB00B + (8 + k) * 0x8121)) >>> 0;
  if (hash01(cx, cy, sk) >= 0.5) return null;
  const h2 = hash2i(cx, cy, (sk ^ 0x39D1) >>> 0);
  const ax = cx * CAVES.HALL_E + 16 + h2[0] * 64;
  const ay = cy * CAVES.HALL_E + 16 + h2[1] * 64;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > 17 * 17) return null;
  }
  const h3 = hash2i(cx, cy, (sk ^ 0x5A5A) >>> 0);
  const gz = terrainH(ax, ay);
  const fz0 = caveFloor(k, ax, ay);
  if (naturalV(ax, ay, fz0 + 1.2, gz) < 0.15) return null;
  const ang = hash01(cx, cy, (sk ^ 0x11EF) >>> 0) * Math.PI;
  return {
    ax, ay,
    hx: 6 + h3[0] * 5,
    hy: 5 + h3[1] * 3,
    hgt: 3.2 + h3[0] * 1.3,
    fz0,
    ca: Math.cos(ang), sa: Math.sin(ang),
  };
}

// Hall carve near (x, y, z): returns [void, slab]. The room void is a plain
// rotated box; the flat floor slab and the pillar lattice ride the slab
// channel, so neither a chamber below nor one overlapping can dissolve them
// - freestanding pillars in a cavern are exactly the ruin look wanted.
// Mirror of WGSL hallV. KEEP IN SYNC.
function hallV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return [-1e9, -1e9];
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  if (!a) return [-1e9, -1e9];
  const dx = x - a.ax, dy = y - a.ay;
  const lx = a.ca * dx + a.sa * dy;
  const ly = -a.sa * dx + a.ca * dy;
  const inBox = Math.min(a.hx - Math.abs(lx), a.hy - Math.abs(ly));
  const v = Math.min(inBox, z - a.fz0, a.fz0 + a.hgt - z);
  // pillar lattice in the local frame (kept clear of the walls)
  const S = CAVES.PIL_S;
  const frac = t => t - Math.floor(t);
  const mx = Math.abs(frac(lx / S + 0.5) - 0.5) * S;
  const my = Math.abs(frac(ly / S + 0.5) - 0.5) * S;
  const cheb = Math.max(mx, my);
  const pillar = Math.min(CAVES.PIL_R - cheb, inBox - 1.2,
                          z - (a.fz0 - 0.1), a.fz0 + a.hgt - z);
  const floorSlab = Math.min(inBox, a.fz0 - z, z - (a.fz0 - 0.9));
  return [v, Math.max(pillar, floorSlab)];
}

// Which hall stands at this point, or null. CPU only - the shader needs the
// geometry, but only the gameplay side needs to know whose hall it is.
function hallIdAt(x, y, z) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return null;
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  return a ? { cx, cy, k, hall: a } : null;
}

// Cave void field: natural banded passages plus carved shafts and halls,
// minus the protected solids (stair slabs, hall floors, pillars), which win
// over every carve. Mirror of WGSL caveV. KEEP IN SYNC.
function caveV(x, y, z, gz) {
  const sv = shaftV(x, y, z, gz);
  const hv = hallV(x, y, z, gz);
  const v = Math.max(naturalV(x, y, z, gz), sv[0], hv[0]);
  return Math.min(v, -Math.max(sv[1], hv[1]));
}

// Layered density, the one authority on what is solid: positive in rock,
// negative in air. The sparse edit overlay (digging) adds on top - the
// typeof guard keeps this file loadable before js/edits.js and in node
// tests that do not exercise edits. Mirror of WGSL solidD. KEEP IN SYNC.
function solidD(x, y, z) {
  const gz = terrainH(x, y);
  let d = Math.min(gz - z, -caveV(x, y, z, gz));
  if (typeof Edits !== 'undefined' && Edits.bounds) d += Edits.sample(x, y, z);
  return d;
}

// -------- 3D value noise — mirror of WGSL vnoise --------
// Used by the shader for canopy erosion and glow lichen; mirrored here so
// the examine system can recognise a lichen patch at a hit point.
function jsUhash3(x, y, z) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, z >>> 0) >>> 0;
}

function vnoise(px, py, pz) {
  const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
  const fx = px - ix, fy = py - iy, fz = pz - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);
  const s = 1 / 4294967296;
  const c000 = jsUhash3(ix, iy, iz) * s;
  const c100 = jsUhash3(ix + 1, iy, iz) * s;
  const c010 = jsUhash3(ix, iy + 1, iz) * s;
  const c110 = jsUhash3(ix + 1, iy + 1, iz) * s;
  const c001 = jsUhash3(ix, iy, iz + 1) * s;
  const c101 = jsUhash3(ix + 1, iy, iz + 1) * s;
  const c011 = jsUhash3(ix, iy + 1, iz + 1) * s;
  const c111 = jsUhash3(ix + 1, iy + 1, iz + 1) * s;
  const x00 = c000 + (c100 - c000) * ux;
  const x10 = c010 + (c110 - c010) * ux;
  const x01 = c001 + (c101 - c001) * ux;
  const x11 = c011 + (c111 - c011) * ux;
  const y0 = x00 + (x10 - x00) * uy;
  const y1 = x01 + (x11 - x01) * uy;
  return y0 + (y1 - y0) * uz;
}

// -------- ground materials: what the world is made of, per point --------
// Shared constants, interpolated into the WGSL template in
// js/webgpu/shaders.js so shader and mirror cannot disagree (scripts/
// verify.js enforces the no-literals convention for MAT_ too).
const MATS = {
  DIRT: 0, STONE: 1, ORE: 2, GEM: 3,
  SOIL_MAX: 2.4,    // soil depth on dead-flat ground, world units
  SOIL_STEEP: 0.55, // slope where soil runs out entirely (bare rock)
  SOIL_FLAT: 0.12,  // slope below which soil is at full depth
  SOIL_F: 0.09,     // soil-depth variation frequency
  SOIL_VAR: 1.2,    // soil-depth variation amplitude
  ORE_F: 0.021,     // ore-region frequency: most rock holds nothing
  ORE_GATE: 0.62,   // region noise above this can carry veins
  VEIN_F: 0.15,     // vein frequency; two isosurfaces meet in curves
  VEIN_W: 0.05,     // vein half-width in noise-value units
  GEM_CORE: 0.22,   // fraction of the vein width that is gem, not ore
  GEM_Z: -6.0,      // gems only form below this depth
  IRON_Z: -14.0,    // ore below this is iron, above it copper
};

// Soil depth below the surface at (x, y): deep on flats, zero on steep
// ground - which is why hillsides read as bare rock. Mirror of WGSL
// soilDepth. KEEP IN SYNC.
function soilDepth(x, y) {
  const e = 0.5;
  const hx = terrainH(x + e, y) - terrainH(x - e, y);
  const hy = terrainH(x, y + e) - terrainH(x, y - e);
  const slope = Math.hypot(hx, hy) / (2 * e);
  const d = smoothstep(MATS.SOIL_STEEP, MATS.SOIL_FLAT, slope) * MATS.SOIL_MAX +
    (vn2(x * MATS.SOIL_F, y * MATS.SOIL_F, (CFG.SEED ^ 0xD117) >>> 0) - 0.5) *
    MATS.SOIL_VAR;
  return Math.max(d, 0);
}

// What a point of rock is: plain stone, an ore vein, or a gem pocket. Two
// value-noise isosurfaces intersect along CURVES, not sheets - that is what
// makes veins read as branching tubes threading the stone rather than
// slabs. Gems sit in the very core of a deep vein. Mirror of WGSL rockMat.
// KEEP IN SYNC.
function rockMat(x, y, z) {
  const o = (CFG.SEED & 0xff) * 0.7;
  const reg = vnoise(x * MATS.ORE_F + 13 + o, y * MATS.ORE_F + 13,
                     z * MATS.ORE_F + 13);
  if (reg < MATS.ORE_GATE) return MATS.STONE;
  const strength = (reg - MATS.ORE_GATE) / (1 - MATS.ORE_GATE);
  const n1 = vnoise(x * MATS.VEIN_F + o, y * MATS.VEIN_F, z * MATS.VEIN_F);
  const n2 = vnoise(x * MATS.VEIN_F + 41 + o, y * MATS.VEIN_F + 17,
                    z * MATS.VEIN_F + 73);
  const w = MATS.VEIN_W * strength;
  const d1 = Math.abs(n1 - 0.5), d2 = Math.abs(n2 - 0.5);
  if (d1 >= w || d2 >= w) return MATS.STONE;
  if (z < MATS.GEM_Z && d1 < w * MATS.GEM_CORE && d2 < w * MATS.GEM_CORE) {
    return MATS.GEM;
  }
  return MATS.ORE;
}

// Material at a world point. gz is terrainH(x, y) - every caller has it.
// Mirror of WGSL matAt. KEEP IN SYNC.
function matAt(x, y, z, gz) {
  if (z > gz - soilDepth(x, y)) return MATS.DIRT;
  return rockMat(x, y, z);
}

// which ore this depth yields
function oreItem(z) { return z < MATS.IRON_Z ? 'iron' : 'copper'; }

// species index for the tree anchored in cell (ix, iy) - deterministic,
// independent of the placement hash so size and species do not correlate
function treeSpecies(ix, iy) {
  return Math.min(2, Math.floor(hash01(ix, iy, (CFG.SEED ^ 0x5EED) >>> 0) * 3));
}

// -------- loose stones and boulders. KEEP IN SYNC with the WGSL --------
// One prop per cell, hash-placed like the trees, so the cleared-cell set in
// js/removed.js covers all of them with a single "ix,iy".
const PROPS = {
  STONE_D: 0.055,   // chance a cell holds a loose stone
  STONE_R: 0.10,    // stone radius, plus a hashed share again
  STONE_VIEW: 30,   // past this a stone is smaller than a glyph: skip it
  ROCK_D: 0.011,    // chance a cell holds a boulder
  ROCK_R: 0.55,     // boulder radius, plus a hashed share again
  ROCK_VIEW: 90,
};

// A loose stone: small, sits on the ground, free to pick up by hand.
// Mirror of WGSL stoneAt. KEEP IN SYNC.
function stoneAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0x570E) >>> 0) >= PROPS.STONE_D) return null;
  const h2 = hash2i(ix, iy, (s ^ 0x5C0B) >>> 0);
  const r = PROPS.STONE_R * (1 + h2[0]);
  return { cx: ix + 0.2 + h2[0] * 0.6, cy: iy + 0.2 + h2[1] * 0.6, r };
}

// A boulder: too big to lift, wants a pickaxe, and blocks the way.
// Mirror of WGSL rockAt. KEEP IN SYNC.
function rockAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0xB017) >>> 0) >= PROPS.ROCK_D) return null;
  if (treeAt(ix, iy)) return null;        // one prop to a cell
  const h2 = hash2i(ix, iy, (s ^ 0xB0DA) >>> 0);
  const r = PROPS.ROCK_R * (1 + h2[0]);
  return { cx: ix + 0.5, cy: iy + 0.5, r,
           // sunk into the ground so it reads as bedded, not dropped
           z: -r * 0.35 };
}

// -------- tree placement — mirror of WGSL treeAt --------
// returns null or { cx, cy, r, trunkH, trunkR }
function treeAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  const forest = vn2(ix * 0.021, iy * 0.021, (s ^ 0xF0F0) >>> 0);
  const density = smoothstep(0.45, 0.72, forest) * 0.16 + 0.004;
  if (hash01(ix, iy, (s ^ 0x7EE7) >>> 0) >= density) return null;
  const h2 = hash2i(ix, iy, (s ^ 0xA11C) >>> 0);
  const r = 1.0 + h2[0] * 0.5;
  return {
    cx: ix + 0.3 + h2[0] * 0.4,
    cy: iy + 0.3 + h2[1] * 0.4,
    r,
    trunkH: 2.6 + h2[1] * 1.2,
    trunkR: 0.085 + r * 0.055,
  };
}
</script>
<script>
// ---- js/world.js ----
// World queries over the infinite procedural terrain. The heavy lifting —
// heightfield and tree placement — lives in js/util.js as bit-compatible
// mirrors of the shader; this module is the gameplay-facing API on top.
// Authored sites (ruins, lore) will register here in a later phase.
const World = {
  groundZ(x, y) { return terrainH(x, y); },

  isWater(x, y) { return terrainH(x, y) < CFG.SEA_LEVEL; },

  // Walkable floor at (x, y) near zRef: march the density field down from
  // just above head height to the first solid, then refine the boundary.
  // One code path covers open terrain, cave floors, entrance ramps, and
  // (later) dug pits. Returns null when there is no standable floor within
  // a step of zRef - callers treat that as blocked.
  walkZ(x, y, zRef) {
    let z = zRef + 1.4;
    // a start inside rock means a wall taller than a legal step: descend to
    // air first, give up quickly if there is none
    let guard = 0;
    while (solidD(x, y, z) >= 0) {
      z -= 0.15;
      if (++guard > 12) return null;
    }
    const zMin = zRef - 4.0;
    let prev = z;
    while (z > zMin) {
      z -= 0.15;
      if (solidD(x, y, z) >= 0) {
        let a = z, b = prev;
        for (let i = 0; i < 8; i++) {
          const m = (a + b) / 2;
          if (solidD(x, y, m) >= 0) a = m; else b = m;
        }
        return (a + b) / 2;
      }
      prev = z;
    }
    return null;
  },

  // nearest tree trunk within `reach` cells of (x, y), or null
  trunkNear(x, y, reach) {
    const cx = Math.floor(x), cy = Math.floor(y);
    let best = null, bestD = Infinity;
    for (let oy = -reach; oy <= reach; oy++) {
      for (let ox = -reach; ox <= reach; ox++) {
        const tr = treeAt(cx + ox, cy + oy);
        if (!tr) continue;
        if (typeof Removed !== 'undefined' && Removed.has(cx + ox, cy + oy)) continue;
        const d = Math.hypot(tr.cx - x, tr.cy - y);
        if (d < bestD) { bestD = d; best = tr; }
      }
    }
    return best && { tree: best, dist: bestD };
  },

  // nearest boulder overlapping (x, y), or null - boulders block the way
  rockNear(x, y) {
    const cx = Math.floor(x), cy = Math.floor(y);
    for (let oy = -1; oy <= 1; oy++) {
      for (let ox = -1; ox <= 1; ox++) {
        const rk = rockAt(cx + ox, cy + oy);
        if (!rk) continue;
        if (typeof Removed !== 'undefined' && Removed.has(cx + ox, cy + oy)) continue;
        const d = Math.hypot(rk.cx - x, rk.cy - y);
        if (d < rk.r + 0.28) return { rock: rk, ix: cx + ox, iy: cy + oy, dist: d };
      }
    }
    return null;
  },

  // Classify what the view ray meets within examine reach. Returns
  // { kind, point, ... } or null. Trees are tested analytically against the
  // hash-placed set; everything solid is classified by asking the same
  // field functions the renderer draws with.
  examineRay(ex, ey, ez, dx, dy, dz) {
    for (let t = 0.4; t < 4.5; t += 0.07) {
      const px = ex + dx * t, py = ey + dy * t, pz = ez + dz * t;
      // trees: trunk cylinder or canopy sphere in nearby cells
      const cx = Math.floor(px), cy = Math.floor(py);
      for (let oy = -2; oy <= 2; oy++) {
        for (let ox = -2; ox <= 2; ox++) {
          const tr = treeAt(cx + ox, cy + oy);
          if (!tr) continue;
          if (typeof Removed !== 'undefined' && Removed.has(cx + ox, cy + oy)) continue;
          const g = terrainH(tr.cx, tr.cy);
          const d2 = (px - tr.cx) ** 2 + (py - tr.cy) ** 2;
          const canZ = g + tr.trunkH + tr.r * 0.55;
          const inTrunk = d2 < (tr.trunkR + 0.15) ** 2 &&
                          pz > g && pz < g + tr.trunkH;
          const inCanopy = d2 + (pz - canZ) ** 2 < tr.r * tr.r;
          if (inTrunk || inCanopy) {
            return { kind: 'tree', ix: cx + ox, iy: cy + oy, tree: tr,
                     point: [px, py, pz] };
          }
        }
      }
      // loose stones and boulders: spheres resting on the ground
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          const jx = cx + ox, jy = cy + oy;
          if (typeof Removed !== 'undefined' && Removed.has(jx, jy)) continue;
          const rk = rockAt(jx, jy);
          if (rk) {
            const rz = terrainH(rk.cx, rk.cy) + rk.z;
            if ((px - rk.cx) ** 2 + (py - rk.cy) ** 2 + (pz - rz) ** 2 < rk.r ** 2) {
              return { kind: 'boulder', ix: jx, iy: jy, rock: rk,
                       point: [px, py, pz] };
            }
          }
          const st = stoneAt(jx, jy);
          if (st) {
            const sz = terrainH(st.cx, st.cy) + st.r * 0.55;
            const rr = st.r + 0.12;   // small: forgive the aim a little
            if ((px - st.cx) ** 2 + (py - st.cy) ** 2 + (pz - sz) ** 2 < rr * rr) {
              return { kind: 'stone', ix: jx, iy: jy, stone: st,
                       point: [px, py, pz] };
            }
          }
        }
      }
      // open water
      if (pz < CFG.SEA_LEVEL && terrainH(px, py) < CFG.SEA_LEVEL) {
        return { kind: 'water', point: [px, py, pz] };
      }
      if (solidD(px, py, pz) >= 0) return this.classifySolid(px, py, pz);
    }
    return null;
  },

  classifySolid(px, py, pz) {
    const gz = terrainH(px, py);
    const p = [px, py, pz];
    // every solid carries its material: it decides the tool, the yield,
    // and what the examine panel is allowed to offer
    const mat = matAt(px, py, pz, gz);
    if (typeof Edits !== 'undefined' && Edits.bounds &&
        Math.abs(Edits.sample(px, py, pz)) > 0.05) {
      return { kind: 'dug', point: p, mat };
    }
    const hv = hallV(px, py, pz, gz);
    if (hv[1] > -0.3) {
      // inside a hall's protected solids; a pillar is still solid overhead.
      // The hall it belongs to comes back with it: its pillars carry the
      // record its builders cut.
      const up = hallV(px, py, pz + 0.8, gz);
      const id = hallIdAt(px, py, pz);
      return { kind: up[1] > -0.3 ? 'pillar' : 'hallfloor', point: p, mat, hall: id };
    }
    const sv = shaftV(px, py, pz, gz);
    if (sv[0] > -0.5 || sv[1] > -0.3) return { kind: 'stair', point: p, mat };
    if (pz < gz - 1.0) {
      // ore and gems outrank the lichen growing over them
      if (mat === MATS.GEM) return { kind: 'gem', point: p, mat };
      if (mat === MATS.ORE) return { kind: 'ore', point: p, mat };
      if (vnoise(px * 1.9, py * 1.9, pz * 1.9) > 0.8) {
        return { kind: 'lichen', point: p, mat };
      }
      return { kind: 'cavewall', point: p, mat };
    }
    if (gz < CFG.SEA_LEVEL + 0.55) return { kind: 'sand', point: p, mat };
    // soil depth decides meadow vs bare rock - the same function the shader
    // shades with and the shovel checks, so all three agree
    return { kind: mat === MATS.DIRT ? 'grass' : 'rock', point: p, mat };
  },

  // Spawn beside a cave entrance when one exists nearby: scan shaft
  // placement cells ring by ring from the origin, then stand on dry, gentle
  // ground at the rim of the first entrance found.
  findSpawn() {
    for (let ring = 0; ring < 40; ring++) {
      for (let cy = -ring; cy <= ring; cy++) {
        for (let cx = -ring; cx <= ring; cx++) {
          if (Math.max(Math.abs(cx), Math.abs(cy)) !== ring) continue;
          const a = shaftAt(cx, cy, 0);
          if (!a) continue;
          for (let ang = 0; ang < Math.PI * 2; ang += 0.4) {
            const x = a.ax + Math.cos(ang) * (CAVES.SHAFT_R + 2.0);
            const y = a.ay + Math.sin(ang) * (CAVES.SHAFT_R + 2.0);
            const h = terrainH(x, y);
            if (h < CFG.SEA_LEVEL + 0.6) continue;
            // the entry apron ledge sits 0.45 below the mouth; spawn where
            // stepping onto it is a legal move
            if (Math.abs(h - (a.zTop - 0.45)) > 1.0) continue;
            // gentle ground: sample slope
            const s = Math.abs(terrainH(x + 1, y) - h) +
                      Math.abs(terrainH(x, y + 1) - h);
            if (s < 0.8) return [x, y];
          }
        }
      }
    }
    // fallback: any dry, gentle ground, spiralling out from the origin
    for (let r = 0; r < 400; r += 3) {
      for (let a = 0; a < Math.PI * 2; a += 0.7) {
        const x = Math.cos(a) * r, y = Math.sin(a) * r;
        const h = terrainH(x, y);
        if (h < CFG.SEA_LEVEL + 0.6) continue;
        const s = Math.abs(terrainH(x + 1, y) - h) + Math.abs(terrainH(x, y + 1) - h);
        if (s < 0.8) return [x, y];
      }
    }
    return [0, 0];
  },
};
</script>
<script>
// ---- js/sky.js ----
// Time of day: the one place that decides where the sun and moon are and
// what colour the world is lit by. Every value here already travelled to the
// GPU as a per-frame uniform, so a full cycle costs the shader nothing.
//
// Night is art-directed rather than simulated. The glyph ramp only has ~24
// brightness steps; a physically dark night would crush the whole scene into
// the bottom two or three and read as an empty screen. So night is a bright
// moonlit blue - it says "night" through hue and contrast, and the ramp
// stays fully used. Yellow is reserved for the moon and stars, which is what
// makes them read as the only light sources up there.
const Sky = {
  t: 0.30,          // 0..1 through the day. .25 dawn, .5 noon, .75 dusk, 0 midnight
  paused: false,

  // sun height above the horizon, -1..1; the whole cycle keys off this
  sunHeight() { return Math.sin((this.t - 0.25) * Math.PI * 2); },

  // 0 by day, 1 in full night, smooth through the twilights
  night() { return 1 - smoothstep(-0.10, 0.16, this.sunHeight()); },

  // How far out the stars are. Deliberately behind night(): the lighting has
  // already gone blue by sunset, but the sky is still far too bright to see
  // anything in it. The first stars wait until the sun is properly under.
  starAmt() {
    return smoothstep(CFG.STAR_DUSK, CFG.STAR_DARK, -this.sunHeight());
  },

  // The celestial sphere's rotation. One turn a day, in the same sense the
  // sun travels, so the stars and the sun agree about which way the world
  // is turning.
  skyAngle() { return this.t * Math.PI * 2; },

  // how much of the twilight colour to mix in: peaks as the sun crosses over
  dusk() {
    const h = this.sunHeight();
    return Math.max(0, 1 - Math.abs(h) / 0.28);
  },

  update(dt) {
    if (this.paused) return;
    this.t = (this.t + dt / CFG.DAY_LEN) % 1;
  },

  // hour of day, for the HUD and the console: t maps straight onto the
  // clock, so t=0 is midnight, .25 sunrise, .5 noon, .75 sunset
  hour() { return this.t * 24; },

  setHour(h) { this.t = ((h / 24) % 1 + 1) % 1; },

  dir(az, el) {
    const c = Math.cos(el);
    return [Math.cos(az) * c, Math.sin(az) * c, Math.sin(el)];
  },

  sunDir() {
    const el = Math.asin(clamp(this.sunHeight(), -1, 1)) * 0.8;
    return this.dir(CFG.SUN_AZ + this.t * Math.PI * 2, el);
  },

  // the moon runs opposite the sun, so it is up when the sun is not
  moonDir() {
    const el = Math.asin(clamp(-this.sunHeight(), -1, 1)) * 0.75;
    return this.dir(CFG.SUN_AZ + Math.PI * 0.7 + this.t * Math.PI * 2, el);
  },

  // ---- palettes, blended by sun height ----
  // day: warm key over a blue sky. twilight: the sun reddens at the horizon.
  // night: everything blue, lit by a cool moon.
  DAY:   { sun: [1.00, 0.94, 0.78], sunI: 1.55,
           amb: [0.30, 0.42, 0.62], ambI: 0.55,
           lo:  [0.42, 0.56, 0.76], hi: [0.10, 0.22, 0.50] },
  DUSK:  { sun: [1.00, 0.62, 0.30], sunI: 1.30,
           amb: [0.34, 0.34, 0.52], ambI: 0.55,
           lo:  [0.62, 0.46, 0.44], hi: [0.10, 0.16, 0.42] },
  NIGHT: { sun: [0.52, 0.68, 1.00], sunI: 0.62,
           amb: [0.24, 0.36, 0.66], ambI: 0.62,
           lo:  [0.14, 0.22, 0.44], hi: [0.03, 0.07, 0.20] },

  mix3(a, b, k) { return a.map((v, i) => v + (b[i] - v) * k); },

  // the full lighting state for this instant
  state() {
    const n = this.night(), d = this.dusk();
    const base = {
      sun: this.mix3(this.DAY.sun, this.NIGHT.sun, n),
      sunI: this.DAY.sunI + (this.NIGHT.sunI - this.DAY.sunI) * n,
      amb: this.mix3(this.DAY.amb, this.NIGHT.amb, n),
      ambI: this.DAY.ambI + (this.NIGHT.ambI - this.DAY.ambI) * n,
      lo: this.mix3(this.DAY.lo, this.NIGHT.lo, n),
      hi: this.mix3(this.DAY.hi, this.NIGHT.hi, n),
    };
    // twilight rides on top of the day/night blend
    return {
      sunDir: this.sunDir(),
      moonDir: this.moonDir(),
      night: n,
      starAmt: this.starAmt(),
      skyAngle: this.skyAngle(),
      sunCol: this.mix3(base.sun, this.DUSK.sun, d * 0.85),
      sunI: base.sunI + (this.DUSK.sunI - base.sunI) * d * 0.6,
      ambCol: this.mix3(base.amb, this.DUSK.amb, d * 0.6),
      ambI: base.ambI + (this.DUSK.ambI - base.ambI) * d * 0.5,
      skyLo: this.mix3(base.lo, this.DUSK.lo, d * 0.8),
      skyHi: this.mix3(base.hi, this.DUSK.hi, d * 0.5),
    };
  },
};
</script>
<script>
// ---- js/overlay.js ----
// Text overlay composited into the ASCII grid by the glyph pass — the HUD is
// made of the same character cells as the world, not a DOM layer floating
// over it. Cell value 0 is transparent; any printable ASCII code (32..126)
// renders that character over a dark backing chip.
const Overlay = {
  cols: 0, rows: 0, data: null, dirty: false,
  BLANK: CFG.UI_BLANK,   // a cell the glyph pass leaves empty

  resize(cols, rows) {
    this.cols = cols; this.rows = rows;
    this.data = new Uint32Array(cols * rows);
    this.dirty = true;
  },

  clear() {
    if (this.data) this.data.fill(0);
    this.dirty = true;
  },

  write(x, y, str) {
    if (!this.data || y < 0 || y >= this.rows) return;
    const row = y * this.cols;
    const put = (cx, code) => {
      if (cx >= 0 && cx < this.cols) this.data[row + cx] = code;
    };
    // Every gap in UI text is cleared, not just the ends: a space between
    // two words has to read as a space, and letting the glyph field show
    // through it turns a sentence back into noise. Anything unprintable
    // (the atlas is ASCII 32..126) clears too.
    for (let i = 0; i < str.length; i++) {
      const code = str.charCodeAt(i);
      put(x + i, (code > 32 && code < 127) ? code : this.BLANK);
    }
    // plus one cell of clear air on each side of the whole insert
    if (str.length) { put(x - 1, this.BLANK); put(x + str.length, this.BLANK); }
    this.dirty = true;
  },

  writeRight(y, str) { this.write(this.cols - 1 - str.length, y, str); },
  writeCentre(y, str) { this.write((this.cols - str.length) >> 1, y, str); },
};
</script>

<script>
// ---- js/edits.js ----
// Player edits to the world: a sparse voxel-delta overlay on the procedural
// density field. Chunks of EDIT_CHUNK^3 signed bytes at EDIT_VOX resolution
// exist ONLY where digging happened - the rest of the infinite world stays a
// pure function of the seed. The CPU is authoritative (collision samples
// this); the GPU receives up to EDIT_MAX resident chunks nearest the player.
// Persisted to localStorage, edited chunks only.
const Edits = {
  chunks: new Map(),   // "cx,cy,cz" -> Int8Array(EDIT_CHUNK^3), z-major
  bounds: null,        // world AABB over all chunks + trilinear margin
  gpuDirty: false,     // resident set needs re-packing and upload
  needSave: false,
  saveTimer: 0,

  // persistent pack targets so per-dig uploads do not allocate
  head: null, data: null,

  key(cx, cy, cz) { return cx + ',' + cy + ',' + cz; },

  init() {
    const n = CAVES.EDIT_CHUNK;
    this.head = new Float32Array(CFG.EDIT_MAX * 4);
    this.data = new Int8Array(CFG.EDIT_MAX * n * n * n);
    this.load();
  },

  growBounds(cx, cy, cz) {
    const w = CAVES.EDIT_CHUNK * CAVES.EDIT_VOX;
    const m = CAVES.EDIT_VOX;           // trilinear reach past the chunk
    const lo = [cx * w - m, cy * w - m, cz * w - m];
    const hi = [cx * w + w + m, cy * w + w + m, cz * w + w + m];
    if (!this.bounds) { this.bounds = [...lo, ...hi]; return; }
    const b = this.bounds;
    for (let i = 0; i < 3; i++) {
      if (lo[i] < b[i]) b[i] = lo[i];
      if (hi[i] > b[i + 3]) b[i + 3] = hi[i];
    }
  },

  // signed delta at an integer voxel; 0 where no chunk exists
  voxel(ix, iy, iz) {
    const n = CAVES.EDIT_CHUNK;
    const cx = Math.floor(ix / n), cy = Math.floor(iy / n), cz = Math.floor(iz / n);
    const ch = this.chunks.get(this.key(cx, cy, cz));
    if (!ch) return 0;
    return ch[((iz - cz * n) * n + (iy - cy * n)) * n + (ix - cx * n)];
  },

  // trilinear density delta at a world point; mirror of WGSL editDelta.
  // KEEP IN SYNC.
  sample(x, y, z) {
    const b = this.bounds;
    if (!b || x < b[0] || y < b[1] || z < b[2] ||
        x > b[3] || y > b[4] || z > b[5]) return 0;
    const inv = 1 / CAVES.EDIT_VOX;
    const gx = x * inv - 0.5, gy = y * inv - 0.5, gz = z * inv - 0.5;
    const ix = Math.floor(gx), iy = Math.floor(gy), iz = Math.floor(gz);
    const fx = gx - ix, fy = gy - iy, fz = gz - iz;
    let sum = 0;
    for (let c = 0; c < 8; c++) {
      const ox = c & 1, oy = (c >> 1) & 1, oz = (c >> 2) & 1;
      const w = (ox ? fx : 1 - fx) * (oy ? fy : 1 - fy) * (oz ? fz : 1 - fz);
      if (w > 1e-4) sum += this.voxel(ix + ox, iy + oy, iz + oz) * w;
    }
    return sum * CAVES.EDIT_SCALE;
  },

  // Spherical smooth splat; amount < 0 digs, > 0 fills. Fills never place
  // material above the terrain surface - the primary ray march trusts the
  // heightfield in open air, so built-above-ground would be invisible.
  splat(x, y, z, r, amount) {
    const n = CAVES.EDIT_CHUNK;
    const vox = CAVES.EDIT_VOX;
    const lo = [x - r, y - r, z - r].map(v => Math.floor(v / vox - 0.5));
    const hi = [x + r, y + r, z + r].map(v => Math.ceil(v / vox - 0.5));
    for (let iy = lo[1]; iy <= hi[1]; iy++) {
      for (let ix = lo[0]; ix <= hi[0]; ix++) {
        const wx = (ix + 0.5) * vox, wy = (iy + 0.5) * vox;
        const colTop = amount > 0 ? terrainH(wx, wy) - 0.1 : Infinity;
        for (let iz = lo[2]; iz <= hi[2]; iz++) {
          const wz = (iz + 0.5) * vox;
          if (wz > colTop) continue;
          const d = Math.hypot(wx - x, wy - y, wz - z);
          if (d > r) continue;
          const fall = 1 - smoothstep(r * 0.45, r, d);
          const add = Math.round(amount * fall);
          if (add === 0) continue;
          const cx = Math.floor(ix / n), cy = Math.floor(iy / n), cz = Math.floor(iz / n);
          const k = this.key(cx, cy, cz);
          let ch = this.chunks.get(k);
          if (!ch) {
            ch = new Int8Array(n * n * n);
            this.chunks.set(k, ch);
            this.growBounds(cx, cy, cz);
          }
          const li = ((iz - cz * n) * n + (iy - cy * n)) * n + (ix - cx * n);
          ch[li] = clamp(ch[li] + add, -127, 127);
        }
      }
    }
    this.gpuDirty = true;
    this.needSave = true;
  },

  // Pack the EDIT_MAX chunks nearest the player for the GPU. Header slot:
  // (world origin xyz, used flag); data: raw signed bytes, z-major, read as
  // packed u32 words in the shader. Returns the resident count and AABB.
  pack(px, py, pz) {
    const n = CAVES.EDIT_CHUNK;
    const w = n * CAVES.EDIT_VOX;
    const keys = [...this.chunks.keys()];
    keys.sort((a, b) => {
      const pa = a.split(',').map(Number), pb = b.split(',').map(Number);
      const da = (pa[0] * w + w / 2 - px) ** 2 + (pa[1] * w + w / 2 - py) ** 2 +
                 (pa[2] * w + w / 2 - pz) ** 2;
      const db = (pb[0] * w + w / 2 - px) ** 2 + (pb[1] * w + w / 2 - py) ** 2 +
                 (pb[2] * w + w / 2 - pz) ** 2;
      return da - db;
    });
    const count = Math.min(keys.length, CFG.EDIT_MAX);
    this.head.fill(0);
    let bounds = null;
    for (let i = 0; i < count; i++) {
      const [cx, cy, cz] = keys[i].split(',').map(Number);
      this.head[i * 4] = cx * w;
      this.head[i * 4 + 1] = cy * w;
      this.head[i * 4 + 2] = cz * w;
      this.head[i * 4 + 3] = 1;
      this.data.set(this.chunks.get(keys[i]), i * n * n * n);
      const m = CAVES.EDIT_VOX;
      const lo = [cx * w - m, cy * w - m, cz * w - m];
      const hi = [cx * w + w + m, cy * w + w + m, cz * w + w + m];
      if (!bounds) bounds = [...lo, ...hi];
      else for (let d = 0; d < 3; d++) {
        if (lo[d] < bounds[d]) bounds[d] = lo[d];
        if (hi[d] > bounds[d + 3]) bounds[d + 3] = hi[d];
      }
    }
    return { count, bounds };
  },

  // ---- persistence: base64 per chunk, portable (no btoa dependency) ----
  B64: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/',

  enc(bytes) {
    const c = this.B64;
    let s = '';
    for (let i = 0; i < bytes.length; i += 3) {
      const a = bytes[i] & 0xff;
      const b = i + 1 < bytes.length ? bytes[i + 1] & 0xff : 0;
      const d = i + 2 < bytes.length ? bytes[i + 2] & 0xff : 0;
      s += c[a >> 2] + c[((a & 3) << 4) | (b >> 4)] +
           c[((b & 15) << 2) | (d >> 6)] + c[d & 63];
    }
    return s;
  },

  dec(s, out) {
    const c = this.B64;
    let o = 0;
    for (let i = 0; i < s.length; i += 4) {
      const a = c.indexOf(s[i]), b = c.indexOf(s[i + 1]);
      const d = c.indexOf(s[i + 2]), e = c.indexOf(s[i + 3]);
      if (o < out.length) out[o++] = (a << 2) | (b >> 4);
      if (o < out.length) out[o++] = ((b & 15) << 4) | (d >> 2);
      if (o < out.length) out[o++] = ((d & 3) << 6) | e;
    }
  },

  serialize() {
    const obj = {};
    for (const [k, ch] of this.chunks) obj[k] = this.enc(new Uint8Array(ch.buffer));
    return JSON.stringify(obj);
  },

  deserialize(str) {
    const n = CAVES.EDIT_CHUNK;
    this.chunks.clear();
    this.bounds = null;
    const obj = JSON.parse(str);
    for (const k of Object.keys(obj)) {
      const ch = new Int8Array(n * n * n);
      this.dec(obj[k], new Uint8Array(ch.buffer));
      this.chunks.set(k, ch);
      const [cx, cy, cz] = k.split(',').map(Number);
      this.growBounds(cx, cy, cz);
    }
    this.gpuDirty = this.chunks.size > 0;
  },

  save() {
    if (typeof localStorage === 'undefined') return;
    try { localStorage.setItem('ascii-caves-v1', this.serialize()); }
    catch (e) { console.warn('edit save failed: ' + e.message); }
    this.needSave = false;
  },

  load() {
    if (typeof localStorage === 'undefined') return;
    const s = localStorage.getItem('ascii-caves-v1');
    if (!s) return;
    try { this.deserialize(s); } catch (e) { console.warn('edit load failed'); }
  },

  tick(dt) {
    if (!this.needSave) return;
    this.saveTimer += dt;
    if (this.saveTimer > 4) { this.saveTimer = 0; this.save(); }
  },
};
</script>
<script>
// ---- js/removed.js ----
// Cleared cells: a sparse set of world cells whose hash-placed prop the
// player has taken away - a felled tree, a pocketed stone, a broken rock.
// One cell holds one prop, so a single set covers all of them.
// CPU-authoritative like the dig edits: collision and examine skip cleared
// cells, and the GPU receives the REMOVED_MAX cells nearest the player so the
// renderer stops drawing them. Clearing is rare, so persistence is a
// synchronous write on change, no debounce.
const Removed = {
  set: new Set(),      // "ix,iy"
  gpuDirty: false,
  data: null,          // packed vec2f cells for the GPU

  init() {
    this.data = new Float32Array(CFG.REMOVED_MAX * 2);
    this.load();
  },

  has(ix, iy) { return this.set.has(ix + ',' + iy); },

  add(ix, iy) {
    this.set.add(ix + ',' + iy);
    this.gpuDirty = true;
    this.save();
  },

  // pack the REMOVED_MAX cleared cells nearest the player; returns the count
  pack(px, py) {
    const cells = [...this.set].map(k => k.split(',').map(Number));
    cells.sort((a, b) =>
      ((a[0] - px) ** 2 + (a[1] - py) ** 2) -
      ((b[0] - px) ** 2 + (b[1] - py) ** 2));
    const n = Math.min(cells.length, CFG.REMOVED_MAX);
    this.data.fill(0);
    for (let i = 0; i < n; i++) {
      this.data[i * 2] = cells[i][0];
      this.data[i * 2 + 1] = cells[i][1];
    }
    return n;
  },

  save() {
    if (typeof localStorage === 'undefined') return;
    try { localStorage.setItem('ascii-removed-v1', JSON.stringify([...this.set])); }
    catch (e) { console.warn('cleared-cell save failed: ' + e.message); }
  },

  load() {
    if (typeof localStorage === 'undefined') return;
    const s = localStorage.getItem('ascii-removed-v1');
    if (!s) return;
    try {
      this.set = new Set(JSON.parse(s));
      this.gpuDirty = this.set.size > 0;
    } catch (e) { console.warn('cleared-cell load failed'); }
  },
};
</script>
<script>
// ---- js/lore.js ----
// The people who cut the halls.
//
// Nothing here is authored: a seed gives a civilisation its name, its
// founder, the thing it dug up, and the way it ended, and the inscriptions
// are generated from those facts. Two runs of the same seed tell exactly the
// same story, and a different seed tells a different one.
//
// The record is laid out by DEPTH. Band -1 carries the founding, -2 the
// digging, -3 the end - so reading the story in order means going down,
// which is the whole reason the caves are there.
// 1st, 2nd, 3rd, 4th - and 11th through 13th, which break the pattern
function ord(n) {
  const t = n % 100;
  if (t >= 11 && t <= 13) return n + 'th';
  return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
}

const Lore = {
  HEAD: ['kar', 'dun', 'mor', 'thal', 'ves', 'gor', 'bal', 'rin', 'oth',
         'urd', 'kel', 'zar', 'mun', 'fel', 'has', 'tor', 'bre', 'skal'],
  TAIL: ['az', 'ok', 'ur', 'eth', 'im', 'ash', 'orn', 'ul', 'ek', 'ir',
         'and', 'uz', 'in', 'ad', 'oth', 'esk'],

  cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); },

  // pick from a table by hash, so every name is a function of the seed
  pick(tbl, a, b) {
    return tbl[jsUhash((a ^ (CFG.SEED >>> 0)) >>> 0, b >>> 0) % tbl.length];
  },

  name(a, b) { return this.cap(this.pick(this.HEAD, a, b) + this.pick(this.TAIL, a, b + 1)); },
  longName(a, b) {
    return this.cap(this.pick(this.HEAD, a, b) + this.pick(this.HEAD, a, b + 7) +
                    this.pick(this.TAIL, a, b + 3));
  },

  // The one civilisation this world remembers. Everything the inscriptions
  // say is drawn from here, so they agree with each other.
  civ() {
    if (this._civ) return this._civ;
    const h = (n) => jsUhash((CFG.SEED >>> 0), n >>> 0);
    const FOUND = ['a vein of copper', 'a spring that ran warm',
                   'stone that split clean', 'a cave already cut'];
    const DEEP = ['the Hollow', 'the Pale Seam', 'the Quiet', 'the Blue Fire',
                  'the Door', 'the Long Vein'];
    const END = ['the water came', 'the lamps went out and stayed out',
                 'the deep gallery answered', 'the stone began to move',
                 'nothing came up the stair again'];
    this._civ = {
      name: this.longName(1, 2),
      people: this.name(3, 4) + 'ai',
      founder: this.name(5, 6),
      last: this.name(7, 8),
      delve: this.name(9, 10),
      found: FOUND[h(11) % FOUND.length],
      deep: DEEP[h(12) % DEEP.length],
      end: END[h(13) % END.length],
      years: 120 + (h(14) % 400),
      depth: 3 + (h(15) % 6),
    };
    return this._civ;
  },

  // Beats of the story, by depth band. Each hall gets one, chosen by its
  // own cell, so a band's halls between them tell that chapter.
  BEATS: {
    '-1': [
      c => [`${c.name} began here.`,
            `${c.founder} found ${c.found} and called it enough.`,
            `We were ${c.people}. We cut downward because we could.`],
      c => [`In the ${ord(c.years)} year the upper halls were finished.`,
            `Every lamp was lit. ${c.founder} walked them all in a day`,
            `and said the walls would outlast the walkers.`],
      c => [`We traded metal upward and took grain down.`,
            `The sky-folk had no name for us that we liked,`,
            `so we kept our own: ${c.people}.`],
      c => [`Here the first stair was cut, by hand, in the dark.`,
            `${c.founder} cut the first step and the last of that flight.`],
    ],
    '-2': [
      c => [`${c.delve} took the lower cut.`,
            `The stone rings hollow below this floor.`,
            `We are told this is only water. It is not water.`],
      c => [`We reached ${c.deep} in the ${ord(c.years + 40)} year.`,
            `${c.founder}'s law said seal it and set a watch.`,
            `We did not seal it.`],
      c => [`The lamps burn blue in the deep gallery.`,
            `No one will say why. ${c.delve} has stopped going down.`],
      c => [`Count the galleries. There should be ${c.depth}.`,
            `There are more than ${c.depth}.`,
            `We did not cut the others.`],
    ],
    '-3': [
      c => [`${c.last} held the gate here.`,
            `Long enough for the upper halls to empty. Not longer.`],
      c => [`It came up through the floor we cut.`,
            `We made the road for it. That is the whole of it.`],
      c => [`If you are reading this, ${c.end}.`,
            `Do not go below the ${ord(c.depth)} gallery.`,
            `We did. There is no one left to say what we found.`],
      c => [`${c.name} ended in the ${ord(c.years + 90)} year.`,
            `${c.last} wrote this and put down the chisel.`,
            `We were ${c.people}. We were here.`],
    ],
  },

  // the inscription cut into the pillars of one hall
  inscription(cx, cy, k) {
    const band = String(Math.max(-3, Math.min(-1, k)));
    const beats = this.BEATS[band] || this.BEATS['-1'];
    const i = jsUhash(((cx * 31) ^ (cy * 17)) >>> 0,
                      ((8 + k) ^ (CFG.SEED >>> 0)) >>> 0) % beats.length;
    const c = this.civ();
    return { band: k, key: cx + ',' + cy + ',' + k, lines: beats[i](c) };
  },

  // what a hall calls itself
  hallName(cx, cy, k) {
    const c = this.civ();
    const KIND = ['Hall', 'Gallery', 'Delve', 'Vault', 'Stair-house', 'Cut'];
    const kind = KIND[jsUhash((cx ^ 0x9e37) >>> 0, (cy ^ (8 + k)) >>> 0) % KIND.length];
    return `the ${kind} of ${this.name(cx + 40, cy + 90 + k)}`;
  },
};
</script>

<script>
// ---- js/game.js ----
// Game state: inventory, modal panels (inventory / craft / examine), and the
// actions they expose. All UI is written into the ASCII grid via Overlay -
// no DOM. One keydown layer routes keys by mode; while a panel is open the
// player is frozen and every key is captured here.
const Game = {
  mode: 'play',        // play | inventory | craft | examine | console
  inv: new Map(),      // item id -> count
  cursor: 0,
  uiDirty: true,
  toastMsg: '', toastT: 0,
  needSave: false, saveTimer: 0,
  devMode: false,       // gates debug view toggles (mono/raw) behind a command
  cmdBuf: '',
  cmdHistory: [],
  read: [],             // inscription keys already read, in the order found
  done: false,          // the record has been pieced together
  spawnAt: null,        // where a saved game left the player standing

  init() {
    this.load();
    // a returning player is dropped straight back in; a new one gets told
    // where they are and what there is to find
    if (!this.spawnAt) this.mode = 'title';
  },

  // ---- inventory ----

  count(id) { return this.inv.get(id) || 0; },

  give(id, n) {
    this.inv.set(id, this.count(id) + n);
    this.needSave = true;
    this.uiDirty = true;
  },

  take(id, n) {
    const c = this.count(id);
    if (c < n) return false;
    if (c === n) this.inv.delete(id); else this.inv.set(id, c - n);
    this.needSave = true;
    this.uiDirty = true;
    return true;
  },

  toast(msg) { this.toastMsg = msg; this.toastT = 3; this.uiDirty = true; },

  // ---- digging: what the ground is made of decides what it takes ----

  // Returns the scoop radius to carve, or 0 when the right tool is missing
  // (a toast explaining why is already queued). Pays out whatever the
  // material yields. Soil moves in bigger bites than rock does.
  digAt(x, y, z) {
    const mat = matAt(x, y, z, terrainH(x, y));
    if (mat === MATS.DIRT) {
      if (!this.count('shovel')) { this.toast('soil - you need a shovel'); return 0; }
      return CFG.DIG_R * 1.4;
    }
    if (!this.count('pick')) { this.toast('solid rock - you need a pickaxe'); return 0; }
    if (mat === MATS.GEM) {
      this.give('gem', 1);
      this.toast('a gem comes loose (' + this.count('gem') + ')');
    } else if (mat === MATS.ORE) {
      const id = oreItem(z);
      this.give(id, 1);
      this.toast('+1 ' + ITEMS[id].name + ' (' + this.count(id) + ')');
    } else {
      this.give('stone', 1);
      this.toast('+1 stone (' + this.count('stone') + ')');
    }
    return CFG.DIG_R;
  },

  open(mode) { this.mode = mode; this.cursor = 0; this.uiDirty = true; },
  close() { this.mode = 'play'; this.uiDirty = true; },

  // ---- console: text commands, "devmode" gates the debug view toggles ----

  openConsole() { this.cmdBuf = ''; this.mode = 'console'; this.uiDirty = true; },

  // Takes the raw keyboard event, not just the code - it needs the actual
  // typed character, which the code-only key() routing below doesn't carry.
  consoleInput(e) {
    if (e.code === 'Escape') { this.close(); return; }
    if (e.code === 'Enter') {
      if (!this.cmdBuf.trim()) { this.close(); return; }
      this.runCommand(this.cmdBuf);
      this.cmdBuf = '';
      this.uiDirty = true;
      return;
    }
    if (e.code === 'Backspace') {
      this.cmdBuf = this.cmdBuf.slice(0, -1);
      this.uiDirty = true;
      return;
    }
    if (e.key && e.key.length === 1 && this.cmdBuf.length < 60) {
      this.cmdBuf += e.key;
      this.uiDirty = true;
    }
  },

  runCommand(raw) {
    const cmd = raw.trim();
    if (!cmd) return;
    this.cmdHistory.push('> ' + cmd);
    const arg = cmd.split(/\s+/);
    const verb = arg[0].toLowerCase();
    // waiting out a whole cycle to see midnight is no way to work
    if (verb === 'time') {
      if (arg.length > 1 && isFinite(parseFloat(arg[1]))) {
        Sky.setHour(parseFloat(arg[1]));
      }
      this.cmdHistory.push('time ' + Sky.hour().toFixed(2) +
        (Sky.paused ? ' (frozen)' : ''));
      return;
    }
    if (verb === 'freeze') {
      Sky.paused = !Sky.paused;
      this.cmdHistory.push(Sky.paused ? 'time frozen' : 'time running');
      return;
    }
    if (verb === 'daylen') {
      if (arg.length > 1 && parseFloat(arg[1]) > 0) CFG.DAY_LEN = parseFloat(arg[1]);
      this.cmdHistory.push('day length ' + CFG.DAY_LEN + 's');
      return;
    }
    switch (cmd.toLowerCase()) {
      case 'devmode':
        this.devMode = !this.devMode;
        this.cmdHistory.push(this.devMode
          ? 'dev mode on - M/X view toggles unlocked'
          : 'dev mode off');
        break;
      case 'clear':
        this.cmdHistory.length = 0;
        break;
      case 'wipe':
        this.inv.clear(); this.read = []; this.done = false; this.used.clear();
        if (typeof localStorage !== 'undefined') {
          localStorage.removeItem('ascii-save-v1');
          localStorage.removeItem('ascii-caves-v1');
          localStorage.removeItem('ascii-removed-v1');
        }
        this.cmdHistory.push('save wiped - reload to start over');
        break;
      case 'help':
        this.cmdHistory.push('commands: devmode, time <h>, freeze, daylen <s>,');
        this.cmdHistory.push('wipe, clear, help');
        break;
      default:
        this.cmdHistory.push('unknown command: ' + cmd);
    }
    if (this.cmdHistory.length > 40) this.cmdHistory.splice(0, this.cmdHistory.length - 40);
  },

  // ---- input: returns true when the key was consumed ----

  key(code) {
    if (this.mode === 'play') {
      if (code === 'Tab') { this.open('inventory'); return true; }
      if (code === 'KeyC') { this.open('craft'); return true; }
      if (code === 'KeyJ') { this.open('journal'); return true; }
      if (code === 'KeyE') { this.examine(); return true; }
      return false;
    }
    // the title is dismissed by anything, and offers nothing else
    if (this.mode === 'title') {
      if (code !== 'F11') this.close();
      return true;
    }
    if (code === 'KeyJ' && this.mode !== 'journal') { this.open('journal'); return true; }
    if (code === 'KeyQ' || code === 'Escape' || code === 'Tab') {
      this.close();
      return true;
    }
    if (code === 'KeyW' || code === 'ArrowUp') {
      this.cursor--; this.uiDirty = true; return true;
    }
    if (code === 'KeyS' || code === 'ArrowDown') {
      this.cursor++; this.uiDirty = true; return true;
    }
    if (code === 'KeyE' || code === 'Enter') { this.confirm(); return true; }
    return true;   // swallow everything else while a panel is open
  },

  confirm() {
    if (this.mode === 'craft') {
      const n = RECIPES.length;
      const r = RECIPES[((this.cursor % n) + n) % n];
      if (!this.canCraft(r)) { this.toast('missing ingredients'); return; }
      for (const [id, cnt] of Object.entries(r.needs)) this.take(id, cnt);
      this.give(r.out, 1);
      this.toast('crafted: ' + ITEMS[r.out].name);
      return;
    }
    if (this.mode === 'examine' && this.actions.length) {
      const n = this.actions.length;
      const i = ((this.cursor % n) + n) % n;
      this.actions[i].fn();
      // actions may consume themselves (once-per-target); rebuild the list
      this.actions = this.actionsFor(this.target);
      this.cursor = Math.min(i, Math.max(0, this.actions.length - 1));
      this.uiDirty = true;
    }
  },

  // ---- examine ----

  target: null, actions: [],
  used: new Set(),   // once-per-target actions spent this session

  examine() {
    const p = Player;
    const cp = Math.cos(p.pitch), sp = Math.sin(p.pitch);
    const t = World.examineRay(p.x, p.y, p.z + CFG.EYE,
      Math.cos(p.angle) * cp, Math.sin(p.angle) * cp, sp);
    if (!t) { this.toast('nothing within reach'); return; }
    this.target = t;
    this.actions = this.actionsFor(t);
    this.open('examine');
  },

  useKey(t, what) {
    return what + ':' + (t.kind === 'tree'
      ? t.ix + ',' + t.iy
      : t.point.map(v => Math.round(v)).join(','));
  },

  actionsFor(t) {
    const acts = [];
    const once = (what, label, fn) => {
      if (this.used.has(this.useKey(t, what))) return;
      acts.push({ label, fn: () => { this.used.add(this.useKey(t, what)); fn(); } });
    };
    if (t.kind === 'tree') {
      const sp = SPECIES[treeSpecies(t.ix, t.iy)];
      acts.push({ label: 'chop' + (this.count('axe') ? '' : '  (needs an axe)'),
        fn: () => this.chop(t, sp) });
      if (sp.harvest) {
        once('harvest', 'harvest  (+' + sp.harvest[1] + ' ' +
          ITEMS[sp.harvest[0]].name + ')', () => {
            this.give(sp.harvest[0], sp.harvest[1]);
            this.toast('+' + sp.harvest[1] + ' ' + ITEMS[sp.harvest[0]].name);
          });
      }
      once('branch', 'break branch  (+1 wood)', () => {
        this.give('wood', 1);
        this.toast('+1 wood (' + this.count('wood') + ')');
      });
      acts.push({ label: 'hug', fn: () => this.toast(sp.hug) });
    } else if (t.kind === 'lichen') {
      once('pick', 'harvest  (+1 glow lichen)', () => {
        this.give('lichen', 1);
        this.toast('+1 glow lichen (' + this.count('lichen') + ')');
      });
    } else if (t.kind === 'ore' || t.kind === 'gem') {
      const id = t.kind === 'gem' ? 'gem' : oreItem(t.point[2]);
      const has = this.count('pick') > 0;
      once('mine', 'mine  (+1 ' + ITEMS[id].name + ')' +
        (has ? '' : '  (needs a pickaxe)'), () => {
          if (!has) { this.toast('you need a pickaxe for that'); return; }
          this.give(id, 1);
          this.toast('+1 ' + ITEMS[id].name + ' (' + this.count(id) + ')');
        });
    } else if (t.kind === 'stone') {
      acts.push({ label: 'pick up  (+1 stone)', fn: () => {
        Removed.add(t.ix, t.iy);
        this.give('stone', 1);
        this.toast('+1 stone (' + this.count('stone') + ')');
        this.close();
      } });
    } else if (t.kind === 'boulder') {
      const has = this.count('pick') > 0;
      acts.push({ label: 'break' + (has ? '  (+3 stone)' : '  (needs a pickaxe)'),
        fn: () => {
          if (!has) { this.toast('you need a pickaxe for that'); return; }
          Removed.add(t.ix, t.iy);
          this.give('stone', 3);
          this.toast('the boulder splits  (+3 stone)');
          this.close();
        } });
    } else if (t.kind === 'rock' || t.kind === 'cavewall' || t.kind === 'dug') {
      // Loose scree, gathered by hand: the bootstrap out of having no tools
      // at all, since every recipe starts with stone.
      once('gather', 'gather loose stone  (+1 stone)', () => {
        this.give('stone', 1);
        this.toast('+1 stone (' + this.count('stone') + ')');
      });
    } else if (t.kind === 'pillar' && t.hall) {
      const ins = Lore.inscription(t.hall.cx, t.hall.cy, t.hall.k);
      const seen = this.read.includes(ins.key);
      acts.push({ label: seen ? 'read again' : 'read the inscription',
        fn: () => this.readInscription(ins) });
    } else if (t.kind === 'water') {
      acts.push({ label: 'drink', fn: () => this.toast('Cold and clean.') });
    }
    return acts;
  },

  // ---- the record ----

  // Which depths the player has read from. The story runs founding, digging,
  // end down the three bands, so holding all three is holding the whole of
  // it - and it can only be done by going down.
  bandsRead() {
    const b = new Set();
    for (const k of this.read) b.add(k.split(',')[2]);
    return b;
  },

  objective() {
    if (this.done) return 'the record is whole';
    const n = this.bandsRead().size;
    if (this.read.length === 0) return 'find the carved halls, and read what they cut';
    return 'the record runs deeper: ' + n + ' of 3 depths read';
  },

  readInscription(ins) {
    this.reading = ins;
    if (!this.read.includes(ins.key)) {
      this.read.push(ins.key);
      this.needSave = true;
    }
    this.open('reading');
    if (!this.done && this.bandsRead().size >= 3) {
      this.done = true;
      this.needSave = true;
    }
  },

  chop(t, sp) {
    if (!this.count('axe')) { this.toast('you need an axe for that'); return; }
    if (typeof Removed === 'undefined') { this.toast('the axe is not sharp yet'); return; }
    Removed.add(t.ix, t.iy);
    this.give('wood', sp.chop);
    this.toast('the ' + sp.name + ' falls  (+' + sp.chop + ' wood)');
    this.close();
  },

  describe(t) {
    switch (t.kind) {
      case 'tree': {
        const sp = SPECIES[treeSpecies(t.ix, t.iy)];
        return [sp.name.toUpperCase(), sp.desc];
      }
      case 'stone':     return ['LOOSE STONE', 'Fist-sized. It would go in a',
                                'pocket without complaint.'];
      case 'boulder':   return ['BOULDER', 'Half-buried and going nowhere.',
                                'It would take a pickaxe.'];
      case 'water':     return ['WATER', 'Still, dark, patient.'];
      case 'lichen':    return ['GLOW LICHEN', ITEMS.lichen.desc];
      case 'ore':       return [ITEMS[oreItem(t.point[2])].name.toUpperCase() + ' VEIN',
                                'A seam of metal threading the stone.'];
      case 'gem':       return ['GEM IN THE ROCK',
                                'Deep in a vein, something is catching',
                                'the light that is not stone.'];
      case 'cavewall':  return ['CAVE WALL', 'Water-worn stone. It has been',
                                'down here longer than anything.'];
      case 'dug':       return ['HEWN ROCK', 'Tool marks. Yours.'];
      case 'stair':     return ['STAIR WELL', 'Old, deliberate, patient work.',
                                'Someone cut this. Long ago.'];
      case 'pillar':    return ['CARVED PILLAR', 'Tool marks spiral upward.',
                                'It is holding the mountain up.'];
      case 'hallfloor': return ['CARVED FLOOR', 'Dead flat. Nothing natural',
                                'is this flat.'];
      case 'sand':      return ['SHORE SAND', 'Fine and pale. A shovel would',
                                'move it easily.'];
      case 'rock':      return ['BARE ROCK', 'Too steep for soil to hold.',
                                'Loose scree lies at your feet.'];
      case 'grass':     return ['MEADOW', 'Wind-combed grass over deep soil.'];
      default:          return [t.kind.toUpperCase(), ''];
    }
  },

  // ---- per-frame ----

  tick(dt) {
    if (this.toastT > 0) {
      this.toastT -= dt;
      if (this.toastT <= 0) { this.toastMsg = ''; this.uiDirty = true; }
    }
    if (this.needSave) {
      this.saveTimer += dt;
      if (this.saveTimer > 2) { this.saveTimer = 0; this.save(); }
    }
  },

  // ---- panel rendering (into the Overlay glyph grid) ----

  // Panels are lines of text placed in the field, not boxes: nothing is
  // padded out to a common width, because padding would clear a rectangle
  // of cells and put the solid backing chip back.
  panel(lines) {
    const w = Math.max(...lines.map(l => l.length));
    const x0 = Math.max(1, (Overlay.cols - w) >> 1);
    const y0 = Math.max(1, ((Overlay.rows - lines.length) >> 1) - 2);
    for (let i = 0; i < lines.length; i++) {
      if (lines[i]) Overlay.write(x0, y0 + i, lines[i]);
    }
  },

  drawUI() {
    if (this.toastMsg) {
      Overlay.writeCentre(Overlay.rows - 3, ' ' + this.toastMsg + ' ');
    }
    if (this.mode === 'inventory') this.drawInventory();
    if (this.mode === 'examine') this.drawExamine();
    if (this.mode === 'craft') this.drawCraft();
    if (this.mode === 'console') this.drawConsole();
    if (this.mode === 'reading') this.drawReading();
    if (this.mode === 'journal') this.drawJournal();
    if (this.mode === 'title') this.drawTitle();
  },

  drawTitle() {
    this.panel([
      'A S C I I   W O R L D',
      '',
      'Every hill, cave and stone here is a',
      'number, worked out the moment you look',
      'at it. Nothing is stored. It goes on as',
      'far as you care to walk.',
      '',
      'You are standing at a cave mouth. Someone',
      'cut the stair below you, a long time ago,',
      'and left their record on the walls.',
      '',
      'Find out who they were.',
      '',
      'E    look at what is in front of you',
      'WASD walk    LMB dig    Tab your things',
      'C    craft   J record   Enter console',
      '',
      'press any key',
    ]);
  },

  drawReading() {
    if (!this.reading) return;
    const lines = ['CUT INTO THE PILLAR', ''];
    for (const l of this.reading.lines) lines.push(l);
    lines.push('');
    if (this.done && this.bandsRead().size >= 3) {
      lines.push('That is the last of it. The record is whole.');
      lines.push('[J] read it through  [Q] close');
    } else {
      lines.push(this.objective());
      lines.push('[Q] close');
    }
    this.panel(lines);
  },

  drawJournal() {
    const c = Lore.civ();
    const lines = ['THE RECORD OF ' + c.name.toUpperCase(), ''];
    if (this.read.length === 0) {
      lines.push('Nothing yet. Somewhere below, someone');
      lines.push('cut their history into the stone.');
    } else {
      // in the order the story happened, not the order it was found
      const order = [...this.read].sort((a, b) =>
        Number(b.split(',')[2]) - Number(a.split(',')[2]));
      for (const key of order) {
        const [cx, cy, k] = key.split(',').map(Number);
        for (const l of Lore.inscription(cx, cy, k).lines) lines.push(l);
        lines.push('');
      }
      lines.push(this.done
        ? 'Nothing else is written. They did not come back up.'
        : this.objective());
    }
    lines.push('[Q] close');
    this.panel(lines);
  },

  drawConsole() {
    const w = Math.min(Overlay.cols - 4, 70);
    const h = 9;
    const x0 = 2, y0 = Math.max(1, Overlay.rows - h - 2);
    Overlay.write(x0, y0, 'CONSOLE' + (this.devMode ? ' [dev]' : ''));
    const rows = h - 2;
    const hist = this.cmdHistory.slice(-rows);
    for (let i = 0; i < rows; i++) {
      if (hist[i]) Overlay.write(x0 + 1, y0 + 1 + i, hist[i].slice(0, w - 2));
    }
    Overlay.write(x0 + 1, y0 + h - 1, ('> ' + this.cmdBuf + '_').slice(0, w - 2));
  },

  canCraft(r) {
    for (const [id, cnt] of Object.entries(r.needs)) {
      if (this.count(id) < cnt) return false;
    }
    return true;
  },

  drawCraft() {
    const lines = ['CRAFTING', ''];
    const n = RECIPES.length;
    const cur = ((this.cursor % n) + n) % n;
    for (let i = 0; i < n; i++) {
      const r = RECIPES[i];
      const needs = Object.entries(r.needs)
        .map(([id, cnt]) => cnt + ' ' + ITEMS[id].name).join(', ');
      const owned = this.count(r.out) ? '  (have ' + this.count(r.out) + ')' : '';
      const mark = this.canCraft(r) ? '' : '  - missing';
      lines.push((i === cur ? '> ' : '  ') +
        ITEMS[r.out].name.padEnd(12) + needs + mark + owned);
    }
    lines.push('');
    lines.push('[W/S] choose  [E] craft  [Q] close');
    this.panel(lines);
  },

  drawExamine() {
    if (!this.target) return;
    const lines = [...this.describe(this.target), ''];
    if (this.actions.length) {
      const n = this.actions.length;
      const cur = ((this.cursor % n) + n) % n;
      for (let i = 0; i < n; i++) {
        lines.push((i === cur ? '> ' : '  ') + this.actions[i].label);
      }
      lines.push('');
      lines.push('[W/S] choose  [E] do  [Q] close');
    } else {
      lines.push('[Q] close');
    }
    this.panel(lines);
  },

  drawInventory() {
    const lines = ['INVENTORY', ''];
    const ids = [...this.inv.keys()];
    if (ids.length === 0) {
      lines.push('(empty)');
      lines.push('');
      lines.push('dig for stone, examine [E] a');
      lines.push('tree for wood');
    } else {
      for (const id of ids) {
        const it = ITEMS[id] || { name: id };
        lines.push(it.name.padEnd(14) + ' x ' + this.count(id));
      }
    }
    lines.push('');
    lines.push('[Q] close');
    this.panel(lines);
  },

  // ---- persistence ----

  // Everything the player accumulated, including where they were standing:
  // a world you return to has to still have you in it.
  snapshot() {
    const inv = {};
    for (const [k, v] of this.inv) inv[k] = v;
    return {
      inv, read: this.read, done: this.done,
      at: typeof Player !== 'undefined' ? [Player.x, Player.y, Player.angle,
                                           Player.pitch, Player.z] : null,
      t: typeof Sky !== 'undefined' ? Sky.t : null,
      used: [...this.used],
    };
  },

  restore(s) {
    this.inv.clear();
    for (const k of Object.keys(s.inv || {})) this.inv.set(k, s.inv[k]);
    this.read = Array.isArray(s.read) ? s.read : [];
    this.done = !!s.done;
    this.used = new Set(s.used || []);
    this.spawnAt = Array.isArray(s.at) ? s.at : null;
    if (typeof s.t === 'number' && typeof Sky !== 'undefined') Sky.t = s.t;
  },

  save() {
    if (typeof localStorage === 'undefined') { this.needSave = false; return; }
    try { localStorage.setItem('ascii-save-v1', JSON.stringify(this.snapshot())); }
    catch (e) { console.warn('save failed: ' + e.message); }
    this.needSave = false;
  },

  load() {
    if (typeof localStorage === 'undefined') return;
    const s = localStorage.getItem('ascii-save-v1');
    if (!s) return;
    try { this.restore(JSON.parse(s)); }
    catch (e) { console.warn('load failed'); }
  },
};
</script>
<script>
// ---- js/player.js ----
// First-person player over the infinite terrain: WASD move, arrows/mouse
// look, slope- and water-limited movement, trunk-circle tree collision.
const Player = {
  x: 0, y: 0, z: 0, angle: 0.6,
  pitch: 0, // radians; ±90° is straight up/down
  keys: {},

  init() {
    // a saved game puts you back where you stopped, facing where you looked
    const at = Game.spawnAt;
    if (at) {
      this.x = at[0]; this.y = at[1];
      this.angle = at[2]; this.pitch = at[3];
      this.z = at[4];
    } else {
      const [sx, sy] = World.findSpawn();
      this.x = sx; this.y = sy;
      this.z = World.groundZ(sx, sy);
    }

    addEventListener('keydown', e => {
      // the console wants raw typed characters, not just key codes - route
      // it before the code-only panel dispatch below
      if (Game.mode === 'console') { Game.consoleInput(e); e.preventDefault(); return; }
      // the game's modal layer gets every key first; panels capture W/S/E/Q
