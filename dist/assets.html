<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Asset Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;1,400&display=swap">
<style>
  /* Same committed world as the chronicle page: the game is a black
     terminal, and a light-mode asset sheet would be a different instrument. */
  :root {
    --bg:#08090b; --plate:#07080a; --ink:#c8d2dc; --dim:#566070;
    --line:#1b1f26; --edge:#2a3039; --ok:#6fae8f; --warn:#c97b4a;
    --mono:"IBM Plex Mono","Consolas","Courier New",monospace;
    --serif:"IBM Plex Serif","Iowan Old Style",Georgia,serif;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font:400 12px/1.6 var(--mono); }

  /* the bar sticks, because the decay slider is the control you reach for
     while looking at something halfway down the page */
  header {
    position:sticky; top:0; z-index:5; background:rgba(8,9,11,.96);
    border-bottom:1px solid var(--line); backdrop-filter:blur(6px);
    padding:12px 20px 11px; display:flex; flex-wrap:wrap; gap:14px 22px;
    align-items:flex-end;
  }
  .eyebrow { font-size:10px; font-weight:600; letter-spacing:.2em;
             text-transform:uppercase; color:var(--dim); margin:0; }
  h1 { font:500 15px/1.3 var(--mono); letter-spacing:.02em; margin:2px 0 0; }
  h2 { font:500 13px/1.3 var(--mono); margin:0; letter-spacing:.02em; }

  .ctl { display:flex; flex-direction:column; gap:3px; }
  .ctl > span { font-size:10px; letter-spacing:.14em; text-transform:uppercase;
                color:var(--dim); }
  .row { display:flex; align-items:center; gap:7px; }
  input[type=range] { accent-color:var(--warn); height:2px; width:132px; }
  input[type=number], select {
    background:#0f1216; color:var(--ink); border:1px solid var(--line);
    padding:4px 7px; font:inherit; font-size:12px;
  }
  input[type=number] { width:10ch; }
  button {
    background:#0f1216; color:var(--dim); border:1px solid var(--line);
    padding:5px 11px; font:500 11px/1 var(--mono); letter-spacing:.06em;
    text-transform:uppercase; cursor:pointer;
    transition:border-color .12s, color .12s, background .12s;
  }
  button:hover { border-color:var(--edge); color:var(--ink); }
  button.on { border-color:var(--warn); color:var(--ink); background:#15100d; }
  :focus-visible { outline:1px solid var(--warn); outline-offset:2px; }
  .spacer { flex:1 1 auto; }
  kbd { border:1px solid var(--edge); border-bottom-width:2px; border-radius:3px;
        padding:0 4px; font:500 10px/1.5 var(--mono); color:var(--ink); }

  main { padding:6px 20px 60px; }
  section { margin-top:26px; }
  .shead { display:flex; align-items:baseline; gap:12px;
           border-bottom:1px solid var(--line); padding-bottom:7px; margin-bottom:14px; }
  .shead p { margin:0; color:var(--dim); font:400 12px/1.5 var(--serif); }

  .grid { display:grid; gap:14px;
          grid-template-columns:repeat(auto-fill, minmax(430px, 1fr)); }
  .card { border:1px solid var(--line); background:#0a0b0d; display:flex;
          flex-direction:column; }
  .card.ok { border-color:#2c4a3d; }
  .view { position:relative; background:var(--plate); border-bottom:1px solid var(--line);
          min-height:120px; display:flex; align-items:center; justify-content:center;
          cursor:grab; overflow:hidden; }
  .view:active { cursor:grabbing; }
  .view canvas { display:block; image-rendering:pixelated; }
  /* the measurements live on the picture, because a number in a table
     underneath is a number nobody reads while looking at the thing */
  .tag { position:absolute; font-size:10px; letter-spacing:.08em; color:var(--dim);
         background:rgba(7,8,10,.72); padding:1px 5px; pointer-events:none; }
  .tag.tl { top:6px; left:6px; } .tag.tr { top:6px; right:6px; }
  .tag.bl { bottom:6px; left:6px; } .tag.br { bottom:6px; right:6px; }
  .tag b { color:var(--ink); font-weight:500; }

  /* the life strip: five stages of one building, cut open, in a row */
  .strip { display:flex; gap:1px; background:var(--line); border-bottom:1px solid var(--line);
           overflow-x:auto; }
  .strip .sc { background:var(--plate); flex:0 0 auto; }
  .strip canvas { display:block; image-rendering:pixelated; }
  .strip p { margin:0; padding:4px 7px 6px; font-size:10px; letter-spacing:.06em;
             display:flex; justify-content:space-between; gap:8px; color:var(--dim); }
  .strip p b { font-weight:500; color:var(--ink); text-transform:uppercase; }

  .meta { padding:9px 11px 4px; }
  .meta h3 { margin:0; font:500 13px/1.35 var(--mono); }
  .why { margin:4px 0 0; color:var(--dim); font:400 12px/1.5 var(--serif); }

  .review { padding:8px 11px 10px; display:flex; flex-direction:column; gap:7px;
            border-top:1px solid var(--line); margin-top:8px; }
  .review .row { justify-content:space-between; }
  label.chk { display:flex; align-items:center; gap:6px; cursor:pointer;
              font-size:11px; letter-spacing:.08em; text-transform:uppercase;
              color:var(--dim); }
  label.chk input { accent-color:var(--ok); width:14px; height:14px; }
  .card.ok label.chk { color:var(--ok); }
  textarea {
    background:#0f1216; color:var(--ink); border:1px solid var(--line);
    padding:6px 8px; font:400 12px/1.5 var(--mono); resize:vertical;
    min-height:34px; width:100%;
  }
  textarea::placeholder { color:#3c444f; }
  textarea.has { border-color:var(--warn); }
  .mini { display:flex; gap:5px; align-items:center; }
  .mini button { padding:3px 7px; font-size:10px; }
  .count { font-variant-numeric:tabular-nums; color:var(--dim); }
  .count b { color:var(--ok); font-weight:500; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <p class="eyebrow">Ascii World</p>
    <h1>The Asset Sheet</h1>
  </div>
  <div class="ctl"><span>Decay</span>
    <div class="row">
      <input type="range" id="decay" min="0" max="100" value="0">
      <span id="stage" style="width:9ch">standing</span>
    </div>
  </div>
  <div class="ctl"><span>Ending</span>
    <select id="cause"></select>
  </div>
  <div class="ctl"><span>Builders</span>
    <select id="mat">
      <option value="timber">timber people</option>
      <option value="stone">stone people</option>
    </select>
  </div>
  <div class="ctl"><span>Turn</span>
    <div class="row"><input type="range" id="az" min="0" max="628" value="85"></div>
  </div>
  <div class="ctl"><span>View</span>
    <div class="row">
      <button id="raw">ascii <kbd>x</kbd></button>
      <button id="sect">section</button>
      <button id="fp">in hand</button>
      <button id="fig" class="on">figure</button>
    </div>
  </div>
  <div class="ctl"><span>Seed</span>
    <div class="row">
      <input type="number" id="seed" min="0" max="16777215">
      <button id="go">run</button>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="ctl"><span>Review</span>
    <div class="row">
      <span class="count" id="count"></span>
      <button id="copy">copy notes</button>
      <button id="clear">reset</button>
    </div>
  </div>
</header>
<main id="sheet"></main>

<script>
// ---- js/config.js ----
// Global configuration. Plain script, shared global scope (inlined at build time).
const CFG = {
  PLANE_LEN: 0.85,    // tan(horizontal half-FOV)
  MAX_DIST: 140,      // ray cutoff (world units); beyond fades to haze
  EYE: 1.55,          // camera height above ground
  SEED: 8151623,      // world seed; MUST stay below 2^24 so the f32 uniform
                      // carries it exactly and CPU and GPU agree on the world
  // rendering. Character cells are sized like a terminal's: monospace glyphs
  // are roughly 0.55x as wide as tall, so cells are taller than wide - and
  // bigger overall, which is both the look and far fewer rays.
  CELL_W: 12,         // CSS px per cell, horizontal
  CELL_H: 22,         // CSS px per cell, vertical
  MONO: false,        // uniform grayscale; devmode + M toggles
  GLYPH_SET: 'ascii', // ascii | symbols  (C cycles)
  // Tone curve applied before glyph selection. White sits at the luminance
  // sunlit surfaces actually reach; above that the brightest glyphs go
  // unused, below it they clip and the highlights flatten.
  TONE_BLACK: 0.0,
  TONE_WHITE: 0.90,
  TONE_GAMMA: 0.9,
  RAW: false,         // debug: show the shaded image without glyph mapping (X)
  SUN_AZ: 0.9,        // sun azimuth at t=0 (rad); the cycle sweeps from here
  DAY_LEN: 3000,      // seconds for a full day/night cycle (50 min)
  // Twilight reach, as sin(sun elevation) either side of the horizon. Low
  // sun means a long path through air, so the light warms well before it
  // touches down - the golden hour is long on the way in, and the afterglow
  // that follows it is shorter.
  WARM_UP: 0.70,      // ~44 deg up: the light starts to turn warm
  WARM_DOWN: 0.26,    // ~15 deg down: the last of the warmth is gone
  DUSK_UP: 0.30,      // the red band in the sky, before the sun is down
  DUSK_DOWN: 0.26,    // and lingering after it
  // night sky: the moon's angular radius and how thick its crescent is
  MOON_R: 0.085,
  MOON_CRESC: 0.42,   // offset of the shadow disc, in moon radii
  MOON_GLOW: 0.10,    // halo strength around the disc
  MOON_GLOW_P: 400,   // halo tightness; higher is a smaller halo
  MOON_DARK: 0.04,    // earthshine lift on the unlit limb
  STAR_GRID: 90,      // celestial grid fineness; higher = smaller stars
  STAR_RARE: 0.976,   // hash above this is a star, at full dark
  // Stars do not arrive at sunset. The first show once the sun is a little
  // way under, and the field fills in as it sinks further - these are the
  // two depths, measured as sin(elevation) below the horizon.
  STAR_DUSK: 0.06,    // ~3.5 deg down: the brightest few
  STAR_DARK: 0.30,    // ~17 deg down: the whole field
  // The celestial pole the sky turns about. Tilted well off vertical, so
  // stars rise and set instead of just wheeling around the zenith.
  STAR_POLE_AZ: 2.2,
  STAR_POLE_EL: 0.85,
  SHADOW: 0.04,       // sun contribution inside full shadow (sky light only)
  // wide sun disc: broad, soft penumbrae that grow with distance from the
  // occluder (0.05 rad is the "soft shadows" look; the real sun is 0.0047)
  SUN_ANGLE: 0.05,
  SUN_SAMPLES: 16,    // shadow rays per pixel
  AO_SAMPLES: 32,     // hemisphere rays per pixel
  AO_RADIUS: 9,       // AO ray length, world units
  TREE_REACH: 2,      // cells a canopy may overhang; sets the search radius
  // lighting LOD: full shadow/AO ray budgets inside SHADE_NEAR, then a hard
  // cut - beyond it no shadow or AO rays are traced at all, no taper
  SHADE_NEAR: 40,
  SHADE_FAR: 40.001,
  // terrain: a continuous, infinite heightfield evaluated in the shader and
  // mirrored in js/util.js. No stored grid, no world bounds.
  TERRAIN_MAX: 16,    // amplitude: highest possible ground, world units
  // caves: view distance underground; rays in cave air stop here and fade out
  CAVE_VIEW: 60,
  // headlamp: camera-attached light so unlit caves are explorable; falls off
  // with distance, only applied to underground hits
  LAMP: 0.6,
  // Overlay cell value meaning "render nothing here". 0 is transparent (the
  // scene's own glyph) and 32 is a space (also the scene's glyph), so clear
  // air around UI text needs a code of its own.
  UI_BLANK: 31,
  // underground ray caps: sun is mostly absent down there, so penumbra
  // fidelity is worth less than frame time
  CAVE_SUN: 8,
  CAVE_AO: 16,
  SEA_LEVEL: 2.4,     // water plane; terrain below this is sea/lake
  // entities (future creatures); buffer capacity fixed, live count per frame
  MAX_ENTS: 64,
  // digging: resident edit-chunk capacity on the GPU, reach and scoop size
  EDIT_MAX: 32,
  DIG_REACH: 3.5,
  DIG_R: 1.1,
  // Buildings resident on the GPU. A village is some hundreds of primitives
  // and only what is near the camera is sent, so these are a view budget
  // rather than a world limit.
  STEAD_HEAD: 256,    // buildings
  STEAD_PRIM: 8192,   // primitives across all of them
  STEAD_STEP: 40,     // world units the player moves before a repack
  // cleared cells visible to the GPU (nearest the player); farther cleared
  // props may visually reappear until this rises in a later phase
  REMOVED_MAX: 64,
};

// The seed is the whole world, so it is worth being able to hand someone
// else. ?seed=<n> picks one at load; the console's "seed" command sets that
// query and reloads, because every module caches something derived from it.
// Out-of-range values are ignored rather than silently wrapped: a seed at or
// above 2^24 does not survive the f32 uniform, and CPU and GPU would then
// disagree about where the world is.
const SEED_MAX = 1 << 24;
CFG.SEED_DEFAULT = CFG.SEED;
(function () {
  if (typeof location === 'undefined' || !location.search) return;
  const m = /[?&]seed=([^&]*)/.exec(location.search);
  if (!m) return;
  const v = Number(decodeURIComponent(m[1]));
  if (Number.isInteger(v) && v >= 0 && v < SEED_MAX) CFG.SEED = v;
  else console.warn('[ASCII World] ignoring seed ' + m[1] +
    ' - must be a whole number in 0..' + (SEED_MAX - 1));
})();

// Saves are per world: two seeds are two different places, and their digs,
// inventories and records have nothing to say to each other. The default
// seed keeps the original unsuffixed keys so an existing save survives.
function saveKey(base) {
  return CFG.SEED === CFG.SEED_DEFAULT ? base : base + ':' + CFG.SEED;
}
</script>
<script>
// ---- js/util.js ----
// Hashing / noise / terrain — bit-compatible mirrors of the WGSL functions in
// js/webgpu/shaders.js. The GPU draws the world from these functions and the
// CPU collides against them, so any change MUST be made in both places.

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

function smoothstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

// u32 hash, identical to WGSL uhash (Math.imul == u32 multiply wrap)
function jsUhash(a, b) {
  let n = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663)) >>> 0;
  n = (n ^ (n >>> 13)) >>> 0;
  n = Math.imul(n, 1274126177) >>> 0;
  return (n ^ (n >>> 16)) >>> 0;
}

function hash01(x, y, s) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0) / 4294967296;
}

function hash2i(x, y, s) {
  const h = jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, s >>> 0);
  return [(h & 0xffff) / 65536, ((h >>> 16) & 0xffff) / 65536];
}

// 2D value noise, smoothstep-interpolated — mirror of WGSL vn2
function vn2(px, py, s) {
  const ix = Math.floor(px), iy = Math.floor(py);
  const fx = px - ix, fy = py - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash01(ix, iy, s), b = hash01(ix + 1, iy, s);
  const c = hash01(ix, iy + 1, s), d = hash01(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}

// -------- terrain height — mirror of WGSL terrainH --------
// Shape constants live here and are interpolated into the WGSL, never
// retyped there. Two hand-kept copies of terrainH is the divergence that
// would move the ground out from under collision without changing a single
// pixel of the sky, so scripts/verify.js rejects a bare float literal in
// either mirrored function.
const TERR = {
  WARP_F: 0.013,     // frequency of the field that warps the domain
  WARP_OX: 37.0,     // and the offsets that decorrelate its two channels
  WARP_OY: 91.0,
  WARP_A: 1.4,       // warp amplitude, in base-frequency units
  BASE_F: 0.023,     // base frequency of the heightfield
  OCT1_W: 0.62,      // octave weights, summing to 1
  OCT2_W: 0.26,
  OCT3_W: 0.12,
  OCT2_F: 2.7,       // and their frequency ratios
  OCT3_F: 6.1,
  RIDGE: 1.55,       // exponent: deepens valleys, sharpens ridges
};

function terrainH(px, py) {
  const s = CFG.SEED >>> 0;
  const wx = vn2(px * TERR.WARP_F, py * TERR.WARP_F, (s ^ 0x77) >>> 0);
  const wy = vn2(px * TERR.WARP_F + TERR.WARP_OX,
                 py * TERR.WARP_F + TERR.WARP_OY, (s ^ 0x77) >>> 0);
  const qx = px * TERR.BASE_F + (wx - 0.5) * TERR.WARP_A;
  const qy = py * TERR.BASE_F + (wy - 0.5) * TERR.WARP_A;
  let h = vn2(qx, qy, s) * TERR.OCT1_W +
          vn2(qx * TERR.OCT2_F, qy * TERR.OCT2_F, (s ^ 0x9e37) >>> 0) * TERR.OCT2_W +
          vn2(qx * TERR.OCT3_F, qy * TERR.OCT3_F, (s ^ 0x51ed) >>> 0) * TERR.OCT3_W;
  h = Math.pow(h, TERR.RIDGE);
  return h * CFG.TERRAIN_MAX;
}

// -------- caves: shared constants + density mirror --------
// These values are interpolated into the WGSL template in
// js/webgpu/shaders.js, so shader and mirror cannot disagree
// (scripts/verify.js enforces the convention: no literal CAVE_/EDIT_
// constants in the shader source).
const CAVES = {
  STEP: 0.3,     // primary-ray march step through cave air, world units
  STEPS: 200,    // primary-ray march budget (STEP * STEPS = CAVE_VIEW)
  TSTEP: 0.55,   // occlusion-ray march step through cave air
  TSTEPS: 14,    // occlusion-ray march budget
  BAND: 12,      // depth-band height; band k spans [k*BAND, k*BAND+BAND)
  TOP: -1,       // no natural void above this z (highest ceiling is -1.4)
  BOT: -36,      // deepest band floor for the slice; extensible downward
  MASK_F: 0.006, // cave-region mask frequency (regions ~150 u across)
  MASK_LO: 0.62, // mask gate: smoothstep(LO, HI, noise)
  MASK_HI: 0.70,
  FLOOR_F: 0.05, // floor ramp frequency; FLOOR_A * FLOOR_F * 1.5 bounds the
  FLOOR_A: 3.0,  // slope (~0.23 = 13 deg) - walkability is by construction
  PASS_F: 0.045, // passage isoline frequency (winding at ~20 u scale)
  PASS_F2: 0.062,// second isoline family; crossings knit the network together
  CHAM_F: 0.02,  // chamber noise frequency
  PASS_W: 0.06,  // passage half-width in isoline value units
  CHAM_W: 0.15,  // extra half-width inside chambers
  PASS_SCALE: 15,// value units -> approx world units (1 / (1.5 * PASS_F))
  // shafts: helical stair wells, one candidate per SHAFT_E cell per band
  // pair. Compact by design so the field only ever checks its own cell.
  SHAFT_E: 48,     // placement cell size; anchor jitter keeps R inside it
  SHAFT_R: 3.0,    // outer radius of the stair well
  SHAFT_RIN: 0.75, // central column radius (keeps the stair "supported")
  SHAFT_PITCH: 3.4,// vertical drop per full turn; grade ~16 deg mid-stair
  SHAFT_OPEN: 0.7, // open fraction of each turn (headroom 2.4, slab 1.0)
  // carved halls: one candidate per HALL_E cell per band; flat-floored
  // rotated rooms with a pillar lattice, entered wherever the natural
  // passage network punctures their walls
  HALL_E: 96,      // placement cell size
  PIL_S: 3.5,      // pillar lattice spacing inside halls
  PIL_R: 0.45,     // pillar half-width (square pillars, Chebyshev metric)
  // edits: sparse voxel-delta overlay (digging); see js/edits.js
  EDIT_CHUNK: 32,      // voxels per chunk edge
  EDIT_VOX: 0.5,       // voxel size, world units
  EDIT_SCALE: 0.03125, // stored i8 -> density units (1/32; range ~±4)
  EDIT_WORDS: 8192,    // u32 words per chunk (32^3 / 4)
};

// Band floor: a low-frequency ramp whose slope is bounded by construction.
// Mirror of WGSL caveFloor. KEEP IN SYNC.
function caveFloor(k, x, y) {
  const s = CFG.SEED >>> 0;
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  return k * CAVES.BAND + 1.6 +
         vn2(x * CAVES.FLOOR_F, y * CAVES.FLOOR_F, (bs ^ 0x0F1D) >>> 0) *
         CAVES.FLOOR_A;
}

// Natural banded void: positive inside carved space (roughly world-unit
// magnitude), very negative elsewhere. Passages are the near-median isolines
// of a per-band value noise - the median level set of a random field
// percolates, so the network is connected across the infinite plane. gz is
// terrainH(x, y), passed in because every caller already has it.
// Mirror of WGSL naturalV. KEEP IN SYNC.
function naturalV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return -1e9;
  const s = CFG.SEED >>> 0;
  const m = vn2(x * CAVES.MASK_F, y * CAVES.MASK_F, (s ^ 0x33AA) >>> 0);
  const gate = smoothstep(CAVES.MASK_LO, CAVES.MASK_HI, m) *
               smoothstep(CFG.SEA_LEVEL + 0.5, CFG.SEA_LEVEL + 1.5, gz);
  if (gate <= 0.001) return -1e9;
  const k = Math.floor(z / CAVES.BAND);
  const bs = (s ^ ((8 + k) * 0x9E37)) >>> 0;
  const fz = caveFloor(k, x, y);
  // two isoline families: each percolates on its own, and their crossings
  // knit isolated contour rings into one network with natural junctions
  const n1 = vn2(x * CAVES.PASS_F, y * CAVES.PASS_F, (bs ^ 0x5EA5) >>> 0);
  const n2 = vn2(x * CAVES.PASS_F2, y * CAVES.PASS_F2, (bs ^ 0x7A3B) >>> 0);
  const iso = Math.min(Math.abs(n1 - 0.5), Math.abs(n2 - 0.5));
  const c = vn2(x * CAVES.CHAM_F, y * CAVES.CHAM_F, (bs ^ 0xC4A6) >>> 0);
  const wide = smoothstep(0.60, 0.85, c);
  const w = (CAVES.PASS_W + wide * CAVES.CHAM_W) * gate;
  const ceilH = 2.6 + wide * 3.4;
  const h = (w - iso) * CAVES.PASS_SCALE;
  const vz = Math.min(z - fz, fz + ceilH - z);
  return Math.min(h, vz);
}

// Shaft candidate for placement cell (cx, cy) and band pair j (0 = surface
// into band -1, j >= 1 = band -j into band -(j+1)). Presence requires a
// passage at the anchor in the destination band (both bands for j >= 1), so
// a shaft always daylights into the network. When (px, py) is given, the
// cheap position/distance precheck runs before any expensive validation -
// the order the WGSL twin relies on. Mirror of WGSL shaftAt. KEEP IN SYNC.
function shaftAt(cx, cy, j, px, py) {
  const s = CFG.SEED >>> 0;
  const sj = (s ^ (0x51F7 + j * 0x9101)) >>> 0;
  if (hash01(cx, cy, sj) >= (j === 0 ? 0.55 : 0.8)) return null;
  const h2 = hash2i(cx, cy, (sj ^ 0x2C55) >>> 0);
  const ax = cx * CAVES.SHAFT_E + 10 + h2[0] * 28;
  const ay = cy * CAVES.SHAFT_E + 10 + h2[1] * 28;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > (CAVES.SHAFT_R + 2.0) * (CAVES.SHAFT_R + 2.0)) {
      return null;
    }
  }
  const gz = terrainH(ax, ay);
  let zTop, zBot;
  if (j === 0) {
    if (gz < CFG.SEA_LEVEL + 1.2 || gz > 11.0) return null;
    zTop = gz;
    zBot = caveFloor(-1, ax, ay);
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  } else {
    zTop = caveFloor(-j, ax, ay) + 0.2;
    zBot = caveFloor(-j - 1, ax, ay);
    if (naturalV(ax, ay, zTop + 1.0, gz) < 0.15) return null;
    if (naturalV(ax, ay, zBot + 1.2, gz) < 0.15) return null;
  }
  const phase = hash01(cx, cy, (sj ^ 0x77AD) >>> 0);
  return { ax, ay, zTop, zBot, phase };
}

// Helical stair carve for one shaft: an annulus between the central column
// and the outer wall, with a helicoid floor - SHAFT_OPEN of every turn is
// air, the rest is the stair slab. Open to the sky just above the mouth;
// the bottom join is the band's own passage carving through the outer wall.
// Returns [void, slab]: slab > 0 marks stair steps that must STAY rock even
// where a tall passage or chamber would carve them away - without it the
// last turns of the stair dissolve into the band void and leave a drop.
// Mirror of WGSL helixV. KEEP IN SYNC.
function helixV(x, y, z, a) {
  const dx = x - a.ax, dy = y - a.ay;
  const r = Math.hypot(dx, dy);
  const radial = Math.min(CAVES.SHAFT_R - r, r - CAVES.SHAFT_RIN);
  const u = (a.zTop - z) / CAVES.SHAFT_PITCH +
            Math.atan2(dy, dx) / (2 * Math.PI) + a.phase;
  const su = u - Math.floor(u);
  const sv = Math.min(su, CAVES.SHAFT_OPEN - su) * CAVES.SHAFT_PITCH;
  let v = Math.min(radial, sv);
  // entry apron: a flat ledge ring around the mouth, stepped into from any
  // rim angle; the stair top emerges from it and winds down
  const apron = Math.min(CAVES.SHAFT_R + 1.8 - r,
                         z - (a.zTop - 0.45));
  v = Math.max(v, apron);
  v = Math.min(v, a.zTop + 1.5 - z, z - (a.zBot - 0.2));
  const slab = Math.min(radial,
    Math.min(su - CAVES.SHAFT_OPEN, 1 - su) * CAVES.SHAFT_PITCH,
    Math.min(z - (a.zBot - 0.2), (a.zTop - 0.45) - z));
  return [v, slab];
}

// All shafts near (x, y): anchors are jittered to keep the well inside its
// own placement cell, so only that one cell is ever checked - the cheap
// presence hash is all the hot march loops pay when no shaft is near.
// Returns [void, slab] aggregated over the band pairs.
// Mirror of WGSL shaftV. KEEP IN SYNC.
function shaftV(x, y, z, gz) {
  if (z > gz + 1.5) return [-1e9, -1e9];
  const cx = Math.floor(x / CAVES.SHAFT_E);
  const cy = Math.floor(y / CAVES.SHAFT_E);
  let v = -1e9, slab = -1e9;
  for (let j = 0; j < 3; j++) {
    const a = shaftAt(cx, cy, j, x, y);
    if (!a) continue;
    if (z > a.zTop + 1.5 || z < a.zBot - 0.5) continue;
    const h = helixV(x, y, z, a);
    if (h[0] > v) v = h[0];
    if (h[1] > slab) slab = h[1];
  }
  return [v, slab];
}

// Hall candidate for placement cell (cx, cy) in band k. Presence requires a
// passage at the anchor, so the network's own tunnels puncture the walls -
// those punctures are the doorways. The floor is FLAT: it sits at the
// anchor's band-floor height across the whole room, which against the noisy
// passages is what reads as "someone carved this".
// Mirror of WGSL hallAt. KEEP IN SYNC.
function hallAt(cx, cy, k, px, py) {
  const s = CFG.SEED >>> 0;
  const sk = (s ^ (0xB00B + (8 + k) * 0x8121)) >>> 0;
  if (hash01(cx, cy, sk) >= 0.5) return null;
  const h2 = hash2i(cx, cy, (sk ^ 0x39D1) >>> 0);
  const ax = cx * CAVES.HALL_E + 16 + h2[0] * 64;
  const ay = cy * CAVES.HALL_E + 16 + h2[1] * 64;
  if (px !== undefined) {
    const dx = px - ax, dy = py - ay;
    if (dx * dx + dy * dy > 17 * 17) return null;
  }
  const h3 = hash2i(cx, cy, (sk ^ 0x5A5A) >>> 0);
  const gz = terrainH(ax, ay);
  const fz0 = caveFloor(k, ax, ay);
  if (naturalV(ax, ay, fz0 + 1.2, gz) < 0.15) return null;
  const ang = hash01(cx, cy, (sk ^ 0x11EF) >>> 0) * Math.PI;
  return {
    ax, ay,
    hx: 6 + h3[0] * 5,
    hy: 5 + h3[1] * 3,
    hgt: 3.2 + h3[0] * 1.3,
    fz0,
    ca: Math.cos(ang), sa: Math.sin(ang),
  };
}

// Hall carve near (x, y, z): returns [void, slab]. The room void is a plain
// rotated box; the flat floor slab and the pillar lattice ride the slab
// channel, so neither a chamber below nor one overlapping can dissolve them
// - freestanding pillars in a cavern are exactly the ruin look wanted.
// Mirror of WGSL hallV. KEEP IN SYNC.
function hallV(x, y, z, gz) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return [-1e9, -1e9];
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  if (!a) return [-1e9, -1e9];
  const dx = x - a.ax, dy = y - a.ay;
  const lx = a.ca * dx + a.sa * dy;
  const ly = -a.sa * dx + a.ca * dy;
  const inBox = Math.min(a.hx - Math.abs(lx), a.hy - Math.abs(ly));
  const v = Math.min(inBox, z - a.fz0, a.fz0 + a.hgt - z);
  // pillar lattice in the local frame (kept clear of the walls)
  const S = CAVES.PIL_S;
  const frac = t => t - Math.floor(t);
  const mx = Math.abs(frac(lx / S + 0.5) - 0.5) * S;
  const my = Math.abs(frac(ly / S + 0.5) - 0.5) * S;
  const cheb = Math.max(mx, my);
  const pillar = Math.min(CAVES.PIL_R - cheb, inBox - 1.2,
                          z - (a.fz0 - 0.1), a.fz0 + a.hgt - z);
  const floorSlab = Math.min(inBox, a.fz0 - z, z - (a.fz0 - 0.9));
  return [v, Math.max(pillar, floorSlab)];
}

// Which hall stands at this point, or null. CPU only - the shader needs the
// geometry, but only the gameplay side needs to know whose hall it is.
function hallIdAt(x, y, z) {
  if (z >= CAVES.TOP || z < CAVES.BOT) return null;
  const k = Math.floor(z / CAVES.BAND);
  const cx = Math.floor(x / CAVES.HALL_E);
  const cy = Math.floor(y / CAVES.HALL_E);
  const a = hallAt(cx, cy, k, x, y);
  return a ? { cx, cy, k, hall: a } : null;
}

// Cave void field: natural banded passages plus carved shafts and halls,
// minus the protected solids (stair slabs, hall floors, pillars), which win
// over every carve. Mirror of WGSL caveV. KEEP IN SYNC.
function caveV(x, y, z, gz) {
  const sv = shaftV(x, y, z, gz);
  const hv = hallV(x, y, z, gz);
  const v = Math.max(naturalV(x, y, z, gz), sv[0], hv[0]);
  return Math.min(v, -Math.max(sv[1], hv[1]));
}

// Layered density, the one authority on what is solid: positive in rock,
// negative in air. The sparse edit overlay (digging) adds on top - the
// typeof guard keeps this file loadable before js/edits.js and in node
// tests that do not exercise edits. Mirror of WGSL solidD. KEEP IN SYNC.
function solidD(x, y, z) {
  const gz = terrainH(x, y);
  let d = Math.min(gz - z, -caveV(x, y, z, gz));
  if (typeof Edits !== 'undefined' && Edits.bounds) d += Edits.sample(x, y, z);
  return d;
}

// -------- 3D value noise — mirror of WGSL vnoise --------
// Used by the shader for canopy erosion and glow lichen; mirrored here so
// the examine system can recognise a lichen patch at a hit point.
function jsUhash3(x, y, z) {
  return jsUhash(jsUhash(x >>> 0, y >>> 0) >>> 0, z >>> 0) >>> 0;
}

function vnoise(px, py, pz) {
  const ix = Math.floor(px), iy = Math.floor(py), iz = Math.floor(pz);
  const fx = px - ix, fy = py - iy, fz = pz - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const uz = fz * fz * (3 - 2 * fz);
  const s = 1 / 4294967296;
  const c000 = jsUhash3(ix, iy, iz) * s;
  const c100 = jsUhash3(ix + 1, iy, iz) * s;
  const c010 = jsUhash3(ix, iy + 1, iz) * s;
  const c110 = jsUhash3(ix + 1, iy + 1, iz) * s;
  const c001 = jsUhash3(ix, iy, iz + 1) * s;
  const c101 = jsUhash3(ix + 1, iy, iz + 1) * s;
  const c011 = jsUhash3(ix, iy + 1, iz + 1) * s;
  const c111 = jsUhash3(ix + 1, iy + 1, iz + 1) * s;
  const x00 = c000 + (c100 - c000) * ux;
  const x10 = c010 + (c110 - c010) * ux;
  const x01 = c001 + (c101 - c001) * ux;
  const x11 = c011 + (c111 - c011) * ux;
  const y0 = x00 + (x10 - x00) * uy;
  const y1 = x01 + (x11 - x01) * uy;
  return y0 + (y1 - y0) * uz;
}

// -------- ground materials: what the world is made of, per point --------
// Shared constants, interpolated into the WGSL template in
// js/webgpu/shaders.js so shader and mirror cannot disagree (scripts/
// verify.js enforces the no-literals convention for MAT_ too).
const MATS = {
  DIRT: 0, STONE: 1, ORE: 2, GEM: 3,
  SOIL_MAX: 2.4,    // soil depth on dead-flat ground, world units
  SOIL_STEEP: 0.55, // slope where soil runs out entirely (bare rock)
  SOIL_FLAT: 0.12,  // slope below which soil is at full depth
  SOIL_F: 0.09,     // soil-depth variation frequency
  SOIL_VAR: 1.2,    // soil-depth variation amplitude
  ORE_F: 0.021,     // ore-region frequency: most rock holds nothing
  ORE_GATE: 0.62,   // region noise above this can carry veins
  VEIN_F: 0.15,     // vein frequency; two isosurfaces meet in curves
  VEIN_W: 0.05,     // vein half-width in noise-value units
  GEM_CORE: 0.22,   // fraction of the vein width that is gem, not ore
  GEM_Z: -6.0,      // gems only form below this depth
  IRON_Z: -14.0,    // ore below this is iron; above it, place decides
  // Tin does not lie with copper. Cassiterite belongs to its own granites,
  // and that one geological fact is why the bronze age ran on trade rather
  // than on local smelting - the two halves of the alloy come out of two
  // different parts of the country. Here it is a province: a coarse 2D
  // field, so tin is somewhere you GO, not something you happen to hit.
  TIN_F: 0.004,     // province frequency: a 250 u noise cell, which runs
                    // out to provinces several hundred units across
  TIN_GATE: 0.70,   // province noise above this carries tin instead of copper
  // Glow lichen on cave rock. Mirrored: the shader decides where it grows
  // and World.classifySolid decides where you may pick it, so a divergence
  // here offers a harvest off a bare wall.
  LICHEN_F: 1.9,    // frequency of the patch noise
  LICHEN_T: 0.8,    // noise above this is a patch
  LICHEN_GAIN: 9.0, // how fast a patch brightens past the threshold
};

// Soil depth below the surface at (x, y): deep on flats, zero on steep
// ground - which is why hillsides read as bare rock. Mirror of WGSL
// soilDepth. KEEP IN SYNC.
function soilDepth(x, y) {
  const e = 0.5;
  const hx = terrainH(x + e, y) - terrainH(x - e, y);
  const hy = terrainH(x, y + e) - terrainH(x, y - e);
  const slope = Math.hypot(hx, hy) / (2 * e);
  const d = smoothstep(MATS.SOIL_STEEP, MATS.SOIL_FLAT, slope) * MATS.SOIL_MAX +
    (vn2(x * MATS.SOIL_F, y * MATS.SOIL_F, (CFG.SEED ^ 0xD117) >>> 0) - 0.5) *
    MATS.SOIL_VAR;
  return Math.max(d, 0);
}

// What a point of rock is: plain stone, an ore vein, or a gem pocket. Two
// value-noise isosurfaces intersect along CURVES, not sheets - that is what
// makes veins read as branching tubes threading the stone rather than
// slabs. Gems sit in the very core of a deep vein. Mirror of WGSL rockMat.
// KEEP IN SYNC.
function rockMat(x, y, z) {
  const o = (CFG.SEED & 0xff) * 0.7;
  const reg = vnoise(x * MATS.ORE_F + 13 + o, y * MATS.ORE_F + 13,
                     z * MATS.ORE_F + 13);
  if (reg < MATS.ORE_GATE) return MATS.STONE;
  const strength = (reg - MATS.ORE_GATE) / (1 - MATS.ORE_GATE);
  const n1 = vnoise(x * MATS.VEIN_F + o, y * MATS.VEIN_F, z * MATS.VEIN_F);
  const n2 = vnoise(x * MATS.VEIN_F + 41 + o, y * MATS.VEIN_F + 17,
                    z * MATS.VEIN_F + 73);
  const w = MATS.VEIN_W * strength;
  const d1 = Math.abs(n1 - 0.5), d2 = Math.abs(n2 - 0.5);
  if (d1 >= w || d2 >= w) return MATS.STONE;
  if (z < MATS.GEM_Z && d1 < w * MATS.GEM_CORE && d2 < w * MATS.GEM_CORE) {
    return MATS.GEM;
  }
  return MATS.ORE;
}

// Material at a world point. gz is terrainH(x, y) - every caller has it.
// Mirror of WGSL matAt. KEEP IN SYNC.
function matAt(x, y, z, gz) {
  if (z > gz - soilDepth(x, y)) return MATS.DIRT;
  return rockMat(x, y, z);
}

// Is this ground tin country? A pure function of where you are standing,
// independent of whether there is any ore under it - the province is the
// place, the vein is the luck. Mirror of WGSL tinCountry. KEEP IN SYNC.
function tinCountry(x, y) {
  return vn2(x * MATS.TIN_F, y * MATS.TIN_F, (CFG.SEED ^ 0x7104) >>> 0) >
         MATS.TIN_GATE;
}

// Which metal a vein carries. Depth decides iron; above that the ground
// does, which is what makes bronze the first thing in this world nobody can
// make without leaving home.
function oreItem(x, y, z) {
  if (z < MATS.IRON_Z) return 'iron';
  return tinCountry(x, y) ? 'tin' : 'copper';
}

// species index for the tree anchored in cell (ix, iy) - deterministic,
// independent of the placement hash so size and species do not correlate
function treeSpecies(ix, iy) {
  return Math.min(2, Math.floor(hash01(ix, iy, (CFG.SEED ^ 0x5EED) >>> 0) * 3));
}

// -------- loose stones and boulders. KEEP IN SYNC with the WGSL --------
// One prop per cell, hash-placed like the trees, so the cleared-cell set in
// js/removed.js covers all of them with a single "ix,iy".
const PROPS = {
  STONE_D: 0.055,   // chance a cell holds a loose stone
  STONE_R: 0.13,    // stone bounding radius, plus a hashed share again
  // View cutoffs, set from each prop's LARGEST possible size at the range
  // where it stops covering even one character cell (a cell is ~0.0106 rad
  // at the default field of view). Cut any nearer and a prop vanishes while
  // it is still drawable, which reads as flicker as you walk.
  STONE_VIEW: 52,   // biggest stone is under a cell past 49
  ROCK_D: 0.011,    // chance a cell holds a boulder
  ROCK_R: 0.68,     // boulder bounding radius, plus a hashed share again
  ROCK_VIEW: 140,   // biggest boulder holds a cell to 256; MAX_DIST cuts first
  // Stones are not spheres: each is a bounding sphere with this many flat
  // cuts taken out of it, giving a faceted silhouette and flat per-face
  // normals. Measured over 30 boulders, this leaves 89% of the surface flat
  // - a low-poly read rather than a weathered one - and because every cut
  // sits at least CUT_MIN of the radius out, no rock can be clipped away.
  FACES: 11,
  CUT_MIN: 0.48,
  CUT_MAX: 0.78,
  // The cuts mean a rock fills roughly this much of its bounding sphere, so
  // collision has to use it or you would be stopped short of thin air.
  SOLID: 0.8,
};

// A loose stone: small, sits on the ground, free to pick up by hand.
// Mirror of WGSL stoneAt. KEEP IN SYNC.
function stoneAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0x570E) >>> 0) >= PROPS.STONE_D) return null;
  const h2 = hash2i(ix, iy, (s ^ 0x5C0B) >>> 0);
  const r = PROPS.STONE_R * (1 + h2[0]);
  return { cx: ix + 0.2 + h2[0] * 0.6, cy: iy + 0.2 + h2[1] * 0.6, r };
}

// A boulder: too big to lift, wants a pickaxe, and blocks the way.
// Mirror of WGSL rockAt. KEEP IN SYNC.
function rockAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  if (hash01(ix, iy, (s ^ 0xB017) >>> 0) >= PROPS.ROCK_D) return null;
  if (treeAt(ix, iy)) return null;        // one prop to a cell
  const h2 = hash2i(ix, iy, (s ^ 0xB0DA) >>> 0);
  const r = PROPS.ROCK_R * (1 + h2[0]);
  return { cx: ix + 0.5, cy: iy + 0.5, r,
           // sunk into the ground so it reads as bedded, not dropped
           z: -r * 0.35 };
}

// -------- tree placement — mirror of WGSL treeAt --------
// Shared with the shader the same way the terrain constants are: the
// canopy's shape and its erosion noise are written down once. The erosion
// numbers matter twice over, because the primary ray and the shadow ray
// each carve the canopy's holes independently - if those two drifted, a
// tree would shadow gaps the eye can see straight through.
const TREE = {
  FOREST_F: 0.021,   // frequency of the forest-region field
  DENS_LO: 0.45,     // region gate: below LO is open ground
  DENS_HI: 0.72,
  DENS_A: 0.16,      // per-cell tree chance deep inside a forest
  DENS_MIN: 0.004,   // and out on the open ground, the occasional lone tree
  OFF: 0.3,          // anchor jitter within the cell
  OFF_VAR: 0.4,
  R_MIN: 1.0,        // canopy radius
  R_VAR: 0.5,
  TRUNK_H: 2.6,      // trunk height
  TRUNK_H_VAR: 1.2,
  TRUNK_R: 0.085,    // trunk radius: a constant plus a share of the canopy
  TRUNK_R_K: 0.055,
  CAN_Z: 0.55,       // canopy centre above the trunk top, in canopy radii
  // canopy erosion: two octaves of 3D noise thin the sphere into foliage
  DENS_F1: 2.6, DENS_W1: 0.75,
  DENS_F2: 6.5, DENS_W2: 0.25,
  EXT: 1.35,         // extinction along the chord through the canopy
  EXT_MIN: 0.35,     // floor and gain applied to the density before it
  EXT_K: 1.3,
  ALPHA_MIN: 0.03,   // below this the canopy is a hole, not foliage
};

function treeAt(ix, iy) {
  const s = CFG.SEED >>> 0;
  const forest = vn2(ix * TREE.FOREST_F, iy * TREE.FOREST_F, (s ^ 0xF0F0) >>> 0);
  const density = smoothstep(TREE.DENS_LO, TREE.DENS_HI, forest) * TREE.DENS_A +
                  TREE.DENS_MIN;
  if (hash01(ix, iy, (s ^ 0x7EE7) >>> 0) >= density) return null;
  const h2 = hash2i(ix, iy, (s ^ 0xA11C) >>> 0);
  const r = TREE.R_MIN + h2[0] * TREE.R_VAR;
  return {
    cx: ix + TREE.OFF + h2[0] * TREE.OFF_VAR,
    cy: iy + TREE.OFF + h2[1] * TREE.OFF_VAR,
    r,
    trunkH: TREE.TRUNK_H + h2[1] * TREE.TRUNK_H_VAR,
    trunkR: TREE.TRUNK_R + r * TREE.TRUNK_R_K,
  };
}
</script>
<script>
// ---- js/items.js ----
// Item, recipe, and tree-species definitions. Data only - the logic that
// gives, takes, crafts, and examines lives in js/game.js.
const ITEMS = {
  wood:   { name: 'wood',        desc: 'Rough-split timber.' },
  stone:  { name: 'stone',       desc: 'Fist-sized chunks of rock.' },
  lichen: { name: 'glow lichen', desc: 'Faintly luminous. Cold to the touch.' },
  fruit:  { name: 'pale fruit',  desc: 'Heavy and sweet-smelling.' },
  sap:    { name: 'pine sap',    desc: 'Sticky amber resin.' },
  copper: { name: 'copper ore',  desc: 'Green-crusted, soft, warm-toned.' },
  iron:   { name: 'iron ore',    desc: 'Heavy, dull, faintly magnetic.' },
  tin:    { name: 'tin ore',     desc: 'Pale, heavy, and never where the copper is.' },
  bronze: { name: 'bronze',      desc: 'Copper and tin. Harder than either alone.' },
  gem:    { name: 'gem',         desc: 'It holds the light a moment too long.' },
  axe:    { name: 'stone axe',   desc: 'Removed trees.' },
  pick:   { name: 'stone pickaxe', desc: 'Breaks stone and frees the soft metals.' },
  bronzepick: { name: 'bronze pickaxe', desc: 'Bites iron, which stone will not.' },
  ironpick:   { name: 'iron pickaxe',   desc: 'Hard enough for the gem pockets.' },
  shovel: { name: 'wooden shovel', desc: 'Moves soil. Useless on rock.' },
  torch:  { name: 'torch',       desc: 'Brightens your lamp while carried.' },
  lantern:{ name: 'gem lantern', desc: 'A gem in a copper cage. Bright, steady.' },
};

// `n` is how many the recipe yields, defaulting to one. Smelting is the
// only thing so far that gives back more pieces than it takes names.
const RECIPES = [
  { out: 'axe',     needs: { wood: 2, stone: 1 } },
  { out: 'pick',    needs: { wood: 1, stone: 2 } },
  { out: 'shovel',  needs: { wood: 2, stone: 1 } },
  { out: 'torch',   needs: { wood: 1, lichen: 1 } },
  { out: 'lantern', needs: { gem: 1, copper: 2, wood: 1 } },
  // The alloy. Three parts copper to one of tin is roughly what the real
  // thing runs at, and the wood is the fire under it - so bronze costs a
  // journey for the tin and a woodland for the heat.
  { out: 'bronze',  n: 2, needs: { copper: 3, tin: 1, wood: 2 } },
  // A pick only bites what it is harder than, so the metals are a ladder
  // and each rung is the way up to the next: bronze is what opens iron,
  // and iron is what opens the gems the lantern wants.
  { out: 'bronzepick', needs: { bronze: 2, wood: 1 } },
  { out: 'ironpick',   needs: { iron: 3, wood: 1 } },
];

// Species index comes from the tree's placement hash - deterministic per
// tree, same on every visit. harvest: [item, count] or null.
const SPECIES = [
  { name: 'pine',      desc: 'Tall, dark, resin-streaked.',
    harvest: ['sap', 2],   chop: 3,
    hug: 'Sticky. Worth it.' },
  { name: 'bloomwood', desc: 'A broadleaf heavy with pale fruit.',
    harvest: ['fruit', 2], chop: 3,
    hug: 'The canopy rustles approvingly.' },
  { name: 'ironbark',  desc: 'Dense and dark. Dents axe blades.',
    harvest: null,         chop: 4,
    hug: 'Like hugging a wall. Solid.' },
];
</script>
<script>
// ---- js/webgpu/atlas.js ----
// Procedural glyph atlas.
//
// Glyph order is measured, not guessed: every candidate is rendered and its
// ink coverage sampled, then the set is sorted by coverage and resampled so
// the ramp is close to linear in brightness. A hand-ordered ramp is uneven —
// the gaps show up as banding in smooth gradients.

// Full printable-ASCII strip (codes 32..126) for the text overlay, rendered
// at the display cell size like the ramp atlas so texels stay 1:1 with pixels.
const TextAtlas = {
  FIRST: 32, COUNT: 95,

  build(cellW, cellH) {
    const W = Math.max(4, Math.round(cellW || 10));
    const H = Math.max(6, Math.round(cellH || 18));
    const cv = document.createElement('canvas');
    cv.width = W * this.COUNT;
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(6, Math.round(H * 0.85))}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < this.COUNT; i++) {
      ctx.fillText(String.fromCharCode(this.FIRST + i), i * W + W / 2, H / 2);
    }
    return { canvas: cv };
  },
};

const GlyphAtlas = {
  // Candidate pools, printable ASCII only — no block elements, which read as
  // pixels rather than as text. Both pools top out near 25% ink, so the tone
  // curve in the fragment shader does the work of keeping bright areas
  // (mainly sky) off the end of the ramp.
  SETS: {
    ascii:   ' .\'`^",:;!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@',
    symbols: ' .\'`^",:;!|/\\()[]{}<>~+-_=*#%&@$?',
  },
  CELL: 32,
  LEVELS: 24,

  measure(chars) {
    const S = 16;
    const cv = document.createElement('canvas');
    cv.width = S; cv.height = S;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.font = `bold ${S * 0.8}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const out = [];
    for (const ch of chars) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, S, S);
      ctx.fillStyle = '#fff';
      ctx.fillText(ch, S / 2, S / 2 + 1);
      const d = ctx.getImageData(0, 0, S, S).data;
      let sum = 0;
      for (let i = 0; i < d.length; i += 4) sum += d[i];
      out.push({ ch, cov: sum / (S * S * 255) });
    }
    return out;
  },

  // pick LEVELS glyphs whose coverages are as evenly spaced as possible
  buildRamp(setName) {
    const seen = new Set();
    const uniq = [];
    for (const g of this.measure(this.SETS[setName] || this.SETS.symbols)) {
      const key = g.cov.toFixed(4);
      if (seen.has(key)) continue;      // drop visually identical glyphs
      seen.add(key);
      uniq.push(g);
    }
    uniq.sort((a, b) => a.cov - b.cov);

    // Walk the sorted glyphs and take the first past each evenly spaced
    // threshold. Glyphs whose coverage is nearly identical look the same on
    // screen, so admitting them would spend ramp steps that show no change;
    // this keeps every step visually distinct and lets the count fall to
    // whatever the font can actually supply.
    const lo = uniq[0].cov, hi = uniq[uniq.length - 1].cov;
    const stepSize = (hi - lo) / (this.LEVELS - 1);
    const ramp = [];
    let next = lo;
    for (const g of uniq) {
      if (g.cov + 1e-9 >= next) {
        ramp.push(g);
        next = g.cov + stepSize;
      }
    }
    const last = uniq[uniq.length - 1];
    if (ramp[ramp.length - 1] !== last) ramp.push(last);
    return ramp;
  },

  // cell is the on-screen size of a glyph in device pixels; rendering the
  // atlas at exactly that size keeps texel-to-pixel mapping 1:1, which is
  // what stops the glyphs from aliasing into moire
  build(setName, cellW, cellH) {
    const ramp = this.buildRamp(setName || CFG.GLYPH_SET);
    this.ramp = ramp;
    const W = Math.max(4, Math.round(cellW || 10));
    const H = Math.max(6, Math.round(cellH || 18));
    const n = ramp.length;
    const cv = document.createElement('canvas');
    cv.width = W * n;
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(6, Math.round(H * 0.85))}px "Consolas", "Courier New", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(ramp[i].ch, i * W + W / 2, H / 2);
    }
    return { canvas: cv, levels: n,
             chars: ramp.map(g => g.ch).join('') };
  },
};
</script>
<script>
// ---- js/assets.js ----
// The asset catalogue: everything that stands on this ground, written as
// geometry rather than stored as one.
//
// Nothing here is a mesh. A building is a function of (kind, seed, decay)
// that returns a list of analytic primitives - boxes, cylinders, cones,
// convex bodies, faceted stones - which are exactly the shapes the shader
// already knows how to intersect. That is the whole point: what the viewer
// draws is not a preview of an asset, it IS the asset, and the same parts
// list can be handed to the renderer without anything being baked.
//
// The decay model and the vocabulary are the chronicle's, not new ones. A
// site has a kind (hold, farm, mine), a people with a material (timber or
// stone) and a metal, an abandonment year and a cause. Those five facts
// decide what stands here and how much of it is left, so a ruin in the
// world is the residue of something the sim actually did.
//
// Pure CPU, no DOM, no storage. Deterministic in (kind, seed): two runs
// agree part for part.

const ASSET = {
  // Decay runs 0 (as built) to 1 (a rectangle of stones in the grass).
  // The stage boundaries are named the way the chronicle names an
  // artifact's condition, because a reader should not have to learn two
  // vocabularies for the same idea.
  STAGES: [
    [0.00, 'standing'],   // roofed, whole, somebody lives here
    [0.18, 'weathered'],  // thatch thin, timber silvered, nobody sweeping
    [0.38, 'roofless'],   // the roof is the first thing to go, always
    [0.62, 'ruined'],     // walls broken to knee and shoulder, rubble skirt
    [0.86, 'footings'],   // a plan in the grass; a tell if the soil took it
  ],
  // Years for a material to lose roughly two thirds of itself once nobody
  // is maintaining it. Thatch goes in a decade, drystone essentially never
  // does - which is why a ruined timber farm is a scatter of postholes and
  // a ruined stone hold is still a wall you can lean on. Same shape as the
  // chronicle's KEEPS table, applied to buildings instead of objects.
  LASTS: {
    thatch: 30, turf: 60, timber: 120, daub: 90, char: 400,
    drystone: 2600, stone: 2000, cutstone: 3000, soil: 1e9,
    iron: 700, bronze: 2400, copper: 1900, gold: 1e9, bone: 800,
    ash: 1e9, water: 1e9, moss: 1e9, brick: 1400,
  },
  // What a cause does to a place, beyond ageing it. `burn` chars the
  // timber and takes the roof early; `spill` is how much of what they
  // owned is still lying about, because people who ran left more behind
  // than people who packed; `throw` is how far the rubble travels.
  CAUSES: {
    left:    { burn: 0.0, spill: 0.10, throw: 1.0, note: 'walked away from' },
    sacked:  { burn: 0.9, spill: 0.75, throw: 1.9, note: 'taken and burnt' },
    plague:  { burn: 0.2, spill: 0.60, throw: 1.0, note: 'emptied by sickness' },
    flood:   { burn: 0.0, spill: 0.45, throw: 1.3, note: 'drowned and silted' },
    famine:  { burn: 0.0, spill: 0.30, throw: 1.0, note: 'starved out' },
    'the deep': { burn: 0.1, spill: 0.80, throw: 1.2, note: 'lost to the deep' },
  },
  // Growth reclaiming the plan. Nothing grows on a floor somebody sweeps,
  // and by the time the walls are knee-high the place is a thicket.
  GREEN_FROM: 0.30,
  GREEN_MAX: 14,      // saplings and tussocks at full abandonment
  RUBBLE_MAX: 26,     // fallen stones a big ruin sheds
  // Where the centre of a faceted stone sits above the ground, as a share of
  // its radius. A facet is a bounding sphere with cuts taken out of it, and
  // every cut is at least PROPS.CUT_MIN of the radius out - so a stone whose
  // centre sits higher than CUT_MIN can have its whole underside cut away
  // and hang in the air. Below that it always makes contact, and a little
  // below reads as bedded, which is what the boulders in the game already do.
  SIT: 0.34,
  // How far a building goes into the ground as it is left. Soil does not
  // stay still: it washes off the slope above and blows in off the field,
  // and a floor swept level with the yard ends up a foot under it. This is
  // why a ruin is dug rather than walked into, and it is most of what makes
  // an old site read as old rather than as a broken new one.
  //
  // Deep enough to read as burial rather than as settling. A site out of
  // use for a thousand years is not a step down, it is a dig - and that
  // number can be honest now the section view exists to show the result.
  // What keeps the plan legible under it is not a shallow sink but a
  // footing course that does not decay; see the drystone curve in wallRun.
  SINK_MAX: 1.65,
};

// Albedo per material, in the same register as the shader's ground colours -
// nothing saturated, because the glyph ramp has 24 steps and colour has to
// survive being one of them.
const AMAT = {
  timber:   { c: [0.42, 0.31, 0.20], name: 'timber' },
  char:     { c: [0.13, 0.11, 0.10], name: 'burnt timber' },
  thatch:   { c: [0.56, 0.47, 0.28], name: 'thatch' },
  turf:     { c: [0.34, 0.46, 0.26], name: 'turf' },
  daub:     { c: [0.62, 0.57, 0.47], name: 'daub' },
  drystone: { c: [0.47, 0.46, 0.43], name: 'drystone' },
  stone:    { c: [0.44, 0.41, 0.38], name: 'stone' },
  cutstone: { c: [0.54, 0.52, 0.48], name: 'cut stone' },
  brick:    { c: [0.51, 0.34, 0.27], name: 'fired brick' },
  soil:     { c: [0.34, 0.28, 0.22], name: 'soil' },
  ash:      { c: [0.28, 0.27, 0.26], name: 'ash' },
  moss:     { c: [0.30, 0.42, 0.28], name: 'moss' },
  leaf:     { c: [0.40, 0.60, 0.32], name: 'leaf' },
  water:    { c: [0.18, 0.30, 0.40], name: 'water' },
  iron:     { c: [0.40, 0.40, 0.42], name: 'iron' },
  rust:     { c: [0.45, 0.28, 0.18], name: 'rusted iron' },
  bronze:   { c: [0.62, 0.46, 0.24], name: 'bronze' },
  copper:   { c: [0.40, 0.58, 0.48], name: 'weathered copper' },
  steel:    { c: [0.56, 0.58, 0.62], name: 'steel' },
  gold:     { c: [0.78, 0.65, 0.28], name: 'gold' },
  silver:   { c: [0.70, 0.72, 0.74], name: 'silver' },
  bone:     { c: [0.72, 0.70, 0.62], name: 'bone' },
  amber:    { c: [0.72, 0.48, 0.18], name: 'amber' },
  jet:      { c: [0.14, 0.13, 0.15], name: 'jet' },
  greenstone: { c: [0.36, 0.52, 0.40], name: 'greenstone' },
  shell:    { c: [0.76, 0.72, 0.66], name: 'shell' },
  gem:      { c: [0.55, 0.80, 0.95], name: 'gem', emit: 0.35 },
  ore:      { c: [0.62, 0.42, 0.30], name: 'ore' },
  lichen:   { c: [0.55, 0.75, 0.70], name: 'glow lichen', emit: 0.5 },
  glass:    { c: [0.60, 0.68, 0.70], name: 'glass' },
  // Not a material anything is made of: the figure that gives scale. Cool
  // and mid-bright, so it separates from every warm earth tone in the list
  // and reads as an instrument rather than as part of the building.
  mark:     { c: [0.44, 0.52, 0.62], name: 'scale figure' },
  // Not a material either: the discolouration a rotted object leaves in the
  // soil. Warm and pale against the ground, because on a dark field the
  // readable stain is the light one - a real one is usually darker than the
  // matrix around it, and here that would be a hole rather than a find.
  stain:    { c: [0.40, 0.33, 0.24], name: 'a stain in the soil' },
};

// -------- primitives --------
// Six shapes, chosen because the shader already traces five of them and the
// sixth (a convex body cut by planes) is the slab loop hitFaceted already
// runs, with the plane normals given instead of hashed. Adding geometry here
// costs the renderer a branch, not an intersector.

const Prim = {
  box(c, he, mat, q) { return { k: 'box', c, he, mat, q: q || null }; },
  cyl(c, r, z0, z1, mat, q) { return { k: 'cyl', c, r, z0, z1, mat, q: q || null }; },
  sph(c, r, mat) { return { k: 'sph', c, r, mat }; },
  // truncated cone: r0 at z0, r1 at z1. A spoil heap, a conical roof, a
  // tapering post and a kiln are all this shape with different numbers.
  cone(c, z0, z1, r0, r1, mat, q) {
    return { k: 'cone', c, z0, z1, r0, r1, mat, q: q || null };
  },
  // convex body as an intersection of half-spaces dot(n,p) <= d, in local
  // space about `c`. Gable roofs, wedges, revetments, broken wall stubs.
  conv(c, planes, mat, q) { return { k: 'conv', c, planes, mat, q: q || null }; },
  // a faceted stone: the boulder shape the game already draws, reused for
  // every piece of rubble so a ruin is made of the same rock as the hill
  facet(c, r, seed, mat) { return { k: 'facet', c, r, seed, mat: mat || 'drystone' }; },
};

// A beam from one point to another. Worth a function because the other way
// round - working out a centre, a length and two angles at every call site -
// is exactly how a rafter ends up horizontal and nobody notices until it is
// hanging in the air over a roof that has gone.
function beamDir(a, b) {
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const L = Math.hypot(d[0], d[1], d[2]);
  return { L, yaw: Math.atan2(d[1], d[0]),
           pitch: Math.atan2(Math.hypot(d[0], d[1]), d[2]) };
}

// square section
function beam(a, b, r, mat) {
  const d = beamDir(a, b);
  if (d.L < 1e-6) return null;
  return Prim.box([(a[0] + b[0]) / 2, (a[1] + b[1]) / 2, (a[2] + b[2]) / 2],
                  [r, r, d.L / 2], mat, [d.yaw, d.pitch]);
}

// round section, anchored at the first point the way a cylinder is
function strut(a, b, r, mat) {
  const d = beamDir(a, b);
  if (d.L < 1e-6) return null;
  return Prim.cyl([a[0], a[1]], r, a[2], a[2] + d.L, mat, [d.yaw, d.pitch]);
}

// A gable roof over a rectangle: two slopes, two ends, a soffit. Written as
// planes so a half-collapsed roof is the same body with one slope removed.
function gable(cx, cy, cz, hx, hy, rise, mat, half) {
  // The pitch plane contains the ridge (0, 0, rise) and the eave (0, hy, 0),
  // so its normal is perpendicular to the edge between them - (0, rise, hy),
  // not (0, hy, rise). Getting that pair the wrong way round builds a roof
  // that is still convex, still closed, and the wrong shape.
  const s = Math.hypot(hy, rise);
  const planes = [
    { n: [0, 0, -1], d: 0 },              // the soffit
    { n: [1, 0, 0], d: hx }, { n: [-1, 0, 0], d: hx },
    { n: [0, rise / s, hy / s], d: hy * rise / s },
  ];
  // a roof that has lost one pitch keeps the other, which is what a
  // half-fallen house actually looks like from the gable end
  if (!half) planes.push({ n: [0, -rise / s, hy / s], d: hy * rise / s });
  else planes.push({ n: [0, -1, 0], d: 0 });
  return Prim.conv([cx, cy, cz], planes, mat);
}

// -------- decay --------

// Deterministic per-asset randomness. Every draw is keyed by the asset's
// name and an index, so adding a part to one building cannot shuffle the
// stones of another - which is what makes a viewer worth reviewing twice.
function arnd(key, i) {
  let h = (CFG.SEED ^ 0x9E37) >>> 0;
  for (let k = 0; k < key.length; k++) h = jsUhash(h, key.charCodeAt(k));
  return jsUhash(h, (i * 2654435761) >>> 0) / 4294967296;
}

// What fraction of a material is left after `years` untended. Exponential,
// same law the chronicle uses for what is in the ground, because it is the
// same physics: something is lost at a rate proportional to what is left.
function wear(mat, years) {
  return Math.exp(-years / (ASSET.LASTS[mat] || 1000));
}

// The word for a decay value, and the value for a word.
function stageOf(d) {
  let w = ASSET.STAGES[0][1];
  for (const [t, n] of ASSET.STAGES) if (d >= t) w = n;
  return w;
}

// A building's context: everything it needs to know about who built it and
// what happened to them. Defaults describe a timber farm nobody burnt.
function assetCtx(o) {
  o = o || {};
  const cause = o.cause && ASSET.CAUSES[o.cause] ? o.cause : 'left';
  const d = clamp(o.decay === undefined ? 0 : o.decay, 0, 1);
  return {
    key: o.key || 'asset',
    decay: d,
    stage: stageOf(d),
    cause,
    fx: ASSET.CAUSES[cause],
    // burnt timber is timber that has already had its fire; it survives
    // being weather far better than the wood it was, which is why a burnt
    // post is often the only post left standing
    wood: (d > 0.12 && ASSET.CAUSES[cause].burn > 0.5) ? 'char' : 'timber',
    mat: o.mat === 'stone' ? 'stone' : 'timber',
    metal: o.metal || 'copper',
    rnd(i) { return arnd(this.key, i); },
  };
}

// -------- ruin helpers --------
// The two shapes that carry every ruin: a wall that breaks unevenly, and a
// row of posts that rots to stumps. Everything else is detail on top.

// A wall run from (x0,y0) to (x1,y1), broken into segments whose surviving
// height is hashed per segment. A ragged top line is the whole read of a
// ruin - an evenly-lowered wall looks like a design decision, and a wall
// with one gap looks like a doorway.
function wallRun(P, ctx, tag, x0, y0, x1, y1, h, th, mat, seg, base) {
  const dx = x1 - x0, dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 1e-4) return;
  const n = seg || Math.max(2, Math.round(len / 1.1));
  const z0 = base || 0;
  const yaw = Math.atan2(dy, dx);
  const d = ctx.decay;
  // stone stands; timber walls are gone by the time the stone is knee-high
  // Timber goes to nothing; stone does not. A footing course is the last
  // thing on a site and the reason a plan is still readable a thousand
  // years on, so the stone curve bottoms out at a course rather than at
  // zero - and the site keeps a shape instead of becoming a bare field.
  // Tuned so the stage names mean what they say: a wall is whole through
  // `weathered`, still standing through `roofless` (the roof is what has
  // gone, not the room), broken through `ruined`, and a course in the grass
  // at `footings`. The earlier curves had timber gone by the middle of
  // `roofless`, which made the two middle stages the same picture.
  const soft = mat === 'timber' || mat === 'char';
  // Drystone gets its own curve and barely moves on it. A footing course is
  // not something time takes away - it is what time leaves, and it is the
  // reason a plan is still readable when everything above it has gone. Held
  // to the same curve as walling stone it vanished under the turf, and the
  // last two stages had nothing in them to look at.
  const keep = soft ? 1 - smoothstep(0.45, 0.92, d)
    : mat === 'drystone' ? 1 - smoothstep(0.40, 1.0, d) * 0.30
    : 1 - smoothstep(0.35, 1.0, d) * 0.72;
  // A wall somebody is still living behind has a straight top. The ragged
  // line is what decay DOES to it, so the variation has to come in with the
  // decay rather than being there from the day it was built - at zero this
  // has to be a wall, or nothing below it means anything.
  const rough = smoothstep(0.02, 0.45, d);
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    const r = ctx.rnd(hashTag(tag, i));
    // Each segment takes its own share off the top, so the break line is
    // jagged. The variation only ever removes, and only in proportion to
    // what the material has already lost - stacking a second reduction on
    // top of `keep` is how a wall ends up gone at half the decay it should.
    let sh = h * keep * (1 - rough * 0.55 * r);
    // and a length of it is simply gone, more of it as the years run
    if (r < d * (soft ? 0.52 : 0.30)) sh = 0;
    sh = Math.max(0, Math.min(sh, h));
    if (sh < 0.06) { rubbleAt(P, ctx, tag + 'r' + i,
      x0 + dx * (t0 + t1) / 2, y0 + dy * (t0 + t1) / 2, th, mat); continue; }
    const cx = x0 + dx * (t0 + t1) / 2, cy = y0 + dy * (t0 + t1) / 2;
    P.push(Prim.box([cx, cy, z0 + sh / 2], [len / (2 * n), th / 2, sh / 2], mat,
      [yaw, 0]));
    // a wall that has lost its top has the top lying at its foot
    if (sh < h * 0.75 && d > 0.05) {
      rubbleAt(P, ctx, tag + 'f' + i, cx, cy, th, mat);
    }
  }
}

// small hash of a tag and an index into one integer, so every call site
// gets its own stream without anybody having to allocate one
function hashTag(tag, i) {
  let h = 0;
  for (let k = 0; k < tag.length; k++) h = (h * 31 + tag.charCodeAt(k)) | 0;
  return ((h ^ (i * 7919)) >>> 0) % 100000;
}

// The stones a wall sheds, thrown further when somebody knocked it down
// than when it fell over on its own.
function rubbleAt(P, ctx, tag, x, y, th, mat) {
  const stone = mat === 'timber' || mat === 'char' ? mat : 'drystone';
  const n = 1 + Math.floor(ctx.rnd(hashTag(tag, 1)) * 3 * (0.4 + ctx.decay));
  for (let i = 0; i < n; i++) {
    const a = ctx.rnd(hashTag(tag, 10 + i)) * 6.2832;
    const s = (0.3 + ctx.rnd(hashTag(tag, 20 + i))) * th * 2.2 * ctx.fx.throw;
    const r = th * (0.22 + 0.30 * ctx.rnd(hashTag(tag, 30 + i)));
    if (stone === 'timber' || stone === 'char') {
      // a fallen timber lies down; it does not turn into gravel
      P.push(Prim.box([x + Math.cos(a) * s, y + Math.sin(a) * s, r * 0.7],
        [r * 3.0, r * 0.7, r * 0.7], stone, [a, 0]));
    } else {
      P.push(Prim.facet([x + Math.cos(a) * s, y + Math.sin(a) * s, r * ASSET.SIT],
        r, hashTag(tag, 40 + i), stone));
    }
  }
}

// A row of posts. Timber rots from the ground up but breaks at the top, so
// what is left of a post ring is stumps of uneven height - and, once the
// place is truly old, holes in the soil the grass grows differently over.
function postRow(P, ctx, tag, x0, y0, x1, y1, n, h, r, mat, base) {
  const d = ctx.decay;
  const z0 = base || 0;
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const x = x0 + (x1 - x0) * t, y = y0 + (y1 - y0) * t;
    const q = ctx.rnd(hashTag(tag, i));
    const keep = clamp(1 - smoothstep(0.12, 0.80, d) * (0.55 + q * 0.9), 0, 1);
    const ph = h * keep;
    if (ph > 0.10) {
      // a standing post leans a little once the ground around it goes soft
      const lean = (q - 0.5) * d * 0.32;
      P.push(Prim.cyl([x, y], r, z0, z0 + ph, mat, [q * 6.2832, lean]));
    } else if (d < 0.92) {
      // the stump, and beside it the length of it that came down
      P.push(Prim.cyl([x, y], r * 1.1, z0, z0 + 0.09, mat));
      if (q > 0.45) {
        const a = q * 6.2832;
        P.push(Prim.box([x + Math.cos(a) * h * 0.35, y + Math.sin(a) * h * 0.35,
          z0 + r], [h * 0.35, r, r], mat, [a, 0]));
      }
    } else {
      // the posthole: dark soil where the post stood, and nothing else
      P.push(Prim.cyl([x, y], r * 1.6, z0 - 0.02, z0 + 0.015, 'soil'));
    }
  }
}

// What grows back, in the order it actually arrives.
//
// Nothing at all while somebody is still sweeping the floor. Then moss and
// tussocks in the corners where the wet sits. Then a creeper up whatever is
// still standing - which is the stage that reads best, because it puts
// something living against something built and dates the ruin at a glance.
// Then a sapling in the middle of the room, and last a young tree.
//
// `wallH` is how high the standing masonry is, if the caller has any. A
// creeper has to climb something, and a building that has none skips
// straight from tussocks to the sapling.
function greenery(P, ctx, tag, hx, hy, wallH) {
  const d = ctx.decay;
  if (d < ASSET.GREEN_FROM) return;
  const amt = smoothstep(ASSET.GREEN_FROM, 1.0, d);
  const n = Math.round(amt * ASSET.GREEN_MAX);
  for (let i = 0; i < n; i++) {
    const x = (ctx.rnd(hashTag(tag, 100 + i)) * 2 - 1) * hx;
    const y = (ctx.rnd(hashTag(tag, 200 + i)) * 2 - 1) * hy;
    const s = 0.10 + ctx.rnd(hashTag(tag, 300 + i)) * 0.22;
    P.push(Prim.sph([x, y, s * 0.66], s, 'moss'));
  }
  // the creeper: up a corner and along the top of what it finds
  if (wallH > 0.5 && d > 0.40) {
    const climb = smoothstep(0.40, 0.85, d);
    for (let c = 0; c < 2; c++) {
      const sx = c ? 1 : -1;
      const cx = sx * hx * (0.72 + ctx.rnd(hashTag(tag, 400 + c)) * 0.2);
      const cy = hy * (ctx.rnd(hashTag(tag, 410 + c)) * 1.5 - 0.75);
      const up = wallH * climb;
      const steps = Math.max(2, Math.round(up / 0.26));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const w = ctx.rnd(hashTag(tag + 'v' + c, i));
        P.push(Prim.sph([cx + (w - 0.5) * 0.34, cy + (t * 2 - 1) * 0.30 * w,
          t * up], 0.11 + w * 0.09, 'leaf'));
      }
    }
  }
  // and the thing growing out of the hearth, which gets a year older with
  // every notch of decay. Kept small: the camera frames the tallest thing
  // on the site, and a full birch would push the ruin into the distance.
  if (d > 0.60) {
    const age = smoothstep(0.60, 1.0, d);
    const th = 0.55 + age * 0.85;
    const x = (ctx.rnd(hashTag(tag, 100)) * 2 - 1) * hx * 0.5;
    const y = (ctx.rnd(hashTag(tag, 200)) * 2 - 1) * hy * 0.5;
    P.push(Prim.cyl([x, y], 0.035 + age * 0.03, 0, th, 'timber',
      [ctx.rnd(hashTag(tag, 500)) * 6.2832, 0.06]));
    const cr = 0.26 + age * 0.30;
    P.push(Prim.sph([x, y, th + cr * 0.45], cr, 'leaf'));
    if (age > 0.5) {
      P.push(Prim.sph([x + cr * 0.6, y - cr * 0.3, th + cr * 0.2], cr * 0.66, 'leaf'));
    }
  }
}

// -------- what a people builds --------
// One generator per building. Each is authored about the origin with +z up
// and the long axis on x, so the viewer can frame anything without knowing
// what it is. Every one of them takes the same context, so decay and cause
// are properties of the world rather than arguments a caller has to invent.

const Build = {

  // The house. A sill of drystone keeps the timber out of the wet, the
  // walls are split planks, and the roof is thatch on a gable - which is
  // also the order those three things leave in, and therefore the order a
  // reader sees the centuries in.
  longhouse(ctx) {
    const P = [];
    const hx = 4.0, hy = 2.0, sill = 0.7, wall = 1.9, rise = 1.8;
    const d = ctx.decay;
    const roof = 1 - smoothstep(0.14, 0.42 + ctx.fx.burn * -0.14, d);
    // the sill: drystone, and the last thing here in a thousand years
    wallRun(P, ctx, 'lhA', -hx, -hy, hx, -hy, sill, 0.42, 'drystone');
    wallRun(P, ctx, 'lhB', -hx, hy, hx, hy, sill, 0.42, 'drystone');
    wallRun(P, ctx, 'lhC', -hx, -hy, -hx, hy, sill, 0.42, 'drystone');
    wallRun(P, ctx, 'lhD', hx, -hy, hx, hy, sill, 0.42, 'drystone');
    P.push(Prim.box([0, 0, 0.02], [hx, hy, 0.04], 'soil'));   // the floor
    // the timber wall, one plank run per side, with the door left out
    if (d < 0.72) {
      wallRun(P, ctx, 'lhW1', -hx, -hy, -0.9, -hy, wall, 0.22, ctx.wood, 4);
      wallRun(P, ctx, 'lhW2', 0.9, -hy, hx, -hy, wall, 0.22, ctx.wood, 4);
      wallRun(P, ctx, 'lhW3', -hx, hy, hx, hy, wall, 0.22, ctx.wood, 8);
      wallRun(P, ctx, 'lhW4', -hx, -hy, -hx, hy, wall, 0.22, ctx.wood, 4);
      wallRun(P, ctx, 'lhW5', hx, -hy, hx, hy, wall, 0.22, ctx.wood, 4);
      // the doorposts and lintel: the last part of a wall to fall, because
      // it is the only part of it anybody framed
      const dh = wall * (1 - smoothstep(0.30, 0.85, d));
      if (dh > 0.3) {
        P.push(Prim.box([-0.9, -hy, dh / 2], [0.12, 0.20, dh / 2], ctx.wood));
        P.push(Prim.box([0.9, -hy, dh / 2], [0.12, 0.20, dh / 2], ctx.wood));
        if (d < 0.55) P.push(Prim.box([0, -hy, dh + 0.1], [1.0, 0.20, 0.12], ctx.wood));
      }
    }
    if (roof > 0.02) {
      // the ridge beam, and the rafters that are all that is left of the
      // roof once the thatch has blown off it
      P.push(Prim.box([0, 0, sill + wall + rise * roof * 0.5],
        [hx + 0.2, 0.11, 0.11], ctx.wood, [0, 0]));
      if (roof > 0.45) {
        for (const sy of [-1, 1]) {
          P.push(Prim.box([0, sy * hy, sill + wall - 0.06],
            [hx + 0.08, 0.12, 0.10], ctx.wood));       // the wall plate
        }
        P.push(gable(0, 0, sill + wall, hx + 0.35, hy + 0.35, rise * roof,
          ctx.fx.burn > 0.5 && d > 0.2 ? 'char' : 'thatch', roof < 0.75));
      } else {
        // the bare rafters, eave to ridge, once the thatch has blown off
        const zE = sill + wall, zR = sill + wall + rise;
        for (let i = 0; i < 7; i++) {
          const rx = -hx + (i / 6) * hx * 2;
          if (ctx.rnd(hashTag('lhR', i)) > roof * 1.6) continue;
          for (const sy of [-1, 1]) {
            P.push(beam([rx, sy * hy, zE], [rx, 0, zR], 0.07, ctx.wood));
          }
        }
      }
    }
    // the hearth, in the middle of the floor where it always was
    P.push(Prim.cyl([0, 0], 0.62, 0, 0.10, 'drystone'));
    P.push(Prim.cyl([0, 0], 0.45, 0.03, 0.09, d > 0.3 ? 'soil' : 'ash'));
    greenery(P, ctx, 'lh', hx, hy, (sill + wall) * (1 - smoothstep(0.45, 0.92, d)));
    return P;
  },

  // Grain up off the ground on staddle stones, so the rats cannot climb and
  // the damp cannot rise. It is the one farm building that survives being
  // abandoned as a legible shape, because the stones stay in their square.
  granary(ctx) {
    const P = [];
    const hx = 1.6, hy = 1.4, lift = 0.85, wall = 1.5;
    const d = ctx.decay;
    const stand = 1 - smoothstep(0.30, 0.70, d);
    for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
      const x = sx * (hx - 0.3), y = sy * (hy - 0.3);
      // the staddle: a mushroom of stone, and the reason the rats fail
      P.push(Prim.cone([x, y], 0, lift * 0.7, 0.22, 0.14, 'drystone'));
      P.push(Prim.cone([x, y], lift * 0.7, lift, 0.34, 0.30, 'drystone'));
    }
    if (stand > 0.05) {
      const h = wall * stand;
      const dw = 0.42;                    // half-width of the door
      P.push(Prim.box([0, 0, lift + 0.08], [hx, hy, 0.09], ctx.wood));
      // the door, in the gable end, with the wall run either side of it -
      // a grain store nobody can get into is a box, and the ladder up to
      // it is the whole reason the floor is off the ground in the first
      // place
      wallRun(P, ctx, 'gnA1', -hx, -hy, -dw, -hy, h, 0.16, ctx.wood, 2, lift + 0.17);
      wallRun(P, ctx, 'gnA2', dw, -hy, hx, -hy, h, 0.16, ctx.wood, 2, lift + 0.17);
      wallRun(P, ctx, 'gnB', -hx, hy, hx, hy, h, 0.16, ctx.wood, 4, lift + 0.17);
      wallRun(P, ctx, 'gnC', -hx, -hy, -hx, hy, h, 0.16, ctx.wood, 3, lift + 0.17);
      wallRun(P, ctx, 'gnD', hx, -hy, hx, hy, h, 0.16, ctx.wood, 3, lift + 0.17);
      // the head of the door: a lintel across, and the threshold under it
      if (stand > 0.62) {
        const dh = Math.min(h, 1.15);
        // jambs first: a lintel rests on its posts, and without them it is
        // spanning whichever bits of wall happen to have survived
        for (const sx of [-1, 1]) {
          P.push(Prim.box([sx * (dw + 0.08), -hy, lift + 0.17 + dh / 2],
            [0.08, 0.18, dh / 2], ctx.wood));
        }
        P.push(Prim.box([0, -hy, lift + 0.17 + dh + 0.08], [dw + 0.16, 0.16, 0.08],
          ctx.wood));
        P.push(Prim.box([0, -hy, lift + 0.19], [dw, 0.20, 0.06], ctx.wood));
        if (h > dh + 0.2) {
          P.push(Prim.box([0, -hy, lift + 0.17 + (dh + h) / 2 + 0.08],
            [dw, 0.16, (h - dh) / 2 - 0.08], ctx.wood));
        }
      }
      // the ladder, leaning on the threshold, taken away at harvest and
      // never put back once nobody is storing anything
      if (stand > 0.62) {
        const foot = [0, -hy - 0.95, 0], head = [0, -hy - 0.10, lift + 0.30];
        for (const sx of [-1, 1]) {
          P.push(strut([foot[0] + sx * 0.20, foot[1], foot[2]],
                       [head[0] + sx * 0.20, head[1], head[2]], 0.045, ctx.wood));
        }
        for (let i = 1; i < 4; i++) {
          const t = i / 4;
          P.push(Prim.box([0, foot[1] + (head[1] - foot[1]) * t,
            foot[2] + (head[2] - foot[2]) * t], [0.22, 0.035, 0.035], ctx.wood));
        }
      }
      if (stand > 0.62) {
        // the wall plate: the continuous timber a roof actually sits on. A
        // gable laid straight onto the wall is resting on whichever courses
        // survived, which for a ragged wall is nothing at all.
        for (const sy of [-1, 1]) {
          P.push(Prim.box([0, sy * hy, lift + 0.17 + h - 0.05],
            [hx + 0.06, 0.10, 0.09], ctx.wood));
        }
        P.push(gable(0, 0, lift + 0.17 + h + 0.02, hx + 0.25, hy + 0.25,
          0.9, 'thatch', stand < 0.82));
      }
    } else if (d < 0.95) {
      // the floor came down whole and is lying across its own staddles
      P.push(Prim.box([0.2, 0.1, lift * 0.35], [hx, hy, 0.09], ctx.wood, [0.3, 0.22]));
    }
    greenery(P, ctx, 'gn', hx + 0.5, hy + 0.5);
    return P;
  },

  // A pen: posts, rails, and a scrape of mud. Nothing here is built to
  // outlast anybody, which is exactly why it is worth drawing - it is the
  // building that proves how fast timber goes.
  byre(ctx) {
    const P = [];
    const R = 3.2, n = 14;
    const d = ctx.decay;
    P.push(Prim.cyl([0, 0], R * 0.92, 0, 0.03, 'soil'));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * 6.2832;
      if (a > 5.6) continue;                    // the gap where the gate was
      const x = Math.cos(a) * R, y = Math.sin(a) * R;
      const q = ctx.rnd(hashTag('by', i));
      const keep = clamp(1 - smoothstep(0.08, 0.62, d) * (0.6 + q), 0, 1);
      if (keep * 1.25 > 0.12) {
        P.push(Prim.cyl([x, y], 0.09, 0, 1.25 * keep, ctx.wood, [0, (q - 0.5) * d]));
      } else if (d < 0.9) {
        P.push(Prim.cyl([x, y], 0.11, 0, 0.07, ctx.wood));
      }
      // the rail to the next post, which is gone long before the posts are
      if (keep > 0.55 && i < n - 1) {
        const a2 = ((i + 1) / n) * 6.2832;
        if (a2 <= 5.6) {
          const x2 = Math.cos(a2) * R, y2 = Math.sin(a2) * R;
          P.push(Prim.box([(x + x2) / 2, (y + y2) / 2, 0.85],
            [Math.hypot(x2 - x, y2 - y) / 2, 0.05, 0.05], ctx.wood,
            [Math.atan2(y2 - y, x2 - x), 0]));
        }
      }
    }
    greenery(P, ctx, 'by', R, R);
    return P;
  },

  // A field boundary, which is the most common piece of building on any
  // ground people farmed and the last one to stop being visible. Drystone
  // does not fall down, it slumps - so this one gets wider as it gets old
  // instead of shorter.
  fieldwall(ctx) {
    const P = [];
    const d = ctx.decay;
    const L = 9;
    const slump = 1 + d * 0.9;
    for (let i = 0; i < 16; i++) {
      const x = -L / 2 + (i / 15) * L;
      const q = ctx.rnd(hashTag('fw', i));
      const h = 0.95 * (1 - smoothstep(0.2, 1.0, d) * (0.35 + q * 0.55));
      // the line wanders, because somebody laid it by eye along a boundary
      const y = Math.sin(i * 0.7) * 0.22;
      // Each stone beds on the two below it, which is what drystone means -
      // so the courses climb by less than a stone's radius and the jitter
      // stays inside one. Wider than that and the top of a course is
      // standing on air.
      const n = 3 + Math.round(q * 3);
      for (let j = 0; j < n; j++) {
        const r = 0.12 + ctx.rnd(hashTag('fw' + i, j)) * 0.12;
        const t = j / n;
        const off = (ctx.rnd(hashTag('fy' + i, j)) - 0.5) * 0.40 * slump;
        // and the courses fall away toward the edges of the spread, so a
        // stone that has rolled off the wall is on the ground, not beside
        // the top of it
        const drop = 1 - Math.min(1, Math.abs(off) / (0.30 * slump)) * 0.75;
        P.push(Prim.facet([x + (ctx.rnd(hashTag('fx' + i, j)) - 0.5) * 0.30 * slump,
          y + off, r * ASSET.SIT + t * h * 0.82 * drop],
          r, hashTag('fs' + i, j), 'drystone'));
      }
    }
    if (d > 0.4) greenery(P, ctx, 'fw', L / 2, 0.8);
    return P;
  },

  // ---- the seat ----

  // The great hall: the one building a people puts cut stone into, and
  // therefore the one that is still recognisably a room after two thousand
  // years. Aisle posts down the middle carry the roof, so when the roof
  // goes the posts are left standing in a double row inside four walls -
  // which is the shape of every excavated hall there has ever been.
  moothall(ctx) {
    const P = [];
    const hx = 6.0, hy = 3.4, wall = 3.2, rise = 2.6, th = 0.75;
    const d = ctx.decay;
    const roof = 1 - smoothstep(0.10, 0.36, d);
    P.push(Prim.box([0, 0, 0.05], [hx, hy, 0.07], 'cutstone'));
    // the walls, with the door left out of the gable end
    wallRun(P, ctx, 'mhA', -hx, -hy, hx, -hy, wall, th, 'cutstone', 9);
    wallRun(P, ctx, 'mhB', -hx, hy, hx, hy, wall, th, 'cutstone', 9);
    wallRun(P, ctx, 'mhC', -hx, -hy, -hx, -1.0, wall, th, 'cutstone', 3);
    wallRun(P, ctx, 'mhD', -hx, 1.0, -hx, hy, wall, th, 'cutstone', 3);
    wallRun(P, ctx, 'mhE', hx, -hy, hx, hy, wall, th, 'cutstone', 6);
    // the doorway: two jambs and a lintel, dressed, and the reason the
    // west end of a ruined hall always has one gap that is not a collapse
    const dh = wall * 0.62 * (1 - smoothstep(0.55, 0.95, d));
    if (dh > 0.3) {
      P.push(Prim.box([-hx, -1.15, dh / 2], [th / 2, 0.25, dh / 2], 'cutstone'));
      P.push(Prim.box([-hx, 1.15, dh / 2], [th / 2, 0.25, dh / 2], 'cutstone'));
      if (d < 0.62) P.push(Prim.box([-hx, 0, dh + 0.2], [th / 2, 1.4, 0.22], 'cutstone'));
    }
